# Hosted, non-production autonomy acceptance. PREPARED, NOT APPLIED.
#
# Deliberately not at the repository root: Render only syncs a root
# render.yaml, so this file can never provision anything by itself. To use it,
# the owner creates a Blueprint from this path in the Render dashboard (see
# deploy/render/AUTONOMY-ACCEPTANCE.md). It never touches the production
# service orchid-calyx-backend or its database.
services:
  - type: worker
    name: orchid-calyx-autonomy-acceptance
    runtime: python
    plan: starter            # smallest always-on worker; prorated per second
    region: oregon           # create the Neon project in AWS US West 2 (Oregon) too
    # The continuous-loop build under review (jsp1440/orchid-calyx-backend#1818).
    branch: claude/sharp-pasteur-e6c4r1-autonomy-loop
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/oc_render_autonomy_acceptance_start.sh
    envVars:
      # Acceptance-only database (Neon, see runbook). Never the production URL.
      - key: DATABASE_URL
        sync: false
      # Pinned to the loop database: the start script refuses to run the worker
      # unless DATABASE_URL really points at autonomy_loop.
      - key: CALYX_ACCEPTANCE_DATABASE_CONFIRMED
        value: non-production:autonomy_loop
      - key: CALYX_ACCEPTANCE_WORK_MODE
        value: loop
      # Generated by Render for this service only; not the production key.
      - key: CALYX_API_KEY
        generateValue: true
      # Read-only, Brain-repository-only token (see runbook).
      - key: OC_BRAIN_READ_TOKEN
        sync: false
      - key: OC_BRAIN_REF
        value: 7ab95c8d9322db49b4837f0198eba7de7e565035  # = acceptance workflow pin
      # New inputs arrive here; the worker refreshes its workspace from it.
      - key: CALYX_ACCEPTANCE_SOURCE_BRANCH
        value: claude/sharp-pasteur-e6c4r1-loop-inputs
      - key: CALYX_PROGRAM_AUTONOMY_ENABLED
        value: "true"
      - key: CALYX_PROGRAM_AUTONOMY_OWNER
        value: backend_api_key
      - key: CALYX_PROGRAM_AUTONOMY_WORKER_ID
        value: render-autonomy-acceptance
      - key: CALYX_PROGRAM_AUTONOMY_POLL_SECONDS
        value: "30"
      - key: CALYX_PROGRAM_AUTONOMY_MAX_JOBS_PER_CYCLE
        value: "2"
      - key: CALYX_PROGRAM_AUTONOMY_LEASE_SECONDS
        value: "300"
      - key: CALYX_PROGRAM_AUTONOMY_TIMEOUT_SECONDS
        value: "120"
      - key: PYTHONUNBUFFERED      # stream one JSON line per cycle to the log
        value: "1"
      - key: NO_API_MODE
        value: "true"
      - key: OC_GOVERNOR_PAID_EXECUTION_ENABLED
        value: "false"
      - key: PROVIDER_LAUNCH_AUTHORIZED
        value: "false"
