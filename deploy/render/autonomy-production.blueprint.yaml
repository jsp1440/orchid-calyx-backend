# Long-running Brain-Calyx autonomy worker (gate G5). PREPARED, NOT APPLIED.
#
# Deliberately not at the repository root: Render only syncs a root
# render.yaml, so this file can never provision anything by itself. The owner
# creates a Blueprint from this path in the Render dashboard, leaves the worker
# suspended, and resumes it only with explicit approval (gate G6); see
# deploy/render/PRODUCTION-AUTONOMY-PLAN.md. It never touches the production
# web service orchid-calyx-backend or its database (neondb).
#
# Same safety posture as the accepted hosted run
# (deploy/render/autonomy-acceptance.blueprint.yaml): read-only executors,
# NO_API_MODE, paid execution off, its own isolated database.
services:
  - type: worker
    name: orchid-calyx-autonomy
    runtime: python
    plan: starter            # about US$7 a month if left running
    region: oregon           # same region as the Neon project
    branch: main             # real merged changes only
    autoDeploy: false        # every deploy is a manual, owner-visible action
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/oc_render_autonomy_acceptance_start.sh
    envVars:
      # The isolated autonomy database (owner-entered). Never the production URL.
      - key: DATABASE_URL
        sync: false
      # The start script refuses to run unless the name is a dedicated
      # autonomy_* database AND DATABASE_URL really points at it.
      - key: CALYX_ACCEPTANCE_DATABASE_CONFIRMED
        value: autonomy-isolated:autonomy_prod
      - key: CALYX_ACCEPTANCE_WORK_MODE
        value: loop
      # Generated by Render for this service only; not the production key.
      - key: CALYX_API_KEY
        generateValue: true
      # Read-only, Brain-repository-only token.
      - key: OC_BRAIN_READ_TOKEN
        sync: false
      - key: OC_BRAIN_REF
        value: 78858693e108389d3de2e5595bead426342645a4  # = acceptance workflow pin
      # Inputs are real merges to main; the worker refreshes its workspace from it.
      - key: CALYX_ACCEPTANCE_SOURCE_BRANCH
        value: main
      - key: CALYX_PROGRAM_AUTONOMY_ENABLED
        value: "true"
      - key: CALYX_PROGRAM_AUTONOMY_OWNER
        value: backend_api_key
      - key: CALYX_PROGRAM_AUTONOMY_WORKER_ID
        value: render-autonomy-production
      - key: CALYX_PROGRAM_AUTONOMY_POLL_SECONDS
        value: "30"
      - key: CALYX_PROGRAM_AUTONOMY_MAX_JOBS_PER_CYCLE
        value: "2"
      - key: CALYX_PROGRAM_AUTONOMY_LEASE_SECONDS
        value: "300"
      - key: CALYX_PROGRAM_AUTONOMY_TIMEOUT_SECONDS
        value: "120"
      - key: PYTHONUNBUFFERED      # stream one JSON line per cycle to the log
        value: "1"
      - key: NO_API_MODE
        value: "true"
      - key: OC_GOVERNOR_PAID_EXECUTION_ENABLED
        value: "false"
      - key: PROVIDER_LAUNCH_AUTHORIZED
        value: "false"
