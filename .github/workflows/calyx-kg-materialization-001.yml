name: CALYX KG Materialization 001

on:
  pull_request:
    paths:
      - 'runtime/knowledge_graph/production_materializer.py'
      - 'runtime/knowledge_graph/production_publish.py'
      - 'runtime/knowledge_graph/verified_dynamic_materializer.py'
      - 'scripts/materialize_verified_graph_relationships.py'
      - 'scripts/materialize_dynamic_graph_relationship.py'
      - 'scripts/audit_persisted_graph_relationships.py'
      - 'app/readiness/live_graph_audit.py'
      - 'app/readiness/owner_audit_relationships.py'
      - 'tests/test_calyx_verified_graph_materializer.py'
      - 'tests/test_verified_dynamic_materializer.py'
      - 'tests/test_calyx_live_graph_audit.py'
      - 'tests/test_owner_audit_relationships.py'
      - 'docs/brain/CALYX-KG-MATERIALIZATION-001.md'
      - '.github/workflows/calyx-kg-materialization-001.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile materializers and live audit
        run: >-
          python -m py_compile
          runtime/knowledge_graph/production_materializer.py
          runtime/knowledge_graph/production_publish.py
          runtime/knowledge_graph/verified_dynamic_materializer.py
          scripts/materialize_verified_graph_relationships.py
          scripts/materialize_dynamic_graph_relationship.py
          scripts/audit_persisted_graph_relationships.py
          app/readiness/live_graph_audit.py
          app/readiness/owner_audit_relationships.py
          tests/test_calyx_verified_graph_materializer.py
          tests/test_verified_dynamic_materializer.py
          tests/test_calyx_live_graph_audit.py
          tests/test_owner_audit_relationships.py
      - name: Focused integration tests
        run: >-
          pytest -q
          tests/test_calyx_verified_graph_materializer.py
          tests/test_verified_dynamic_materializer.py
          tests/test_calyx_live_graph_audit.py
          tests/test_owner_audit_relationships.py
      - name: Adjacent graph regressions
        run: >-
          pytest -q
          tests/test_source_registry.py
          tests/test_full_domain_adapters.py
          tests/test_knowledge_graph_orchestrator.py
          tests/test_controlled_graph_dry_run.py
          tests/test_build_067_pg_writer.py
          tests/test_audit_relationship_integration_001.py
          tests/test_calyx_homepage_readiness_route.py
      - name: Ruff
        run: >-
          ruff check
          runtime/knowledge_graph/production_materializer.py
          runtime/knowledge_graph/production_publish.py
          runtime/knowledge_graph/verified_dynamic_materializer.py
          scripts/materialize_verified_graph_relationships.py
          scripts/materialize_dynamic_graph_relationship.py
          scripts/audit_persisted_graph_relationships.py
          app/readiness/live_graph_audit.py
          app/readiness/owner_audit_relationships.py
          tests/test_calyx_verified_graph_materializer.py
          tests/test_verified_dynamic_materializer.py
          tests/test_calyx_live_graph_audit.py
          tests/test_owner_audit_relationships.py
      - name: Permanent publication guards
        run: |
          grep -q 'PUBLISH_VERIFIED_GRAPH_RELATIONSHIPS' runtime/knowledge_graph/production_materializer.py
          grep -q 'EXPLICIT_PRODUCTION_DOMAINS_REQUIRED' runtime/knowledge_graph/production_materializer.py
          grep -q 'run_controlled_dry_run' runtime/knowledge_graph/production_materializer.py
          grep -q 'publish_to_production' runtime/knowledge_graph/production_materializer.py
          grep -q 'production_graph_mutation.*summary' runtime/knowledge_graph/production_materializer.py
          grep -q 'DYNAMIC_DOMAINS = ("habitat", "elevation")' runtime/knowledge_graph/verified_dynamic_materializer.py
          grep -q 'taxon_resolved_rows' runtime/knowledge_graph/verified_dynamic_materializer.py
          grep -q 'queries: dict\[str, str\] | None' runtime/knowledge_graph/production_publish.py
          grep -q 'taxonomy_to_literature' app/readiness/live_graph_audit.py
          grep -q 'taxonomy_to_habitat' app/readiness/live_graph_audit.py
          grep -q 'persisted_knowledge_graph_audit' app/readiness/owner_audit_relationships.py
          grep -q 'run_live_graph_audit' scripts/audit_persisted_graph_relationships.py
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
