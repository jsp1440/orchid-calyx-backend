name: CALYX-RUNTIME-001K Persistent Activation State

on:
  pull_request:
    paths:
      - "runtime/persistent_activation_state.py"
      - "tests/test_calyx_runtime_001k_persistent_activation_state.py"
      - ".github/workflows/calyx-runtime-001k.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/persistent_activation_state.py tests/test_calyx_runtime_001k_persistent_activation_state.py
      - run: python -m ruff format --check runtime/persistent_activation_state.py tests/test_calyx_runtime_001k_persistent_activation_state.py
      - run: python -m pytest -q tests/test_calyx_runtime_001k_persistent_activation_state.py
      - run: python -m compileall -q runtime/persistent_activation_state.py
      - run: git diff --check
