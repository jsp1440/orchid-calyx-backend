name: CALYX-BRAIN-002 Validation

on:
  pull_request:
    paths:
      - "app/reasoning_ledger/**"
      - "app/main.py"
      - "migrations/103_reasoning_ledger*.sql"
      - "tests/test_calyx_brain_002_*.py"
      - ".github/workflows/calyx-brain-002-validation.yml"
  workflow_dispatch:

jobs:
  reasoning-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reasoning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reasoning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      CALYX_BRAIN_002_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reasoning_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Ruff
        run: >-
          python -m ruff check
          app/reasoning_ledger
          tests/test_calyx_brain_002_correctness.py
          tests/test_calyx_brain_002_operational.py
          tests/test_calyx_brain_002_migration.py
      - name: Formatting check
        run: >-
          python -m ruff format --check
          app/reasoning_ledger
          tests/test_calyx_brain_002_correctness.py
          tests/test_calyx_brain_002_operational.py
          tests/test_calyx_brain_002_migration.py
      - name: Focused reasoning, API, isolation, and integration tests
        run: >-
          python -m pytest -q
          tests/test_calyx_brain_002_correctness.py
          tests/test_calyx_brain_002_operational.py
      - name: Disposable PostgreSQL migration apply and rollback
        run: python -m pytest -q tests/test_calyx_brain_002_migration.py
      - name: Compile and import smoke test
        run: |
          python -m compileall -q app/reasoning_ledger
          python -c "import app.main; import app.reasoning_ledger.routes"
      - name: Secret scan changed scope
        shell: bash
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,})' -- app/reasoning_ledger migrations/103_reasoning_ledger.sql tests/test_calyx_brain_002_*.py; then
            echo "Potential committed secret detected"
            exit 1
          fi
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
