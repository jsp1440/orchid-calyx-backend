name: Literature Matrix Vision Engines Validation

on:
  pull_request:
    paths:
      - "app/multimodal_intelligence/**"
      - "tests/test_multimodal_intelligence_engines.py"
      - ".github/workflows/multimodal-intelligence-engines.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/multimodal_intelligence
      - name: Ruff
        run: ruff check app/multimodal_intelligence tests/test_multimodal_intelligence_engines.py
      - name: Focused tests
        run: pytest -q tests/test_multimodal_intelligence_engines.py
