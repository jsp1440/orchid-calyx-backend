name: CALYX-116 Validation

on:
  pull_request:
    paths:
      - "runtime/calyx_certification/deployed_commit_drift.py"
      - "tests/test_calyx_116_deployed_commit_drift.py"
      - ".github/workflows/calyx-116.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/deployed_commit_drift.py tests/test_calyx_116_deployed_commit_drift.py
      - run: pytest -q tests/test_calyx_116_deployed_commit_drift.py
