name: Governed Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code — attempt 1
        id: claude_attempt_1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10
            --allowedTools "Edit,Read,Write,Bash(git diff --check),Bash(git status),Bash(git diff)"
            --append-system-prompt "Read CLAUDE.md and AGENTS.md before editing. Orchid Continuum Brain and GitHub are authoritative; model output is not project state. Reuse existing authoritative work. For implementation missions, run focused validation and required CI, commit and push the work, and create or update exactly one DRAFT pull request. Never merge or auto-merge, deploy production, mutate production DB/KG/scientific state, activate taxonomy, publish science, create or disclose credentials, spend funds, force-push, or delete branches/repositories. Stop after three unsuccessful repair attempts on the same deterministic failure class and report the blocker."

      - name: Back off after attempt 1
        if: steps.claude_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Reset repository before attempt 2
        if: steps.claude_attempt_1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Run Claude Code — attempt 2
        id: claude_attempt_2
        if: steps.claude_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10
            --allowedTools "Edit,Read,Write,Bash(git diff --check),Bash(git status),Bash(git diff)"
            --append-system-prompt "Read CLAUDE.md and AGENTS.md before editing. Orchid Continuum Brain and GitHub are authoritative; model output is not project state. Reuse existing authoritative work. For implementation missions, run focused validation and required CI, commit and push the work, and create or update exactly one DRAFT pull request. Never merge or auto-merge, deploy production, mutate production DB/KG/scientific state, activate taxonomy, publish science, create or disclose credentials, spend funds, force-push, or delete branches/repositories. Stop after three unsuccessful repair attempts on the same deterministic failure class and report the blocker."

      - name: Back off after attempt 2
        if: steps.claude_attempt_1.outcome == 'failure' && steps.claude_attempt_2.outcome == 'failure'
        run: sleep 60

      - name: Reset repository before attempt 3
        if: steps.claude_attempt_1.outcome == 'failure' && steps.claude_attempt_2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Run Claude Code — attempt 3
        if: steps.claude_attempt_1.outcome == 'failure' && steps.claude_attempt_2.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10
            --allowedTools "Edit,Read,Write,Bash(git diff --check),Bash(git status),Bash(git diff)"
            --append-system-prompt "Read CLAUDE.md and AGENTS.md before editing. Orchid Continuum Brain and GitHub are authoritative; model output is not project state. Reuse existing authoritative work. For implementation missions, run focused validation and required CI, commit and push the work, and create or update exactly one DRAFT pull request. Never merge or auto-merge, deploy production, mutate production DB/KG/scientific state, activate taxonomy, publish science, create or disclose credentials, spend funds, force-push, or delete branches/repositories. Stop after three unsuccessful repair attempts on the same deterministic failure class and report the blocker."
