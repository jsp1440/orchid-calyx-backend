name: BUILD-070 Validation

on:
  pull_request:
    paths:
      - "app/intake/**"
      - "app/routers/health.py"
      - "migrations/070_knowledge_intake.sql"
      - "tests/test_build_070_intake_extractor.py"
      - ".github/workflows/build-070-validation.yml"
  push:
    branches:
      - build-070-knowledge-intake
      - build-070-post-merge-audit-fixes
    paths:
      - "app/intake/**"
      - "app/routers/health.py"
      - "migrations/070_knowledge_intake.sql"
      - "tests/test_build_070_intake_extractor.py"
      - ".github/workflows/build-070-validation.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependency
        run: pip install "pydantic>=2,<3"
      - name: Run standalone BUILD-070 smoke test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys
          import types

          package = types.ModuleType("app.intake")
          package.__path__ = [str(Path("app/intake").resolve())]
          sys.modules["app.intake"] = package
          spec = importlib.util.spec_from_file_location("app.intake.extractor", "app/intake/extractor.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          text = (
              "A newly described orchid species Pleurothallis pembertoniii was reported by "
              "Kew Gardens. The Darwin Initiative grant deadline is July 20, 2026."
          )
          result = module.extract(text)
          names = {(e.entity_type, e.canonical_name) for e in result.entities}
          assert ("species", "Pleurothallis pembertoniii") in names
          assert ("deadline", "July 20, 2026") in names
          assert ("organization", "Kew Gardens") in names
          assert ("organization", "Darwin Initiative") in names
          assert ("species", "Initiative grant") not in names
          assert any(t.task_type == "verify_taxonomy" for t in result.tasks)
          assert any(t.task_type == "review_funding" for t in result.tasks)
          assert result.model_dump() == module.extract(text).model_dump()
          assert module.content_hash(text) == module.content_hash(text)

          repository = Path("app/intake/repository.py").read_text()
          assert "ON CONFLICT (content_hash) DO NOTHING" in repository
          assert "WHERE content_hash = %s" in repository
          print("BUILD-070 focused validation passed")
          PY
      - name: Compile intake package
        run: python -m compileall -q app/intake

  startup-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Import FastAPI application
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; assert app is not None; print('app.main import passed')"
