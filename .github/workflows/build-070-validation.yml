name: BUILD-070 Validation

on:
  pull_request:
    paths:
      - 'app/intake/**'
      - 'app/routers/health.py'
      - 'migrations/070_knowledge_intake.sql'
      - 'tests/test_build_070_intake_extractor.py'
      - '.github/workflows/build-070-validation.yml'
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile BUILD-070 modules
        run: python -m compileall -q app/intake app/routers/health.py

      - name: Run BUILD-070 focused tests
        run: pytest -q tests/test_build_070_intake_extractor.py
