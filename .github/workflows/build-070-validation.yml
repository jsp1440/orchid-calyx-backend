name: BUILD-070 Validation

on:
  pull_request:
    paths:
      - "app/intake/**"
      - "app/routers/health.py"
      - "migrations/070_knowledge_intake.sql"
      - "tests/test_build_070_intake_extractor.py"
      - ".github/workflows/build-070-validation.yml"
  push:
    branches:
      - build-070-knowledge-intake
    paths:
      - "app/intake/**"
      - "app/routers/health.py"
      - "migrations/070_knowledge_intake.sql"
      - "tests/test_build_070_intake_extractor.py"
      - ".github/workflows/build-070-validation.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run BUILD-070 tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_build_070_intake_extractor.py
      - name: Compile intake package
        run: python -m compileall -q app/intake
