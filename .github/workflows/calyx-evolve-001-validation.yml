name: CALYX-EVOLVE-001 Validation

on:
  pull_request:
    paths:
      - "runtime/calyx_evolve/**"
      - "app/routers/calyx_evolve.py"
      - "app/main.py"
      - "migrations/CALYX-EVOLVE-001-experiment-ledger.sql"
      - "migrations/CALYX-EVOLVE-001-experiment-ledger_rollback.sql"
      - "scripts/calyx_evolve_001_postgres_validation.py"
      - "tests/test_calyx_evolve_001.py"
      - "tests/test_calyx_evolve_persistence_001.py"
      - ".github/workflows/calyx-evolve-001-validation.yml"
  push:
    branches:
      - feature/calyx-evolve-001
    paths:
      - "runtime/calyx_evolve/**"
      - "app/routers/calyx_evolve.py"
      - "migrations/CALYX-EVOLVE-001-experiment-ledger.sql"
      - "migrations/CALYX-EVOLVE-001-experiment-ledger_rollback.sql"
      - "scripts/calyx_evolve_001_postgres_validation.py"
      - "tests/test_calyx_evolve_001.py"
      - "tests/test_calyx_evolve_persistence_001.py"
      - ".github/workflows/calyx-evolve-001-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    # An ephemeral throwaway PostgreSQL. This workflow never connects to a
    # production database and never receives a production credential.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calyx
          POSTGRES_PASSWORD: calyx
          POSTGRES_DB: calyx_evolve_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff
      - name: Compile the changed surface
        run: |
          python -m py_compile \
            runtime/calyx_evolve/__init__.py \
            runtime/calyx_evolve/analysis.py \
            runtime/calyx_evolve/campaign.py \
            runtime/calyx_evolve/candidates.py \
            runtime/calyx_evolve/cognition.py \
            runtime/calyx_evolve/defaults.py \
            runtime/calyx_evolve/fixture.py \
            runtime/calyx_evolve/governance.py \
            runtime/calyx_evolve/memory.py \
            runtime/calyx_evolve/metrics.py \
            runtime/calyx_evolve/provenance.py \
            runtime/calyx_evolve/reconciler.py \
            runtime/calyx_evolve/redaction.py \
            runtime/calyx_evolve/safety.py \
            runtime/calyx_evolve/sandbox.py \
            runtime/calyx_evolve/selection.py \
            runtime/calyx_evolve/status.py \
            app/routers/calyx_evolve.py \
            scripts/calyx_evolve_001_postgres_validation.py \
            tests/test_calyx_evolve_001.py \
            tests/test_calyx_evolve_persistence_001.py
      # B008 is excluded because FastAPI's `Depends()` default-argument idiom is
      # used by every router in this repository.
      - name: Ruff the changed surface
        run: |
          python -m ruff check --extend-ignore B008 \
            runtime/calyx_evolve \
            app/routers/calyx_evolve.py \
            scripts/calyx_evolve_001_postgres_validation.py \
            tests/test_calyx_evolve_001.py \
            tests/test_calyx_evolve_persistence_001.py
      - name: Focused acceptance tests
        run: |
          python -m pytest -q \
            tests/test_calyx_evolve_001.py \
            tests/test_calyx_evolve_persistence_001.py
      - name: Migration upgrade, re-apply, rollback and re-upgrade
        env:
          PGPASSWORD: calyx
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -p 5432 -U calyx -d calyx_evolve_ci -v ON_ERROR_STOP=1"
          $PSQL -f migrations/CALYX-EVOLVE-001-experiment-ledger.sql
          $PSQL -f migrations/CALYX-EVOLVE-001-experiment-ledger.sql
          test "$($PSQL -tAc "select count(*) from information_schema.tables where table_schema='oc_admin' and table_name like 'calyx_evolve%'")" = "7"
          $PSQL -f migrations/CALYX-EVOLVE-001-experiment-ledger_rollback.sql
          test "$($PSQL -tAc "select count(*) from information_schema.tables where table_schema='oc_admin' and table_name like 'calyx_evolve%'")" = "0"
          $PSQL -f migrations/CALYX-EVOLVE-001-experiment-ledger.sql
          test "$($PSQL -tAc "select count(*) from information_schema.tables where table_schema='oc_admin' and table_name like 'calyx_evolve%'")" = "7"
      - name: Durable memory and replay idempotency against PostgreSQL
        env:
          DATABASE_URL: postgresql://calyx:calyx@localhost:5432/calyx_evolve_ci
          CALYX_EVOLVE_STAGING_VALIDATION: "1"
        run: python scripts/calyx_evolve_001_postgres_validation.py
      - name: Diff hygiene
        run: git diff --check
