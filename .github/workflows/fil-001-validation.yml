name: FIL-001 Functional Interaction Layer validation

on:
  pull_request:
    paths:
      - "app/functional_interaction/**"
      - "contracts/oc-fil-*.v1.json"
      - "tests/test_fil_001*.py"
      - "tests/fixtures/functional_interaction/**"
      - "app/literature_extraction/**"
      - "app/parallel_platform/brain_candidate_handoff.py"
      - "app/parallel_platform/reasoning_contract_bridge.py"
      - "app/calyx_orchestrator/executor_registry.py"
      - "app/provider_reservoir/routing.py"
      - "harvesters/execution.py"
      - "docs/fil/**"
      - "app/provider_reservoir/capabilities.py"
      - "app/calyx_orchestrator/executor.py"
      - "app/calyx_orchestrator/service.py"
      - "app/scientific_observability/models.py"
      - "app/research_traits/service.py"
      - "app/candidate_knowledge/**"
      - "app/evidence_aggregation/**"
      - "app/reasoning_ledger/models.py"
      - "runtime/brain_capability_registry.py"
      - "runtime/knowledge_graph/canonical_taxonomy.py"
      - "requirements-dev.txt"
      - ".github/workflows/fil-001-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Disposable database for the FIL-001B durability test only. Never a
    # production database; the credentials below exist only in this runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocfil
          POSTGRES_PASSWORD: ocfil_test_only
          POSTGRES_DB: oc_fil_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ocfil -d oc_fil_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ocfil:ocfil_test_only@localhost:5432/oc_fil_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app/functional_interaction tests/test_fil_001_contracts.py tests/test_fil_001_compatibility.py tests/test_fil_001_scientific_demo.py tests/test_fil_001b_literature_to_calyx.py tests/test_fil_001b_capability_view.py tests/test_fil_001b_durable_evidence.py
      - run: python -m ruff format --check app/functional_interaction tests/test_fil_001_contracts.py tests/test_fil_001_compatibility.py tests/test_fil_001_scientific_demo.py tests/test_fil_001b_literature_to_calyx.py tests/test_fil_001b_capability_view.py tests/test_fil_001b_durable_evidence.py
      - run: python -m compileall -q app/functional_interaction
      - run: python -m pytest -q tests/test_fil_001_contracts.py tests/test_fil_001_compatibility.py tests/test_fil_001_scientific_demo.py tests/test_fil_001b_literature_to_calyx.py tests/test_fil_001b_capability_view.py tests/test_fil_001b_durable_evidence.py
      - run: git diff --check
