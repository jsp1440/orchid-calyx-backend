name: CALYX Conversation Report 638

on:
  pull_request:
    paths:
      - "app/conversation_memory/report.py"
      - "app/routers/calyx_operator_chat.py"
      - "tests/test_calyx_conversation_report_638.py"
      - "docs/brain/CALYX-CONVERSATION-REPORT-638.md"
      - ".github/workflows/calyx-conversation-report-638.yml"
  workflow_dispatch:

jobs:
  conversation-report:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile conversation report surface
        run: >-
          python -m py_compile
          app/conversation_memory/report.py
          app/routers/calyx_operator_chat.py
          tests/test_calyx_conversation_report_638.py
      - name: Report plus persistent conversation regressions
        run: >-
          python -m pytest -q
          tests/test_calyx_conversation_report_638.py
          tests/test_calyx_conversation_sessions_636.py
          tests/test_calyx_document_scope_637.py
      - name: Permanent report non-authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          report = Path('app/conversation_memory/report.py').read_text()
          router = Path('app/routers/calyx_operator_chat.py').read_text()
          required = (
              'Data status: `CONVERSATION_CONTEXT`',
              'Evidence authority: `false`',
              'Scientific publication authorized: `false`',
              'Knowledge Graph mutation authorized: `false`',
              'not a peer-reviewed scientific conclusion',
          )
          missing = [item for item in required if item not in report]
          if missing:
              raise SystemExit(f'missing report governance assertion(s): {missing}')
          if 'build_conversation_markdown' not in router:
              raise SystemExit('persistent report endpoint is not wired')
          forbidden = ('INSERT INTO oc_graph', 'UPDATE oc_graph', 'DELETE FROM oc_graph', 'TRUNCATE oc_graph')
          present = [item for item in forbidden if item in report or item in router]
          if present:
              raise SystemExit(f'forbidden graph mutation surface present: {present}')
          PY
      - name: Changed-surface Ruff and diff hygiene
        run: |
          python -m ruff check app/conversation_memory/report.py app/routers/calyx_operator_chat.py tests/test_calyx_conversation_report_638.py
          python -m ruff format --check app/conversation_memory/report.py app/routers/calyx_operator_chat.py tests/test_calyx_conversation_report_638.py
          git diff --check
