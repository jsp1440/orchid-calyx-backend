name: TEMP Calyx Live Literature Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/temp-calyx-live-literature-dry-run.yml"

permissions:
  contents: read

jobs:
  literature-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
      CALYX_BOUNDED_DRY_RUN_DOMAIN: literature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CALYX_BACKEND_URL:?CALYX_BACKEND_URL required}"
          : "${CALYX_OWNER_ACCESS_CODE:?CALYX_OWNER_ACCESS_CODE required}"
      - name: Run bounded literature staging step 1
        env:
          CALYX_BOUNDED_DRY_RUN_EVIDENCE_PATH: literature-pass1.json
        run: python scripts/run_bounded_resumable_graph_dry_run.py | tee literature-pass1.txt
      - name: Inspect whether exactly one bounded resume is needed
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data = json.load(open("literature-pass1.json", encoding="utf-8"))
          run_id = str((data.get("report", {}).get("session") or data.get("session") or {}).get("run_id") or "")
          if not run_id:
              raise SystemExit("missing run_id")
          next_action = str((data.get("report", {}).get("progress") or {}).get("next_action") or "")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CALYX_BOUNDED_DRY_RUN_RUN_ID={run_id}\n")
              env.write(f"NEEDS_RESUME={'true' if next_action == 'resume' else 'false'}\n")
          print(f"run_id={run_id} next_action={next_action}")
          PY
      - name: Run bounded literature staging step 2 only when requested
        if: env.NEEDS_RESUME == 'true'
        env:
          CALYX_BOUNDED_DRY_RUN_EVIDENCE_PATH: literature-pass2.json
        run: python scripts/run_bounded_resumable_graph_dry_run.py | tee literature-pass2.txt
      - name: Upload literature staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-calyx-live-literature-${{ github.run_id }}
          path: |
            literature-pass1.json
            literature-pass1.txt
            literature-pass2.json
            literature-pass2.txt
          if-no-files-found: warn
          retention-days: 7
