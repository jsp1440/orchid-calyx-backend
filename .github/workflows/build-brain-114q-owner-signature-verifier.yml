name: BUILD-BRAIN-114Q Owner Signature Verifier Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/owner_signature_verifier.py"
      - "app/calyx_orchestrator/git_mutation_authorization.py"
      - "tests/test_calyx_owner_signature_verifier_114q.py"
      - "tests/test_calyx_git_mutation_authorization_114o.py"
      - "requirements.txt"
      - "docs/brain/BUILD-BRAIN-114Q-OWNER-SIGNATURE-VERIFIER.md"
      - ".github/workflows/build-brain-114q-owner-signature-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile owner verification surfaces
        run: |
          python -m compileall -q app/calyx_orchestrator/owner_signature_verifier.py app/calyx_orchestrator/git_mutation_authorization.py tests/test_calyx_owner_signature_verifier_114q.py
      - name: Ruff owner verification surfaces
        run: |
          ruff check app/calyx_orchestrator/owner_signature_verifier.py app/calyx_orchestrator/git_mutation_authorization.py tests/test_calyx_owner_signature_verifier_114q.py
          ruff format --check app/calyx_orchestrator/owner_signature_verifier.py app/calyx_orchestrator/git_mutation_authorization.py tests/test_calyx_owner_signature_verifier_114q.py
      - name: Focused owner verification regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_owner_signature_verifier_114q.py tests/test_calyx_git_mutation_authorization_114o.py
      - name: Public-key-only and v2 provenance assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          verifier = Path("app/calyx_orchestrator/owner_signature_verifier.py").read_text(encoding="utf-8")
          gate = Path("app/calyx_orchestrator/git_mutation_authorization.py").read_text(encoding="utf-8")
          for marker in ("Ed25519PublicKey", "owner_grant_signing_bytes", "CALYX_OWNER_VERIFY_KEYS_JSON", "CALYX_OWNER_REVOKED_KEY_IDS"):
              assert marker in verifier, marker
          for marker in ("Ed25519PrivateKey", "generate_private_key", "hmac", "private_key", "sign_grant", "mint_grant"):
              assert marker not in verifier, marker
          assert 'REQUEST_SCHEMA = "calyx-git-mutation-authorization-request-v2"' in gate
          assert 'MANIFEST_SCHEMA = "calyx-git-proposal-manifest-v2"' in gate
          assert "patch_program_job_id" in gate
          assert 'signature=str(value.get("signature") or "").strip()' in gate
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
