name: BUILD-088E Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  publication-pipeline-operational-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchid_build_088e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orchid_build_088e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orchid_build_088e
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: BUILD-088E PostgreSQL pipeline and readiness
        run: pytest -q tests/test_build_088e_publication_operational_readiness.py
      - name: BUILD-088B through BUILD-088D isolated regression
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres orchid_build_088b_regression
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/orchid_build_088b_regression \
            pytest -q tests/test_build_088b_publication_foundation.py
          createdb -h localhost -U postgres orchid_build_088c_regression
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/orchid_build_088c_regression \
            pytest -q tests/test_build_088c_atomic_graph_publication.py
          createdb -h localhost -U postgres orchid_build_088d_regression
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/orchid_build_088d_regression \
            pytest -q tests/test_build_088d_publication_lifecycle.py
      - name: Compile and lint
        run: |
          python -m compileall -q app tests/test_build_088e_publication_operational_readiness.py
          python -m ruff check app/knowledge_publication tests/test_build_088e_publication_operational_readiness.py
