name: TEMP Calyx Core Eligible Ledger Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/temp-calyx-core-eligible-ledger-pr.yml"

permissions:
  contents: read

jobs:
  discover-eligible-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CALYX_BACKEND_URL:?Repository variable CALYX_BACKEND_URL is required}"
          : "${CALYX_OWNER_ACCESS_CODE:?Repository secret CALYX_OWNER_ACCESS_CODE is required}"
      - name: Discover eligible reviewed ledger read-only
        run: python scripts/discover_eligible_reasoning_ledgers.py
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-calyx-core-eligible-ledger-${{ github.sha }}
          path: calyx-eligible-ledger-discovery.json
          if-no-files-found: error
          retention-days: 7
