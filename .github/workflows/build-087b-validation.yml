name: BUILD-087B validation

on:
  pull_request:
    paths:
      - "app/scientific_interpretation/**"
      - "app/main.py"
      - "runtime/knowledge_graph/**"
      - "migrations/087b_context_preserving_interpretation.sql"
      - "migrations/BUILD-051-owner-operations-console.sql"
      - "tests/test_build_087b_scientific_interpretation.py"
      - "tests/test_build_105_harvester_safety.py"
      - "tests/test_build_046_scientific_priorities.py"
      - "tests/test_calyx_live_graph_audit.py"
      - "tests/test_knowledge_graph_orchestrator.py"
      - "tests/test_source_registry.py"
      - "tests/test_calyx_journalism_mvp_001.py"
      - "tests/test_calyx_journalism_brain_routes.py"
      - "tests/test_calyx_runtime_001n_authenticated_runtime_api.py"
      - "tests/test_mission_control_telemetry_001a_executive_state.py"
      - "tests/test_ci_baseline_001.py"
      - "docs/BUILD-087B-IMPLEMENTATION-REPORT.md"
      - "docs/brain/CI-BASELINE-001*.md"
      - ".github/workflows/build-087b-validation.yml"
  push:
    branches: [feature/build-087b-context-preserving-evidence-interpretation]
  workflow_dispatch:

jobs:
  scientific-interpretation-validation:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build087
          POSTGRES_PASSWORD: build087_test_only
          POSTGRES_DB: build087_validation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U build087 -d build087_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Provision isolated validation databases
        run: |
          createdb "$BUILD087_FOCUSED_DATABASE"
          createdb "$BUILD087_REGRESSION_DATABASE"
        env:
          PGHOST: localhost
          PGUSER: build087
          PGPASSWORD: build087_test_only
          BUILD087_FOCUSED_DATABASE: build087_focused
          BUILD087_REGRESSION_DATABASE: build087_regression
      - name: BUILD-087B focused and PostgreSQL validation
        run: python -m pytest -q tests/test_build_087b_scientific_interpretation.py
        env:
          TEST_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_focused
      - name: BUILD-082 through BUILD-087 regression matrix
        run: >-
          python -m pytest -q
          tests/test_build_082_drive_document_import.py
          tests/test_build_083_bulk_drive_import.py
          tests/test_build_084c_foundation.py
          tests/test_build_084d_scientific_objects.py
          tests/test_build_084e_integration.py
          tests/test_build_085a_semantic_index.py
          tests/test_build_085b_hybrid_retrieval.py
          tests/test_build_085c_retrieval_validation.py
          tests/test_build_086a_candidate_knowledge.py
          tests/test_build_086b_evidence_aggregation.py
          tests/test_build_086c_final_validation.py
          tests/test_build_086d_review_readiness.py
          tests/test_build_087b_scientific_interpretation.py
        env:
          TEST_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_regression
      - name: Canonical Calyx Journalism validation
        run: |
          python -m pytest -q tests/test_calyx_journalism_mvp_001.py -k 'not http'
          python -m pytest -q tests/test_calyx_journalism_brain_routes.py
      - name: Canonical runtime and executive API validation
        run: >-
          env -u DATABASE_URL -u TEST_DATABASE_URL python -m pytest -q
          tests/test_calyx_runtime_001n_authenticated_runtime_api.py
          tests/test_mission_control_telemetry_001a_executive_state.py
      - name: Focused current-contract baseline repairs
        run: >-
          env -u DATABASE_URL -u TEST_DATABASE_URL python -m pytest -q
          tests/test_build_046_scientific_priorities.py
          tests/test_calyx_live_graph_audit.py
      - name: Expanded Knowledge Graph registry contract
        run: >-
          env -u DATABASE_URL -u TEST_DATABASE_URL python -m pytest -q
          tests/test_knowledge_graph_orchestrator.py
          tests/test_source_registry.py
      - name: Provision broad-suite harvester safety schema
        run: |
          psql "$BROAD_DATABASE_URL" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS oc_admin;
          CREATE TABLE IF NOT EXISTS oc_admin.harvest_safety_state (
              harvester_id text PRIMARY KEY,
              last_cursor text,
              circuit_open boolean NOT NULL DEFAULT false,
              circuit_reason text,
              last_run_mode text,
              last_budget jsonb,
              last_audit jsonb,
              updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Apply BUILD-051 owner-console schema to broad-suite database
        run: psql "$BROAD_DATABASE_URL" -f migrations/BUILD-051-owner-operations-console.sql
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Full backend suite diagnostic (non-blocking baseline debt)
        continue-on-error: true
        run: >-
          env -u TEST_DATABASE_URL python -m pytest -q
          --ignore=tests/calyx_certification/test_deterministic_failure_round2.py
          --ignore=tests/test_calyx_journalism_mvp_001.py
          --deselect=tests/test_build_034_044_049_integration.py::test_state_changing_runtime_routes_fail_closed_without_api_key
          --deselect=tests/test_build_055_runtime_activation.py::test_api_key_missing_with_header_reports_configuration_blocker
          --deselect=tests/test_build_055_runtime_activation.py::test_owner_session_authorizes_runtime_control_without_api_key
          --deselect=tests/test_build_055_runtime_activation.py::test_unauthorized_runtime_control_still_rejected
          --deselect=tests/test_build_055_runtime_activation.py::test_runtime_configuration_diagnostic_is_secret_safe
          --deselect=tests/test_build_055_runtime_activation.py::test_execute_next_uses_skip_locked_for_duplicate_job_prevention
          --deselect=tests/test_build_056_owner_authentication.py::test_cookie_session_login_inspect_logout_and_secret_safety
          --deselect=tests/test_build_056_owner_authentication.py::test_expired_tampered_api_key_cors_and_configuration
          --deselect=tests/test_build_063_owner_auth.py::test_runner_authenticated_start_includes_cors_headers
          --deselect=tests/test_build_052_executive_engine.py::test_executive_api_endpoints_are_read_only
        env:
          DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Scientific interpretation package Ruff diagnostic
        continue-on-error: true
        run: python -m ruff check app/scientific_interpretation tests/test_build_087b_scientific_interpretation.py
      - name: Strict BUILD-087B repair hygiene
        run: |
          python -m compileall -q app/scientific_interpretation app/main.py runtime/knowledge_graph
          python -m ruff check app/scientific_interpretation/postgres_repository.py runtime/knowledge_graph/source_registry.py tests/test_ci_baseline_001.py
          git diff --check
