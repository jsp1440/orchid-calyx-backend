name: BUILD-087B validation

on:
  pull_request:
    paths:
      - "app/scientific_interpretation/**"
      - "app/main.py"
      - "runtime/knowledge_graph/**"
      - "runtime/calyx_research_executor.py"
      - "migrations/087b_context_preserving_interpretation.sql"
      - "migrations/BUILD-051-owner-operations-console.sql"
      - "tests/test_build_087b_scientific_interpretation.py"
      - "tests/test_build_105_harvester_safety.py"
      - "tests/test_build_046_scientific_priorities.py"
      - "tests/test_calyx_live_graph_audit.py"
      - "tests/test_knowledge_graph_orchestrator.py"
      - "tests/test_source_registry.py"
      - "tests/test_calyx_journalism_mvp_001.py"
      - "tests/test_calyx_journalism_brain_routes.py"
      - "tests/test_calyx_runtime_001n_authenticated_runtime_api.py"
      - "tests/test_mission_control_telemetry_001a_executive_state.py"
      - "tests/test_ci_baseline_001.py"
      - "tests/test_calyx_persona.py"
      - "tests/test_calyx_provider_context_budget.py"
      - "tests/test_calyx_scientific_runtime_readiness_617.py"
      - "tests/test_calyx_scientific_uncertainty_617.py"
      - "tests/test_specialist_council_persistence.py"
      - "tests/test_calyx_gate2_research_executor.py"
      - "tests/test_calyx_gate3_external_literature.py"
      - "app/calyx_conversation/external_literature.py"
      - "requirements-scientific.txt"
      - "docs/BUILD-087B-IMPLEMENTATION-REPORT.md"
      - "docs/brain/CI-BASELINE-001*.md"
      - ".github/workflows/build-087b-validation.yml"
  push:
    branches: [feature/build-087b-context-preserving-evidence-interpretation]
  workflow_dispatch:

jobs:
  scientific-interpretation-validation:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build087
          POSTGRES_PASSWORD: build087_test_only
          POSTGRES_DB: build087_validation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U build087 -d build087_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-scientific.txt pytest pytest-asyncio httpx ruff
      - name: Provision isolated validation databases
        run: |
          createdb "$BUILD087_FOCUSED_DATABASE"
          createdb "$BUILD087_REGRESSION_DATABASE"
        env:
          PGHOST: localhost
          PGUSER: build087
          PGPASSWORD: build087_test_only
          BUILD087_FOCUSED_DATABASE: build087_focused
          BUILD087_REGRESSION_DATABASE: build087_regression
      - name: BUILD-087B focused and PostgreSQL validation
        run: python -m pytest -q tests/test_build_087b_scientific_interpretation.py
        env:
          TEST_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_focused
      - name: BUILD-082 through BUILD-087 regression matrix
        run: >-
          python -m pytest -q
          tests/test_build_082_drive_document_import.py
          tests/test_build_083_bulk_drive_import.py
          tests/test_build_084c_foundation.py
          tests/test_build_084d_scientific_objects.py
          tests/test_build_084e_integration.py
          tests/test_build_085a_semantic_index.py
          tests/test_build_085b_hybrid_retrieval.py
          tests/test_build_085c_retrieval_validation.py
          tests/test_build_086a_candidate_knowledge.py
          tests/test_build_086b_evidence_aggregation.py
          tests/test_build_086c_final_validation.py
          tests/test_build_086d_review_readiness.py
          tests/test_build_087b_scientific_interpretation.py
        env:
          TEST_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_regression
      - name: Canonical Calyx Journalism validation
        run: |
          python -m pytest -q tests/test_calyx_journalism_mvp_001.py -k 'not http'
          python -m pytest -q tests/test_calyx_journalism_brain_routes.py
      - name: Canonical runtime and executive API validation
        run: >-
          env -u DATABASE_URL -u TEST_DATABASE_URL python -m pytest -q
          tests/test_calyx_runtime_001n_authenticated_runtime_api.py
          tests/test_mission_control_telemetry_001a_executive_state.py
      - name: Focused current-contract baseline repairs
        run: >-
          env -u DATABASE_URL -u TEST_DATABASE_URL python -m pytest -q
          tests/test_build_046_scientific_priorities.py
          tests/test_calyx_live_graph_audit.py
      - name: Expanded Knowledge Graph registry contract
        run: >-
          env -u DATABASE_URL -u TEST_DATABASE_URL python -m pytest -q
          tests/test_knowledge_graph_orchestrator.py
          tests/test_source_registry.py
      - name: Provision broad-suite harvester safety schema
        run: |
          psql "$BROAD_DATABASE_URL" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS oc_admin;
          CREATE TABLE IF NOT EXISTS oc_admin.harvest_safety_state (
              harvester_id text PRIMARY KEY,
              last_cursor text,
              circuit_open boolean NOT NULL DEFAULT false,
              circuit_reason text,
              last_run_mode text,
              last_budget jsonb,
              last_audit jsonb,
              updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS oc_admin.research_station_records (
              owner_key  text NOT NULL,
              project_id text NOT NULL,
              kind       text NOT NULL,
              record_id  text NOT NULL,
              payload    jsonb NOT NULL DEFAULT '{}',
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now(),
              PRIMARY KEY (owner_key, project_id, kind, record_id)
          );
          SQL
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Apply oc_missions schema to broad-suite database
        run: psql "$BROAD_DATABASE_URL" -f migrations/079_controlled_mission_orchestration.sql
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Provision broad-suite oc_concepts and oc_graph schemas
        run: |
          psql "$BROAD_DATABASE_URL" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS oc_concepts;
          CREATE TABLE IF NOT EXISTS oc_concepts.concept_schemes (
              scheme_id UUID PRIMARY KEY,
              scheme_key TEXT NOT NULL UNIQUE,
              name TEXT NOT NULL,
              authority TEXT NOT NULL,
              steward TEXT NOT NULL,
              review_state TEXT NOT NULL DEFAULT 'PENDING'
                CHECK (review_state IN ('PENDING','IN_REVIEW','APPROVED','CHANGES_REQUESTED')),
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              revised_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS oc_concepts.concept_releases (
              release_id UUID PRIMARY KEY,
              scheme_id UUID NOT NULL REFERENCES oc_concepts.concept_schemes(scheme_id),
              version TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'DRAFT'
                CHECK (status IN ('DRAFT','ACTIVE','DEPRECATED')),
              metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              revised_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              UNIQUE (scheme_id, version)
          );
          CREATE TABLE IF NOT EXISTS oc_concepts.concepts (
              concept_id UUID PRIMARY KEY,
              concept_uri TEXT NOT NULL UNIQUE,
              scheme_id UUID NOT NULL REFERENCES oc_concepts.concept_schemes(scheme_id),
              release_id UUID REFERENCES oc_concepts.concept_releases(release_id),
              status TEXT NOT NULL DEFAULT 'DRAFT'
                CHECK (status IN ('DRAFT','ACTIVE','DEPRECATED','SUPERSEDED')),
              review_state TEXT NOT NULL DEFAULT 'PENDING'
                CHECK (review_state IN ('PENDING','IN_REVIEW','APPROVED','CHANGES_REQUESTED')),
              steward TEXT NOT NULL,
              superseded_by_id UUID REFERENCES oc_concepts.concepts(concept_id),
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              revised_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS oc_concepts.concept_labels (
              label_id UUID PRIMARY KEY,
              concept_id UUID NOT NULL REFERENCES oc_concepts.concepts(concept_id),
              label_type TEXT NOT NULL CHECK (label_type IN (
                  'PREFERRED','ALTERNATE','HIDDEN','HISTORICAL','ABBREVIATION',
                  'SCIENTIFIC_NAME','COMMON_NAME','MISSPELLING'
              )),
              label TEXT NOT NULL CHECK (btrim(label) <> ''),
              normalized_label TEXT NOT NULL CHECK (btrim(normalized_label) <> ''),
              language TEXT NOT NULL DEFAULT 'und',
              script TEXT,
              editorial_context TEXT NOT NULL DEFAULT 'default',
              provenance JSONB NOT NULL DEFAULT '{}'::jsonb,
              review_state TEXT NOT NULL DEFAULT 'PENDING',
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              revised_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS oc_concepts.concept_definitions (
              definition_id UUID PRIMARY KEY,
              concept_id UUID NOT NULL REFERENCES oc_concepts.concepts(concept_id),
              definition_type TEXT NOT NULL CHECK (definition_type IN (
                  'NORMATIVE_SCIENTIFIC','GLOSSARY','GROWER','LEARNER',
                  'PLAIN_LANGUAGE','HISTORICAL'
              )),
              text TEXT NOT NULL CHECK (btrim(text) <> ''),
              language TEXT NOT NULL DEFAULT 'und',
              script TEXT,
              provenance JSONB NOT NULL DEFAULT '{}'::jsonb,
              review_state TEXT NOT NULL DEFAULT 'PENDING',
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              revised_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE SCHEMA IF NOT EXISTS oc_graph;
          CREATE TABLE IF NOT EXISTS oc_graph.kg_nodes (
              kg_node_id BIGSERIAL PRIMARY KEY,
              node_type TEXT NOT NULL,
              canonical_key TEXT NOT NULL,
              display_label TEXT,
              source_table TEXT,
              source_pk TEXT,
              evidence_class TEXT,
              confidence_score DOUBLE PRECISION,
              confidence_label TEXT,
              payload_json JSONB NOT NULL DEFAULT '{}'::jsonb,
              is_active BOOLEAN NOT NULL DEFAULT TRUE,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              UNIQUE (node_type, canonical_key)
          );
          CREATE TABLE IF NOT EXISTS oc_graph.kg_edges (
              kg_edge_id BIGSERIAL PRIMARY KEY,
              edge_type TEXT NOT NULL,
              from_node_id BIGINT NOT NULL REFERENCES oc_graph.kg_nodes(kg_node_id),
              to_node_id BIGINT NOT NULL REFERENCES oc_graph.kg_nodes(kg_node_id),
              source_table TEXT,
              source_pk TEXT,
              evidence_class TEXT,
              confidence_score DOUBLE PRECISION,
              confidence_label TEXT,
              rule_name TEXT,
              payload_json JSONB NOT NULL DEFAULT '{}'::jsonb,
              is_active BOOLEAN NOT NULL DEFAULT TRUE,
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Provision broad-suite oc_design_intelligence schema
        run: |
          psql "$BROAD_DATABASE_URL" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS oc_design_intelligence;
          -- documents: external FKs to oc_import/oc_document_intelligence removed (those
          -- schemas are not provisioned in CI); all other constraints preserved.
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.documents (
            document_id BIGSERIAL PRIMARY KEY,
            logical_key TEXT NOT NULL,
            version INTEGER NOT NULL CHECK(version > 0),
            title TEXT NOT NULL,
            document_type TEXT NOT NULL,
            authors JSONB NOT NULL,
            publication_date DATE,
            license_metadata JSONB NOT NULL,
            source_metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
            revision_id BIGINT NOT NULL,
            extraction_run_id BIGINT NOT NULL,
            content_hash CHAR(64) NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            UNIQUE(logical_key, version),
            UNIQUE(revision_id, extraction_run_id, content_hash)
          );
          -- document_provenance: external FKs to oc_import/oc_document_intelligence removed.
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.document_provenance (
            provenance_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            source_system TEXT NOT NULL,
            source_id TEXT NOT NULL,
            revision_id BIGINT NOT NULL,
            extraction_run_id BIGINT NOT NULL,
            anchor_id BIGINT NOT NULL,
            evidence_link_ids JSONB NOT NULL DEFAULT '[]'::jsonb,
            exact_locator JSONB NOT NULL DEFAULT '{}'::jsonb,
            fingerprint CHAR(64) NOT NULL UNIQUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            UNIQUE(document_id, anchor_id)
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.classifications (
            classification_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            domain TEXT NOT NULL CHECK(domain IN(
              'USER_EXPERIENCE','USER_INTERFACE','GRAPHIC_DESIGN','INFORMATION_ARCHITECTURE',
              'INTERACTION_DESIGN','DASHBOARD_DESIGN','ACCESSIBILITY','MOTION_AND_ANIMATION',
              'EDUCATIONAL_DESIGN','LEARNING_SCIENCES','SCIENTIFIC_VISUALIZATION',
              'BRANDING_AND_VISUAL_IDENTITY','DESIGN_SYSTEMS','COMPONENT_LIBRARIES')),
            knowledge_type TEXT NOT NULL CHECK(knowledge_type IN(
              'DESIGN_PRINCIPLE','PATTERN','ANTI_PATTERN','GUIDELINE','STANDARD','BEST_PRACTICE',
              'EDUCATIONAL_THEORY','ACCESSIBILITY_REQUIREMENT','VISUALIZATION_TECHNIQUE','INTERACTION_PATTERN')),
            confidence NUMERIC NOT NULL CHECK(confidence BETWEEN 0 AND 1),
            classifier_version TEXT NOT NULL,
            evidence JSONB NOT NULL,
            fingerprint CHAR(64) NOT NULL UNIQUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            UNIQUE(document_id, domain, knowledge_type, classifier_version)
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.topics (
            topic_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            topic TEXT NOT NULL,
            confidence NUMERIC NOT NULL CHECK(confidence BETWEEN 0 AND 1),
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            UNIQUE(document_id, topic)
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.review_events (
            review_event_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            state TEXT NOT NULL CHECK(state IN('APPROVED','CHANGES_REQUESTED','REJECTED')),
            actor TEXT NOT NULL,
            rationale TEXT NOT NULL,
            evidence JSONB NOT NULL DEFAULT '{}'::jsonb,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.publication_events (
            publication_event_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            status TEXT NOT NULL CHECK(status IN('PUBLISHED','RETIRED','RETRACTED')),
            actor TEXT NOT NULL,
            rationale TEXT NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          -- retrieval_documents: external FK to oc_document_intelligence.source_anchors removed.
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.retrieval_documents (
            retrieval_document_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            anchor_id BIGINT NOT NULL,
            authorized_text TEXT NOT NULL,
            search_vector TSVECTOR GENERATED ALWAYS AS (to_tsvector('english', authorized_text)) STORED,
            display_policy TEXT NOT NULL,
            confidence NUMERIC NOT NULL CHECK(confidence BETWEEN 0 AND 1),
            fingerprint CHAR(64) NOT NULL UNIQUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            UNIQUE(document_id, anchor_id)
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.audit_events (
            audit_event_id BIGSERIAL PRIMARY KEY,
            document_id BIGINT REFERENCES oc_design_intelligence.documents(document_id),
            event_type TEXT NOT NULL,
            actor TEXT,
            details JSONB NOT NULL DEFAULT '{}'::jsonb,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX IF NOT EXISTS design_document_latest_idx ON oc_design_intelligence.documents(logical_key, version DESC);
          CREATE INDEX IF NOT EXISTS design_classification_idx ON oc_design_intelligence.classifications(domain, knowledge_type, confidence DESC);
          CREATE INDEX IF NOT EXISTS design_topic_idx ON oc_design_intelligence.topics(topic, confidence DESC);
          CREATE INDEX IF NOT EXISTS design_review_idx ON oc_design_intelligence.review_events(document_id, review_event_id DESC);
          CREATE INDEX IF NOT EXISTS design_publication_idx ON oc_design_intelligence.publication_events(document_id, publication_event_id DESC);
          CREATE INDEX IF NOT EXISTS design_retrieval_fts_idx ON oc_design_intelligence.retrieval_documents USING GIN(search_vector);
          CREATE OR REPLACE FUNCTION oc_design_intelligence.reject_mutation() RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN RAISE EXCEPTION 'DESIGN_INTELLIGENCE_RECORDS_ARE_APPEND_ONLY'; END $$;
          DO $$ DECLARE tbl TEXT; BEGIN
            FOREACH tbl IN ARRAY ARRAY['documents','document_provenance','classifications','topics','review_events','publication_events','retrieval_documents','audit_events'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgname='protect_089a_'||tbl) THEN
                EXECUTE format('CREATE TRIGGER %I BEFORE UPDATE OR DELETE ON oc_design_intelligence.%I FOR EACH ROW EXECUTE FUNCTION oc_design_intelligence.reject_mutation()','protect_089a_'||tbl,tbl);
              END IF;
            END LOOP;
          END $$;
          -- 089b: semantic reasoning layer
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.semantic_units (
            unit_id CHAR(64) PRIMARY KEY,
            document_id BIGINT NOT NULL REFERENCES oc_design_intelligence.documents(document_id),
            document_version INTEGER NOT NULL CHECK(document_version > 0),
            ordinal INTEGER NOT NULL CHECK(ordinal > 0),
            parent_unit_id CHAR(64) REFERENCES oc_design_intelligence.semantic_units(unit_id),
            unit_type TEXT NOT NULL CHECK(unit_type IN(
              'HEADING','SECTION','PARAGRAPH','BULLET_LIST','NUMBERED_PROCEDURE','TABLE','CAPTION',
              'CODE_EXAMPLE','QUOTED_GUIDANCE','RECOMMENDATION','WARNING','ANTI_PATTERN','BEST_PRACTICE')),
            authorized_text TEXT NOT NULL,
            source_location JSONB NOT NULL,
            domains JSONB NOT NULL DEFAULT '[]'::jsonb,
            educational_classifications JSONB NOT NULL DEFAULT '[]'::jsonb,
            knowledge_types JSONB NOT NULL DEFAULT '[]'::jsonb,
            classification_confidence NUMERIC NOT NULL CHECK(classification_confidence BETWEEN 0 AND 1),
            classification_evidence JSONB NOT NULL DEFAULT '[]'::jsonb,
            classification_version TEXT NOT NULL,
            embedding JSONB NOT NULL,
            embedding_metadata JSONB NOT NULL,
            search_vector TSVECTOR GENERATED ALWAYS AS (to_tsvector('english', authorized_text)) STORED,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            UNIQUE(document_id, document_version, ordinal)
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.semantic_relationships (
            relationship_id CHAR(64) PRIMARY KEY,
            source_unit_id CHAR(64) NOT NULL REFERENCES oc_design_intelligence.semantic_units(unit_id),
            target_unit_id CHAR(64) NOT NULL REFERENCES oc_design_intelligence.semantic_units(unit_id),
            relationship_type TEXT NOT NULL CHECK(relationship_type IN(
              'SUPPORTS','CONTRADICTS','EXTENDS','SPECIALIZES','RELATED_TO','USED_BY','IMPROVES','REQUIRES','REFERENCES')),
            confidence NUMERIC NOT NULL CHECK(confidence BETWEEN 0 AND 1),
            rationale TEXT NOT NULL,
            provenance JSONB NOT NULL,
            generator_version TEXT NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            CHECK(source_unit_id <> target_unit_id),
            UNIQUE(source_unit_id, target_unit_id, relationship_type, generator_version)
          );
          CREATE TABLE IF NOT EXISTS oc_design_intelligence.semantic_audit_events (
            semantic_audit_event_id BIGSERIAL PRIMARY KEY,
            unit_id CHAR(64) REFERENCES oc_design_intelligence.semantic_units(unit_id),
            relationship_id CHAR(64) REFERENCES oc_design_intelligence.semantic_relationships(relationship_id),
            event_type TEXT NOT NULL,
            details JSONB NOT NULL DEFAULT '{}'::jsonb,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            CHECK(unit_id IS NOT NULL OR relationship_id IS NOT NULL)
          );
          CREATE INDEX IF NOT EXISTS design_semantic_document_idx ON oc_design_intelligence.semantic_units(document_id, document_version, ordinal);
          CREATE INDEX IF NOT EXISTS design_semantic_domains_idx ON oc_design_intelligence.semantic_units USING GIN(domains);
          CREATE INDEX IF NOT EXISTS design_semantic_types_idx ON oc_design_intelligence.semantic_units USING GIN(knowledge_types);
          CREATE INDEX IF NOT EXISTS design_relationship_source_idx ON oc_design_intelligence.semantic_relationships(source_unit_id, relationship_type);
          CREATE INDEX IF NOT EXISTS design_relationship_target_idx ON oc_design_intelligence.semantic_relationships(target_unit_id, relationship_type);
          DO $$ DECLARE tbl TEXT; BEGIN
            FOREACH tbl IN ARRAY ARRAY['semantic_units','semantic_relationships','semantic_audit_events'] LOOP
              IF NOT EXISTS(SELECT 1 FROM pg_trigger WHERE tgname='protect_089b_'||tbl) THEN
                EXECUTE format('CREATE TRIGGER %I BEFORE UPDATE OR DELETE ON oc_design_intelligence.%I FOR EACH ROW EXECUTE FUNCTION oc_design_intelligence.reject_mutation()','protect_089b_'||tbl,tbl);
              END IF;
            END LOOP;
          END $$;
          SQL
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Apply BUILD-051 owner-console schema to broad-suite database
        run: psql "$BROAD_DATABASE_URL" -f migrations/BUILD-051-owner-operations-console.sql
        env:
          BROAD_DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Repository-wide backend suite
        run: >-
          env -u TEST_DATABASE_URL python -m pytest -q
          --ignore=tests/calyx_certification/test_deterministic_failure_round2.py
          --ignore=tests/test_calyx_journalism_mvp_001.py
          --deselect=tests/test_build_034_044_049_integration.py::test_state_changing_runtime_routes_fail_closed_without_api_key
        env:
          DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
      - name: Scientific interpretation package Ruff diagnostic
        continue-on-error: true
        run: python -m ruff check app/scientific_interpretation tests/test_build_087b_scientific_interpretation.py
      - name: Strict BUILD-087B repair hygiene
        run: |
          python -m compileall -q app/scientific_interpretation app/main.py runtime/knowledge_graph
          python -m ruff check app/scientific_interpretation/postgres_repository.py runtime/knowledge_graph/source_registry.py tests/test_ci_baseline_001.py
          git diff --check
