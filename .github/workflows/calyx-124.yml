name: CALYX-124 Validation

on:
  pull_request:
    paths:
      - "runtime/calyx_certification/production_certification_report.py"
      - "tests/test_calyx_124_production_certification_report.py"
      - ".github/workflows/calyx-124.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/production_certification_report.py tests/test_calyx_124_production_certification_report.py
      - run: pytest -q tests/test_calyx_124_production_certification_report.py
