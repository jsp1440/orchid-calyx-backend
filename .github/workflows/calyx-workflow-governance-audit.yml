name: CALYX Workflow Governance Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_workflow_governance.py'
      - 'tests/test_workflow_governance_audit.py'
      - 'docs/brain/BUILD-101-CURRENT-MAIN-WORKFLOW-GOVERNANCE.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_workflow_governance.py'
      - 'tests/test_workflow_governance_audit.py'
      - 'docs/brain/BUILD-101-CURRENT-MAIN-WORKFLOW-GOVERNANCE.md'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calyx-workflow-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Detect owner-operated workflow bottlenecks
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install focused validation dependencies
        run: python -m pip install pytest ruff

      - name: Compile and lint auditor surface
        run: |
          python -m py_compile scripts/audit_workflow_governance.py tests/test_workflow_governance_audit.py
          ruff check scripts/audit_workflow_governance.py tests/test_workflow_governance_audit.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_workflow_governance_audit.py

      - name: Generate governance inventory
        if: always()
        run: |
          python scripts/audit_workflow_governance.py \
            --json workflow-governance-report.json \
            --markdown workflow-governance-report.md

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f workflow-governance-report.md ]; then
            cat workflow-governance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Workflow governance report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload machine-readable and human-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calyx-workflow-governance-${{ github.run_id }}
          path: |
            workflow-governance-report.json
            workflow-governance-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Record operating boundary
        if: always()
        run: |
          echo 'This audit does not dispatch, disable, delete, or mutate another workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual-only destructive operations may remain gated; routine owner-operated bottlenecks must be converted to event-, dependency-, or schedule-driven execution.' >> "$GITHUB_STEP_SUMMARY"
