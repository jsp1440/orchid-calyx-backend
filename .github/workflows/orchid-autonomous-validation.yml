name: Orchid Autonomous Backend Validation

on:
  pull_request:
    branches: [oc-autonomous-integration]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swarm post-build write-set verification
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # Only PRs actually dispatched by a versioned Swarm controller carry a
          # durable lease receipt. Legacy/manual PRs remain valid.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr="${{ github.event.pull_request.number }}"
          else
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --base oc-autonomous-integration --head "$HEAD_REF" \
              --json number --jq '.[0].number // empty')
          fi
          if [[ -z "${pr:-}" ]]; then
            echo "No integration PR for this head; write-set verification not applicable."
            exit 0
          fi

          body=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" | sed -n '1p')
          if [[ -z "$issue" ]]; then
            echo "PR #$pr has no OC-AUTO-ISSUE marker; write-set verification not applicable."
            exit 0
          fi

          lease=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[].body | select(test("^\\[OC-SWARM-V[0-9]+\\].*lease claimed:"; "i"))] | last // ""')
          if [[ -z "$lease" ]]; then
            echo "Issue #$issue has no versioned Swarm lease receipt; treating as legacy/manual work."
            exit 0
          fi

          files=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json files --jq '[.files[].path]')
          echo "Verifying PR #$pr actual changed files against issue #$issue resource lease."
          python3 scripts/oc_swarm_write_set_verifier.py \
            --lease-comment "$lease" \
            --files-json "$files" \
            --issue-number "$issue"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Diff hygiene
        run: git diff --check
      - name: Compile Python sources
        run: python -m compileall -q app runtime harvesters scripts
      - name: Validate changed Python files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.sha }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin oc-autonomous-integration
            base=$(git merge-base HEAD origin/oc-autonomous-integration)
          fi
          mapfile -t pyfiles < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' | while read -r f; do [[ -f "$f" ]] && echo "$f"; done)
          if (( ${#pyfiles[@]} > 0 )); then
            ruff check "${pyfiles[@]}"
          fi
          mapfile -t tests < <(printf '%s\n' "${pyfiles[@]:-}" | grep -E '(^|/)test[^/]*\.py$|(^|/)tests/.*\.py$' || true)
          if (( ${#tests[@]} > 0 )); then
            python -m pytest -q --maxfail=1 "${tests[@]}"
          fi
