name: OC Real Canonical Matrix Proof

on:
  pull_request:
    branches: [oc-autonomous-integration]
    paths:
      - "scripts/prove_real_canonical_matrix_slice.py"
      - ".github/workflows/oc-real-canonical-matrix-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-real-canonical-phalaenopsis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout exact backend head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify proof script compiles
        run: python -m compileall -q scripts/prove_real_canonical_matrix_slice.py
      - name: Prove real canonical evidence → governed Matrix
        run: python scripts/prove_real_canonical_matrix_slice.py
      - name: Verify evidence receipt exists
        run: test -s real-canonical-matrix-proof.json
