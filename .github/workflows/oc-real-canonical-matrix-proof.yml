name: OC Real Canonical Matrix Proof

on:
  pull_request:
    branches: [oc-autonomous-integration]
    paths:
      - "scripts/prove_real_canonical_matrix_slice.py"
      - ".github/workflows/oc-real-canonical-matrix-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-real-canonical-phalaenopsis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRONTEND_SHA: 7b781cf3916b412502b4654e4bff0937ca6d3738
    steps:
      - name: Checkout exact backend head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify proof script compiles
        run: python -m compileall -q scripts/prove_real_canonical_matrix_slice.py

      - name: Prove real canonical evidence → governed Matrix
        run: python scripts/prove_real_canonical_matrix_slice.py

      - name: Verify real evidence receipts exist
        run: |
          test -s real-canonical-matrix-proof.json
          test -s real-canonical-matrix-consumer.json

      - name: Checkout exact frontend integration head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jsp1440/orchid-continuum-frontend
          ref: ${{ env.FRONTEND_SHA }}
          path: frontend

      - name: Verify pinned frontend SHA
        run: test "$(git -C frontend rev-parse HEAD)" = "${FRONTEND_SHA}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Consume real backend receipt through Matrix → Atlas → Calyx
        working-directory: frontend
        env:
          OC_CROSS_REPO_PROOF_JSON: ../real-canonical-matrix-consumer.json
        run: |
          npm test -- \
            src/lib/crossRepoScientificConvergence.test.ts \
            src/lib/canonicalContinuumDemoContinuity.current.test.ts \
            src/pages/RelationshipMatrixNext.canonicalSource.test.ts

      - name: Record exact Phase 1 heads
        run: |
          echo "backend_sha=${GITHUB_SHA}"
          echo "frontend_sha=${FRONTEND_SHA}"
