name: CALYX-RUNTIME-001A Self-Audit

on:
  pull_request:
    paths:
      - "runtime/self_audit.py"
      - "tests/test_calyx_runtime_001a_self_audit.py"
      - ".github/workflows/calyx-runtime-001a-self-audit.yml"
  workflow_dispatch:

jobs:
  self-audit-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install pytest ruff
      - name: Lint and format
        run: |
          python -m ruff check runtime/self_audit.py tests/test_calyx_runtime_001a_self_audit.py
          python -m ruff format --check runtime/self_audit.py tests/test_calyx_runtime_001a_self_audit.py
      - name: Governed self-audit tests
        run: python -m pytest -q tests/test_calyx_runtime_001a_self_audit.py
      - name: Compile
        run: python -m compileall -q runtime/self_audit.py
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
