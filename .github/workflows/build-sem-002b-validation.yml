name: BUILD-SEM-002B validation

on:
  pull_request:
    paths:
      - "app/concepts/**"
      - "migrations/102b_concept_lexical_definition_services.sql"
      - "scripts/validate_build_sem_002b_migration.py"
      - "tests/test_build_sem_002b_lexical_services.py"
      - ".github/workflows/build-sem-002b-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx ruff
      - name: Validate additive migration
        run: python scripts/validate_build_sem_002b_migration.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_build_sem_002a_core_concept_registry.py tests/test_build_sem_002b_lexical_services.py
      - name: Ruff changed concept files
        run: python -m ruff check app/concepts tests/test_build_sem_002b_lexical_services.py scripts/validate_build_sem_002b_migration.py
      - name: Compile concept module
        run: python -m compileall -q app/concepts
