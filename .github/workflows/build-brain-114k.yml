name: BUILD-BRAIN-114K Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/sandbox_supervisor_*.py"
      - "app/calyx_orchestrator/routes.py"
      - "tests/test_calyx_sandbox_supervisor_evidence.py"
      - "migrations/20260808_calyx_sandbox_validation_requests.sql"
      - "docs/brain/BUILD-BRAIN-114K-EXTERNAL-SUPERVISOR-EVIDENCE.md"
      - ".github/workflows/build-brain-114k.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile supervisor evidence surface
        run: >-
          python -m compileall -q
          app/calyx_orchestrator/sandbox_supervisor_evidence.py
          app/calyx_orchestrator/sandbox_supervisor_models.py
          app/calyx_orchestrator/sandbox_supervisor_service.py
          app/calyx_orchestrator/sandbox_supervisor_routes.py
          tests/test_calyx_sandbox_supervisor_evidence.py
      - name: Ruff supervisor evidence surface
        run: >-
          ruff check
          app/calyx_orchestrator/sandbox_supervisor_evidence.py
          app/calyx_orchestrator/sandbox_supervisor_models.py
          app/calyx_orchestrator/sandbox_supervisor_service.py
          app/calyx_orchestrator/sandbox_supervisor_routes.py
          tests/test_calyx_sandbox_supervisor_evidence.py
      - name: Focused supervisor evidence regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_calyx_sandbox_supervisor_evidence.py
      - name: Migration contract
        run: |
          grep -q "calyx_sandbox_validation_requests" migrations/20260808_calyx_sandbox_validation_requests.sql
          grep -q "request_digest" migrations/20260808_calyx_sandbox_validation_requests.sql
          grep -q "receipt_digest" migrations/20260808_calyx_sandbox_validation_requests.sql
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
