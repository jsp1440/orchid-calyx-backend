name: CALYX-TAXONOMY-READINESS-API-001

on:
  pull_request:
    paths:
      - 'app/routers/taxonomy_releases.py'
      - 'runtime/world_plants_readiness_api.py'
      - 'tests/test_world_plants_readiness_api_001.py'
      - '.github/workflows/calyx-taxonomy-readiness-api-001.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff fastapi python-multipart httpx2
      - run: python -m ruff check app/routers/taxonomy_releases.py runtime/world_plants_readiness_api.py tests/test_world_plants_readiness_api_001.py
      - run: python -m ruff format --check app/routers/taxonomy_releases.py runtime/world_plants_readiness_api.py tests/test_world_plants_readiness_api_001.py
      - run: python -m pytest -q tests/test_world_plants_readiness_api_001.py tests/test_world_plants_upload_001.py
      - run: python -m compileall -q app/routers/taxonomy_releases.py runtime/world_plants_readiness_api.py
      - run: git diff --check
