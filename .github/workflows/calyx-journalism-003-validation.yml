name: CALYX-JOURNALISM-003 Validation

on:
  pull_request:
    paths:
      - 'app/calyx_journalism/**'
      - 'app/calyx_agent/**'
      - 'tests/test_calyx_journalism_003.py'
      - 'migrations/20260801_calyx_journalism_003.sql'
      - 'docs/architecture/CALYX-JOURNALISM-003.md'
      - '.github/workflows/calyx-journalism-003-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-journalism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/calyx_journalism app/calyx_agent
      - name: Ruff
        run: ruff check app/calyx_journalism app/calyx_agent tests/test_calyx_journalism_003.py
      - name: Focused tests
        run: pytest -q tests/test_calyx_journalism_003.py
      - name: Route registration smoke
        env:
          CALYX_API_KEY: test-key
          CALYX_OWNER_SESSION_SECRET: test-secret
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {
              '/brain/journalism/evidence-packets/{packet_id}',
              '/brain/journalism/articles/{article_id}',
          }
          missing = required - paths
          if missing:
              raise SystemExit(f'Missing routes: {sorted(missing)}')
          print('CALYX-JOURNALISM-003 routes registered')
          PY
