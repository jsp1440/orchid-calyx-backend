name: Orchid Continuous Completion Pulse

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  pulse:
    if: github.event.issue.number == 1031 && contains(github.event.comment.body, '[OC_ENGINE_PULSE]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch continuous completion scheduler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run orchid-continuous-completion.yml --repo "$GITHUB_REPOSITORY" --ref main
