name: Orchid Continuous Completion Pulse

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  pulse:
    if: github.event.issue.number == 1031 && contains(github.event.comment.body, '[OC_ENGINE_PULSE]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch continuous completion scheduler
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          output=$(gh workflow run orchid-continuous-completion.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1)
          code=$?
          if [[ $code -eq 0 ]]; then
            {
              echo "### Orchid Continuous Pulse"
              echo ""
              echo "DISPATCHED: workflow_dispatch accepted for Orchid Continuous Completion."
              echo "Source pulse run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Orchid Continuous Pulse"
              echo ""
              echo "FAILED: workflow_dispatch was rejected with exit code ${code}."
              echo "Source pulse run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "Diagnostic: ${output}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
