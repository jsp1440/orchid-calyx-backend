name: CALYX-BRAIN-EDU-DESIGN-001 Validation

on:
  pull_request:
    paths:
      - 'app/brain/education_design_routes.py'
      - 'app/brain/routes.py'
      - 'app/calyx_agent/**'
      - 'app/calyx_orchestrator/service.py'
      - 'tests/test_calyx_brain_edu_design_001.py'
      - 'docs/architecture/CALYX-BRAIN-CURRENT-STATUS-2026-08.md'
      - '.github/workflows/calyx-brain-edu-design-001-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  education-design-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CALYX_AGENT_PROVIDER: ''
      CALYX_AGENT_MODEL: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx
      - name: Compile
        run: python -m compileall -q app/brain app/calyx_agent app/calyx_orchestrator app/design_intelligence
      - name: Ruff
        run: ruff check app/brain/education_design_routes.py app/calyx_agent/tools.py app/calyx_agent/service.py app/calyx_orchestrator/service.py tests/test_calyx_brain_edu_design_001.py
      - name: Focused tests
        run: pytest -q tests/test_calyx_brain_edu_design_001.py tests/test_calyx_agent_001.py tests/test_calyx_agent_002.py tests/test_calyx_agent_003.py
      - name: Route registration smoke
        env:
          CALYX_API_KEY: test-key
          CALYX_OWNER_SESSION_SECRET: test-secret
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {
              '/brain/education-design/readiness',
              '/brain/education-design/search',
              '/brain/agent/capabilities',
              '/brain/orchestrator/status',
          }
          missing = required - paths
          if missing:
              raise SystemExit(f'Missing routes: {sorted(missing)}')
          print('Education and Design Intelligence Brain routes registered')
          PY
