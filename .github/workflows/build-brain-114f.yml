name: BUILD-BRAIN-114F Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/**"
      - "tests/test_calyx_*"
      - "migrations/2026080*_calyx_*"
      - ".github/workflows/build-brain-114*.yml"
      - "docs/brain/BUILD-BRAIN-114*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile autonomy surface
        run: python -m compileall -q app/calyx_orchestrator
      - name: Ruff autonomy surface
        run: |
          ruff check \
            app/calyx_orchestrator \
            tests/test_calyx_autonomous_program_cycle.py \
            tests/test_calyx_repository_evidence_executor.py \
            tests/test_calyx_isolated_patch_executor.py \
            tests/test_calyx_static_validation_executor.py \
            tests/test_calyx_governed_assignment_factory.py \
            tests/test_calyx_autonomous_patch_validation_program.py
      - name: Focused current-main autonomy regressions
        run: |
          pytest -q \
            tests/test_calyx_autonomous_program_cycle.py \
            tests/test_calyx_repository_evidence_executor.py \
            tests/test_calyx_isolated_patch_executor.py \
            tests/test_calyx_static_validation_executor.py \
            tests/test_calyx_governed_assignment_factory.py \
            tests/test_calyx_autonomous_patch_validation_program.py
      - name: Migration compatibility
        run: |
          grep -q "ADD COLUMN IF NOT EXISTS input_json TEXT NULL" migrations/20260805_calyx_autonomous_engineering_core.sql
          grep -q "ADD COLUMN IF NOT EXISTS input_json TEXT NULL" migrations/20260807_calyx_program_job_inputs.sql
      - name: Diff hygiene
        run: git diff --check
