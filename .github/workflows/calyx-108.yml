name: CALYX-108 Validation
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/owner_authorization.py tests/test_calyx_108_owner_authorization.py
      - run: pytest -q tests/test_calyx_108_owner_authorization.py
