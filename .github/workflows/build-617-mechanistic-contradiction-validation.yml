name: BUILD-617 Mechanistic Contradiction Validation

on:
  pull_request:
    paths:
      - 'app/brain/mechanistic_contradictions.py'
      - 'app/brain/mechanistic_publication_plan.py'
      - 'app/parallel_platform/routes.py'
      - 'tests/test_build_617_mechanistic_contradictions.py'
      - 'tests/test_build_616_mechanistic_publication_plan.py'
      - 'tests/test_build_615_mechanistic_candidate_graph.py'
      - '.github/workflows/build-617-mechanistic-contradiction-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mechanistic-contradictions:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile BUILD-617 slice
        run: >-
          python -m py_compile
          app/brain/mechanistic_contradictions.py
          app/brain/mechanistic_publication_plan.py
          app/parallel_platform/routes.py
          tests/test_build_617_mechanistic_contradictions.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/mechanistic_contradictions.py
          app/brain/mechanistic_publication_plan.py
          app/parallel_platform/routes.py
          tests/test_build_617_mechanistic_contradictions.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/mechanistic_contradictions.py
          app/brain/mechanistic_publication_plan.py
          app/parallel_platform/routes.py
          tests/test_build_617_mechanistic_contradictions.py
      - name: BUILD-617 behavioral regressions
        run: python -m pytest -q tests/test_build_617_mechanistic_contradictions.py
      - name: BUILD-616 and BUILD-615 regressions
        run: >-
          python -m pytest -q
          tests/test_build_616_mechanistic_publication_plan.py
          tests/test_build_615_mechanistic_candidate_graph.py
      - name: Verify contradiction route
        run: >-
          python -c "from app.parallel_platform.routes import router; assert any(r.path == '/api/platform/brain/mechanistic-contradictions' for r in router.routes)"
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
