name: Orchid Continuous Completion

# The scheduler stays lightweight. It never runs Claude inline. Instead it
# dispatches Orchid Completion Lane through workflow_dispatch, which GitHub
# explicitly allows to create downstream workflow runs from GITHUB_TOKEN and
# which Claude Code Action v1 supports as an automation event.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/automation/continuous-engine-trigger'
  pull_request:
    types: [closed, synchronize, ready_for_review]
  issues:
    types: [closed, reopened]

concurrency:
  group: orchid-continuous-completion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  reconcile-and-dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure orchestration labels and current integration base
        shell: bash
        run: |
          set -euo pipefail
          ensure_label () {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" 2>/dev/null || true
          }
          ensure_label oc-queued 1d76db "Eligible for autonomous Orchid Continuum execution"
          ensure_label oc-running fbca04 "Currently assigned to an autonomous execution lane"
          ensure_label oc-validating 8250df "Implementation delivered; validation/integration supervisor owns next transition"
          ensure_label oc-owner-gate d93f0b "Validated integration batch awaits owner-gated main/deploy decision"
          ensure_label oc-blocked b60205 "Externally blocked; does not consume an execution lane"
          ensure_label oc-done 0e8a16 "Acceptance criteria completed"
          ensure_label oc-auto-generated 5319e7 "Generated by autonomous backlog planning"

          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$INTEGRATION_BRANCH" || git fetch origin main
          if git show-ref --verify --quiet "refs/remotes/origin/$INTEGRATION_BRANCH"; then
            git checkout -B "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"
          else
            git checkout -B "$INTEGRATION_BRANCH" origin/main
          fi
          if git merge --no-edit origin/main; then
            git push origin "HEAD:$INTEGRATION_BRANCH"
          else
            git merge --abort
            echo "Integration branch conflicts with current main; worker PRs stay isolated until reconciliation." >&2
          fi

      - name: Reclaim abandoned lanes
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          mapfile -t running < <(gh issue list --repo "$REPO" --state open --label oc-running --limit 100 --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"')
          for row in "${running[@]:-}"; do
            [[ -n "$row" ]] || continue
            issue=${row%% *}
            updated=${row#* }
            epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo "$now")

            # A completion lane may legitimately run for up to 70 minutes. Do not
            # infer that it finished merely because an older durable PR exists:
            # repair lanes intentionally update an existing PR. Only reclaim after
            # the worker timeout plus a ten-minute control-plane grace period.
            if (( now - epoch <= 4800 )); then
              continue
            fi

            marker="OC-AUTO-ISSUE: #${issue}"
            durable=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty")
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-running >/dev/null 2>&1 || true
            if [[ -n "$durable" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Worker lease exceeded 80 minutes, but durable integration PR #$durable exists. Reclaimed the lane into validation rather than redispatching Claude." >/dev/null 2>&1 || true
            else
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Worker lease exceeded 80 minutes with no durable integration PR. Lane reclaimed and returned to queue." >/dev/null 2>&1 || true
            fi
          done

      - name: Validate and integrate delivered worker PRs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | .number')
          for pr in "${prs[@]:-}"; do
            [[ -n "$pr" ]] || continue
            data=$(gh pr view "$pr" --repo "$REPO" --json body,isDraft,mergeStateStatus,headRefName,headRefOid)
            body=$(jq -r '.body // ""' <<<"$data")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" | sed -n '1p')
            [[ -n "$issue" ]] || continue

            # oc-running is the execution lease. Never steal it merely because a
            # durable PR already exists: a bounded repair worker may be updating
            # that same PR. This also prevents merging an old green head while a
            # repair worker is still active.
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
            if [[ "$labels" == *oc-running* ]]; then
              continue
            fi
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true

            head=$(jq -r '.headRefName' <<<"$data")
            sha=$(jq -r '.headRefOid' <<<"$data")
            runs=$(gh run list --repo "$REPO" --workflow orchid-autonomous-validation.yml --branch "$head" --event workflow_dispatch --limit 20 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            result=$(jq -r --arg sha "$sha" '[.[] | select(.headSha == $sha)][0] | if . then (.status + " " + (.conclusion // "")) else "" end' <<<"$runs")

            if [[ -z "$result" ]]; then
              # No validation evidence for this exact head. Retry validation only;
              # never pay for Claude merely because workflow dispatch was transient.
              gh workflow run orchid-autonomous-validation.yml --repo "$REPO" --ref "$head" >/dev/null 2>&1 || true
              continue
            fi
            [[ "$result" == completed* ]] || continue
            if [[ "$result" != "completed success" ]]; then
              # A completed red exact-head validation is an implementation repair
              # signal. Queue one bounded repair; the lane concurrency + lease
              # preflight suppress any stale duplicate dispatches.
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              continue
            fi

            merge_state=$(jq -r '.mergeStateStatus' <<<"$data")
            if [[ "$merge_state" == "BEHIND" ]]; then
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null 2>&1 || true
              continue
            fi
            if [[ "$merge_state" == "DIRTY" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              continue
            fi
            if [[ $(jq -r '.isDraft' <<<"$data") == "true" ]]; then
              gh pr ready "$pr" --repo "$REPO" >/dev/null 2>&1 || true
            fi

            if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch=false >/dev/null 2>&1; then
              requeue=false
              blocked=false
              grep -Eiq '^OC-AUTO-REQUEUE:[[:space:]]*true[[:space:]]*$' <<<"$body" && requeue=true || true
              grep -Eiq '^OC-AUTO-BLOCKED:[[:space:]]*true[[:space:]]*$' <<<"$body" && blocked=true || true
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued >/dev/null 2>&1 || true
              if [[ "$blocked" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-blocked >/dev/null 2>&1 || true
              elif [[ "$requeue" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --add-label oc-done >/dev/null 2>&1 || true
                gh issue close "$issue" --repo "$REPO" --comment "[OC-AUTO] Validated slice integrated into $INTEGRATION_BRANCH. Main and production remain owner-gated." >/dev/null 2>&1 || true
              fi
            fi
          done

      - name: Reconcile queue labels against durable PR lineage
        shell: bash
        run: |
          set -euo pipefail
          # Queue labels are advisory; durable PR lineage is authoritative. Repair
          # any stale queued state before backlog seeding/selection so a scheduler
          # restart or prior transient failure cannot duplicate already-delivered work.
          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | [.number, .body] | @base64')
          for encoded in "${prs[@]:-}"; do
            [[ -n "$encoded" ]] || continue
            pr_json=$(base64 --decode <<<"$encoded")
            pr=$(jq -r '.[0]' <<<"$pr_json")
            body=$(jq -r '.[1] // ""' <<<"$pr_json")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" | sed -n '1p')
            [[ -n "$issue" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ -n "$labels" ]] || continue
            [[ "$labels" == *oc-running* ]] && continue
            if [[ "$labels" == *oc-queued* || "$labels" != *oc-validating* ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Reconciled stale queue state to durable integration PR #$pr; duplicate worker dispatch suppressed." >/dev/null 2>&1 || true
            fi
          done

      - name: Seed curated completion backlog
        shell: bash
        run: |
          set -euo pipefail
          BACKLOG=(1030 1029 1025 1026 1027 1008 1021 1022 1023 1024)
          for issue in "${BACKLOG[@]}"; do
            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo MISSING)
            [[ "$state" == OPEN ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
            if [[ "$labels" != *oc-queued* && "$labels" != *oc-running* && "$labels" != *oc-validating* && "$labels" != *oc-owner-gate* && "$labels" != *oc-blocked* && "$labels" != *oc-done* ]]; then
              gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null
            fi
          done

      - name: Dispatch up to three completion workers
        shell: bash
        run: |
          set -euo pipefail
          BACKLOG=(1030 1029 1025 1026 1027 1008 1021 1022 1023 1024)
          selected=()
          contains () { for x in "${selected[@]:-}"; do [[ "$x" == "$1" ]] && return 0; done; return 1; }

          for issue in "${BACKLOG[@]}"; do
            (( ${#selected[@]} >= 3 )) && break
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$labels" == *oc-queued* ]] && selected+=("$issue")
          done
          if (( ${#selected[@]} < 3 )); then
            mapfile -t extra < <(gh issue list --repo "$REPO" --state open --label oc-queued --limit 200 --json number,createdAt --jq 'sort_by(.createdAt) | .[].number')
            for issue in "${extra[@]:-}"; do
              (( ${#selected[@]} >= 3 )) && break
              contains "$issue" || selected+=("$issue")
            done
          fi

          dispatched=()
          for issue in "${selected[@]:-}"; do
            [[ -n "$issue" ]] || continue
            # Last-moment durable-lineage guard closes the race between queue
            # reconciliation and dispatch if a worker PR appeared in this run.
            marker="OC-AUTO-ISSUE: #${issue}"
            durable=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty")
            if [[ -n "$durable" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
              continue
            fi

            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-validating --add-label oc-running >/dev/null
            if gh workflow run orchid-completion-lane.yml --repo "$REPO" --ref main -f issue_number="$issue" >/dev/null; then
              dispatched+=("$issue")
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Scheduler dispatched completion worker via workflow_dispatch. Scheduler run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
            else
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --add-label oc-queued >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Worker dispatch failed; lane returned to queue. Scheduler run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null 2>&1 || true
            fi
          done
          if (( ${#dispatched[@]} > 0 )); then
            joined=$(IFS=,; echo "${dispatched[*]}")
            gh issue comment 1031 --repo "$REPO" --body "ORCHID CONTINUOUS ENGINE — dispatched worker workflow(s) for issue(s) ${joined}. Scheduler run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
          fi

      - name: Maintain integration-to-main owner gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATION_BRANCH" || exit 0
          (( $(git rev-list --count "origin/main..origin/$INTEGRATION_BRANCH") > 0 )) || exit 0
          pr=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          body='Autonomously validated backend integration batch. Worker PRs may merge here only after independent validation. This integration branch must never be auto-merged to main or deployed to production. OC-AUTO-INTEGRATION-GATE'
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$REPO" --base main --head "$INTEGRATION_BRANCH" --draft --title "OC autonomous backend integration batch" --body "$body" >/dev/null
            pr=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          else
            gh pr edit "$pr" --repo "$REPO" --body "$body" >/dev/null
          fi
          [[ -z "$pr" ]] || gh pr edit "$pr" --repo "$REPO" --add-label oc-owner-gate >/dev/null 2>&1 || true
