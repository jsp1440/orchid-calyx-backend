name: Orchid Continuous Completion

# Lightweight control plane: never run Claude inline. The scheduler reconciles
# durable state and dispatches parameterized completion workers only while the
# Claude runtime health circuit is closed.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/automation/continuous-engine-trigger'
  pull_request:
    types: [closed, synchronize, ready_for_review]
  issues:
    types: [closed, reopened]

concurrency:
  group: orchid-continuous-completion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  reconcile-and-dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
      # Recovery mode intentionally admits one authoritative implementation
      # lease. Expand only after #1193 is delivered or truthfully blocked.
      MAX_ACTIVE_LANES: 1
      STABILIZATION_ISSUE: 1193
      MAX_REPAIR_ATTEMPTS: 2
      RUNTIME_TRACKER_ISSUE: 1031
      PLANNER: scripts/oc_portfolio_scheduler.py
    steps:
      # The checkout must match whichever ref GitHub took this workflow file from,
      # or the file and the code it calls disagree. GitHub resolves the file from
      # the head for workflow_dispatch and pull_request, and from main for
      # schedule/push/issues - so pin the checkout the same way. This grants no
      # extra reach: on a pull_request the head's workflow file is already what is
      # executing, whatever the checkout says.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && github.sha || 'main' }}
          fetch-depth: 0

      - name: Ensure orchestration labels and current integration base
        shell: bash
        run: |
          set -euo pipefail
          ensure_label () {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" 2>/dev/null || true
          }
          ensure_label oc-queued 1d76db "Eligible for autonomous Orchid Continuum execution"
          ensure_label oc-running fbca04 "Currently assigned to an autonomous execution lane"
          ensure_label oc-validating 8250df "Implementation delivered; validation/integration supervisor owns next transition"
          ensure_label oc-repair bfd4f2 "Exact-head validation or merge conflict authorized one bounded repair"
          ensure_label oc-owner-gate d93f0b "Validated integration batch awaits owner-gated main/deploy decision"
          ensure_label oc-blocked b60205 "Externally blocked; does not consume an execution lane"
          ensure_label oc-done 0e8a16 "Acceptance criteria completed"
          ensure_label oc-auto-generated 5319e7 "Generated by autonomous backlog planning"
          ensure_label oc-runtime-backoff 6e7781 "Worker parked after Claude runtime/provider failure; not eligible until canary recovery"
          ensure_label oc-repair-backoff 6e7781 "Bounded repair attempts exhausted; parked pending material change"
          ensure_label oc-runtime-degraded cf222e "Preferred Claude runtime degraded; authorized fallback may remain available"
          ensure_label oc-provider-chain-blocked 5319e7 "All authorized providers unavailable or fail-closed; scheduler parked"
          ensure_label oc-p0 b60205 "Portfolio priority P0 — completion/control-plane critical"
          ensure_label oc-p1 d93f0b "Portfolio priority P1 — core scientific/product integration"
          ensure_label oc-p2 fbca04 "Portfolio priority P2 — major application completion"
          ensure_label oc-p3 1d76db "Portfolio priority P3 — federation/data expansion"
          ensure_label oc-p4 8250df "Portfolio priority P4 — operational completion"
          ensure_label oc-p5 6e7781 "Portfolio priority P5 — idle-capacity enrichment"

          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This step switches branches to maintain the integration base, which
          # leaves the working tree on that branch. Later steps run control-plane
          # code from the checkout, so remember the ref that was checked out and
          # restore it before handing over.
          control_plane=$(git rev-parse HEAD)

          git fetch origin main "$INTEGRATION_BRANCH" || git fetch origin main
          if git show-ref --verify --quiet "refs/remotes/origin/$INTEGRATION_BRANCH"; then
            git checkout -B "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"
          else
            git checkout -B "$INTEGRATION_BRANCH" origin/main
          fi
          if git merge --no-edit origin/main; then
            git push origin "HEAD:$INTEGRATION_BRANCH"
          else
            git merge --abort
            echo "Integration branch conflicts with current main; worker PRs stay isolated until reconciliation." >&2
          fi

          git checkout --force --detach "$control_plane"

      - name: Reclaim abandoned lanes
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          mapfile -t running < <(gh issue list --repo "$REPO" --state open --label oc-running --limit 100 --json number,updatedAt,labels --jq '.[] | [.number, .updatedAt, ([.labels[].name] | join(" "))] | @tsv')
          for row in "${running[@]:-}"; do
            [[ -n "$row" ]] || continue
            IFS=$'\t' read -r issue updated labels <<<"$row"
            epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo "$now")
            if (( now - epoch <= 4800 )); then
              continue
            fi
            if [[ "$labels" == *oc-repair-backoff* ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-queued --remove-label oc-repair >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Stale lease released while repair backoff remains authoritative; issue was not requeued." >/dev/null 2>&1 || true
              continue
            fi
            marker="OC-AUTO-ISSUE: #${issue}"
            durable=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty")
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-repair >/dev/null 2>&1 || true
            if [[ -n "$durable" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Worker lease exceeded 80 minutes, but durable integration PR #$durable exists. Reclaimed into validation instead of redispatching Claude." >/dev/null 2>&1 || true
            else
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Worker lease exceeded 80 minutes with no durable PR. Lane reclaimed into queue." >/dev/null 2>&1 || true
            fi
          done

      - name: Validate and integrate delivered worker PRs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | .number')
          for pr in "${prs[@]:-}"; do
            [[ -n "$pr" ]] || continue
            data=$(gh pr view "$pr" --repo "$REPO" --json body,isDraft,mergeStateStatus,headRefName,headRefOid)
            body=$(jq -r '.body // ""' <<<"$data")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" | sed -n '1p')
            [[ -n "$issue" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$labels" == *oc-running* ]] && continue
            [[ "$labels" == *oc-repair-backoff* ]] && continue
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-runtime-backoff --add-label oc-validating >/dev/null 2>&1 || true

            head=$(jq -r '.headRefName' <<<"$data")
            sha=$(jq -r '.headRefOid' <<<"$data")
            runs=$(gh run list --repo "$REPO" --workflow orchid-autonomous-validation.yml --branch "$head" --event workflow_dispatch --limit 20 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            result=$(jq -r --arg sha "$sha" '[.[] | select(.headSha == $sha)][0] | if . then (.status + " " + (.conclusion // "")) else "" end' <<<"$runs")
            if [[ -z "$result" ]]; then
              gh workflow run orchid-autonomous-validation.yml --repo "$REPO" --ref "$head" >/dev/null 2>&1 || true
              continue
            fi
            [[ "$result" == completed* ]] || continue
            if [[ "$result" != "completed success" ]]; then
              latest_labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
              if [[ "$latest_labels" == *oc-repair-backoff* ]]; then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued --remove-label oc-repair >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
              fi
              continue
            fi

            merge_state=$(jq -r '.mergeStateStatus' <<<"$data")
            if [[ "$merge_state" == "BEHIND" ]]; then
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null 2>&1 || true
              continue
            fi
            if [[ "$merge_state" == "DIRTY" ]]; then
              latest_labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
              if [[ "$latest_labels" == *oc-repair-backoff* ]]; then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued --remove-label oc-repair >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
              fi
              continue
            fi
            if [[ $(jq -r '.isDraft' <<<"$data") == "true" ]]; then
              gh pr ready "$pr" --repo "$REPO" >/dev/null 2>&1 || true
            fi

            if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch=false >/dev/null 2>&1; then
              requeue=false
              blocked=false
              grep -Eiq '^OC-AUTO-REQUEUE:[[:space:]]*true[[:space:]]*$' <<<"$body" && requeue=true || true
              grep -Eiq '^OC-AUTO-BLOCKED:[[:space:]]*true[[:space:]]*$' <<<"$body" && blocked=true || true
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued --remove-label oc-repair --remove-label oc-runtime-backoff >/dev/null 2>&1 || true
              if [[ "$blocked" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-blocked >/dev/null 2>&1 || true
              elif [[ "$requeue" == true ]]; then
                latest_labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
                [[ "$latest_labels" == *oc-repair-backoff* ]] || gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --add-label oc-done >/dev/null 2>&1 || true
                gh issue close "$issue" --repo "$REPO" --comment "[OC-AUTO] Validated slice integrated into $INTEGRATION_BRANCH. Protected main/production decisions remain governed." >/dev/null 2>&1 || true
              fi
            fi
          done

      - name: Reconcile queue labels against durable PR lineage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | [.number, .body] | @base64')
          for encoded in "${prs[@]:-}"; do
            [[ -n "$encoded" ]] || continue
            pr_json=$(base64 --decode <<<"$encoded")
            pr=$(jq -r '.[0]' <<<"$pr_json")
            body=$(jq -r '.[1] // ""' <<<"$pr_json")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" | sed -n '1p')
            [[ -n "$issue" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ -n "$labels" ]] || continue
            [[ "$labels" == *oc-running* ]] && continue
            [[ "$labels" == *oc-repair* ]] && continue
            [[ "$labels" == *oc-repair-backoff* ]] && continue
            if [[ "$labels" == *oc-queued* || "$labels" != *oc-validating* ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-runtime-backoff --add-label oc-validating >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Reconciled stale queue state to durable integration PR #$pr; duplicate worker dispatch suppressed." >/dev/null 2>&1 || true
            fi
          done

      - name: Heal portfolio queue invariants
        shell: bash
        run: |
          set -euo pipefail
          # Durable priority representation. Priority is resolved once and written
          # back as an oc-p<n> label so ranking stops depending on issue wording;
          # an explicit label is authoritative and is never overwritten here.
          if [[ -f "$PLANNER" ]]; then
            gh issue list --repo "$REPO" --state open --limit 500 \
              --json number,title,labels,createdAt | jq '{issues: .}' > "$RUNNER_TEMP/oc-portfolio.json"
            python3 "$PLANNER" \
              --input "$RUNNER_TEMP/oc-portfolio.json" --mode priority-labels > "$RUNNER_TEMP/oc-priority-fixes.json"
            while read -r row; do
              [[ -n "$row" ]] || continue
              issue=$(jq -r '.number' <<<"$row")
              gh issue edit "$issue" --repo "$REPO" --add-label "$(jq -r '.add' <<<"$row")" >/dev/null 2>&1 || true
              while read -r stale; do
                [[ -n "$stale" ]] || continue
                gh issue edit "$issue" --repo "$REPO" --remove-label "$stale" >/dev/null 2>&1 || true
              done < <(jq -r '.remove[]?' <<<"$row")
            done < <(jq -c '.[]' "$RUNNER_TEMP/oc-priority-fixes.json")
          else
            echo "::warning::$PLANNER absent from this checkout; leaving priority labels untouched."
          fi

          # Terminal reconciliation: completed work must not silently carry a queue
          # lease or a repair authorization back into selection if it is ever
          # reopened. Ask the API for the intersections directly - this scheduler
          # runs every five minutes and must not spend a request per completed
          # issue just to discover that almost none of them are stale.
          mapfile -t stale_done < <(
            {
              gh issue list --repo "$REPO" --state all --label oc-done --label oc-queued --limit 200 --json number --jq '.[].number'
              gh issue list --repo "$REPO" --state all --label oc-done --label oc-repair --limit 200 --json number --jq '.[].number'
            } | sort -u
          )
          for issue in "${stale_done[@]:-}"; do
            [[ -n "$issue" ]] || continue
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-repair >/dev/null 2>&1 || true
          done

          # Repair backoff is a hard non-executable state. Strip every execution
          # lease/authorization before any healer can make the issue selectable.
          mapfile -t backed_off < <(
            {
              gh issue list --repo "$REPO" --state open --label oc-repair-backoff --label oc-queued --limit 200 --json number --jq '.[].number'
              gh issue list --repo "$REPO" --state open --label oc-repair-backoff --label oc-running --limit 200 --json number --jq '.[].number'
              gh issue list --repo "$REPO" --state open --label oc-repair-backoff --label oc-repair --limit 200 --json number --jq '.[].number'
            } | sort -u
          )
          for issue in "${backed_off[@]:-}"; do
            [[ -n "$issue" ]] || continue
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-running --remove-label oc-repair >/dev/null 2>&1 || true
          done

          # oc-repair is a positive one-pass authorization and must never become a
          # terminal state by itself. Heal every orphaned repair back to selectable
          # queue state, without spending a request per repair.
          mapfile -t repairs < <(gh issue list --repo "$REPO" --state open --label oc-repair --limit 200 --json number,labels --jq '.[] | [.number, ([.labels[].name] | join(" "))] | @tsv')
          for row in "${repairs[@]:-}"; do
            [[ -n "$row" ]] || continue
            issue=${row%%$'\t'*}
            labels=${row#*$'\t'}
            if [[ "$labels" == *oc-repair* && "$labels" != *oc-running* && "$labels" != *oc-queued* && "$labels" != *oc-runtime-backoff* && "$labels" != *oc-repair-backoff* ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
            fi
          done

      - name: Manage Claude runtime circuit
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          tracker=$(gh issue view "$RUNTIME_TRACKER_ISSUE" --repo "$REPO" --json labels,updatedAt 2>/dev/null || echo '{}')
          tracker_labels=$(jq -r '[.labels[]?.name] | join(" ")' <<<"$tracker")
          if [[ "$tracker_labels" == *oc-provider-chain-blocked* ]]; then
            updated=$(jq -r '.updatedAt // empty' <<<"$tracker")
            epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo "$now")
            age=$(( now - epoch ))
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Every authorized provider is blocked; portfolio dispatch is paused."
            if (( age >= 1800 )); then
              gh workflow run orchid-gemini-runtime-canary.yml --repo "$REPO" --ref main >/dev/null 2>&1 || true
            fi
            exit 0
          fi

          mapfile -t parked < <(gh issue list --repo "$REPO" --state open --label oc-runtime-backoff --limit 200 --json number,labels --jq '.[] | [.number, ([.labels[].name] | join(" "))] | @tsv')
          for row in "${parked[@]:-}"; do
            [[ -n "$row" ]] || continue
            issue=${row%%$'\t'*}
            labels=${row#*$'\t'}
            if [[ "$labels" == *oc-repair-backoff* ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-runtime-backoff --remove-label oc-queued --remove-label oc-running --remove-label oc-repair >/dev/null 2>&1 || true
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Runtime backoff cleared, but repair backoff remains authoritative; issue was not returned to the execution queue." >/dev/null 2>&1 || true
              continue
            fi
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-runtime-backoff --add-label oc-queued >/dev/null 2>&1 || true
            gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Claude runtime canary is healthy again. Runtime backoff cleared and issue returned to the priority portfolio." >/dev/null 2>&1 || true
          done
          echo "paused=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch priority-aware portfolio workers
        if: steps.runtime.outputs.paused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          running_count=$(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number --jq 'length')
          capacity=$(( MAX_ACTIVE_LANES - running_count ))
          if (( capacity <= 0 )); then
            echo "All ${MAX_ACTIVE_LANES} implementation lanes are occupied."
            exit 0
          fi

          #
          # Fail closed, never red: without the planner there is no authoritative
          # ranking, so this cycle dispatches nothing rather than guessing.
          if [[ ! -f "$PLANNER" ]]; then
            echo "::warning::$PLANNER absent from this checkout; no worker dispatched this cycle."
            exit 0
          fi

          # Ranking, durable-PR suppression, reserved repair capacity, bounded
          # fairness and P5 idle admission are decided by one deterministic
          # planner, so the policy is provable by unit test rather than by
          # grepping bash: tests/test_oc_portfolio_scheduler.py.
          issues=$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title,labels,createdAt)
          prs=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body)
          jq -n --argjson issues "$issues" --argjson prs "$prs" --argjson max "$MAX_ACTIVE_LANES" --argjson stabilization "$STABILIZATION_ISSUE" \
            '{max_active_lanes: $max, stabilization_issue: $stabilization, issues: $issues, pull_requests: $prs}' > "$RUNNER_TEMP/oc-plan-input.json"
          python3 "$PLANNER" \
            --input "$RUNNER_TEMP/oc-plan-input.json" --mode plan > "$RUNNER_TEMP/oc-plan.json"

          # Read-only status surface: active width, queue order with priority and
          # its source, wait time, and why each selection was made.
          {
            jq -r '"active_width=\(.active_lane_count)/\(.max_active_lanes) available=\(.available_capacity) eligible=\(.eligible_count)"' "$RUNNER_TEMP/oc-plan.json"
            echo '### queue order'
            jq -r '.ranking[] | "  P\(.priority) #\(.number) [\(.priority_source)] waited=\(.waited_hours)h"' "$RUNNER_TEMP/oc-plan.json"
            echo '### selected'
            jq -r '.selected[] | "  #\(.number) P\(.priority) via \(.selection_reason)"' "$RUNNER_TEMP/oc-plan.json"
            echo '### suppressed'
            jq -r '.suppressed[] | "  #\(.number) \(.reason)"' "$RUNNER_TEMP/oc-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

          # Durable integration PR lineage suppresses ordinary dispatch.
          while read -r issue; do
            [[ -n "$issue" ]] || continue
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
          done < <(jq -r '.suppressed[] | select(.reason == "durable-pr") | .number' "$RUNNER_TEMP/oc-plan.json")

          mapfile -t selected < <(jq -r '.selected[].number' "$RUNNER_TEMP/oc-plan.json")

          dispatched=()
          for issue in "${selected[@]:-}"; do
            [[ -n "$issue" ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$labels" == *oc-queued* ]] || continue
            [[ "$labels" == *oc-running* ]] && continue
            [[ "$labels" == *oc-validating* ]] && continue
            [[ "$labels" == *oc-blocked* ]] && continue
            [[ "$labels" == *oc-owner-gate* ]] && continue
            [[ "$labels" == *oc-done* ]] && continue
            [[ "$labels" == *oc-runtime-backoff* ]] && continue
            [[ "$labels" == *oc-repair-backoff* ]] && continue
            repair=false
            [[ "$labels" == *oc-repair* ]] && repair=true
            if [[ "$repair" == true ]]; then
              attempts=$(gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" --jq '[.[] | select(.body | contains("[OC-AUTO] BOUNDED_REPAIR_ATTEMPT"))] | length' | awk '{total += $1} END {print total + 0}')
              if (( attempts >= MAX_REPAIR_ATTEMPTS )); then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-queued --remove-label oc-repair --add-label oc-repair-backoff >/dev/null 2>&1 || true
                gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Bounded repair limit (${MAX_REPAIR_ATTEMPTS}) reached. Parked without retry thrash until a material code, provider, or CI-infrastructure change." >/dev/null 2>&1 || true
                continue
              fi
            fi
            marker="OC-AUTO-ISSUE: #${issue}"
            durable=$(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty")
            if [[ -n "$durable" && "$repair" != true ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true
              continue
            fi
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-queued --remove-label oc-validating --add-label oc-running >/dev/null
            if gh workflow run orchid-completion-lane.yml --repo "$REPO" --ref main -f issue_number="$issue" >/dev/null; then
              dispatched+=("$issue")
              if [[ "$repair" == true ]]; then
                gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] BOUNDED_REPAIR_ATTEMPT $((attempts + 1))/${MAX_REPAIR_ATTEMPTS}." >/dev/null
              fi
              gh issue comment "$issue" --repo "$REPO" --body "[OC-AUTO] Priority-aware scheduler dispatched completion worker. Active-width ceiling: ${MAX_ACTIVE_LANES}. Scheduler run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
            else
              latest_labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
              if [[ "$latest_labels" == *oc-repair-backoff* ]]; then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-queued --remove-label oc-repair >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --add-label oc-queued >/dev/null 2>&1 || true
              fi
            fi
          done
          if (( ${#dispatched[@]} > 0 )); then
            joined=$(IFS=,; echo "${dispatched[*]}")
            gh issue comment "$RUNTIME_TRACKER_ISSUE" --repo "$REPO" --body "ORCHID CONTINUOUS ENGINE — priority-aware dispatch for issue(s) ${joined}; active-width ceiling ${MAX_ACTIVE_LANES}. Scheduler run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
          fi

      - name: Maintain integration-to-main owner gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATION_BRANCH" || exit 0
          (( $(git rev-list --count "origin/main..origin/$INTEGRATION_BRANCH") > 0 )) || exit 0
          pr=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          body='Autonomously validated backend integration batch. Routine green reversible engineering may continue automatically. Protected scientific truth, sensitive locality, credentials/security, spending, destructive operations, and constitutional governance remain exception-gated. OC-AUTO-INTEGRATION-GATE'
          if [[ -z "$pr" ]]; then
            # Opening the gate PR needs "Allow GitHub Actions to create and approve
            # pull requests", which only the owner can enable. That is an owner
            # decision about the gate itself, not an implementation failure, so it
            # must not leave the whole control plane red every five minutes.
            if ! gh pr create --repo "$REPO" --base main --head "$INTEGRATION_BRANCH" --draft --title "OC autonomous backend integration batch" --body "$body" >/dev/null 2>&1; then
              echo "::warning::Could not open the integration->main gate PR. GitHub Actions is not permitted to create pull requests in this repository; the owner must open it, or enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'. Integration stays isolated and main remains owner-gated either way."
              exit 0
            fi
            pr=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          else
            gh pr edit "$pr" --repo "$REPO" --body "$body" >/dev/null
          fi
          [[ -z "$pr" ]] || gh pr edit "$pr" --repo "$REPO" --add-label oc-owner-gate >/dev/null 2>&1 || true
