name: Orchid Continuous Completion

# Compatibility entry point only. Autonomous selection, leasing, dispatch, and
# refill are owned exclusively by Orchid Swarm Controller.
on:
  workflow_dispatch:

concurrency:
  group: orchid-swarm-controller-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect to governed Swarm v4 controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run orchid-swarm-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref oc-autonomous-integration
          echo "Legacy scheduler retired; dispatched governed Swarm v4 controller." >> "$GITHUB_STEP_SUMMARY"
