name: Orchid Continuous Completion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [closed, synchronize, ready_for_review]
  issues:
    types: [closed, reopened]

concurrency:
  group: orchid-continuous-completion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      refill_count: ${{ steps.state.outputs.refill_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure orchestration state and absorb current main
        shell: bash
        run: |
          set -euo pipefail
          ensure_label () {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" 2>/dev/null || true
          }
          ensure_label oc-queued 1d76db "Eligible for autonomous Orchid Continuum execution"
          ensure_label oc-running fbca04 "Currently assigned to an autonomous execution lane"
          ensure_label oc-validating 8250df "Implementation delivered; validation/integration supervisor owns next transition"
          ensure_label oc-owner-gate d93f0b "Validated integration batch awaits owner-gated main/deploy decision"
          ensure_label oc-blocked b60205 "Externally blocked; does not consume an execution lane"
          ensure_label oc-done 0e8a16 "Acceptance criteria completed"
          ensure_label oc-auto-generated 5319e7 "Generated by the autonomous backlog planner"

          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main "$INTEGRATION_BRANCH" || git fetch origin main
          if git show-ref --verify --quiet "refs/remotes/origin/$INTEGRATION_BRANCH"; then
            git checkout -B "$INTEGRATION_BRANCH" "origin/$INTEGRATION_BRANCH"
          else
            git checkout -B "$INTEGRATION_BRANCH" origin/main
          fi
          if git merge --no-edit origin/main; then
            git push origin "HEAD:$INTEGRATION_BRANCH"
          else
            git merge --abort
            echo "Current main conflicts with integration head; existing integration work remains isolated and lanes continue." >&2
          fi

      - name: Reclaim stale lanes and integrate validated worker PRs
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          mapfile -t running < <(gh issue list --repo "$REPO" --state open --label oc-running --limit 100 --json number,updatedAt --jq '.[] | "\(.number) \(.updatedAt)"')
          for row in "${running[@]}"; do
            issue=${row%% *}
            updated=${row#* }
            epoch=$(date -u -d "$updated" +%s || echo "$now")
            if (( now - epoch > 5700 )); then
              marker="OC-AUTO-ISSUE: #${issue}"
              durable=$(gh pr list --repo "$REPO" --state open --limit 100 --json number,body --jq ".[] | select(.body != null and (.body | contains(\"$marker\"))) | .number" | head -1)
              if [[ -z "$durable" ]]; then
                gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --add-label oc-queued >/dev/null 2>&1 || true
              fi
            fi
          done

          mapfile -t prs < <(gh pr list --repo "$REPO" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq '.[] | select(.body != null and (.body | contains("OC-AUTO-ISSUE: #"))) | .number')
          for pr in "${prs[@]}"; do
            data=$(gh pr view "$pr" --repo "$REPO" --json body,isDraft,mergeStateStatus,headRefName,headRefOid)
            body=$(jq -r '.body // ""' <<<"$data")
            issue=$(sed -n 's/.*OC-AUTO-ISSUE: #\([0-9][0-9]*\).*/\1/p' <<<"$body" | head -1)
            [[ -n "$issue" ]] || continue
            gh issue edit "$issue" --repo "$REPO" --remove-label oc-running --remove-label oc-queued --add-label oc-validating >/dev/null 2>&1 || true

            head=$(jq -r '.headRefName' <<<"$data")
            sha=$(jq -r '.headRefOid' <<<"$data")
            runs=$(gh run list --repo "$REPO" --workflow orchid-autonomous-validation.yml --branch "$head" --event workflow_dispatch --limit 10 --json headSha,status,conclusion 2>/dev/null || echo '[]')
            result=$(jq -r --arg sha "$sha" '[.[] | select(.headSha == $sha)][0] | if . then "\(.status) \(.conclusion // \"\")" else "" end' <<<"$runs")
            [[ -n "$result" ]] || continue
            [[ "$result" == completed* ]] || continue
            if [[ "$result" != "completed success" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              continue
            fi

            merge_state=$(jq -r '.mergeStateStatus' <<<"$data")
            if [[ "$merge_state" == "BEHIND" ]]; then
              gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null 2>&1 || true
              continue
            fi
            if [[ "$merge_state" == "DIRTY" ]]; then
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --add-label oc-queued >/dev/null 2>&1 || true
              continue
            fi
            if [[ $(jq -r '.isDraft' <<<"$data") == "true" ]]; then
              gh pr ready "$pr" --repo "$REPO" >/dev/null
            fi

            if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch=false >/dev/null; then
              requeue=false
              blocked=false
              grep -Eiq '^OC-AUTO-REQUEUE:[[:space:]]*true[[:space:]]*$' <<<"$body" && requeue=true || true
              grep -Eiq '^OC-AUTO-BLOCKED:[[:space:]]*true[[:space:]]*$' <<<"$body" && blocked=true || true
              gh issue edit "$issue" --repo "$REPO" --remove-label oc-validating --remove-label oc-running --remove-label oc-queued >/dev/null 2>&1 || true
              if [[ "$blocked" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-blocked >/dev/null 2>&1 || true
              elif [[ "$requeue" == true ]]; then
                gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null 2>&1 || true
              else
                gh issue edit "$issue" --repo "$REPO" --add-label oc-done >/dev/null 2>&1 || true
                gh issue close "$issue" --repo "$REPO" --comment "[OC-AUTO] Validated slice integrated into $INTEGRATION_BRANCH. Main and production remain owner-gated." >/dev/null 2>&1 || true
              fi
            fi
          done

      - name: Seed curated backlog and calculate refill
        id: state
        shell: bash
        run: |
          set -euo pipefail
          BACKLOG=(1030 1029 1025 1026 1027 1008 1021 1022 1023 1024)
          for issue in "${BACKLOG[@]}"; do
            state=$(gh issue view "$issue" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo MISSING)
            [[ "$state" == OPEN ]] || continue
            labels=$(gh issue view "$issue" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
            if [[ "$labels" != *oc-queued* && "$labels" != *oc-running* && "$labels" != *oc-validating* && "$labels" != *oc-owner-gate* && "$labels" != *oc-blocked* && "$labels" != *oc-done* ]]; then
              gh issue edit "$issue" --repo "$REPO" --add-label oc-queued >/dev/null
            fi
          done
          queued=$(gh issue list --repo "$REPO" --state open --label oc-queued --limit 200 --json number --jq length)
          running=$(gh issue list --repo "$REPO" --state open --label oc-running --limit 200 --json number --jq length)
          validating=$(gh issue list --repo "$REPO" --state open --label oc-validating --limit 200 --json number --jq length)
          actionable=$((queued + running + validating))
          refill=0
          (( actionable >= 6 )) || refill=$((6 - actionable))
          echo "refill_count=$refill" >> "$GITHUB_OUTPUT"

  planner:
    needs: inventory
    if: needs.inventory.outputs.refill_count != '0'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oc-autonomous-integration
          fetch-depth: 0
      - name: Refill implementation backlog
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ORCHID CONTINUUM — AUTONOMOUS BACKEND BACKLOG REFILL

            Create exactly ${{ needs.inventory.outputs.refill_count }} new bounded implementation issue(s), unless existing open issues already cover the same work.
            Inspect current main, oc-autonomous-integration, open PRs/issues, failed CI, scientific-contract gaps, harvester/readiness gaps, Calyx/KG integration, and the NAOCC demonstration path.
            Prioritize: production/demo blockers; scientific truth/provenance defects; canonical KG/service contracts; harvest/data integration; Calyx/Atlas/Research/Conservation support; then maintainability.
            Each issue must be implementation-sized with acceptance criteria and validation, labeled oc-queued and oc-auto-generated, and contain marker OC-AUTO-GENERATED.
            Never invent science. Do not edit product code, merge, deploy, or mutate production data in this planner step.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git ls-files:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run:*)"

  prepare:
    needs: [inventory, planner]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      issue1: ${{ steps.queue.outputs.issue1 }}
      issue2: ${{ steps.queue.outputs.issue2 }}
      issue3: ${{ steps.queue.outputs.issue3 }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fill three execution slots
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          BACKLOG=(1030 1029 1025 1026 1027 1008 1021 1022 1023 1024)
          selected=()
          contains () { for x in "${selected[@]:-}"; do [[ "$x" == "$1" ]] && return 0; done; return 1; }
          for issue in "${BACKLOG[@]}"; do
            (( ${#selected[@]} >= 3 )) && break
            labels=$(gh issue view "$issue" --repo "$REPO" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
            [[ "$labels" == *oc-queued* ]] && selected+=("$issue")
          done
          if (( ${#selected[@]} < 3 )); then
            mapfile -t extra < <(gh issue list --repo "$REPO" --state open --label oc-queued --limit 200 --json number,createdAt --jq 'sort_by(.createdAt) | .[].number')
            for issue in "${extra[@]}"; do
              (( ${#selected[@]} >= 3 )) && break
              contains "$issue" || selected+=("$issue")
            done
          fi
          for idx in 0 1 2; do
            value="${selected[$idx]:-}"
            if [[ -n "$value" ]]; then
              gh issue edit "$value" --repo "$REPO" --remove-label oc-queued --remove-label oc-validating --add-label oc-running >/dev/null
            fi
            echo "issue$((idx+1))=$value" >> "$GITHUB_OUTPUT"
          done

  lane1:
    needs: prepare
    # always() is required, not decorative. Without it GitHub ANDs an implicit
    # success() across the whole needs chain, so a failed planner skips every
    # lane even though prepare itself succeeded and already labelled the issue
    # oc-running. That left issues claimed with nothing executing them until the
    # 95-minute reclaim, which re-claimed them within a minute - a livelock that
    # burned five hours and produced no durable work. prepare already guards
    # itself this way; the lanes must too.
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue1 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue1 }}
    secrets: inherit
  lane2:
    needs: prepare
    # always() is required, not decorative. Without it GitHub ANDs an implicit
    # success() across the whole needs chain, so a failed planner skips every
    # lane even though prepare itself succeeded and already labelled the issue
    # oc-running. That left issues claimed with nothing executing them until the
    # 95-minute reclaim, which re-claimed them within a minute - a livelock that
    # burned five hours and produced no durable work. prepare already guards
    # itself this way; the lanes must too.
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue2 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue2 }}
    secrets: inherit
  lane3:
    needs: prepare
    # always() is required, not decorative. Without it GitHub ANDs an implicit
    # success() across the whole needs chain, so a failed planner skips every
    # lane even though prepare itself succeeded and already labelled the issue
    # oc-running. That left issues claimed with nothing executing them until the
    # 95-minute reclaim, which re-claimed them within a minute - a livelock that
    # burned five hours and produced no durable work. prepare already guards
    # itself this way; the lanes must too.
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.issue3 != ''
    uses: ./.github/workflows/orchid-completion-lane.yml
    with:
      issue_number: ${{ needs.prepare.outputs.issue3 }}
    secrets: inherit

  publish-owner-gate:
    needs: [lane1, lane2, lane3]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Maintain integration-to-main owner gate PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$INTEGRATION_BRANCH" || exit 0
          (( $(git rev-list --count "origin/main..origin/$INTEGRATION_BRANCH") > 0 )) || exit 0
          pr=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          body='Autonomously validated backend integration batch. Worker PRs may merge here only after validation; this integration branch must never be auto-merged to main or deployed to production. OC-AUTO-INTEGRATION-GATE'
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$REPO" --base main --head "$INTEGRATION_BRANCH" --draft --title "OC autonomous backend integration batch" --body "$body" >/dev/null
            pr=$(gh pr list --repo "$REPO" --state open --base main --head "$INTEGRATION_BRANCH" --json number --jq '.[0].number // empty')
          else
            gh pr edit "$pr" --repo "$REPO" --body "$body" >/dev/null
          fi
          [[ -z "$pr" ]] || gh pr edit "$pr" --repo "$REPO" --add-label oc-owner-gate >/dev/null 2>&1 || true
