name: Actions Runner Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/actions-runner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner reached first step
        run: echo "ACTIONS_RUNNER_SMOKE_OK"
