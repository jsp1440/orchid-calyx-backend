name: Orchid Claude Runtime Canary

# Dispatch-only. anthropics/claude-code-action@v1 rejects the push event outright
# ("Unsupported event type: push"), so a push-triggered canary could never pass and
# only ever opened the circuit against a runtime it had not actually tested. The
# scheduler already re-dispatches this workflow while the circuit is open.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Claude Code runtime and API credential
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions"
          show_full_output: true
          prompt: |
            ORCHID CONTINUUM AUTOMATION CANARY.
            Read README.md only. Do not edit files, create branches, issues, comments, commits, or pull requests.
            Return exactly: ORCHID_AUTOMATION_CANARY_OK
          claude_args: |
            --max-turns 3
            --allowedTools "Read"

      - name: Publish canary result and control runtime circuit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          log="${CLAUDE_EXECUTION_LOG:-/home/runner/work/_temp/claude-execution-output.json}"
          verdict=indeterminate
          detail="no Claude execution record was produced"

          if [[ -f "$log" ]]; then
            echo "--- claude-execution-output.json ---"
            cat "$log"
            is_error=$(jq -r '[.. | objects | select(.type == "result")] | last | .is_error' "$log" 2>/dev/null || echo null)
            case "$is_error" in
              false) verdict=pass; detail="Claude executed and returned is_error:false" ;;
              true)
                verdict=fail
                # The message lives in .result for an api_error record; .subtype is
                # "success" even on failure, so preferring it reported nothing useful.
                # This detail is what lands on the tracker issue, so it must name the
                # actual cause - e.g. "api_error 400: Credit balance is too low".
                detail=$(jq -r '
                  [.. | objects | select(.type == "result")] | last
                  | ((.terminal_reason // "error")
                     + (if .api_error_status then " " + (.api_error_status | tostring) else "" end)
                     + ": "
                     + (.result // .error // "is_error:true"))
                ' "$log" 2>/dev/null || echo "is_error:true")
                ;;
            esac
          fi

          if [[ "$OUTCOME" != "success" ]]; then
            verdict=fail
            detail="claude step outcome=${OUTCOME}; ${detail}"
          fi

          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### Orchid Claude Runtime Canary"
            echo ""
            echo "Verdict: **${verdict}**"
            echo "Detail: ${detail}"
            echo "Run: ${RUN_URL}"
          } >> "$summary_file"
          echo "verdict: ${verdict}"
          echo "detail: ${detail}"

          case "$verdict" in
            pass)
              gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-degraded --remove-label oc-provider-chain-blocked >/dev/null 2>&1 || true
              ;;
            fail)
              gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded >/dev/null 2>&1 || true
              exit 1
              ;;
            *)
              exit 1
              ;;
          esac
