name: Orchid Claude Runtime Canary

# Dispatch-only. anthropics/claude-code-action@v1 rejects the push event outright
# ("Unsupported event type: push"), so a push-triggered canary could never pass and
# only ever opened the circuit against a runtime it had not actually tested. The
# scheduler already re-dispatches this workflow while the circuit is open.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Claude Code runtime and API credential
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions"
          # A circuit breaker whose probe cannot say why it failed is not
          # observable. Actions masks the secret regardless; this only reveals
          # the SDK's own error text, which is what classification needs.
          show_full_output: true
          prompt: |
            ORCHID CONTINUUM AUTOMATION CANARY.
            Read README.md only. Do not edit files, create branches, issues, comments, commits, or pull requests.
            Return exactly: ORCHID_AUTOMATION_CANARY_OK
          claude_args: |
            --max-turns 3
            --allowedTools "Read"

      - name: Publish canary result and control runtime circuit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The action exits outcome=success when it SKIPS execution - notably
          # "Workflow validation failed ... identical content to the version on the
          # repository's default branch". Trusting outcome alone therefore closes the
          # circuit on a canary that never called Claude at all. The verdict must come
          # from positive proof of execution: the SDK result record.
          # Overridable so the verdict logic itself is testable off-runner.
          log="${CLAUDE_EXECUTION_LOG:-/home/runner/work/_temp/claude-execution-output.json}"
          verdict=indeterminate
          detail="no Claude execution record was produced"

          if [[ -f "$log" ]]; then
            echo "--- claude-execution-output.json ---"
            cat "$log"
            is_error=$(jq -r '[.. | objects | select(.type == "result")] | last | .is_error' "$log" 2>/dev/null || echo null)
            case "$is_error" in
              false) verdict=pass; detail="Claude executed and returned is_error:false" ;;
              true)
                verdict=fail
                # The message lives in .result for an api_error record; .subtype is
                # "success" even on failure, so preferring it reported nothing useful.
                # This detail is what lands on the tracker issue, so it must name the
                # actual cause - e.g. "api_error 400: Credit balance is too low".
                detail=$(jq -r '
                  [.. | objects | select(.type == "result")] | last
                  | ((.terminal_reason // "error")
                     + (if .api_error_status then " " + (.api_error_status | tostring) else "" end)
                     + ": "
                     + (.result // .error // "is_error:true"))
                ' "$log" 2>/dev/null || echo "is_error:true")
                ;;
            esac
          fi

          # A failed step is a failure even if a record exists; never upgrade it.
          if [[ "$OUTCOME" != "success" ]]; then
            verdict=fail
            detail="claude step outcome=${OUTCOME}; ${detail}"
          fi

          echo "canary verdict: ${verdict} (${detail})"

          case "$verdict" in
            pass)
              gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-degraded >/dev/null 2>&1 || true
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID AUTOMATION CANARY — **PASSED**. Claude Code executed and returned a clean result record. Runtime circuit closed; the next scheduler pulse may recover parked workers. Run: ${RUN_URL}"
              ;;
            fail)
              gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded >/dev/null 2>&1 || true
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID AUTOMATION CANARY — **FAILED**. ${detail}. Runtime circuit remains open; ordinary worker dispatch stays paused. Run: ${RUN_URL}"
              exit 1
              ;;
            *)
              # Never move the circuit on an inconclusive probe, in either direction.
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID AUTOMATION CANARY — **INDETERMINATE**. ${detail}, so this run proves nothing about the Claude runtime and the circuit is left exactly as it was. This is what a workflow-validation skip looks like: the action exits success without calling Claude, which is why the verdict is no longer taken from step outcome. Run: ${RUN_URL}"
              exit 1
              ;;
          esac
