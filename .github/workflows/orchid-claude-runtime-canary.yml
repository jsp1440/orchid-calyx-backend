name: Orchid Claude Runtime Canary

# Dispatch-only. anthropics/claude-code-action@v1 rejects the push event outright
# ("Unsupported event type: push"), so a push-triggered canary could never pass and
# only ever opened the circuit against a runtime it had not actually tested. The
# scheduler already re-dispatches this workflow while the circuit is open.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

# Global paid-execution concurrency — enforces PAID_WORKER_CONCURRENCY=1 across
# all provider workflows.  cancel-in-progress: false queues rather than kills.
concurrency:
  group: swarm-paid-execution-${{ github.repository }}
  cancel-in-progress: false

jobs:
  canary:
    # Fail closed before the provider action is initialized or downloaded.
    if: vars.NO_API_MODE == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: NO-API mode guard
        id: no_api
        env:
          NO_API_MODE: ${{ vars.NO_API_MODE }}
        run: python3 scripts/oc_no_api_guard.py

      - name: Swarm governor precheck
        id: governor
        if: steps.no_api.outputs.blocked == 'false'
        env:
          NO_API_MODE: ${{ vars.NO_API_MODE }}
          OC_GOVERNOR_EMERGENCY_KILL_SWITCH: ${{ vars.OC_GOVERNOR_EMERGENCY_KILL_SWITCH }}
          OC_GOVERNOR_PAID_EXECUTION_ENABLED: ${{ vars.OC_GOVERNOR_PAID_EXECUTION_ENABLED }}
          OC_GOVERNOR_PROVIDER: anthropic
          OC_GOVERNOR_PROVIDER_ALLOWLIST: ${{ vars.OC_GOVERNOR_PROVIDER_ALLOWLIST }}
          OC_GOVERNOR_RETRY_COUNT: "0"
          OC_GOVERNOR_MAX_RETRIES: ${{ vars.OC_GOVERNOR_MAX_RETRIES }}
          OC_GOVERNOR_PER_RUN_ESTIMATED_COST_USD: ${{ vars.OC_GOVERNOR_CANARY_ESTIMATED_COST_USD || '0.10' }}
          OC_GOVERNOR_PER_RUN_BUDGET_USD: ${{ vars.OC_GOVERNOR_PER_RUN_BUDGET_USD }}
          OC_GOVERNOR_DAILY_BUDGET_USD: ${{ vars.OC_GOVERNOR_DAILY_BUDGET_USD }}
          OC_GOVERNOR_MONTHLY_BUDGET_USD: ${{ vars.OC_GOVERNOR_MONTHLY_BUDGET_USD }}
          OC_GOVERNOR_DAILY_SPEND_USD: ${{ vars.OC_GOVERNOR_DAILY_SPEND_USD }}
          OC_GOVERNOR_MONTHLY_SPEND_USD: ${{ vars.OC_GOVERNOR_MONTHLY_SPEND_USD }}
        run: python3 scripts/swarm_governor_precheck.py

      - name: Verify Claude Code runtime and API credential
        id: claude
        if: steps.no_api.outputs.blocked == 'false' && steps.governor.outputs.authorized == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions"
          show_full_output: true
          prompt: |
            ORCHID CONTINUUM AUTOMATION CANARY.
            Read README.md only. Do not edit files, create branches, issues, comments, commits, or pull requests.
            Return exactly: ORCHID_AUTOMATION_CANARY_OK
          claude_args: |
            --max-turns 3
            --allowedTools "Read"

      - name: Publish canary result and control runtime circuit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.claude.outcome }}
          NO_API_BLOCKED: ${{ steps.no_api.outputs.blocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # NO-API mode: provider was intentionally skipped — do not affect circuit state.
          if [[ "${NO_API_BLOCKED:-true}" == "true" ]]; then
            echo "[OC-CANARY] NO-API mode active; canary provider step was skipped. Circuit state unchanged."
            exit 0
          fi
          log="${CLAUDE_EXECUTION_LOG:-/home/runner/work/_temp/claude-execution-output.json}"
          verdict=indeterminate
          detail="no Claude execution record was produced"
          error_kind="unknown"

          if [[ -f "$log" ]]; then
            echo "--- claude-execution-output.json ---"
            cat "$log"
            is_error=$(jq -r '[.. | objects | select(.type == "result")] | last | .is_error' "$log" 2>/dev/null || echo null)
            case "$is_error" in
              false) verdict=pass; detail="Claude executed and returned is_error:false" ;;
              true)
                verdict=fail
                # The message lives in .result for an api_error record; .subtype is
                # "success" even on failure, so preferring it reported nothing useful.
                # This detail is what lands on the tracker issue, so it must name the
                # actual cause - e.g. "api_error 400: Credit balance is too low".
                detail=$(jq -r '
                  [.. | objects | select(.type == "result")] | last
                  | ((.terminal_reason // "error")
                     + (if .api_error_status then " " + (.api_error_status | tostring) else "" end)
                     + ": "
                     + (.result // .error // "is_error:true"))
                ' "$log" 2>/dev/null || echo "is_error:true")
                # Classify the root cause so the owner sees a specific label and
                # actionable message rather than a generic FAILED signal.
                error_field=$(jq -r '[.. | objects | select(.type == "result")] | last | .error // ""' "$log" 2>/dev/null || echo "")
                api_status=$(jq -r '[.. | objects | select(.type == "result")] | last | (.api_error_status // 0) | tostring' "$log" 2>/dev/null || echo "0")
                if [[ "$error_field" == "billing_error" ]]; then
                  error_kind="billing_exhausted"
                elif [[ "$api_status" == "401" || "$api_status" == "403" ]]; then
                  error_kind="authentication_error"
                else
                  error_kind="provider_or_transient"
                fi
                ;;
            esac
          fi

          if [[ "$OUTCOME" != "success" ]]; then
            verdict=fail
            detail="claude step outcome=${OUTCOME}; ${detail}"
          fi

          summary_file="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### Orchid Claude Runtime Canary"
            echo ""
            echo "Verdict: **${verdict}**"
            echo "Detail: ${detail}"
            echo "Run: ${RUN_URL}"
          } >> "$summary_file"
          echo "verdict: ${verdict}"
          echo "detail: ${detail}"

          case "$verdict" in
            pass)
              gh issue edit 1031 --repo "$GITHUB_REPOSITORY" \
                --remove-label oc-runtime-degraded \
                --remove-label oc-provider-chain-blocked \
                --remove-label oc-provider-billing-exhausted \
                >/dev/null 2>&1 || true
              ;;
            fail)
              case "$error_kind" in
                billing_exhausted)
                  owner_action="Top up Anthropic API credits at console.anthropic.com/settings/billing. The circuit closes automatically once the next canary passes."
                  gh issue edit 1031 --repo "$GITHUB_REPOSITORY" \
                    --add-label oc-runtime-degraded \
                    --add-label oc-provider-billing-exhausted \
                    >/dev/null 2>&1 || true
                  ;;
                authentication_error)
                  owner_action="Verify the ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions) is valid and not expired."
                  gh issue edit 1031 --repo "$GITHUB_REPOSITORY" \
                    --add-label oc-runtime-degraded \
                    >/dev/null 2>&1 || true
                  ;;
                *)
                  owner_action="Transient; canary will retry automatically."
                  gh issue edit 1031 --repo "$GITHUB_REPOSITORY" \
                    --add-label oc-runtime-degraded \
                    >/dev/null 2>&1 || true
                  ;;
              esac
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" \
                --body "ORCHID CLAUDE RUNTIME CANARY — **FAILED** (${error_kind}). ${detail}. Owner action: ${owner_action}. Run: ${RUN_URL}." \
                >/dev/null 2>&1 || true
              exit 1
              ;;
            *)
              # Inconclusive probes do not open or close the provider circuit, but
              # they must leave durable evidence so operators can distinguish an
              # actual provider failure from a workflow-validation skip or malformed
              # execution record.
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" \
                --body "ORCHID CLAUDE RUNTIME CANARY — **INDETERMINATE**. ${detail}. Circuit state unchanged. Run: ${RUN_URL}." \
                >/dev/null 2>&1 || true
              exit 1
              ;;
          esac
