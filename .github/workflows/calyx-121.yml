name: CALYX-121 Validation

on:
  pull_request:
    paths:
      - "runtime/calyx_certification/change_window_policy.py"
      - "tests/test_calyx_121_change_window_policy.py"
      - ".github/workflows/calyx-121.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/change_window_policy.py tests/test_calyx_121_change_window_policy.py
      - run: pytest -q tests/test_calyx_121_change_window_policy.py
