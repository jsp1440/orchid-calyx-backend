name: CALYX-101 Validation

on:
  pull_request:
    paths:
      - 'runtime/calyx_certification/artifact_bundle.py'
      - 'tests/test_calyx_101_artifact_bundle.py'
      - '.github/workflows/calyx-101.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/artifact_bundle.py tests/test_calyx_101_artifact_bundle.py
      - run: pytest -q tests/test_calyx_101_artifact_bundle.py
