name: Integration Gap Diagnostic

# Read-only production diagnostics for DATA-INTEGRATION-REPAIR-001. The
# development sandbox has no egress to the database host, so schema questions
# can only be answered from a runner.
# The push trigger is removed deliberately. These jobs commit their findings
# back to the branch, and a push authored by GITHUB_TOKEN cannot trigger a
# workflow -- so every automatic evidence commit became a PR head with zero
# checks against the exact commit that would merge. They were investigation
# instruments; the evidence they were built to gather is committed under
# docs/evidence/audit-measurement-002/. Re-run them deliberately when a
# question needs re-asking.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIAGNOSTIC_PATH: docs/evidence/audit-measurement-002/integration-gap-diagnostic.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install 'psycopg[binary]'

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Repository secret DATABASE_URL is required}"

      - name: Run read-only diagnostic
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/evidence/audit-measurement-002
          python scripts/diagnose_integration_gaps.py 2>&1 | tee integration-gap-diagnostic.log

      - name: Commit diagnostic
        if: always()
        shell: bash
        run: |
          # This block publishes diagnostics; it must never be the reason a job
          # goes red. `git rebase --abort` exits 128 when no rebase is in
          # progress, so the previous `rebase || abort` pair turned an ordinary
          # "nothing to rebase" into a failed step under `set -e` -- which is
          # how the job built to make CI legible became the illegible one.
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/evidence/audit-measurement-002
          cp integration-gap-diagnostic.log docs/evidence/audit-measurement-002/integration-gap-diagnostic-log.txt || true
          # Strip trailing whitespace before committing. Captured console output
          # carries it routinely, and this repo gates every PR on
          # `git diff --check origin/<base>...HEAD` -- so evidence files were
          # failing BUILD-BRAIN-114Q's diff-hygiene step. Only invisible trailing
          # spaces are removed; no recorded content changes.
          for f in docs/evidence/audit-measurement-002/*.txt; do
            [ -e "$f" ] && sed -i 's/[[:space:]]*$//' "$f"
          done
          git add docs/evidence/audit-measurement-002
          git diff --cached --quiet && exit 0
          # Two things are needed for the PR head to be testable, and this
          # handles only the first: the message carries no CI-skip directive.
          # The second cannot be fixed here -- a push authored by the default
          # GITHUB_TOKEN never triggers a workflow run, by design, so this
          # commit will show zero checks no matter what its message says. The
          # branch must therefore END on a human-authored commit before it is
          # judged merge-ready. Committing under docs/evidence/** also does not
          # match this workflow's own path filter, so it cannot retrigger itself.
          git commit -m "evidence(audit): capture production integration-gap diagnostic"
          git fetch origin ${{ github.ref_name }} || true
          git rebase origin/${{ github.ref_name }} || git rebase --abort || true
          git push origin HEAD:${{ github.ref_name }} || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-gap-diagnostic-${{ github.sha }}
          path: |
            docs/evidence/audit-measurement-002/integration-gap-diagnostic.json
            integration-gap-diagnostic.log
          if-no-files-found: warn
          retention-days: 30
