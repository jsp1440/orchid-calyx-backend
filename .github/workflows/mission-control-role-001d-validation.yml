name: MISSION-CONTROL-ROLE-001D validation

on:
  pull_request:
    paths:
      - 'app/review_tasks/postgres_repository.py'
      - 'app/mission_control_access/postgres_repository.py'
      - 'migrations/mission_control_role_001d.sql'
      - 'tests/test_mission_control_role_001d_postgres_persistence.py'
      - '.github/workflows/mission-control-role-001d-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run persistence tests
        run: python -m pytest -q tests/test_mission_control_role_001d_postgres_persistence.py
