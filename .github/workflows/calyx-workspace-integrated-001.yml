name: CALYX Workspace Integrated 001 Validation

on:
  pull_request:
    paths:
      - "app/calyx_conversation/speak_routes.py"
      - "app/calyx_conversation/workspace_outputs.py"
      - "app/calyx_conversation/provider_readiness.py"
      - "app/routers/matrix_identification.py"
      - "tests/test_calyx_workspace_output_api_001.py"
      - "tests/test_calyx_matrix_workspace_output_001.py"
      - "tests/test_calyx_provider_readiness_001.py"
      - "docs/brain/CALYX-WORKSPACE-INTEGRATED-001.md"
      - ".github/workflows/calyx-workspace-integrated-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile integrated workspace slice
        run: >-
          python -m py_compile
          app/calyx_conversation/speak_routes.py
          app/calyx_conversation/workspace_outputs.py
          app/calyx_conversation/provider_readiness.py
          app/routers/matrix_identification.py
          tests/test_calyx_workspace_output_api_001.py
          tests/test_calyx_matrix_workspace_output_001.py
          tests/test_calyx_provider_readiness_001.py
      - name: Focused integrated workspace tests
        run: >-
          python -m pytest -q
          tests/test_calyx_workspace_output_api_001.py
          tests/test_calyx_matrix_workspace_output_001.py
          tests/test_calyx_provider_readiness_001.py
      - name: Adjacent Speak regressions
        run: >-
          python -m pytest -q
          tests/test_calyx_context_awareness_001.py
          tests/test_calyx_speak_003_degraded_retrieval.py
      - name: Ruff integrated workspace slice
        run: >-
          python -m ruff check
          app/calyx_conversation/speak_routes.py
          app/calyx_conversation/workspace_outputs.py
          app/calyx_conversation/provider_readiness.py
          app/routers/matrix_identification.py
          tests/test_calyx_workspace_output_api_001.py
          tests/test_calyx_matrix_workspace_output_001.py
          tests/test_calyx_provider_readiness_001.py
      - name: Diff hygiene
        run: git diff --check
