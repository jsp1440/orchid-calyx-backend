name: CALYX-GLOSSARY-001 Validation

on:
  pull_request:
    paths:
      - "app/literature_extraction/extractors/glossary.py"
      - "app/literature_extraction/registry.py"
      - "tests/test_calyx_glossary_001_vocabulary_intake.py"
      - "tests/test_calyx_brain_001_literature_e2e.py"
      - ".github/workflows/calyx-glossary-001-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Ruff glossary scope
        run: >-
          python -m ruff check
          app/literature_extraction/extractors/glossary.py
          app/literature_extraction/registry.py
          tests/test_calyx_glossary_001_vocabulary_intake.py
          tests/test_calyx_brain_001_literature_e2e.py
      - name: Run glossary and literature regression tests
        run: >-
          python -m pytest -q
          tests/test_calyx_glossary_001_vocabulary_intake.py
          tests/test_calyx_brain_001_literature_e2e.py
          tests/test_literature_extraction_pipeline.py
          tests/test_literature_extraction_models.py
          tests/test_literature_extraction_output.py
