name: CALYX-GLOSSARY-001 Validation

on:
  pull_request:
    paths:
      - "app/literature_extraction/extractors/glossary.py"
      - "app/literature_extraction/registry.py"
      - "app/concepts/**"
      - "migrations/20260808_glossary_scientific_language.sql"
      - "scripts/validate_calyx_glossary_001_migration.py"
      - "tests/test_calyx_glossary_001.py"
      - "tests/test_calyx_glossary_001_vocabulary_intake.py"
      - "tests/test_calyx_brain_001_literature_e2e.py"
      - ".github/workflows/calyx-glossary-001-validation.yml"
      - "docs/brain/CALYX-GLOSSARY-001.md"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Validate additive glossary persistence migration
        run: python scripts/validate_calyx_glossary_001_migration.py
      - name: Ruff glossary scope
        run: >-
          python -m ruff check
          app/literature_extraction/extractors/glossary.py
          app/literature_extraction/registry.py
          app/concepts/glossary.py
          app/concepts/routers.py
          tests/test_calyx_glossary_001.py
          tests/test_calyx_glossary_001_vocabulary_intake.py
          tests/test_calyx_brain_001_literature_e2e.py
          scripts/validate_calyx_glossary_001_migration.py
      - name: Run glossary, concept, and literature regression tests
        run: >-
          python -m pytest -q
          tests/test_calyx_glossary_001.py
          tests/test_calyx_glossary_001_vocabulary_intake.py
          tests/test_build_sem_002a_core_concept_registry.py
          tests/test_build_sem_002b_lexical_services.py
          tests/test_calyx_brain_001_literature_e2e.py
          tests/test_literature_extraction_pipeline.py
          tests/test_literature_extraction_models.py
          tests/test_literature_extraction_output.py
      - name: Compile concept module
        run: python -m compileall -q app/concepts
      - name: Import application
        run: python -c "import app.main"
