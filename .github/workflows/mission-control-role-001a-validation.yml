name: MISSION-CONTROL-ROLE-001A validation

on:
  pull_request:
    paths:
      - "app/review_tasks/**"
      - "tests/test_mission_control_role_001a_review_tasks.py"
      - ".github/workflows/mission-control-role-001a-validation.yml"
  push:
    branches:
      - feature/mission-control-role-001a-review-task-engine

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile review task package
        run: python -m compileall app/review_tasks
      - name: Run deterministic review task tests
        env:
          PYTHONPATH: .
        run: |
          set +e
          pytest -vv tests/test_mission_control_role_001a_review_tasks.py > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          exit $status
      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-role-001a-pytest-output
          path: pytest-output.txt
