name: Dispatch AGENT-007 Certification Once

on:
  push:
    branches: [main]
    paths:
      - '.github/calyx-agent-007/trigger-once'

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Diagnose certification state
        id: diagnose
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALYX_BACKEND_URL: https://orchid-calyx-backend.onrender.com
          CALYX_API_KEY: ${{ secrets.CALYX_API_KEY || secrets.MISSION_CONTROL_SMOKE_TOKEN }}
        run: |
          set +e
          outcome="unknown"
          detail=""
          draft=$(gh pr view 1043 --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft' 2>/tmp/gherr)
          state=$(gh pr view 1043 --repo "$GITHUB_REPOSITORY" --json state -q '.state' 2>>/tmp/gherr)
          if [[ $? -ne 0 ]]; then
            outcome="github_pr_lookup_failed"
            detail="Could not read PR #1043 with the workflow token."
          elif [[ "$draft" != "true" || "$state" != "OPEN" ]]; then
            outcome="unsafe_target_state"
            detail="PR #1043 must remain an open draft; observed draft=$draft state=$state."
          elif [[ -z "$CALYX_API_KEY" ]]; then
            outcome="missing_api_key_secret"
            detail="Neither CALYX_API_KEY nor MISSION_CONTROL_SMOKE_TOKEN is available to this production job."
          else
            latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow calyx-agent-007-persisted-certification.yml --limit 1 --json databaseId,status,conclusion,createdAt -q '.[0] | [.databaseId,.status,(.conclusion // "-")] | @tsv' 2>/tmp/runerr)
            if [[ -n "$latest" ]]; then
              IFS=$'\t' read -r run_id run_status run_conclusion <<< "$latest"
              case "$run_status" in
                queued|in_progress|pending|requested|waiting)
                  outcome="certification_running"
                  detail="Persisted certification is already running as GitHub Actions run ${run_id} with status ${run_status}."
                  ;;
                completed)
                  if [[ "$run_conclusion" == "success" ]]; then
                    outcome="certification_completed_success"
                    detail="Latest persisted certification run ${run_id} completed successfully."
                  else
                    outcome="certification_completed_failure"
                    detail="Latest persisted certification run ${run_id} completed with conclusion ${run_conclusion}."
                  fi
                  ;;
              esac
            fi
            if [[ "$outcome" == "unknown" ]]; then
              code=$(curl -sS -o /tmp/calyx-ready.json -w '%{http_code}' \
                -H 'Accept: application/json' \
                -H "X-API-Key: ${CALYX_API_KEY}" \
                "${CALYX_BACKEND_URL%/}/brain/engineering/completion-jobs?limit=1" || true)
              if [[ "$code" != "200" ]]; then
                outcome="observation_endpoint_not_ready"
                detail="Completion-job observation endpoint returned HTTP ${code}."
              else
                gh workflow run calyx-agent-007-persisted-certification.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f pull_request=1043 \
                  -f confirmation='RUN AGENT-007 PERSISTED CERTIFICATION' \
                  -f repair_path='tests/test_build_088e_publication_operational_readiness.py' \
                  -f required_check='BUILD-088E Validation' \
                  -f max_steps=40
                if [[ $? -eq 0 ]]; then
                  outcome="dispatched"
                  detail="No active certification was found; a new persisted certification was dispatched."
                else
                  outcome="workflow_dispatch_failed"
                  detail="GitHub rejected the certification dispatch."
                fi
              fi
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "AGENT-007 diagnostic outcome: $outcome — $detail"

      - name: Publish diagnostic to sprint tracker
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.diagnose.outputs.outcome }}
          DETAIL: ${{ steps.diagnose.outputs.detail }}
        run: |
          gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 AUTONOMY DIAGNOSTIC — **${OUTCOME:-unknown}**. ${DETAIL:-No detail returned.} Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail closed only on actual blocker
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.diagnose.outputs.outcome }}
        run: |
          case "$OUTCOME" in
            dispatched|certification_running|certification_completed_success) exit 0 ;;
            *) exit 1 ;;
          esac
