name: Dispatch AGENT-007 Certification Once

# One-shot bridge for the explicitly authorized disposable certification target.
# It preserves the certification workflow's owner-triggered-only contract by
# dispatching that workflow through GitHub's Actions API rather than changing
# the certification workflow's trigger surface.

on:
  push:
    branches: [main]
    paths:
      - '.github/calyx-agent-007/trigger-once'

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Confirm disposable certification target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          draft=$(gh pr view 1043 --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft')
          state=$(gh pr view 1043 --repo "$GITHUB_REPOSITORY" --json state -q '.state')
          if [[ "$draft" != "true" || "$state" != "OPEN" ]]; then
            echo "::error::PR #1043 is no longer an open disposable draft; refusing certification dispatch."
            exit 1
          fi

      - name: Wait for deployed completion-job observation endpoint
        shell: bash
        env:
          CALYX_BACKEND_URL: ${{ secrets.CALYX_BACKEND_URL }}
          CALYX_API_KEY: ${{ secrets.CALYX_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CALYX_BACKEND_URL}" || -z "${CALYX_API_KEY}" ]]; then
            echo "::error::production environment requires CALYX_BACKEND_URL and CALYX_API_KEY."
            exit 1
          fi
          for attempt in $(seq 1 40); do
            code=$(curl -sS -o /tmp/calyx-ready.json -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H "X-API-Key: ${CALYX_API_KEY}" \
              "${CALYX_BACKEND_URL%/}/brain/engineering/completion-jobs?limit=1" || true)
            if [[ "$code" == "200" ]]; then
              echo "Deployed AGENT-007 observation endpoint is ready."
              exit 0
            fi
            echo "Attempt ${attempt}/40: HTTP ${code}; waiting 15 seconds."
            sleep 15
          done
          echo "::error::Observation endpoint did not become ready within 10 minutes."
          exit 1

      - name: Dispatch persisted certification against PR 1043
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run calyx-agent-007-persisted-certification.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pull_request=1043 \
            -f confirmation='RUN AGENT-007 PERSISTED CERTIFICATION' \
            -f repair_path='tests/test_build_088e_publication_operational_readiness.py' \
            -f required_check='BUILD-088E Validation' \
            -f max_steps=40
          echo 'Persisted certification dispatched.'
