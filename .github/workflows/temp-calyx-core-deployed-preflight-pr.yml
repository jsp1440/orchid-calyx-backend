name: TEMP Calyx Core Deployed Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/temp-calyx-core-deployed-preflight-pr.yml"

permissions:
  contents: read

jobs:
  deployed-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
      CALYX_PREFLIGHT_EVIDENCE_PATH: calyx-deployed-preflight-evidence.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CALYX_BACKEND_URL:?Repository variable CALYX_BACKEND_URL is required}"
          : "${CALYX_OWNER_ACCESS_CODE:?Repository secret CALYX_OWNER_ACCESS_CODE is required}"

      - name: Run existing read-only deployed preflight
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_graph_deployment_preflight.py 2>&1 | tee calyx-deployed-preflight.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-calyx-core-deployed-preflight-${{ github.sha }}
          path: |
            calyx-deployed-preflight.txt
            calyx-deployed-preflight-evidence.json
          if-no-files-found: error
          retention-days: 7
