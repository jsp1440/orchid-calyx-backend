name: Calyx Azure provider-free execution

on:
  pull_request:
    paths:
      - 'app/calyx_orchestrator/azure_*.py'
      - 'scripts/oc_azure_execution_demo.py'
      - 'tests/test_calyx_azure_execution.py'
      - 'migrations/181_calyx_azure_execution_records.sql'
      - 'docs/azure/execution-adapter.md'
      - 'requirements-azure.txt'
      - '.github/workflows/calyx-azure-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-azure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      CALYX_AZURE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local validation dependencies
        run: pip install -r requirements-dev.txt sqlalchemy pydantic requests fastapi 'fastapi<0.116'
      - name: Provider-free tests
        run: python -m pytest -q tests/test_calyx_azure_execution.py
      - name: Local Brain-to-Calyx proof
        run: python -m scripts.oc_azure_execution_demo
      - name: Lint and compile
        run: |
          python -m ruff check app/calyx_orchestrator/azure_execution_adapter.py app/calyx_orchestrator/azure_execution_models.py app/calyx_orchestrator/azure_job_client.py scripts/oc_azure_execution_demo.py tests/test_calyx_azure_execution.py
          python -m ruff format --check app/calyx_orchestrator/azure_execution_adapter.py app/calyx_orchestrator/azure_execution_models.py app/calyx_orchestrator/azure_job_client.py scripts/oc_azure_execution_demo.py tests/test_calyx_azure_execution.py
          python -m compileall -q app/calyx_orchestrator/azure_execution_adapter.py app/calyx_orchestrator/azure_execution_models.py app/calyx_orchestrator/azure_job_client.py scripts/oc_azure_execution_demo.py tests/test_calyx_azure_execution.py
          git diff --check
