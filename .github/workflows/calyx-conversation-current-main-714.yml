name: CALYX Conversation Current Main 714

on:
  pull_request:
    paths:
      - "app/conversation_memory/**"
      - "app/evidence_retrieval/engine.py"
      - "app/mission_control_registration.py"
      - "app/routers/calyx_conversation_sources.py"
      - "app/routers/calyx_operator_chat.py"
      - "app/routers/live_mission_control.py"
      - "runtime/continuum_conversation.py"
      - "runtime/continuum_graph_tool.py"
      - "migrations/140_calyx_conversation_sessions.sql"
      - "tests/test_calyx_conversation_current_main_714.py"
      - "docs/brain/CALYX-CONVERSATION-CURRENT-MAIN-714.md"
      - ".github/workflows/calyx-conversation-current-main-714.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-current-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile current-main conversation surfaces
        run: >-
          python -m py_compile
          app/conversation_memory/models.py
          app/conversation_memory/service.py
          app/conversation_memory/report.py
          app/evidence_retrieval/engine.py
          app/mission_control_registration.py
          app/routers/calyx_operator_chat.py
          app/routers/calyx_conversation_sources.py
          app/routers/live_mission_control.py
          runtime/continuum_conversation.py
          runtime/continuum_graph_tool.py
          tests/test_calyx_conversation_current_main_714.py
      - name: Focused current-main regressions
        run: >-
          python -m pytest -q
          tests/test_calyx_conversation_current_main_714.py
          tests/test_calyx_mission_control_003b_chat_api.py
          tests/test_calyx_mission_control_003c_live_registration.py
          tests/test_build_085b_hybrid_retrieval.py
      - name: Governance assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          surfaces = "\n".join(
              Path(path).read_text()
              for path in (
                  "runtime/continuum_conversation.py",
                  "runtime/continuum_graph_tool.py",
                  "app/routers/calyx_operator_chat.py",
                  "app/routers/calyx_conversation_sources.py",
              )
          )
          required = (
              '"model_knowledge_used": False',
              '"scientific_publication_authorized": False',
              '"knowledge_graph_mutation_authorized": False',
              'ASK_THE_CONTINUUM_FIRST',
          )
          missing = [item for item in required if item not in surfaces]
          if missing:
              raise SystemExit(f"missing governance assertion(s): {missing}")
          forbidden = (
              "INSERT INTO oc_graph",
              "UPDATE oc_graph",
              "DELETE FROM oc_graph",
          )
          present = [item for item in forbidden if item in surfaces]
          if present:
              raise SystemExit(f"forbidden graph mutation present: {present}")
          engine = Path("app/evidence_retrieval/engine.py").read_text()
          if 'str(d.get("revision_id")' in engine or 'str(d.get("parent_id")' in engine:
              raise SystemExit("document scope must not cross-match revision/parent namespaces")
          PY
      - name: Ruff and diff hygiene
        run: |
          python -m ruff check app/conversation_memory app/mission_control_registration.py app/routers/calyx_operator_chat.py app/routers/calyx_conversation_sources.py app/routers/live_mission_control.py runtime/continuum_conversation.py runtime/continuum_graph_tool.py tests/test_calyx_conversation_current_main_714.py
          python -m ruff format --check app/conversation_memory app/mission_control_registration.py app/routers/calyx_operator_chat.py app/routers/calyx_conversation_sources.py app/routers/live_mission_control.py runtime/continuum_conversation.py runtime/continuum_graph_tool.py tests/test_calyx_conversation_current_main_714.py
          git diff --check
