name: BUILD-086C final validation
on:
  pull_request:
    paths:
      - "scripts/build_086c_final_validation.py"
      - "tests/test_build_086c_final_validation.py"
      - "docs/BUILD-086C-FINAL-VALIDATION.md"
      - ".github/workflows/build-086c-validation.yml"
  push:
    branches: [feature/build-086c-final-integration-validation]
  workflow_dispatch:
jobs:
  final-validation:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx
      - name: BUILD-086C focused validation
        run: python -m pytest -q tests/test_build_086c_final_validation.py
      - name: BUILD-082 through BUILD-086C regression matrix
        run: >-
          python -m pytest -q
          tests/test_build_082_drive_document_import.py
          tests/test_build_083_bulk_drive_import.py
          tests/test_build_084c_foundation.py
          tests/test_build_084d_scientific_objects.py
          tests/test_build_084e_integration.py
          tests/test_build_085a_semantic_index.py
          tests/test_build_085b_hybrid_retrieval.py
          tests/test_build_085c_retrieval_validation.py
          tests/test_build_086a_candidate_knowledge.py
          tests/test_build_086b_evidence_aggregation.py
          tests/test_build_086c_final_validation.py
      - name: Compile and diff validation
        run: python -m compileall -q app/candidate_knowledge app/evidence_aggregation scripts/build_086c_final_validation.py && git diff --check
