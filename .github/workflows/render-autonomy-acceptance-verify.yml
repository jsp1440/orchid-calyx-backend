name: Render Autonomy Acceptance Verify

# Owner-triggered, read-only verification of the hosted Render + Neon
# acceptance run (deploy/render/AUTONOMY-ACCEPTANCE.md). It runs only when a
# pull request is labelled `render-acceptance-verify`, so ordinary pushes never
# produce a green check without hosted evidence. It connects to the acceptance
# database with a temporary SELECT-only role and never contacts Render.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: render-autonomy-acceptance-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.label.name == 'render-acceptance-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OC_ACCEPTANCE_VERIFY_DATABASE_URL: ${{ secrets.OC_ACCEPTANCE_VERIFY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the read-only verification credential
        run: |
          if [ -z "$OC_ACCEPTANCE_VERIFY_DATABASE_URL" ]; then
            echo "::error::OC_ACCEPTANCE_VERIFY_DATABASE_URL is not set; no hosted evidence was checked."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the hosted acceptance record (read-only)
        # shell: bash adds pipefail, so a failed verification is not masked by tee.
        shell: bash
        env:
          NO_API_MODE: "true"
        run: >-
          python -B scripts/oc_autonomy_hosted_verify.py
          --dsn "$OC_ACCEPTANCE_VERIFY_DATABASE_URL"
          | tee render-acceptance-verify.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-autonomy-acceptance-verify
          path: render-acceptance-verify.json
          if-no-files-found: warn
          retention-days: 30
