name: Render Autonomy Acceptance Verify

# Owner-triggered, read-only verification of the hosted Render + Neon
# acceptance run (deploy/render/AUTONOMY-ACCEPTANCE.md). It runs only when a
# pull request is labelled, so ordinary pushes never produce a green check
# without hosted evidence:
#   render-acceptance-verify         -> first run's database (OC_ACCEPTANCE_VERIFY_DATABASE_URL)
#   render-acceptance-verify-midrun  -> mid-run restart database
#                                       (OC_ACCEPTANCE_VERIFY_MIDRUN_DATABASE_URL, --require-midrun)
# It connects with a temporary SELECT-only role and never contacts Render.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: render-autonomy-acceptance-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.label.name == 'render-acceptance-verify' ||
      github.event.label.name == 'render-acceptance-verify-midrun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OC_ACCEPTANCE_VERIFY_DATABASE_URL: >-
        ${{ github.event.label.name == 'render-acceptance-verify-midrun'
            && secrets.OC_ACCEPTANCE_VERIFY_MIDRUN_DATABASE_URL
            || secrets.OC_ACCEPTANCE_VERIFY_DATABASE_URL }}
      VERIFY_FLAGS: >-
        ${{ github.event.label.name == 'render-acceptance-verify-midrun'
            && '--require-midrun' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the read-only verification credential
        run: |
          if [ -z "$OC_ACCEPTANCE_VERIFY_DATABASE_URL" ]; then
            echo "::error::The verification database secret for label '${{ github.event.label.name }}' is not set; no hosted evidence was checked."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the hosted acceptance record (read-only)
        # shell: bash adds pipefail, so a failed verification is not masked by tee.
        shell: bash
        env:
          NO_API_MODE: "true"
        run: >-
          python -B scripts/oc_autonomy_hosted_verify.py
          --dsn "$OC_ACCEPTANCE_VERIFY_DATABASE_URL" $VERIFY_FLAGS
          --export render-acceptance-records.json
          | tee render-acceptance-verify.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.label.name }}-report
          path: |
            render-acceptance-verify.json
            render-acceptance-records.json
          if-no-files-found: warn
          retention-days: 90
