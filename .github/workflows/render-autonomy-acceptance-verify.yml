name: Render Autonomy Acceptance Verify

# Owner-triggered, read-only verification of the hosted Render + Neon
# acceptance run (deploy/render/AUTONOMY-ACCEPTANCE.md). It runs only when a
# pull request is labelled, so ordinary pushes never produce a green check
# without hosted evidence:
#   render-acceptance-verify         -> first run's database (OC_ACCEPTANCE_VERIFY_DATABASE_URL)
#   render-acceptance-verify-midrun  -> mid-run restart database, --require-midrun:
#                                       OC_ACCEPTANCE_VERIFY_MIDRUN_DATABASE_URL if set, otherwise
#                                       the first run's read-only role on database autonomy_midrun
# It connects with a temporary SELECT-only role and never contacts Render.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: render-autonomy-acceptance-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.label.name == 'render-acceptance-verify' ||
      github.event.label.name == 'render-acceptance-verify-midrun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mid-run without its own secret: the first run's SELECT-only role, pointed
      # at database autonomy_midrun by --database (same server, same grants).
      FIRST_RUN_DSN: ${{ secrets.OC_ACCEPTANCE_VERIFY_DATABASE_URL }}
      MIDRUN_DSN: ${{ secrets.OC_ACCEPTANCE_VERIFY_MIDRUN_DATABASE_URL }}
      MIDRUN: ${{ github.event.label.name == 'render-acceptance-verify-midrun' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the read-only verification credential
        run: |
          if [ -z "$FIRST_RUN_DSN" ] && [ -z "$MIDRUN_DSN" ]; then
            echo "::error::The verification database secret for label '${{ github.event.label.name }}' is not set; no hosted evidence was checked."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the hosted acceptance record (read-only)
        # shell: bash adds pipefail, so a failed verification is not masked by tee.
        shell: bash
        env:
          NO_API_MODE: "true"
        run: |
          flags=()
          if [ "$MIDRUN" = "true" ]; then
            flags+=(--require-midrun)
            dsn="$MIDRUN_DSN"
            if [ -z "$dsn" ]; then
              dsn="$FIRST_RUN_DSN"
              flags+=(--database autonomy_midrun)
            fi
          else
            dsn="$FIRST_RUN_DSN"
          fi
          if [ -z "$dsn" ]; then
            echo "::error::OC_ACCEPTANCE_VERIFY_DATABASE_URL is not set; no hosted evidence was checked."
            exit 1
          fi
          python -B scripts/oc_autonomy_hosted_verify.py --dsn "$dsn" "${flags[@]}" \
            --export render-acceptance-records.json | tee render-acceptance-verify.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.label.name }}-report
          path: |
            render-acceptance-verify.json
            render-acceptance-records.json
          if-no-files-found: warn
          retention-days: 90
