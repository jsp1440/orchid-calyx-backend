name: CALYX Deployed Preflight Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
      CALYX_PREFLIGHT_EVIDENCE_PATH: calyx-deployed-preflight-evidence.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run read-only deployed preflight
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_graph_deployment_preflight.py 2>&1 | tee calyx-deployed-preflight.txt

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calyx-deployed-preflight-evidence-${{ github.sha }}
          path: |
            calyx-deployed-preflight.txt
            calyx-deployed-preflight-evidence.json
          if-no-files-found: warn
          retention-days: 30
