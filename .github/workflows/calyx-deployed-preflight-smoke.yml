name: CALYX Deployed Preflight Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CALYX_BACKEND_URL: ${{ secrets.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${CALYX_BACKEND_URL:?Repository secret CALYX_BACKEND_URL is required}"
          : "${CALYX_OWNER_ACCESS_CODE:?Repository secret CALYX_OWNER_ACCESS_CODE is required}"

      - name: Run read-only deployed preflight
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_graph_deployment_preflight.py 2>&1 | tee calyx-deployed-preflight.txt

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calyx-deployed-preflight-report
          path: calyx-deployed-preflight.txt
          if-no-files-found: warn
          retention-days: 14
