name: CALYX Occurrence Consolidated Validation

on:
  pull_request:
    paths:
      - "migrations/110_occurrence_reconciliation_runs.sql"
      - "migrations/111_occurrence_taxonomy_context_guard.sql"
      - "runtime/occurrence_persistence.py"
      - "tests/test_occurrence_reconciliation_runs.py"
      - "tests/test_occurrence_taxonomy_guard.py"
      - "docs/brain/CALYX-CORE-OCCURRENCE-CONSOLIDATION.md"
      - ".github/workflows/calyx-occurrence-consolidated-validation.yml"
  workflow_dispatch: {}

jobs:
  occurrence-consolidated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orchid_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test -d orchid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: "."
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: orchid_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - name: Configure SQLAlchemy occurrence test URL
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from sqlalchemy import URL
          value = URL.create(
              "postgresql+psycopg",
              username=os.environ["PGUSER"],
              password=os.environ["PGPASSWORD"],
              host=os.environ["PGHOST"],
              port=int(os.environ["PGPORT"]),
              database=os.environ["PGDATABASE"],
          ).render_as_string(hide_password=False)
          print(f"DATABASE_URL={value}")
          print(f"TEST_DATABASE_URL={value}")
          PY
      - name: Compile consolidated occurrence surface
        run: >-
          python -m py_compile
          runtime/occurrence_persistence.py
          tests/test_occurrence_reconciliation_runs.py
          tests/test_occurrence_taxonomy_guard.py
      - name: Ruff consolidated occurrence surface
        run: >-
          python -m ruff check
          runtime/occurrence_persistence.py
          tests/test_occurrence_reconciliation_runs.py
          tests/test_occurrence_taxonomy_guard.py
      - name: PostgreSQL taxonomy-bound occurrence integration
        run: python -m pytest -q tests/test_occurrence_reconciliation_runs.py tests/test_occurrence_taxonomy_guard.py
      - name: Exact replay regression
        run: python -m pytest -q tests/test_occurrence_reconciliation_runs.py::test_exact_replay_preserves_source_taxonomy_without_inventing_canonical_id
      - name: Migration non-authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = "\n".join(
              Path(path).read_text().lower()
              for path in (
                  'migrations/110_occurrence_reconciliation_runs.sql',
                  'migrations/111_occurrence_taxonomy_context_guard.sql',
              )
          )
          forbidden = (
              'insert into oc_graph', 'update oc_graph', 'delete from oc_graph',
              'drop schema taxonomy_pipeline', 'automatic_promotion = true',
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'forbidden production mutation surface: {present}')
          PY
      - run: git diff --check
