name: CALYX Occurrence Consolidated Validation

on:
  pull_request:
    paths:
      - "migrations/108_occurrence_reconciliation_runs.sql"
      - "migrations/109_occurrence_taxonomy_context_guard.sql"
      - "runtime/occurrence_persistence.py"
      - "tests/test_occurrence_reconciliation_runs.py"
      - "tests/test_occurrence_taxonomy_guard.py"
      - "docs/brain/CALYX-CORE-OCCURRENCE-CONSOLIDATION.md"
      - ".github/workflows/calyx-occurrence-consolidated-validation.yml"
  workflow_dispatch:

jobs:
  occurrence-consolidated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orchid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d orchid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/orchid_test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/orchid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - name: Compile consolidated occurrence surface
        run: >-
          python -m py_compile
          runtime/occurrence_persistence.py
          tests/test_occurrence_reconciliation_runs.py
          tests/test_occurrence_taxonomy_guard.py
      - name: Ruff consolidated occurrence surface
        run: >-
          python -m ruff check
          runtime/occurrence_persistence.py
          tests/test_occurrence_reconciliation_runs.py
          tests/test_occurrence_taxonomy_guard.py
      - name: PostgreSQL taxonomy-bound occurrence integration
        run: python -m pytest -q tests/test_occurrence_reconciliation_runs.py tests/test_occurrence_taxonomy_guard.py
      - name: Existing bounded occurrence staging regression
        run: python -m pytest -q tests/test_occurrence_staging.py
      - name: Migration non-authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = "\n".join(
              Path(path).read_text().lower()
              for path in (
                  'migrations/108_occurrence_reconciliation_runs.sql',
                  'migrations/109_occurrence_taxonomy_context_guard.sql',
              )
          )
          forbidden = (
              'insert into oc_graph', 'update oc_graph', 'delete from oc_graph',
              'drop schema taxonomy_pipeline', 'automatic_promotion = true',
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'forbidden production mutation surface: {present}')
          PY
      - run: git diff --check
