name: OC Society CRM P0 Validation

on:
  pull_request:
    paths:
      - "app/constituent_platform/**"
      - "migrations/20260823_oc_constituent_communications_foundation.sql"
      - "migrations/20260926_society_crm_p0_core.sql"
      - "tests/test_society_crm_postgres.py"
      - "migrations/20260927_society_crm_p1_tenant_isolation.sql"
      - "scripts/oc_crm_backup_restore_drill.py"
      - "tests/test_crm_backup_restore.py"
      - "docs/operations/OC-CRM-BACKUP-RESTORE-001.md"
      - ".github/workflows/oc-society-crm-p0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orchid_test
      PGPASSWORD: postgres
      OC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest
      - name: Apply constituent foundation
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260823_oc_constituent_communications_foundation.sql
      - name: Apply society CRM P0 schema
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260926_society_crm_p0_core.sql
      - name: Verify P0 schema idempotency
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260926_society_crm_p0_core.sql
      - name: Run society CRM PostgreSQL tests
        run: pytest -q tests/test_society_crm_postgres.py
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore) from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Run CRM backup/restore drill tests (OC-CRM-BACKUP-RESTORE-001)
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/16/bin/pg_dump
          PG_RESTORE_BIN: /usr/lib/postgresql/16/bin/pg_restore
        run: pytest -q tests/test_crm_backup_restore.py
      - name: Compile constituent platform package
        run: python -m compileall -q app/constituent_platform
