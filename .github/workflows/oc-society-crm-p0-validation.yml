name: OC Society CRM P0 Validation

on:
  pull_request:
    paths:
      - "app/constituent_platform/**"
      - "migrations/20260823_oc_constituent_communications_foundation.sql"
      - "migrations/20260926_society_crm_p0_core.sql"
      - "migrations/20260927_society_crm_p1_tenant_isolation.sql"
      - "migrations/20260927b_constituent_newsletter_canonical.sql"
      - "migrations/CALYX-RECOVERY-001-research-station-records.sql"
      - "runtime/research_station_store.py"
      - "scripts/oc_constituent_migrate_research_station.py"
      - "tests/test_society_crm_postgres.py"
      - "tests/test_constituent_canonical_store.py"
      - "tests/test_constituent_persistence_selection.py"
      - ".github/workflows/oc-society-crm-p0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orchid_test
      PGPASSWORD: postgres
      OC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest
      - name: Apply constituent foundation
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260823_oc_constituent_communications_foundation.sql
      - name: Apply society CRM P0 schema
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260926_society_crm_p0_core.sql
      - name: Verify P0 schema idempotency
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260926_society_crm_p0_core.sql
      - name: Run society CRM PostgreSQL tests
        run: pytest -q tests/test_society_crm_postgres.py
      - name: Apply society CRM P1 tenant isolation
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260927_society_crm_p1_tenant_isolation.sql
      - name: Apply canonical newsletter/contact schema
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260927b_constituent_newsletter_canonical.sql
      - name: Verify canonical newsletter schema idempotency
        run: >-
          psql -h localhost -U postgres -d orchid_test -v ON_ERROR_STOP=1
          -f migrations/20260927b_constituent_newsletter_canonical.sql
      - name: Run canonical newsletter/contact tests
        run: >-
          pytest -q tests/test_constituent_canonical_store.py
          tests/test_constituent_persistence_selection.py
          tests/test_constituent_platform_routes.py
          tests/test_constituent_platform_domain.py
      - name: Compile constituent platform package
        run: >-
          python -m compileall -q app/constituent_platform
          scripts/oc_constituent_migrate_research_station.py
