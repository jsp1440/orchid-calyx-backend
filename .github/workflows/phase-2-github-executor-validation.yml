name: PHASE-2 GitHub Executor Validation

on:
  pull_request:
    paths:
      - 'app/calyx_orchestrator/github_coding_executor.py'
      - 'app/calyx_orchestrator/github_copilot_cloud_provider.py'
      - 'app/calyx_orchestrator/github_repository_inspector.py'
      - 'app/calyx_orchestrator/github_agent_lifecycle.py'
      - 'app/calyx_orchestrator/github_agent_dispatch_store.py'
      - 'app/calyx_orchestrator/github_agent_dispatch_cycle.py'
      - 'migrations/20260814_phase_2_github_agent_dispatch.sql'
      - 'tests/test_phase_2_github_coding_executor.py'
      - 'tests/test_phase_2_github_copilot_cloud_provider.py'
      - 'tests/test_phase_2_github_repository_inspector.py'
      - 'tests/test_phase_2_github_agent_lifecycle.py'
      - 'tests/test_phase_2_github_agent_dispatch_store.py'
      - 'tests/test_phase_2_github_agent_dispatch_cycle.py'
      - '.github/workflows/phase-2-github-executor-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest ruff
      - run: >-
          python -m pytest -q
          tests/test_phase_2_github_coding_executor.py
          tests/test_phase_2_github_copilot_cloud_provider.py
          tests/test_phase_2_github_repository_inspector.py
          tests/test_phase_2_github_agent_lifecycle.py
          tests/test_phase_2_github_agent_dispatch_store.py
          tests/test_phase_2_github_agent_dispatch_cycle.py
      - run: >-
          python -m compileall -q
          app/calyx_orchestrator/github_coding_executor.py
          app/calyx_orchestrator/github_copilot_cloud_provider.py
          app/calyx_orchestrator/github_repository_inspector.py
          app/calyx_orchestrator/github_agent_lifecycle.py
          app/calyx_orchestrator/github_agent_dispatch_store.py
          app/calyx_orchestrator/github_agent_dispatch_cycle.py
      - run: >-
          ruff check
          app/calyx_orchestrator/github_coding_executor.py
          app/calyx_orchestrator/github_copilot_cloud_provider.py
          app/calyx_orchestrator/github_repository_inspector.py
          app/calyx_orchestrator/github_agent_lifecycle.py
          app/calyx_orchestrator/github_agent_dispatch_store.py
          app/calyx_orchestrator/github_agent_dispatch_cycle.py
          tests/test_phase_2_github_coding_executor.py
          tests/test_phase_2_github_copilot_cloud_provider.py
          tests/test_phase_2_github_repository_inspector.py
          tests/test_phase_2_github_agent_lifecycle.py
          tests/test_phase_2_github_agent_dispatch_store.py
          tests/test_phase_2_github_agent_dispatch_cycle.py
