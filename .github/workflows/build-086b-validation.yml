name: BUILD-086B validation
on:
  pull_request:
    paths:
      - "app/evidence_aggregation/**"
      - "app/main.py"
      - "migrations/086b_evidence_aggregation.sql"
      - "tests/test_build_086b_evidence_aggregation.py"
      - ".github/workflows/build-086b-validation.yml"
  push:
    branches: [feature/build-086b-evidence-aggregation]
  workflow_dispatch:
jobs:
  evidence-aggregation-validation:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx
      - name: Validate BUILD-086B and evidence pipeline regressions
        run: >-
          python -m pytest -q
          tests/test_build_082_drive_document_import.py
          tests/test_build_083_bulk_drive_import.py
          tests/test_build_084c_foundation.py
          tests/test_build_084d_scientific_objects.py
          tests/test_build_084e_integration.py
          tests/test_build_085a_semantic_index.py
          tests/test_build_085b_hybrid_retrieval.py
          tests/test_build_085c_retrieval_validation.py
          tests/test_build_086a_candidate_knowledge.py
          tests/test_build_086b_evidence_aggregation.py
