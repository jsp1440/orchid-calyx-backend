name: WORLD-PLANTS-UPLOAD-001

on:
  pull_request:
    paths:
      - "runtime/world_plants_release_store.py"
      - "app/routers/taxonomy_releases.py"
      - "app/routers/health.py"
      - "tests/test_world_plants_upload_001.py"
      - ".github/workflows/world-plants-upload-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest ruff httpx
      - run: python -m ruff check runtime/world_plants_release_store.py app/routers/taxonomy_releases.py tests/test_world_plants_upload_001.py
      - run: python -m ruff format --check runtime/world_plants_release_store.py app/routers/taxonomy_releases.py tests/test_world_plants_upload_001.py
      - run: python -m pytest -q tests/test_world_plants_upload_001.py
      - run: python -m compileall -q runtime/world_plants_release_store.py app/routers/taxonomy_releases.py
      - run: git diff --check
