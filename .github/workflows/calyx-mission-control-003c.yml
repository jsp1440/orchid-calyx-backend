name: CALYX-MISSION-CONTROL-003C Live Registration

on:
  pull_request:
    paths:
      - "app/mission_control_registration.py"
      - "tests/test_calyx_mission_control_003c_live_registration.py"
      - ".github/workflows/calyx-mission-control-003c.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi httpx pytest ruff
      - run: python -m ruff check app/mission_control_registration.py tests/test_calyx_mission_control_003c_live_registration.py
      - run: python -m ruff format --check app/mission_control_registration.py tests/test_calyx_mission_control_003c_live_registration.py
      - run: python -m pytest -q tests/test_calyx_mission_control_003c_live_registration.py
      - run: python -m compileall -q app/mission_control_registration.py
      - run: git diff --check
