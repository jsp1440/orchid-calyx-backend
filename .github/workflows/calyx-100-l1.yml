name: CALYX-100-L1 Validation

on:
  pull_request:
    paths:
      - 'runtime/calyx_certification/deployed_preflight.py'
      - 'tests/test_calyx_100_l1_deployed_preflight.py'
      - '.github/workflows/calyx-100-l1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/deployed_preflight.py tests/test_calyx_100_l1_deployed_preflight.py
      - run: pytest -q tests/test_calyx_100_l1_deployed_preflight.py
