name: BUILD-082 validation
on:
  pull_request:
    paths:
      - 'app/document_import/**'
      - 'migrations/082_controlled_drive_document_import.sql'
      - 'tests/test_build_082_drive_document_import.py'
      - 'app/missions/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_build_082_drive_document_import.py tests/test_build_081_source_registry.py tests/test_build_079_mission_queue.py tests/test_build_076a_universal_intake.py
