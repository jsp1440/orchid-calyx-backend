name: OCU University Durable Foundation

on:
  pull_request:
    paths:
      - 'app/mission_control_access/qualification_registry.py'
      - 'app/review_api/dependencies.py'
      - 'app/university/config.py'
      - 'app/university/durable_*.py'
      - 'app/university/learner_auth.py'
      - 'app/university/session_discovery.py'
      - 'app/university/session_discovery_routes.py'
      - 'app/university/reviewer_workspace.py'
      - 'app/university/reviewer_routes.py'
      - 'app/university/activation_service.py'
      - 'app/university/routes.py'
      - 'app/university/schemas.py'
      - 'app/university/service.py'
      - 'app/university/release.py'
      - 'migrations/ocu_sci_008_durable_sessions.sql'
      - 'scripts/validate_university_durable_migration.py'
      - 'scripts/validate_university_release_evidence.py'
      - 'scripts/preflight_university_activation.py'
      - 'tests/test_university_durable_foundation.py'
      - 'tests/test_university_release_evidence.py'
      - 'tests/test_university_activation_service.py'
      - 'tests/test_university_activation_preflight.py'
      - 'tests/test_university_event_revision_contract.py'
      - 'tests/test_university_learner_auth.py'
      - 'tests/test_university_session_discovery.py'
      - 'tests/test_university_reviewer_qualification_registry.py'
      - 'tests/test_university_reviewer_workspace.py'
      - '.github/workflows/ocu-university-durable-foundation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Validate migration invariants
        run: python scripts/validate_university_durable_migration.py
      - name: Run durable University identity, discovery, reviewer, preflight, and activation tests
        run: >-
          python -m unittest
          tests/test_university_durable_foundation.py
          tests/test_university_release_evidence.py
          tests/test_university_activation_service.py
          tests/test_university_activation_preflight.py
          tests/test_university_release_readiness.py
          tests/test_university_event_revision_contract.py
          tests/test_university_learner_auth.py
          tests/test_university_session_discovery.py
          tests/test_university_reviewer_qualification_registry.py
          tests/test_university_reviewer_workspace.py
      - name: Compile durable activation modules
        run: >-
          python -m py_compile
          app/mission_control_access/qualification_registry.py
          app/review_api/dependencies.py
          app/university/config.py
          app/university/durable_config.py
          app/university/durable_repository.py
          app/university/learner_auth.py
          app/university/session_discovery.py
          app/university/session_discovery_routes.py
          app/university/reviewer_workspace.py
          app/university/reviewer_routes.py
          app/university/activation_service.py
          app/university/routes.py
          app/university/schemas.py
          app/university/service.py
          app/university/release.py
          scripts/validate_university_release_evidence.py
          scripts/preflight_university_activation.py
