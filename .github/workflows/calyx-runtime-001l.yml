name: CALYX-RUNTIME-001L Governed Worker Loop

on:
  pull_request:
    paths:
      - "runtime/governed_worker_loop.py"
      - "tests/test_calyx_runtime_001l_governed_worker_loop.py"
      - ".github/workflows/calyx-runtime-001l.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/governed_worker_loop.py tests/test_calyx_runtime_001l_governed_worker_loop.py
      - run: python -m ruff format --check runtime/governed_worker_loop.py tests/test_calyx_runtime_001l_governed_worker_loop.py
      - run: python -m pytest -q tests/test_calyx_runtime_001l_governed_worker_loop.py
      - run: python -m compileall -q runtime/governed_worker_loop.py
      - run: git diff --check
