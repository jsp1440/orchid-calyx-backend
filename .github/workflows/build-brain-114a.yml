name: BUILD-BRAIN-114A Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/autonomy_policy.py"
      - "app/calyx_orchestrator/autonomy_routes.py"
      - "app/calyx_orchestrator/dry_run_service.py"
      - "app/calyx_orchestrator/execution_bridge.py"
      - "app/calyx_orchestrator/executor_registry.py"
      - "app/calyx_orchestrator/program_cycle.py"
      - "app/calyx_orchestrator/program_worker.py"
      - "app/calyx_orchestrator/portfolio.py"
      - "app/calyx_orchestrator/program_routes.py"
      - "app/calyx_orchestrator/routes.py"
      - "runtime/program_autonomy_worker.py"
      - "tests/test_calyx_autonomous_program_cycle.py"
      - "tests/test_calyx_dry_run_execution_loop.py"
      - ".github/workflows/calyx-program-autonomy.yml"
      - ".github/workflows/build-brain-114a.yml"
      - "docs/brain/BUILD-BRAIN-114A-AUTONOMOUS-WORKER-CYCLE.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m py_compile \
            app/calyx_orchestrator/autonomy_policy.py \
            app/calyx_orchestrator/autonomy_routes.py \
            app/calyx_orchestrator/dry_run_service.py \
            app/calyx_orchestrator/execution_bridge.py \
            app/calyx_orchestrator/executor_registry.py \
            app/calyx_orchestrator/program_cycle.py \
            app/calyx_orchestrator/program_worker.py \
            app/calyx_orchestrator/portfolio.py \
            app/calyx_orchestrator/program_routes.py \
            app/calyx_orchestrator/routes.py \
            runtime/program_autonomy_worker.py \
            tests/test_calyx_autonomous_program_cycle.py \
            tests/test_calyx_dry_run_execution_loop.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/autonomy_policy.py \
            app/calyx_orchestrator/autonomy_routes.py \
            app/calyx_orchestrator/dry_run_service.py \
            app/calyx_orchestrator/execution_bridge.py \
            app/calyx_orchestrator/executor_registry.py \
            app/calyx_orchestrator/program_cycle.py \
            app/calyx_orchestrator/program_worker.py \
            app/calyx_orchestrator/portfolio.py \
            app/calyx_orchestrator/program_routes.py \
            app/calyx_orchestrator/routes.py \
            runtime/program_autonomy_worker.py \
            tests/test_calyx_autonomous_program_cycle.py \
            tests/test_calyx_dry_run_execution_loop.py
      - name: Focused autonomy tests
        run: |
          pytest -q \
            tests/test_calyx_autonomous_program_cycle.py \
            tests/test_calyx_dry_run_execution_loop.py \
            tests/test_calyx_execution_bridge.py \
            tests/test_calyx_engineering_program_worker.py \
            tests/test_calyx_persisted_scheduler.py \
            tests/test_calyx_orchestration_portfolio.py
