name: MISSION-CONTROL-TELEMETRY-001C validation

on:
  pull_request:
    paths:
      - "app/executive_telemetry/**"
      - "tests/test_mission_control_telemetry_001c_source_metrics.py"
      - ".github/workflows/mission-control-telemetry-001c-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      CALYX_REVIEW_ALLOW_MEMORY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest 'httpx<0.28'
      - name: Compile source metric adapters
        run: python -m compileall app/executive_telemetry
      - name: Run telemetry 001C tests
        run: |
          set -o pipefail
          pytest -vv tests/test_mission_control_telemetry_001c_source_metrics.py 2>&1 | tee /tmp/mission-control-telemetry-001c.log
      - name: Upload telemetry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-telemetry-001c-diagnostics
          path: /tmp/mission-control-telemetry-001c.log
      - name: Run telemetry regressions
        run: |
          set -o pipefail
          pytest -vv tests/test_mission_control_telemetry_001a_executive_state.py tests/test_mission_control_telemetry_001b_harvester_adapters.py 2>&1 | tee /tmp/mission-control-telemetry-001c-regression.log
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-telemetry-001c-regression-diagnostics
          path: /tmp/mission-control-telemetry-001c-regression.log
