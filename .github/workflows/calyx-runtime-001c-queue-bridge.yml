name: CALYX-RUNTIME-001C Queue Bridge

on:
  pull_request:
    paths:
      - "runtime/self_audit_queue_bridge.py"
      - "tests/test_calyx_runtime_001c_queue_bridge.py"
      - ".github/workflows/calyx-runtime-001c-queue-bridge.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/self_audit.py runtime/self_audit_queue_bridge.py tests/test_calyx_runtime_001c_queue_bridge.py
      - run: python -m ruff format --check runtime/self_audit.py runtime/self_audit_queue_bridge.py tests/test_calyx_runtime_001c_queue_bridge.py
      - run: python -m pytest -q tests/test_calyx_runtime_001c_queue_bridge.py
