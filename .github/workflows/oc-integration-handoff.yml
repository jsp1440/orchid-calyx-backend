name: OC Integration Handoff

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [oc-autonomous-integration]
  workflow_dispatch:

concurrency:
  group: oc-integration-handoff-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

jobs:
  validate-integration-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oc-autonomous-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Compile backend sources
        run: python -m compileall -q app runtime harvesters scripts

      - name: Validate governed Matrix integration
        run: |
          ruff check app/routers/matrix_relationship.py runtime/matrix_relationship_sources.py \
            tests/test_matrix_relationship_genus_scope.py \
            tests/test_matrix_relationship_genus_scope_attestation.py \
            tests/test_matrix_relationship_governed_sources.py
          python -m pytest -q --maxfail=1 \
            tests/test_matrix_relationship_genus_scope.py \
            tests/test_matrix_relationship_genus_scope_attestation.py \
            tests/test_matrix_relationship_governed_sources.py

      - name: Record exact-head integration receipt
        shell: bash
        run: |
          head_sha=$(git rev-parse HEAD)
          {
            echo "## OC backend integration receipt"
            echo "- head: \`${head_sha}\`"
            echo "- branch: \`oc-autonomous-integration\`"
            echo "- compile: passed"
            echo "- Matrix governed-source tests: passed"
            echo "- next action: dispatch continuous completion supervisor"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact-head federation receipt
        if: github.event_name != 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FEDERATION_ISSUE: "1330"
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          python3 scripts/oc_federation_state.py \
            --repository "$GITHUB_REPOSITORY" \
            --work-id "backend:integration:${head_sha:0:12}" \
            --integration-sha "$head_sha" \
            --verification-sha "$head_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --capability schema-validation \
            --capability test-execution \
            > "$RUNNER_TEMP/oc-federation-state.json"
          {
            echo '<!-- OC-FEDERATION-STATE-V1'
            cat "$RUNNER_TEMP/oc-federation-state.json"
            echo '-->'
          } > "$RUNNER_TEMP/oc-federation-comment.md"
          gh issue comment "$FEDERATION_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/oc-federation-comment.md" >/dev/null
          jq -r '"- federation schema: `" + .schema + "`\n- federation state: `" + .state + "`\n- federation implementation/integration: `" + .integration_sha + "`\n- downstream dependents declared: " + ((.downstream_dependents | length) | tostring)' \
            "$RUNNER_TEMP/oc-federation-state.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch same-repo completion supervisor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run orchid-continuous-completion.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref oc-autonomous-integration
