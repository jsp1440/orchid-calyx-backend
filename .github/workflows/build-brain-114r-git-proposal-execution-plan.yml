name: BUILD-BRAIN-114R Git Proposal Execution Plan Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_proposal_execution_plan.py"
      - "app/calyx_orchestrator/git_mutation_authorization.py"
      - "app/calyx_orchestrator/owner_signature_verifier.py"
      - "app/calyx_orchestrator/proposal_authorization_store.py"
      - "tests/test_calyx_git_proposal_execution_plan_114r.py"
      - "tests/test_calyx_owner_signature_verifier_114q.py"
      - "docs/brain/BUILD-BRAIN-114R-GIT-PROPOSAL-EXECUTION-PLAN.md"
      - ".github/workflows/build-brain-114r-git-proposal-execution-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile 114R planning surface
        run: |
          python -m compileall -q app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Ruff 114R planning surface
        run: |
          ruff check app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_proposal_execution_plan_114r.py
          ruff format --check app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Focused planning regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_git_proposal_execution_plan_114r.py tests/test_calyx_owner_signature_verifier_114q.py tests/test_calyx_git_mutation_authorization_114o.py
      - name: Planning-only static assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/git_proposal_execution_plan.py").read_text(encoding="utf-8")
          required = (
              "plan_only",
              "git_mutation_performed",
              "owner_grant_verified",
              "authorization_request_digest",
          )
          for marker in required:
              assert marker in source, marker
          forbidden = (
              "subprocess",
              "git push",
              "git commit",
              "requests.post",
              "urllib.request",
              "api.github.com",
              "merge_pull_request",
              "enable_auto_merge",
              "deployment_client",
              "publication_client",
          )
          for marker in forbidden:
              assert marker not in source, marker
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
