name: BUILD-BRAIN-114R Git Proposal Execution Plan Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_proposal_execution_plan.py"
      - "app/calyx_orchestrator/git_mutation_authorization.py"
      - "app/calyx_orchestrator/owner_signature_verifier.py"
      - "app/calyx_orchestrator/proposal_authorization_store.py"
      - "app/calyx_orchestrator/assignment_factory.py"
      - "tests/test_calyx_git_proposal_execution_plan_114r.py"
      - "tests/test_calyx_git_proposal_action_dependencies_114r.py"
      - "tests/test_calyx_owner_signature_verifier_114q.py"
      - "tests/test_calyx_git_mutation_authorization_114o.py"
      - "docs/brain/BUILD-BRAIN-114R-GIT-PROPOSAL-EXECUTION-PLAN.md"
      - "docs/brain/BUILD-BRAIN-114M-R1-TO-114R-CURRENT-PARENT-HANDOFF.md"
      - ".github/workflows/build-brain-114r-git-proposal-execution-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile authorization and 114R planning surfaces
        run: |
          python -m compileall -q app/calyx_orchestrator/git_mutation_authorization.py app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_mutation_authorization_114o.py tests/test_calyx_owner_signature_verifier_114q.py tests/test_calyx_git_proposal_execution_plan_114r.py tests/test_calyx_git_proposal_action_dependencies_114r.py
      - name: Ruff authorization and 114R planning surfaces
        run: |
          ruff check app/calyx_orchestrator/git_mutation_authorization.py app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_mutation_authorization_114o.py tests/test_calyx_owner_signature_verifier_114q.py tests/test_calyx_git_proposal_execution_plan_114r.py tests/test_calyx_git_proposal_action_dependencies_114r.py
          ruff format --check app/calyx_orchestrator/git_mutation_authorization.py app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_mutation_authorization_114o.py tests/test_calyx_owner_signature_verifier_114q.py tests/test_calyx_git_proposal_execution_plan_114r.py tests/test_calyx_git_proposal_action_dependencies_114r.py
      - name: Focused planning regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_git_proposal_execution_plan_114r.py tests/test_calyx_git_proposal_action_dependencies_114r.py tests/test_calyx_owner_signature_verifier_114q.py tests/test_calyx_git_mutation_authorization_114o.py
      - name: Planning-only v2 provenance assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/git_proposal_execution_plan.py").read_text(encoding="utf-8")
          gate = Path("app/calyx_orchestrator/git_mutation_authorization.py").read_text(encoding="utf-8")
          tests = Path("tests/test_calyx_git_proposal_execution_plan_114r.py").read_text(encoding="utf-8")
          for marker in (
              'SCHEMA = "calyx-git-proposal-execution-plan-v2"',
              "patch_program_job_id",
              "base_ref",
              "copy.deepcopy",
              "plan_only",
              "git_mutation_performed",
              "owner_grant_verified",
              "authorization_request_digest",
              "GIT_PROPOSAL_PLAN_ACTION_PREREQUISITE_MISSING",
          ):
              assert marker in source, marker
          for marker in (
              "base_ref: str",
              '"base_ref": self.base_ref',
              "GIT_AUTHORIZATION_BASE_REF_INVALID",
              "GIT_AUTHORIZATION_BASE_REF_CONFLICT",
              "clock: Callable[[], datetime] | None",
          ):
              assert marker in gate, marker
          assert "authorization_gate.verify_grant(request, grant_mapping)" in source
          assert "assignment_inputs_for_program_job" in tests
          assert "test_snapshot_mutation_cannot_change_frozen_plan_or_digest" in tests
          assert "test_base_ref_is_owner_authorized_and_cannot_be_changed_after_grant" in tests
          for marker in (
              "subprocess",
              "git push",
              "git commit",
              "requests.post",
              "urllib.request",
              "api.github.com",
              "merge_pull_request",
              "enable_auto_merge",
              "deployment_client",
              "publication_client",
          ):
              assert marker not in source, marker
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
