name: BUILD-BRAIN-114S Git Proposal Mutation Executor Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_proposal_mutation_executor.py"
      - "app/calyx_orchestrator/git_proposal_execution_plan.py"
      - "app/calyx_orchestrator/git_mutation_authorization.py"
      - "app/calyx_orchestrator/owner_signature_verifier.py"
      - "app/calyx_orchestrator/proposal_authorization_store.py"
      - "tests/test_calyx_git_proposal_mutation_executor_114s.py"
      - "tests/test_calyx_git_proposal_execution_plan_114r.py"
      - "docs/brain/BUILD-BRAIN-114S-GIT-PROPOSAL-MUTATION-EXECUTOR.md"
      - ".github/workflows/build-brain-114s-git-proposal-mutation-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile executor surfaces
        run: |
          python -m compileall -q app/calyx_orchestrator/git_proposal_mutation_executor.py tests/test_calyx_git_proposal_mutation_executor_114s.py
      - name: Ruff executor surfaces
        run: |
          ruff check app/calyx_orchestrator/git_proposal_mutation_executor.py tests/test_calyx_git_proposal_mutation_executor_114s.py
          ruff format --check app/calyx_orchestrator/git_proposal_mutation_executor.py tests/test_calyx_git_proposal_mutation_executor_114s.py
      - name: Focused executor regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_git_proposal_mutation_executor_114s.py tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Authority boundary assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/git_proposal_mutation_executor.py").read_text(encoding="utf-8")
          required = (
              "GitProposalExecutionPlanner.build",
              "repository_allowlist",
              "autonomy/proposal/",
              "GitProposalMutationAdapter",
              "partial_failure",
          )
          for marker in required:
              assert marker in source, marker
          forbidden = (
              "subprocess",
              "git push",
              "git commit",
              "requests.",
              "urllib.",
              "GITHUB_TOKEN",
              "merge_pull_request",
              "enable_auto_merge",
              "deploy",
              "publish_scientific",
          )
          for marker in forbidden:
              assert marker not in source, marker
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
