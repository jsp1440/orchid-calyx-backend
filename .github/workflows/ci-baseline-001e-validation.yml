name: CI-BASELINE-001E Validation

on:
  pull_request:
    paths:
      - "tests/test_build_046_scientific_priorities.py"
      - "tests/test_calyx_live_graph_audit.py"
      - "tests/test_calyx_runtime_001n_authenticated_runtime_api.py"
      - "tests/test_calyx_journalism_brain_routes.py"
      - "tests/test_mission_control_telemetry_001a_executive_state.py"
      - "tests/test_knowledge_graph_orchestrator.py"
      - "tests/test_source_registry.py"
      - "runtime/knowledge_graph/**"
      - "docs/brain/CI-BASELINE-001E.md"
      - ".github/workflows/ci-baseline-001e-validation.yml"
  workflow_dispatch:

jobs:
  baseline-contract-validation:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build087
          POSTGRES_PASSWORD: build087_test_only
          POSTGRES_DB: build087_validation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U build087 -d build087_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://build087:build087_test_only@localhost:5432/build087_validation?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Focused current-contract repairs
        run: >-
          python -m pytest -q
          tests/test_build_046_scientific_priorities.py
          tests/test_calyx_live_graph_audit.py
      - name: Canonical supersession contracts
        run: >-
          env -u DATABASE_URL python -m pytest -q
          tests/test_calyx_runtime_001n_authenticated_runtime_api.py
          tests/test_calyx_journalism_brain_routes.py
          tests/test_mission_control_telemetry_001a_executive_state.py
      - name: Provision broad-suite validation schemas
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/BUILD-051-owner-operations-console.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS oc_admin;
          CREATE TABLE IF NOT EXISTS oc_admin.harvest_safety_state (
            harvester_id text PRIMARY KEY,
            last_cursor text,
            circuit_open boolean NOT NULL DEFAULT false,
            circuit_reason text,
            last_run_mode text,
            last_budget jsonb NOT NULL DEFAULT '{}'::jsonb,
            last_audit jsonb NOT NULL DEFAULT '{}'::jsonb,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Full backend suite diagnostic
        continue-on-error: true
        run: >-
          env -u TEST_DATABASE_URL python -m pytest -q
          --ignore=tests/calyx_certification/test_deterministic_failure_round2.py
          --deselect=tests/test_build_034_044_049_integration.py::test_state_changing_runtime_routes_fail_closed_without_api_key
          --deselect=tests/test_build_055_runtime_activation.py::test_api_key_missing_with_header_reports_configuration_blocker
          --deselect=tests/test_build_055_runtime_activation.py::test_owner_session_authorizes_runtime_control_without_api_key
          --deselect=tests/test_build_055_runtime_activation.py::test_unauthorized_runtime_control_still_rejected
          --deselect=tests/test_build_055_runtime_activation.py::test_runtime_configuration_diagnostic_is_secret_safe
          --deselect=tests/test_build_055_runtime_activation.py::test_execute_next_uses_skip_locked_for_duplicate_job_prevention
          --deselect=tests/test_build_056_owner_authentication.py::test_cookie_session_login_inspect_logout_and_secret_safety
          --deselect=tests/test_build_056_owner_authentication.py::test_expired_tampered_api_key_cors_and_configuration
          --deselect=tests/test_build_063_owner_auth.py::test_runner_authenticated_start_includes_cors_headers
          --deselect=tests/test_build_052_executive_engine.py::test_executive_api_endpoints_are_read_only
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_brief_requires_auth
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_brief_accepted_with_api_key
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_presets_lists_fcos
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_preset_unknown_returns_404
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_evidence_preview_returns_packet
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_generate_then_export_round_trip
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_export_unknown_article_returns_404
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_preview_stores_packet_with_id
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_generate_with_evidence_packet_id_e2e
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_generate_unknown_packet_id_returns_404
          --deselect=tests/test_calyx_journalism_mvp_001.py::test_http_insufficient_evidence_flagged_in_response
      - name: Strict repair hygiene
        run: |
          python -m ruff check tests/test_build_046_scientific_priorities.py tests/test_calyx_live_graph_audit.py
          git diff --check
