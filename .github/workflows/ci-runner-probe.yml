name: CI Runner Probe

on:
  pull_request:
    paths:
      - '.github/workflows/ci-runner-probe.yml'
  workflow_dispatch:

jobs:
  ubuntu-probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Ubuntu runner execution
        run: echo "ubuntu-runner-executed"

  windows-probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Windows runner execution
        shell: pwsh
        run: Write-Output "windows-runner-executed"
