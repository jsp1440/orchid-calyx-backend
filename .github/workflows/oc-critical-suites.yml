name: OC Critical Suites

# Named suites that must pass on every pull request and push to main and
# oc-autonomous-integration, whatever files the change touched. Orchid
# Autonomous Backend Validation runs only the test files a pull request
# changes, and OC Integration Handoff runs only the Matrix governed-source
# tests, so none of these suites ran unless a change happened to edit them.
#
# The suite lists below are explicit on purpose. A missing file is a pytest
# usage error (exit 4), so a renamed or deleted suite turns this workflow red
# rather than silently dropping out of it. tests/test_critical_suite_coverage.py
# fails when a test module under tests/ (any depth, test_*.py or *_test.py)
# whose path names a security, auth, credential, session, privacy, redaction,
# judging, ledger, fencing, lease or locality concern is in none of these
# lists (or in its reasoned exclusion list).
#
# Both jobs run the SAME lists: critical-suites deselects requires_postgres,
# postgres-ledger selects only requires_postgres. A PostgreSQL-gated test in
# any listed file therefore runs somewhere, including one reached through an
# imported marker (tests/acquisition_ledger_backends.py in #1699 parametrizes
# test_acquisition_ledger.py and test_shared_firecrawl.py over PostgreSQL
# without the marker's name appearing in those files).
#
# Source compilation for the same events is OC Source Compile
# (oc-source-compile.yml).

on:
  pull_request:
    branches: [main, oc-autonomous-integration]
  push:
    branches: [main, oc-autonomous-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oc-critical-suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Acquisition ledger, lease fencing, shared Firecrawl, source federation
  # acquisition, and the other ledger/lease suites.
  OC_CRITICAL_LEDGER_SUITES: >-
    tests/test_acquisition_ledger.py
    tests/test_acquisition_ledger_fencing.py
    tests/test_acquisition_ledger_schema.py
    tests/test_shared_firecrawl.py
    tests/test_firecrawl_federation_pilot_ledger.py
    tests/test_firecrawl_map_ledger_dedupe.py
    tests/test_firecrawl_search_ledger_cache.py
    tests/test_source_federation_acquisition.py
    tests/test_canonical_brain_leases.py
    tests/test_oc_swarm_lease_reconcile.py
    tests/test_calyx_100_l4_ledger_certification.py
    tests/test_eligible_ledger_discovery.py
    tests/test_eligible_ledger_discovery_observability.py
    tests/test_ledger_exact_revision_retrieval.py
    tests/test_reasoning_ledger_exact_revision.py
    tests/test_reasoning_ledger_exact_service.py
  # app/security.py, owner-only routes, member read access, credentials,
  # CORS, redaction, show-day judging lock, calyx_core owner-only show
  # management, and governed-authorization suites.
  OC_CRITICAL_SECURITY_SUITES: >-
    tests/test_security_fail_closed.py
    tests/test_non_ascii_credentials.py
    tests/test_worker_lease_token_constant_time.py
    tests/test_constant_time_remaining_secrets.py
    tests/test_config_loader_credential_precedence.py
    tests/test_calyx_115_secret_readiness.py
    tests/test_github_agent_credential.py
    tests/test_github_agent_zero_credential_live_shape_proof.py
    tests/test_common_security_boundary.py
    tests/test_agent_security_gateway.py
    tests/test_owner_authorization_gate.py
    tests/test_build_056_owner_authentication.py
    tests/test_build_063_owner_auth.py
    tests/test_owner_session_cors_repair.py
    tests/test_cors_preflight_repair.py
    tests/test_widget_cors_credentials.py
    tests/test_member_read_access.py
    tests/test_research_projects_member_access.py
    tests/test_privacy_owner_only_contacts_and_chat.py
    tests/test_legacy_feedback_privacy.py
    tests/test_evidence_feedback_routes.py
    tests/test_evidence_feedback_grants_preflight.py
    tests/test_release1_env_readiness.py
    tests/test_exact_occurrence_api_security.py
    tests/test_show_output_safety_redaction.py
    tests/test_show_output_safety_timing.py
    tests/test_show_day_judging_lock.py
    tests/test_show_day_phase1.py
    tests/test_calyx_core_owner_only_show_management.py
    tests/test_calyx_100_l2_all_domain_authorization.py
    tests/test_calyx_108_owner_authorization.py
    tests/test_calyx_durable_proposal_authorization.py
    tests/test_calyx_git_mutation_authorization_114o.py
    tests/test_calyx_proposal_authorization.py
    tests/test_calyx_proposal_authorization_status.py
    tests/test_calyx_runtime_001n_authenticated_runtime_api.py
    tests/test_mission_control_role_001f_auth_postgres_wiring.py
    tests/test_mission_control_runner_auth_wiring.py
    tests/test_university_learner_auth.py
    tests/test_university_session_discovery.py
    tests/test_university_session_service.py
  # Release 1 member Matrix privacy and partner/locality disclosure.
  OC_CRITICAL_PRIVACY_SUITES: >-
    tests/test_member_matrix_identification.py
    tests/test_member_matrix_identification_adversarial.py
    tests/test_member_matrix_screen_broadened.py
    tests/test_matrix_identification_session_001.py
    tests/test_matrix_identification_session_store_001.py
    tests/test_scan_trait_locality.py
    tests/test_partner_data_exact_atlas_security.py
    tests/test_partner_data_disclosure.py
    tests/test_partner_data_model_output_guards.py
    tests/test_partner_data_access_bridge.py
  # PENDING: critical suites added by open pull requests (#1704 per-judge
  # auth, #1700 precise coordinates / legacy occurrence API). Each is run,
  # and required to pass, as soon as it exists in the tree; until then it is
  # reported as a notice. tests/test_critical_suite_coverage.py fails once a
  # pending file exists, so the pull request that lands it must also move it
  # into a list above.
  OC_PENDING_CRITICAL_SUITES: >-
    tests/test_judge_auth_blind_judging.py
    tests/test_no_precise_coordinates.py
    tests/test_legacy_occurrence_api_fail_closed.py

jobs:
  critical-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          # Same pins as Orchid Autonomous Backend Validation: the scientific
          # layer includes requirements.txt; requirements-dev.txt pins ruff,
          # pytest and pytest-asyncio.
          pip install -r requirements-scientific.txt
          pip install -r requirements-dev.txt
      - name: Critical-suite coverage guard
        run: python -m pytest -q -p no:cacheprovider tests/test_critical_suite_coverage.py
      # The PostgreSQL-gated tests in these files run in the postgres-ledger
      # job below. Here they are deselected rather than left to fail: with
      # CI=true, tests/conftest.py fails a requires_postgres test that has no
      # usable database instead of skipping it.
      - name: Ledger, lease fencing, shared Firecrawl, source federation acquisition
        run: |
          read -ra suites <<< "$OC_CRITICAL_LEDGER_SUITES"
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" "${suites[@]}"
      - name: Security, owner-only routes, member read access, redaction, show-day judging lock
        run: |
          read -ra suites <<< "$OC_CRITICAL_SECURITY_SUITES"
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" "${suites[@]}"
      - name: Release 1 member Matrix privacy and partner locality disclosure
        run: |
          read -ra suites <<< "$OC_CRITICAL_PRIVACY_SUITES"
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" "${suites[@]}"
      - name: Pending critical suites that already exist
        run: |
          read -ra listed <<< "$OC_PENDING_CRITICAL_SUITES"
          present=()
          for f in "${listed[@]}"; do
            if [[ -f "$f" ]]; then
              present+=("$f")
            else
              echo "::notice::pending critical suite $f is not in this tree yet"
            fi
          done
          if (( ${#present[@]} == 0 )); then
            exit 0
          fi
          rc=0
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" "${present[@]}" || rc=$?
          # 5: every test in these files is PostgreSQL-gated; postgres-ledger runs them.
          if (( rc != 0 && rc != 5 )); then
            exit "$rc"
          fi

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: occritical
          POSTGRES_PASSWORD: occritical_test_only
          POSTGRES_DB: oc_critical
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U occritical -d oc_critical"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable service-container credentials, not a secret.
      TEST_DATABASE_URL: postgresql://occritical:occritical_test_only@localhost:5432/oc_critical
      DATABASE_URL: postgresql://occritical:occritical_test_only@localhost:5432/oc_critical
      # Fail, never skip, if the database is unusable (tests/conftest.py).
      OC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scientific.txt
          pip install -r requirements-dev.txt
      # Every listed file, not only those known to hold PostgreSQL tests:
      # a file without any (test_acquisition_ledger.py today) is deselected at
      # no cost, and a PostgreSQL case added to one later -- as #1699 does to
      # that file -- runs here without editing this job. The selection holds
      # the fencing and evidence-feedback PostgreSQL tests today, so an empty
      # selection (exit 5, a failure) means the requires_postgres markers were
      # lost.
      - name: PostgreSQL-gated tests in every critical suite
        run: |
          read -ra ledger <<< "$OC_CRITICAL_LEDGER_SUITES"
          read -ra security <<< "$OC_CRITICAL_SECURITY_SUITES"
          read -ra privacy <<< "$OC_CRITICAL_PRIVACY_SUITES"
          read -ra listed <<< "$OC_PENDING_CRITICAL_SUITES"
          pending=()
          for f in "${listed[@]}"; do
            if [[ -f "$f" ]]; then
              pending+=("$f")
            fi
          done
          python -m pytest -q -p no:cacheprovider -rA -m requires_postgres \
            "${ledger[@]}" "${security[@]}" "${privacy[@]}" "${pending[@]}"
