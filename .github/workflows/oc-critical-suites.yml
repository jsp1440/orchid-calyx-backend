name: OC Critical Suites

# Named suites that must pass on every pull request and push to main and
# oc-autonomous-integration, whatever files the change touched. Orchid
# Autonomous Backend Validation runs only the test files a pull request
# changes, and OC Integration Handoff runs only the Matrix governed-source
# tests, so none of these suites ran unless a change happened to edit them.
#
# The paths are explicit on purpose. A missing file is a pytest usage error
# (exit 4) and an empty selection is exit 5, so a renamed or deleted suite
# turns this workflow red rather than silently dropping out of it.
# Source compilation for the same events is OC Source Compile
# (oc-source-compile.yml).

on:
  pull_request:
    branches: [main, oc-autonomous-integration]
  push:
    branches: [main, oc-autonomous-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oc-critical-suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          # Same pins as Orchid Autonomous Backend Validation: the scientific
          # layer includes requirements.txt; requirements-dev.txt pins ruff,
          # pytest and pytest-asyncio.
          pip install -r requirements-scientific.txt
          pip install -r requirements-dev.txt
      # The PostgreSQL-gated tests in these files run in the postgres-ledger
      # job below. Here they are deselected rather than left to fail: with
      # CI=true, tests/conftest.py fails a requires_postgres test that has no
      # usable database instead of skipping it.
      - name: Acquisition ledger, lease fencing, shared Firecrawl, source federation acquisition
        run: |
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" \
            tests/test_acquisition_ledger.py \
            tests/test_acquisition_ledger_fencing.py \
            tests/test_shared_firecrawl.py \
            tests/test_source_federation_acquisition.py
      - name: Security, owner-only routes, member read access, redaction, show-day judging lock
        run: |
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" \
            tests/test_security_fail_closed.py \
            tests/test_non_ascii_credentials.py \
            tests/test_worker_lease_token_constant_time.py \
            tests/test_build_056_owner_authentication.py \
            tests/test_build_063_owner_auth.py \
            tests/test_owner_session_cors_repair.py \
            tests/test_member_read_access.py \
            tests/test_research_projects_member_access.py \
            tests/test_privacy_owner_only_contacts_and_chat.py \
            tests/test_legacy_feedback_privacy.py \
            tests/test_exact_occurrence_api_security.py \
            tests/test_no_precise_coordinates.py \
            tests/test_show_output_safety_redaction.py \
            tests/test_show_output_safety_timing.py \
            tests/test_show_day_judging_lock.py \
            tests/test_show_day_phase1.py \
            tests/test_calyx_core_owner_only_show_management.py
      - name: Release 1 member Matrix privacy
        run: |
          python -m pytest -q -p no:cacheprovider -m "not requires_postgres" \
            tests/test_member_matrix_identification.py \
            tests/test_member_matrix_identification_adversarial.py \
            tests/test_member_matrix_screen_broadened.py

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: occritical
          POSTGRES_PASSWORD: occritical_test_only
          POSTGRES_DB: oc_critical
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U occritical -d oc_critical"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable service-container credentials, not a secret.
      TEST_DATABASE_URL: postgresql://occritical:occritical_test_only@localhost:5432/oc_critical
      DATABASE_URL: postgresql://occritical:occritical_test_only@localhost:5432/oc_critical
      # Fail, never skip, if the database is unusable (tests/conftest.py).
      OC_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scientific.txt
          pip install -r requirements-dev.txt
      # Selecting only requires_postgres makes an empty selection exit 5, so
      # dropping the marker or the tests fails this job instead of passing it.
      - name: PostgreSQL acquisition ledger and lease fencing
        run: |
          python -m pytest -q -p no:cacheprovider -rA -m requires_postgres \
            tests/test_acquisition_ledger.py \
            tests/test_acquisition_ledger_fencing.py
