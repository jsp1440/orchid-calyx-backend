name: CALYX-105 Validation
on:
  pull_request:
    paths:
      - runtime/calyx_certification/live_preflight_evidence.py
      - tests/test_calyx_105_live_preflight_evidence.py
      - .github/workflows/calyx-105.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/live_preflight_evidence.py tests/test_calyx_105_live_preflight_evidence.py
      - run: pytest -q tests/test_calyx_105_live_preflight_evidence.py
