name: OC-PARALLEL-PLATFORM-001 Validation

on:
  pull_request:
    paths:
      - "app/parallel_platform/**"
      - "app/routers/health.py"
      - "tests/test_oc_parallel_platform_001.py"
      - ".github/workflows/oc-parallel-platform-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_oc_parallel_platform_001.py
      - run: python -m ruff check app/parallel_platform tests/test_oc_parallel_platform_001.py
      - run: python -m compileall -q app/parallel_platform
