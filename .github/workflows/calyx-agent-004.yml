name: CALYX-AGENT-004 Validation

on:
  pull_request:
    paths:
      - "app/calyx_engineering/**"
      - "app/brain/routes.py"
      - "tests/test_calyx_agent_004.py"
      # The governed completion loop's own safety tests were listed by no
      # workflow at all, and no workflow runs the whole suite, so they had
      # never executed in CI. That is how they were able to rot into passing
      # for the wrong reason. They are the AGENT-007 safety contract; they gate
      # this job now.
      - "tests/test_calyx_governed_autonomous_completion_loop.py"
      - "tests/test_calyx_agent_007_required_workflow_roster.py"
      - "tests/test_calyx_completion_job_refresh.py"
      - ".github/workflows/calyx-agent-004.yml"

jobs:
  governed-engineering-loop:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/calyx_engineering app/brain/routes.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_engineering \
            app/brain/routes.py \
            tests/test_calyx_agent_004.py \
            tests/test_calyx_governed_autonomous_completion_loop.py \
            tests/test_calyx_agent_007_required_workflow_roster.py \
            tests/test_calyx_completion_job_refresh.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_calyx_agent_004.py \
            tests/test_calyx_governed_autonomous_completion_loop.py \
            tests/test_calyx_agent_007_required_workflow_roster.py \
            tests/test_calyx_completion_job_refresh.py
      - name: Route registration smoke
        run: python -c "from app.brain.routes import router; assert any('/engineering/status' in route.path for route in router.routes)"
