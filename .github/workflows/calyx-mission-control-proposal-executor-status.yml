name: CALYX Mission Control Proposal Executor Status Validation

on:
  pull_request:
    paths:
      - 'app/mission_control_briefing/proposal_executor_status.py'
      - 'app/mission_control_briefing/routes.py'
      - 'tests/test_calyx_mission_control_proposal_executor_status_114u.py'
      - '.github/workflows/calyx-mission-control-proposal-executor-status.yml'
  push:
    branches:
      - 'feature/calyx-mission-control-proposal-executor-status'
    paths:
      - 'app/mission_control_briefing/proposal_executor_status.py'
      - 'app/mission_control_briefing/routes.py'
      - 'tests/test_calyx_mission_control_proposal_executor_status_114u.py'
      - '.github/workflows/calyx-mission-control-proposal-executor-status.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m compileall -q \
            app/mission_control_briefing/proposal_executor_status.py \
            app/mission_control_briefing/routes.py \
            tests/test_calyx_mission_control_proposal_executor_status_114u.py
      - name: Ruff
        run: |
          ruff check \
            app/mission_control_briefing/proposal_executor_status.py \
            app/mission_control_briefing/routes.py \
            tests/test_calyx_mission_control_proposal_executor_status_114u.py
          ruff format --check \
            app/mission_control_briefing/proposal_executor_status.py \
            app/mission_control_briefing/routes.py \
            tests/test_calyx_mission_control_proposal_executor_status_114u.py
      - name: Focused Mission Control regressions
        run: |
          python -m pytest -q \
            tests/test_calyx_mission_control_proposal_executor_status_114u.py \
            tests/test_calyx_github_proposal_executor_policy_114u.py
      - name: Read-only authority boundary
        run: |
          python - <<'PY'
          from app.mission_control_briefing.proposal_executor_status import proposal_executor_mission_control_status
          status = proposal_executor_mission_control_status({})
          assert status['read_only'] is True
          assert status['mutation_performed'] is False
          assert status['secret_material_exposed'] is False
          assert status['live_credential_registration_active'] is False
          assert status['authority']['merge_authorized'] is False
          assert status['authority']['deployment_authorized'] is False
          assert status['authority']['publication_authorized'] is False
          assert status['authority']['production_graph_mutation_authorized'] is False
          PY
      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}...HEAD
