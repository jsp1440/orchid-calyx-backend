name: CALYX-RUNTIME-001B Signal Adapters

on:
  pull_request:
    paths:
      - "runtime/self_audit_adapters.py"
      - "tests/test_calyx_runtime_001b_signal_adapters.py"
      - ".github/workflows/calyx-runtime-001b-signal-adapters.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/self_audit.py runtime/self_audit_adapters.py tests/test_calyx_runtime_001b_signal_adapters.py
      - run: python -m ruff format --check runtime/self_audit.py runtime/self_audit_adapters.py tests/test_calyx_runtime_001b_signal_adapters.py
      - run: python -m pytest -q tests/test_calyx_runtime_001b_signal_adapters.py
