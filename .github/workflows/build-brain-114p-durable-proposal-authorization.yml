name: BUILD-BRAIN-114P Durable Proposal Authorization Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/persisted_patch_execution.py"
      - "app/calyx_orchestrator/proposal_authorization.py"
      - "app/calyx_orchestrator/proposal_authorization_status.py"
      - "app/calyx_orchestrator/proposal_authorization_models.py"
      - "app/calyx_orchestrator/proposal_authorization_store.py"
      - "tests/test_calyx_durable_proposal_authorization.py"
      - "tests/test_calyx_proposal_authorization.py"
      - "tests/test_calyx_proposal_authorization_status.py"
      - "migrations/20260808_calyx_proposal_authorization_decisions.sql"
      - "docs/brain/BUILD-BRAIN-114P-DURABLE-PROPOSAL-AUTHORIZATION.md"
      - ".github/workflows/build-brain-114p-durable-proposal-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calyx_114p
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calyx_114p"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile durable authorization surface
        run: |
          python -m compileall -q app/calyx_orchestrator/persisted_patch_execution.py app/calyx_orchestrator/proposal_authorization.py app/calyx_orchestrator/proposal_authorization_status.py app/calyx_orchestrator/proposal_authorization_models.py app/calyx_orchestrator/proposal_authorization_store.py tests/test_calyx_durable_proposal_authorization.py tests/test_calyx_proposal_authorization.py tests/test_calyx_proposal_authorization_status.py
      - name: Ruff durable authorization surface
        run: |
          ruff check app/calyx_orchestrator/persisted_patch_execution.py app/calyx_orchestrator/proposal_authorization.py app/calyx_orchestrator/proposal_authorization_status.py app/calyx_orchestrator/proposal_authorization_models.py app/calyx_orchestrator/proposal_authorization_store.py tests/test_calyx_durable_proposal_authorization.py tests/test_calyx_proposal_authorization.py tests/test_calyx_proposal_authorization_status.py
          ruff format --check app/calyx_orchestrator/persisted_patch_execution.py app/calyx_orchestrator/proposal_authorization.py app/calyx_orchestrator/proposal_authorization_status.py app/calyx_orchestrator/proposal_authorization_models.py app/calyx_orchestrator/proposal_authorization_store.py tests/test_calyx_durable_proposal_authorization.py tests/test_calyx_proposal_authorization.py tests/test_calyx_proposal_authorization_status.py
      - name: Focused durable authorization regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_durable_proposal_authorization.py tests/test_calyx_proposal_authorization.py tests/test_calyx_proposal_authorization_status.py
      - name: Migration contract
        run: |
          python - <<'PY'
          from pathlib import Path

          sql = Path("migrations/20260808_calyx_proposal_authorization_decisions.sql").read_text(encoding="utf-8")
          required = (
              "CREATE TABLE IF NOT EXISTS calyx_proposal_authorization_decisions",
              "UNIQUE (manifest_digest, review_class)",
              "authorization_digest VARCHAR(64) NOT NULL UNIQUE",
              "CHECK (review_class IN ('operational', 'security'))",
              "BEFORE UPDATE OR DELETE ON calyx_proposal_authorization_decisions",
              "ERRCODE = '55000'",
          )
          for marker in required:
              assert marker in sql, marker
          PY
      - name: PostgreSQL immutable-row contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calyx_114p
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          sql = Path("migrations/20260808_calyx_proposal_authorization_decisions.sql").read_text(encoding="utf-8")
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/calyx_114p") as conn:
              conn.execute(sql)
              conn.commit()
              conn.execute(
                  """
                  INSERT INTO calyx_proposal_authorization_decisions
                      (record_id, manifest_digest, review_class, authorization_digest, payload_json)
                  VALUES (%s, %s, %s, %s, %s)
                  """,
                  ("114p-immutable-test", "a" * 64, "security", "b" * 64, "{}"),
              )
              conn.commit()
              for statement in (
                  "UPDATE calyx_proposal_authorization_decisions SET payload_json='tampered' WHERE record_id='114p-immutable-test'",
                  "DELETE FROM calyx_proposal_authorization_decisions WHERE record_id='114p-immutable-test'",
              ):
                  try:
                      conn.execute(statement)
                      conn.commit()
                  except psycopg.Error as exc:
                      assert exc.sqlstate == "55000", exc.sqlstate
                      conn.rollback()
                  else:
                      raise AssertionError("immutable review row mutation unexpectedly succeeded")
              row = conn.execute(
                  "SELECT payload_json FROM calyx_proposal_authorization_decisions WHERE record_id='114p-immutable-test'"
              ).fetchone()
              assert row == ("{}",)
          PY
      - name: Static durable trust and authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/proposal_authorization_store.py").read_text(encoding="utf-8")
          auth = Path("app/calyx_orchestrator/proposal_authorization.py").read_text(encoding="utf-8")
          combined = source + "\n" + auth
          forbidden = (
              "subprocess",
              "git push",
              "git commit",
              "create_pull_request",
              "merge_pull_request",
              "requests.post",
              "urllib.request",
          )
          for marker in forbidden:
              assert marker not in combined, marker
          assert "PersistedPatchExecutionService" in source
          assert "self.db.expire_all()" in source
          assert "PROPOSAL_AUTH_DURABLE_REVIEWER_SEPARATION_REQUIRED" in source
          assert "patch_receipt" not in source
          assert "patch_program_job_id" in source
          assert 'MANIFEST_SCHEMA = "calyx-git-proposal-manifest-v2"' in auth
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
