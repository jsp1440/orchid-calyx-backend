name: CALYX Continuum Conversation 634

on:
  pull_request:
    paths:
      - "runtime/continuum_conversation.py"
      - "app/routers/calyx_operator_chat.py"
      - "tests/test_calyx_continuum_conversation_634.py"
      - "tests/test_calyx_mission_control_003b_chat_api.py"
      - "app/evidence_retrieval/**"
      - "docs/brain/CALYX-CONTINUUM-CONVERSATION-634.md"
      - ".github/workflows/calyx-continuum-conversation-634.yml"
  workflow_dispatch:

jobs:
  continuum-conversation:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile conversational surface
        run: >-
          python -m py_compile
          runtime/continuum_conversation.py
          app/routers/calyx_operator_chat.py
          tests/test_calyx_continuum_conversation_634.py
      - name: Conversation and retrieval regressions
        run: >-
          python -m pytest -q
          tests/test_calyx_continuum_conversation_634.py
          tests/test_calyx_mission_control_003b_chat_api.py
          tests/test_calyx_evidence_retrieval_085b.py
      - name: Permanent Ask-the-Continuum non-authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('runtime/continuum_conversation.py').read_text()
          required = (
              '"model_knowledge_used": False',
              '"scientific_interpretation_generated": False',
              '"scientific_publication_authorized": False',
              '"knowledge_graph_mutation_authorized": False',
              '"answering_policy": "ASK_THE_CONTINUUM_FIRST"',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing conversation governance assertion(s): {missing}')
          forbidden = ('INSERT INTO oc_graph', 'UPDATE oc_graph', 'DELETE FROM oc_graph', 'TRUNCATE oc_graph')
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'forbidden graph mutation surface present: {present}')
          PY
      - name: Changed-surface Ruff and diff hygiene
        run: |
          python -m ruff check runtime/continuum_conversation.py app/routers/calyx_operator_chat.py tests/test_calyx_continuum_conversation_634.py
          git diff --check
