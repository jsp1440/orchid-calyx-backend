name: Canonical Brain Validation

# Current-main integration gate; commands intentionally match the validated slice lineage.
on:
  pull_request:
    paths:
      - "app/canonical_brain/**"
      - "tests/test_canonical_brain_*.py"
      - "docs/architecture/BUILD-BRAIN-100-*"
      - ".github/workflows/canonical-brain-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-brain-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic fastapi httpx pytest ruff
      - name: Compile
        run: python -m compileall -q app/canonical_brain
      - name: Lint
        run: python -m ruff check app/canonical_brain tests/test_canonical_brain_*.py
      - name: Test
        run: python -m pytest -q tests/test_canonical_brain_*.py
