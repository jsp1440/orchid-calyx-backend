name: Canonical Brain Validation

on:
  push:
    branches:
      - "feature/brain-canonical-architecture-registry"
    paths:
      - "app/canonical_brain/**"
      - "tests/test_canonical_brain_*.py"
      - "docs/architecture/**"
      - "scripts/validate_canonical_brain.py"
      - "scripts/validate_canonical_brain.sh"
      - ".github/workflows/canonical-brain-validation.yml"
  pull_request:
    paths:
      - "app/canonical_brain/**"
      - "tests/test_canonical_brain_*.py"
      - "docs/architecture/**"
      - "scripts/validate_canonical_brain.py"
      - "scripts/validate_canonical_brain.sh"
      - ".github/workflows/canonical-brain-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-brain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-brain-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Run canonical Brain validation
        run: python scripts/validate_canonical_brain.py
