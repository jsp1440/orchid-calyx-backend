name: CALYX Lexicon Live 002 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/lexicon/routes.py"
      - "tests/test_calyx_lexicon_live_contract_002.py"
      - "docs/brain/CALYX-LEXICON-LIVE-002.md"
      - ".github/workflows/calyx-lexicon-live-002-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexicon-live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile
        run: python -m py_compile app/lexicon/routes.py tests/test_calyx_lexicon_live_contract_002.py
      - name: Focused regressions
        run: python -m pytest -q tests/test_calyx_lexicon_live_contract_002.py
      - name: Adjacent canonical Lexicon regressions
        run: python -m pytest -q tests/test_calyx_lexicon_integration_001.py tests/test_matrix_identification_registry_001.py
      - name: Ruff
        run: python -m ruff check app/lexicon/routes.py tests/test_calyx_lexicon_live_contract_002.py
      - name: Format
        run: python -m ruff format --check app/lexicon/routes.py tests/test_calyx_lexicon_live_contract_002.py
      - name: Diff hygiene
        run: git diff --check
