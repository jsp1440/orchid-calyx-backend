name: BUILD-077 PostgreSQL validation

on:
  pull_request:
    paths:
      - "app/ontology/**"
      - "app/semantic/**"
      - "app/intake/**"
      - "migrations/076a_universal_intake.sql"
      - "migrations/076b_semantic_extraction.sql"
      - "migrations/077_ontology_evidence_registry.sql"
      - "tests/test_build_076b_semantic_extraction.py"
      - "tests/test_build_077_ontology_registry.py"
      - "scripts/build_077_postgres_validation.py"
      - "scripts/build_077_ci.py"
      - "tests/test_build_077_ci.py"
      - ".github/workflows/build-077-postgres-validation.yml"
  push:
    branches:
      - feature/build-077-ontology-evidence-registry
    paths:
      - "app/ontology/**"
      - "app/semantic/**"
      - "app/intake/**"
      - "migrations/076a_universal_intake.sql"
      - "migrations/076b_semantic_extraction.sql"
      - "migrations/077_ontology_evidence_registry.sql"
      - "tests/test_build_076b_semantic_extraction.py"
      - "tests/test_build_077_ontology_registry.py"
      - "scripts/build_077_postgres_validation.py"
      - "scripts/build_077_ci.py"
      - "tests/test_build_077_ci.py"
      - ".github/workflows/build-077-postgres-validation.yml"
  workflow_dispatch:

jobs:
  postgres-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchid_build077_test
        ports:
          # Keep the suite's unconfigured localhost:5432 placeholder unreachable.
          - 55477:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orchid_build077_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-scientific.txt pytest pytest-asyncio httpx
      - name: Validate BUILD-077 against isolated PR PostgreSQL
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:55477/orchid_build077_test
        run: python -m scripts.build_077_ci
      - name: Validate BUILD-077 against configured PostgreSQL
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_077_postgres_validation.py
