name: BUILD-077 PostgreSQL validation

on:
  pull_request:
    paths:
      - "app/ontology/**"
      - "app/semantic/**"
      - "app/intake/**"
      - "migrations/076a_universal_intake.sql"
      - "migrations/076b_semantic_extraction.sql"
      - "migrations/077_ontology_evidence_registry.sql"
      - "tests/test_build_076b_semantic_extraction.py"
      - "tests/test_build_077_ontology_registry.py"
      - "scripts/build_077_postgres_validation.py"
      - ".github/workflows/build-077-postgres-validation.yml"
  push:
    branches:
      - feature/build-077-ontology-evidence-registry
    paths:
      - "app/ontology/**"
      - "app/semantic/**"
      - "app/intake/**"
      - "migrations/076a_universal_intake.sql"
      - "migrations/076b_semantic_extraction.sql"
      - "migrations/077_ontology_evidence_registry.sql"
      - "tests/test_build_076b_semantic_extraction.py"
      - "tests/test_build_077_ontology_registry.py"
      - "scripts/build_077_postgres_validation.py"
      - ".github/workflows/build-077-postgres-validation.yml"
  workflow_dispatch:

jobs:
  postgres-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate BUILD-077 against PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_077_postgres_validation.py
