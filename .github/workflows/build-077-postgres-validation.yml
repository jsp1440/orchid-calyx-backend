name: BUILD-077 PostgreSQL validation

on:
  workflow_dispatch:

jobs:
  postgres-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate BUILD-077 against PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_077_postgres_validation.py
