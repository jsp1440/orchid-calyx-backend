name: BUILD-BRAIN-114B Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/repository_evidence_executor.py"
      - "app/calyx_orchestrator/executor_registry.py"
      - "tests/test_calyx_repository_evidence_executor.py"
      - "scripts/validate_repository_evidence_executor.py"
      - ".github/workflows/build-brain-114b.yml"
      - "docs/brain/BUILD-BRAIN-114B-REPOSITORY-EVIDENCE-EXECUTOR.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Run portable BUILD-BRAIN-114B validation
        run: python scripts/validate_repository_evidence_executor.py
      - name: Emit validation receipt
        if: always()
        run: |
          if [ -f artifacts/validation/repository-evidence-executor.json ]; then
            cat artifacts/validation/repository-evidence-executor.json
          else
            echo "Validation runner did not start or did not create a receipt."
          fi
