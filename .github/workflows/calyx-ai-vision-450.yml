name: CALYX AI Vision 450

on:
  pull_request:
    paths:
      - "runtime/ai_vision_governed.py"
      - "runtime/matrix_operational.py"
      - "app/routers/ai_vision_governed.py"
      - "app/routers/live_mission_control.py"
      - "tests/test_calyx_ai_vision_450.py"
      - "tests/test_calyx_matrix_operational_449.py"
      - "docs/brain/CALYX-AI-VISION-450.md"
      - ".github/workflows/calyx-ai-vision-450.yml"
  workflow_dispatch:

jobs:
  ai-vision:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile AI.Vision surface
        run: >-
          python -m py_compile
          runtime/ai_vision_governed.py
          app/routers/ai_vision_governed.py
          app/routers/live_mission_control.py
          tests/test_calyx_ai_vision_450.py
      - name: Deterministic AI.Vision and Matrix tests
        run: >-
          python -m pytest -q
          tests/test_calyx_ai_vision_450.py
          tests/test_calyx_matrix_operational_449.py
          tests/test_multimodal_intelligence_engines.py
          tests/test_calyx_artifact_registry.py
      - name: Permanent governance assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('runtime/ai_vision_governed.py').read_text()
          required = (
              '"face_or_person_analysis": False',
              '"autonomous_species_identification": False',
              '"taxonomy_activation_authorized": False',
              '"scientific_publication_authorized": False',
              '"knowledge_graph_mutation_authorized": False',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing AI.Vision governance assertion(s): {missing}')
          PY
      - name: Changed-surface Ruff and diff hygiene
        run: |
          python -m ruff check runtime/ai_vision_governed.py app/routers/ai_vision_governed.py tests/test_calyx_ai_vision_450.py
          git diff --check
