name: CALYX-RUNTIME-001F Draft Engineering Executor

on:
  pull_request:
    paths:
      - "runtime/draft_engineering_executor.py"
      - "tests/test_calyx_runtime_001f_draft_engineering_executor.py"
      - ".github/workflows/calyx-runtime-001f-draft-engineering-executor.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/draft_engineering_executor.py tests/test_calyx_runtime_001f_draft_engineering_executor.py
      - run: python -m ruff format --check runtime/draft_engineering_executor.py tests/test_calyx_runtime_001f_draft_engineering_executor.py
      - run: python -m pytest -q tests/test_calyx_runtime_001f_draft_engineering_executor.py
      - run: python -m compileall -q runtime/draft_engineering_executor.py
      - run: git diff --check
