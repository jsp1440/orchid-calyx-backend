name: CALYX Graph Pipeline Readiness

on:
  pull_request:
    paths:
      - "runtime/graph_pipeline_readiness.py"
      - "runtime/knowledge_graph/**"
      - "runtime/world_plants_*.py"
      - "runtime/taxonomy_image_population.py"
      - "app/routers/graph_pipeline_readiness.py"
      - "app/routers/health.py"
      - "scripts/report_graph_pipeline_readiness.py"
      - "tests/test_graph_pipeline_core_readiness.py"
      - "docs/CALYX-GRAPH-PIPELINE-CORE-READINESS.md"
      - ".github/workflows/calyx-graph-pipeline-readiness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run focused readiness tests
        run: python -m pytest -q tests/test_graph_pipeline_core_readiness.py
      - name: Compile readiness modules
        run: >-
          python -m compileall -q
          runtime/graph_pipeline_readiness.py
          app/routers/graph_pipeline_readiness.py
          scripts/report_graph_pipeline_readiness.py
      - name: Check repository whitespace
        run: git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
