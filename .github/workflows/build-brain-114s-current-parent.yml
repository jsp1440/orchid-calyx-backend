name: BUILD-BRAIN-114S Current-Parent Mutation Executor Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_proposal_mutation_executor.py"
      - "app/calyx_orchestrator/git_proposal_execution_plan.py"
      - "tests/test_calyx_git_proposal_mutation_executor_114s.py"
      - "tests/test_calyx_git_proposal_execution_plan_114r.py"
      - "docs/brain/BUILD-BRAIN-114S-CURRENT-PARENT-MUTATION-EXECUTOR.md"
      - ".github/workflows/build-brain-114s-current-parent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/calyx_orchestrator/git_proposal_mutation_executor.py app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_proposal_mutation_executor_114s.py tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Ruff
        run: |
          ruff check app/calyx_orchestrator/git_proposal_mutation_executor.py app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_proposal_mutation_executor_114s.py tests/test_calyx_git_proposal_execution_plan_114r.py
          ruff format --check app/calyx_orchestrator/git_proposal_mutation_executor.py app/calyx_orchestrator/git_proposal_execution_plan.py tests/test_calyx_git_proposal_mutation_executor_114s.py tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Focused regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_calyx_git_proposal_execution_plan_114r.py tests/test_calyx_git_proposal_mutation_executor_114s.py
      - name: Authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("app/calyx_orchestrator/git_proposal_mutation_executor.py").read_text(encoding="utf-8")
          for required in ("patch_program_job_id", "repository_allowlist", "_require_dependency_closed_prefix", "partial_failure"):
              assert required in source, required
          for forbidden in ("merge_pull_request", "enable_auto_merge", "GITHUB_TOKEN", "subprocess", "requests.", "deploy", "publish_scientific"):
              assert forbidden not in source, forbidden
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
