name: BUILD-101 validation

on:
  pull_request:
    paths:
      - "app/harvest/**"
      - "tests/harvest/**"
      - ".github/workflows/build-101-validation.yml"
  push:
    branches:
      - "feature/build-101-harvester-v2-rewrite"
    paths:
      - "app/harvest/**"
      - "tests/harvest/**"
      - ".github/workflows/build-101-validation.yml"

jobs:
  harvest-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify repository imports
        run: python -c "import app.harvest; print('app.harvest import OK')"
      - name: Run Harvester V2 tests
        run: python -m pytest -q tests/harvest
