name: CALYX Phase 1 Production Activation

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/20260805_calyx_autonomous_engineering_core.sql'
      - 'app/orchestrator/**'
      - 'tests/test_engineering_program*.py'
      - '.github/workflows/calyx-phase1-production-activation.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Recovery runs only: type APPLY CALYX PHASE 1 MIGRATION'
        required: true
        type: string
      run_smoke_test:
        description: 'Verify protected program endpoints after deployment'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: calyx-phase1-production-activation
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply idempotent program migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate invocation policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CONFIRMATION" != "APPLY CALYX PHASE 1 MIGRATION" ]]; then
            echo "Manual recovery runs require the exact confirmation phrase."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "Automatic safe-path activation triggered by an approved change merged to main."
          fi

      - name: Check required database secret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not configured"; exit 1; }

      - name: Check out triggering main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Phase 1 migration transactionally
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file=migrations/20260805_calyx_autonomous_engineering_core.sql

      - name: Verify program tables exist
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          actual=$(psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          SELECT count(*)
          FROM information_schema.tables
          WHERE table_schema = 'public'
            AND table_name IN (
              'calyx_engineering_programs',
              'calyx_engineering_program_jobs',
              'calyx_engineering_program_dependencies'
            );
          SQL
          )
          test "$actual" = "3" || { echo "Expected 3 program tables; found $actual"; exit 1; }

      - name: Record migration result
        if: always()
        shell: bash
        run: |
          {
            echo "## CALYX autonomous operations"
            echo "- Event: ${{ github.event_name }}"
            echo "- Revision: \`${{ github.sha }}\`"
            echo "- Migration: transactional and idempotent"
            echo "- Destructive operations: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Verify deployed protected endpoints
    if: ${{ github.event_name == 'push' || inputs.run_smoke_test }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required endpoint secrets
        shell: bash
        env:
          CALYX_BACKEND_URL: ${{ secrets.CALYX_BACKEND_URL }}
          CALYX_API_KEY: ${{ secrets.CALYX_API_KEY }}
        run: |
          test -n "$CALYX_BACKEND_URL" || { echo "CALYX_BACKEND_URL secret is not configured"; exit 1; }
          test -n "$CALYX_API_KEY" || { echo "CALYX_API_KEY secret is not configured"; exit 1; }

      - name: Wait for deployed main to become healthy
        shell: bash
        env:
          CALYX_BACKEND_URL: ${{ secrets.CALYX_BACKEND_URL }}
        run: |
          base="${CALYX_BACKEND_URL%/}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$base/" >/dev/null; then
              exit 0
            fi
            echo "Backend not ready yet (attempt $attempt/30)"
            sleep 10
          done
          echo "Backend did not become healthy in time"
          exit 1

      - name: Verify protected orchestrator status
        shell: bash
        env:
          CALYX_BACKEND_URL: ${{ secrets.CALYX_BACKEND_URL }}
          CALYX_API_KEY: ${{ secrets.CALYX_API_KEY }}
        run: |
          base="${CALYX_BACKEND_URL%/}"
          curl --fail --silent --show-error \
            -H "X-API-Key: $CALYX_API_KEY" \
            "$base/orchestrator/status" \
            | python -m json.tool

      - name: Verify program route is mounted without creating work
        shell: bash
        env:
          CALYX_BACKEND_URL: ${{ secrets.CALYX_BACKEND_URL }}
          CALYX_API_KEY: ${{ secrets.CALYX_API_KEY }}
        run: |
          base="${CALYX_BACKEND_URL%/}"
          status=$(curl --silent --output /tmp/program-response.json --write-out '%{http_code}' \
            -H "X-API-Key: $CALYX_API_KEY" \
            "$base/orchestrator/programs/00000000-0000-0000-0000-000000000000")
          cat /tmp/program-response.json | python -m json.tool
          test "$status" = "404"

      - name: Record terminal outcome
        if: success()
        shell: bash
        run: |
          {
            echo "## DELIVERED"
            echo "- Program migration verified"
            echo "- Protected orchestrator status verified"
            echo "- Program route verified read-only"
            echo "- No worker or engineering program created"
            echo "- No taxonomy activation, graph mutation, scientific publication, credential rotation, or data deletion"
          } >> "$GITHUB_STEP_SUMMARY"
