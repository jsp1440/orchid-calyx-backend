name: CALYX Bounded Live Dry Run

on:
  pull_request:
    paths:
      - "scripts/run_bounded_resumable_graph_dry_run.py"
      - "tests/test_run_bounded_resumable_graph_dry_run.py"
      - ".github/workflows/calyx-bounded-live-dry-run.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_bounded_resumable_graph_dry_run.py"
      - "tests/test_run_bounded_resumable_graph_dry_run.py"
      - ".github/workflows/calyx-bounded-live-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
      CALYX_BOUNDED_DRY_RUN_EVIDENCE_PATH: calyx-bounded-dry-run-evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate bounded operator
        run: |
          python -m pip install pytest
          pytest -q tests/test_run_bounded_resumable_graph_dry_run.py
          python -m compileall -q scripts/run_bounded_resumable_graph_dry_run.py
      - name: Run one bounded live staging step
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_bounded_resumable_graph_dry_run.py | tee calyx-bounded-dry-run.txt
      - name: Upload bounded dry-run evidence
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: calyx-bounded-live-dry-run-${{ github.run_id }}
          path: |
            calyx-bounded-dry-run.txt
            calyx-bounded-dry-run-evidence.json
          if-no-files-found: warn
          retention-days: 30
