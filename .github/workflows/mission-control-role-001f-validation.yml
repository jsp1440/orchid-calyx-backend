name: MISSION-CONTROL-ROLE-001F validation

on:
  pull_request:
    paths:
      - "app/review_api/**"
      - "tests/test_mission_control_role_001f_auth_postgres_wiring.py"
      - ".github/workflows/mission-control-role-001f-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest "httpx<0.28"
      - name: Compile review authentication wiring
        env:
          PYTHONPATH: .
        run: python -m compileall app/review_api app/mission_control_access app/review_tasks
      - name: Run 001F tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_mission_control_role_001f_auth_postgres_wiring.py
      - name: Run Mission Control regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_mission_control_role_001a_review_tasks.py tests/test_mission_control_role_001b_capabilities.py tests/test_mission_control_role_001c_principals.py tests/test_mission_control_role_001d_postgres_persistence.py
