name: BUILD-BRAIN-114S-R4 Mutation Executor Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_proposal_mutation_executor.py"
      - "tests/test_calyx_git_proposal_mutation_executor_114s.py"
      - "docs/brain/BUILD-BRAIN-114S-R4-MUTATION-EXECUTOR.md"
      - ".github/workflows/build-brain-114s-r4-mutation-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/calyx_orchestrator/git_proposal_mutation_executor.py tests/test_calyx_git_proposal_mutation_executor_114s.py
      - name: Ruff
        run: |
          ruff check app/calyx_orchestrator/git_proposal_mutation_executor.py tests/test_calyx_git_proposal_mutation_executor_114s.py
          ruff format --check app/calyx_orchestrator/git_proposal_mutation_executor.py tests/test_calyx_git_proposal_mutation_executor_114s.py
      - name: Focused regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_calyx_git_proposal_mutation_executor_114s.py tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Authority and review-fix boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("app/calyx_orchestrator/git_proposal_mutation_executor.py").read_text(encoding="utf-8")
          for required in (
              "authorization_gate.verify_grant(request, grant_mapping)",
              "base_ref != plan.base_ref",
              "_failure_code",
              "patch_program_job_id",
              "repository_allowlist",
              "partial_failure",
          ):
              assert required in source, required
          for forbidden in (
              "merge_pull_request",
              "enable_auto_merge",
              "GITHUB_TOKEN",
              "subprocess",
              "requests.",
              "deployment_client",
              "publication_client",
              "publish_scientific",
          ):
              assert forbidden not in source, forbidden
          PY
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref || github.event.repository.default_branch }}...HEAD"
