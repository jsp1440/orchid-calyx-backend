name: TEMP Calyx Bounded Live Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/temp-calyx-bounded-live-dry-run-pr.yml"

permissions:
  contents: read

jobs:
  bounded-live-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
      CALYX_BOUNDED_DRY_RUN_EVIDENCE_PATH: calyx-bounded-dry-run-evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CALYX_BACKEND_URL:?Repository variable CALYX_BACKEND_URL is required}"
          : "${CALYX_OWNER_ACCESS_CODE:?Repository secret CALYX_OWNER_ACCESS_CODE is required}"
      - name: Validate bounded operator
        run: |
          python -m pip install pytest
          pytest -q tests/test_run_bounded_resumable_graph_dry_run.py
          python -m compileall -q scripts/run_bounded_resumable_graph_dry_run.py
      - name: Run one bounded live staging step
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_bounded_resumable_graph_dry_run.py 2>&1 | tee calyx-bounded-dry-run.txt
      - name: Upload bounded dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-calyx-bounded-live-dry-run-${{ github.run_id }}
          path: |
            calyx-bounded-dry-run.txt
            calyx-bounded-dry-run-evidence.json
          if-no-files-found: warn
          retention-days: 7
