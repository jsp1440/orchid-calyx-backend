name: CALYX-AGENT-006 Validation

on:
  pull_request:
    paths:
      - "app/calyx_engineering/**"
      - "tests/test_calyx_agent_006.py"
      - ".github/workflows/calyx-agent-006.yml"

jobs:
  provider-patch-repair:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/calyx_engineering tests/test_calyx_agent_006.py
      - name: Ruff
        run: ruff check app/calyx_engineering tests/test_calyx_agent_006.py
      - name: Focused tests
        run: pytest -q tests/test_calyx_agent_006.py
      - name: Route registration smoke
        run: python -c "from app.brain.routes import router; assert any('/engineering/pull-requests/{pull_request_number}/repair' in route.path for route in router.routes)"
