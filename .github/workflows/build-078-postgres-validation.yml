name: BUILD-078 PostgreSQL validation

on:
  pull_request:
    paths:
      - "app/publication/**"
      - "app/main.py"
      - "migrations/078_controlled_publication_gate.sql"
      - "tests/test_build_078_publication_gate.py"
      - "scripts/build_078_postgres_validation.py"
      - ".github/workflows/build-078-postgres-validation.yml"
  push:
    branches:
      - feature/build-078-controlled-publication-gate
    paths:
      - "app/publication/**"
      - "app/main.py"
      - "migrations/078_controlled_publication_gate.sql"
      - "tests/test_build_078_publication_gate.py"
      - "scripts/build_078_postgres_validation.py"
      - ".github/workflows/build-078-postgres-validation.yml"
  workflow_dispatch:

concurrency:
  group: orchid-validation-postgres
  cancel-in-progress: false

jobs:
  postgres-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate BUILD-078 against PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_078_postgres_validation.py
