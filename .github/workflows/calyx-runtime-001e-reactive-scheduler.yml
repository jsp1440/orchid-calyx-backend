name: CALYX-RUNTIME-001E Reactive Scheduler

on:
  pull_request:
    paths:
      - "runtime/reactive_scheduler.py"
      - "tests/test_calyx_runtime_001e_reactive_scheduler.py"
      - ".github/workflows/calyx-runtime-001e-reactive-scheduler.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/reactive_scheduler.py tests/test_calyx_runtime_001e_reactive_scheduler.py
      - run: python -m ruff format --check runtime/reactive_scheduler.py tests/test_calyx_runtime_001e_reactive_scheduler.py
      - run: python -m pytest -q tests/test_calyx_runtime_001e_reactive_scheduler.py
