name: BUILD-BRAIN-114D Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/static_validation_executor.py"
      - "app/calyx_orchestrator/executor_registry.py"
      - "tests/test_calyx_static_validation_executor.py"
      - ".github/workflows/build-brain-114d.yml"
      - "docs/brain/BUILD-BRAIN-114D-STATIC-VALIDATION-EXECUTOR.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m py_compile \
            app/calyx_orchestrator/static_validation_executor.py \
            app/calyx_orchestrator/executor_registry.py \
            tests/test_calyx_static_validation_executor.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/static_validation_executor.py \
            app/calyx_orchestrator/executor_registry.py \
            tests/test_calyx_static_validation_executor.py
      - name: Focused autonomous validation tests
        run: |
          pytest -q \
            tests/test_calyx_static_validation_executor.py \
            tests/test_calyx_isolated_patch_executor.py \
            tests/test_calyx_repository_evidence_executor.py \
            tests/test_calyx_autonomous_program_cycle.py
      - name: Diff hygiene
        run: git diff --check
