name: BUILD-618 Causal Scope Validation

on:
  pull_request:
    paths:
      - "app/brain/causal_scope.py"
      - "app/brain/mechanistic_candidates.py"
      - "app/brain/mechanistic_contradictions.py"
      - "app/brain/mechanistic_publication_plan.py"
      - "tests/test_build_618_causal_scope.py"
      - "tests/test_build_618_causal_scope_p1_regressions.py"
      - "tests/test_build_617_mechanistic_contradictions.py"
      - "tests/test_build_616_mechanistic_publication_plan.py"
      - "tests/test_build_615_mechanistic_candidate_graph.py"
      - "docs/brain/BUILD-618-CAUSAL-SCOPE-R3.md"
      - ".github/workflows/build-618-causal-scope-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-causal-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile
        run: >-
          python -m py_compile
          app/brain/causal_scope.py
          app/brain/mechanistic_candidates.py
          app/brain/mechanistic_contradictions.py
          app/brain/mechanistic_publication_plan.py
          tests/test_build_618_causal_scope.py
          tests/test_build_618_causal_scope_p1_regressions.py
          tests/test_build_617_mechanistic_contradictions.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/causal_scope.py
          app/brain/mechanistic_candidates.py
          app/brain/mechanistic_contradictions.py
          app/brain/mechanistic_publication_plan.py
          tests/test_build_618_causal_scope.py
          tests/test_build_618_causal_scope_p1_regressions.py
          tests/test_build_617_mechanistic_contradictions.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/causal_scope.py
          app/brain/mechanistic_candidates.py
          app/brain/mechanistic_contradictions.py
          app/brain/mechanistic_publication_plan.py
          tests/test_build_618_causal_scope.py
          tests/test_build_618_causal_scope_p1_regressions.py
          tests/test_build_617_mechanistic_contradictions.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Causal scope regressions
        run: >-
          python -m pytest -q
          tests/test_build_618_causal_scope.py
          tests/test_build_618_causal_scope_p1_regressions.py
          tests/test_build_617_mechanistic_contradictions.py
          tests/test_build_616_mechanistic_publication_plan.py
          tests/test_build_615_mechanistic_candidate_graph.py
      - name: Scope-governance assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          scope = Path("app/brain/causal_scope.py").read_text(encoding="utf-8")
          contradictions = Path("app/brain/mechanistic_contradictions.py").read_text(encoding="utf-8")
          publication = Path("app/brain/mechanistic_publication_plan.py").read_text(encoding="utf-8")
          tests = Path("tests/test_build_618_causal_scope.py").read_text(encoding="utf-8")
          p1_tests = Path("tests/test_build_618_causal_scope_p1_regressions.py").read_text(encoding="utf-8")
          for marker in (
              "BOUNDED_CAUSAL_SCOPE_REQUIRES_APPLICABILITY_BOUNDS",
              "GLOBAL_CAUSAL_SCOPE_REQUIRES_JUSTIFICATION",
              "causal_scope_identity",
              "APPLICABILITY_DIMENSIONS",
          ):
              assert marker in scope, marker
          assert "applicability_identity" in contradictions
          identity_block = contradictions.split("def _scope_identity", 1)[1].split("def _scope_id", 1)[0]
          assert '"causal_scope": scope.get("applicability_identity")' in identity_block
          assert "experimental_context" not in identity_block
          assert "quantitative_context" not in identity_block
          assert "publication_scope_blockers" in publication
          assert '"publication_adapter_available": False' in publication
          assert '"operations": operations' in publication
          assert "test_narrative_scope_metadata_cannot_split_a_real_contradiction" in tests
          assert "test_unknown_scope_narrative_context_cannot_split_a_real_contradiction" in tests
          assert "test_bounded_scope_requires_real_bounds_after_whitespace_normalization" in tests
          assert "test_bounded_scope_rejects_semantically_empty_mapping_bounds" in p1_tests
          assert "test_equivalent_categorical_mapping_scope_forms_real_contradiction" in p1_tests
          PY
      - name: Hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git diff --check "origin/${BASE_REF}...HEAD"
