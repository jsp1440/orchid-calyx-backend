name: Calyx Continuum Integration

on:
  pull_request:
    paths:
      - 'app/calyx_conversation/**'
      - 'tests/test_calyx_speak_002.py'
      - 'tests/test_calyx_continuum_context.py'
      - 'tests/test_calyx_continuum_environment.py'
      - '.github/workflows/calyx-continuum-integration.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Compile Calyx conversation integration
        run: python -m compileall -q app/calyx_conversation
      - name: Ruff
        run: ruff check app/calyx_conversation/continuum_context.py app/calyx_conversation/provider.py app/calyx_conversation/speak_routes.py tests/test_calyx_continuum_context.py tests/test_calyx_continuum_environment.py
      - name: Targeted tests
        env:
          DATABASE_URL: ''
        run: python -m pytest -q tests/test_calyx_speak_002.py tests/test_calyx_continuum_context.py tests/test_calyx_continuum_environment.py
