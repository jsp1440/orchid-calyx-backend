name: CALYX-115 Validation

on:
  pull_request:
    paths:
      - "runtime/calyx_certification/secret_readiness.py"
      - "tests/test_calyx_115_secret_readiness.py"
      - ".github/workflows/calyx-115.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/secret_readiness.py tests/test_calyx_115_secret_readiness.py
      - run: pytest -q tests/test_calyx_115_secret_readiness.py
