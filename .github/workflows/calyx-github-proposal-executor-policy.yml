name: CALYX GitHub Proposal Executor Policy Validation

on:
  pull_request:
    paths:
      - 'app/calyx_orchestrator/github_proposal_executor_policy.py'
      - 'app/calyx_orchestrator/github_proposal_mutation_adapter.py'
      - 'tests/test_calyx_github_proposal_executor_policy_114u.py'
      - 'tests/test_calyx_github_proposal_mutation_adapter_114u.py'
      - '.github/workflows/calyx-github-proposal-executor-policy.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m compileall -q \
            app/calyx_orchestrator/github_proposal_executor_policy.py \
            app/calyx_orchestrator/github_proposal_mutation_adapter.py \
            tests/test_calyx_github_proposal_executor_policy_114u.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/github_proposal_executor_policy.py \
            tests/test_calyx_github_proposal_executor_policy_114u.py
          ruff format --check \
            app/calyx_orchestrator/github_proposal_executor_policy.py \
            tests/test_calyx_github_proposal_executor_policy_114u.py
      - name: Focused policy and transport regressions
        run: |
          python -m pytest -q \
            tests/test_calyx_github_proposal_executor_policy_114u.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py \
            tests/test_calyx_git_proposal_mutation_journal_114t.py \
            tests/test_calyx_git_proposal_mutation_executor_114s.py \
            tests/test_calyx_git_proposal_execution_plan_114r.py
      - name: Disabled-by-default and authority boundary
        run: |
          python - <<'PY'
          from app.calyx_orchestrator.github_proposal_executor_policy import github_proposal_executor_status
          status = github_proposal_executor_status({}, credential_ready=True)
          assert status['enabled'] is False
          assert status['external_side_effects'] is False
          assert status['merge_authorized'] is False
          assert status['deployment_authorized'] is False
          assert status['publication_authorized'] is False
          assert status['taxonomy_activation_authorized'] is False
          assert status['production_database_mutation_authorized'] is False
          assert status['production_graph_mutation_authorized'] is False
          assert status['credential_disclosure_authorized'] is False
          assert status['spending_authorized'] is False
          PY
      - name: No credential activation
        run: |
          ! git diff --unified=0 ${{ github.event.pull_request.base.sha || 'HEAD^' }}...HEAD -- \
            . \
            ':(exclude).github/workflows/calyx-github-proposal-executor-policy.yml' \
            | grep -E '^\+.*(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+|CALYX_GITHUB_PROPOSAL_TOKEN)'
      - name: Diff hygiene
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }}...HEAD
