name: BUILD-088B validation

on:
  pull_request:
    paths:
      - "app/knowledge_publication/**"
      - "migrations/088b_publication_registry_policy_foundation.sql"
      - "tests/test_build_088b_publication_foundation.py"
      - ".github/workflows/build-088b-validation.yml"
  workflow_dispatch:

jobs:
  publication-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build088
          POSTGRES_PASSWORD: build088_test_only
          POSTGRES_DB: build088_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build088 -d build088_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://build088:build088_test_only@localhost:5432/build088_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: python -m ruff check app/knowledge_publication tests/test_build_088b_publication_foundation.py
      - run: python -m pytest -q tests/test_build_088b_publication_foundation.py
      - run: python -m pytest -q tests/test_build_087b_scientific_interpretation.py tests/test_build_078_publication_gate.py
      - run: python -m compileall -q app runtime scripts tests
      - run: git diff --check
