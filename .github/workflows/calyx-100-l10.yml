name: CALYX-100-L10 Validation

on:
  pull_request:
    paths:
      - 'runtime/calyx_certification/status.py'
      - 'tests/test_calyx_100_l10_status.py'
      - '.github/workflows/calyx-100-l10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-status:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/status.py tests/test_calyx_100_l10_status.py
      - run: pytest -q tests/test_calyx_100_l10_status.py
