name: CALYX Provider Readiness Validation

on:
  pull_request:
    paths:
      - 'app/calyx_conversation/provider_readiness.py'
      - 'app/calyx_conversation/speak_routes.py'
      - 'tests/test_calyx_provider_readiness_001.py'
      - '.github/workflows/calyx-provider-readiness-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile provider readiness layer
        run: python -m py_compile app/calyx_conversation/provider_readiness.py app/calyx_conversation/speak_routes.py tests/test_calyx_provider_readiness_001.py
      - name: Run provider readiness and adjacent Speak regressions
        run: python -m pytest -q tests/test_calyx_provider_readiness_001.py tests/test_calyx_workspace_output_api_001.py tests/test_calyx_context_awareness_001.py tests/test_calyx_speak_003_degraded_retrieval.py
      - name: Lint provider readiness layer
        run: ruff check app/calyx_conversation/provider_readiness.py app/calyx_conversation/speak_routes.py tests/test_calyx_provider_readiness_001.py
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
