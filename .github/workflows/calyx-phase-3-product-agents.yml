name: CALYX Phase 3 Product Agents Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/product_agents.py"
      - "app/calyx_orchestrator/product_program.py"
      - "tests/test_calyx_product_agents_phase_3.py"
      - ".github/workflows/calyx-phase-3-product-agents.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m compileall -q app/calyx_orchestrator
      - name: Ruff
        run: ruff check app/calyx_orchestrator/product_agents.py app/calyx_orchestrator/product_program.py tests/test_calyx_product_agents_phase_3.py
      - name: Focused tests
        run: pytest -q tests/test_calyx_product_agents_phase_3.py
