name: CALYX Conservatory 451

on:
  pull_request:
    paths:
      - "runtime/conservatory_operational.py"
      - "app/routers/conservatory_operational.py"
      - "app/routers/live_mission_control.py"
      - "tests/test_calyx_conservatory_451.py"
      - "docs/brain/CALYX-CONSERVATORY-451.md"
      - ".github/workflows/calyx-conservatory-451.yml"
  workflow_dispatch:

jobs:
  conservatory:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile Conservatory surface
        run: >-
          python -m py_compile
          runtime/conservatory_operational.py
          app/routers/conservatory_operational.py
          app/routers/live_mission_control.py
          tests/test_calyx_conservatory_451.py
      - name: Deterministic Conservatory and artifact tests
        run: >-
          python -m pytest -q
          tests/test_calyx_conservatory_451.py
          tests/test_calyx_artifact_registry.py
      - name: Permanent privacy and non-authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('runtime/conservatory_operational.py').read_text()
          required = (
              '"public_location_exposure": False',
              '"autonomous_taxonomic_acceptance": False',
              '"production_deployment_authorized": False',
              '"knowledge_graph_mutation_authorized": False',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing Conservatory governance assertion(s): {missing}')
          forbidden = ('INSERT INTO oc_graph', 'UPDATE oc_graph', 'DELETE FROM oc_graph', 'TRUNCATE oc_graph')
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'forbidden graph mutation surface present: {present}')
          PY
      - name: Changed-surface Ruff and diff hygiene
        run: |
          python -m ruff check --ignore UP037 runtime/conservatory_operational.py app/routers/conservatory_operational.py tests/test_calyx_conservatory_451.py
          git diff --check
