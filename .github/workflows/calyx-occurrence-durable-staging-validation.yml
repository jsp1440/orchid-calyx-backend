name: CALYX Occurrence Durable Staging Validation

on:
  pull_request:
    paths:
      - "runtime/occurrence_persistence.py"
      - "runtime/occurrence_staging.py"
      - "migrations/106_occurrence_staging_runtime.sql"
      - "tests/test_occurrence_durable_staging.py"
      - "docs/brain/CALYX-CORE-OCCURRENCE-DURABLE-STAGING.md"
      - ".github/workflows/calyx-occurrence-durable-staging-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: occurrence_test
          POSTGRES_PASSWORD: occurrence_test
          POSTGRES_DB: occurrence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U occurrence_test -d occurrence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      OCCURRENCE_STAGING_TEST_DATABASE_URL: postgresql+psycopg://occurrence_test:occurrence_test@localhost:5432/occurrence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Compile and lint
        run: |
          python -m py_compile runtime/occurrence_staging.py runtime/occurrence_persistence.py tests/test_occurrence_durable_staging.py
          python -m ruff check runtime/occurrence_staging.py runtime/occurrence_persistence.py tests/test_occurrence_durable_staging.py
      - name: Durable occurrence tests
        run: python -m pytest -q tests/test_occurrence_durable_staging.py
      - name: Existing Harvester V2 regressions
        run: python -m pytest -q tests/harvest/test_manager.py tests/harvest/test_gbif_plugin.py
      - name: Migration and governance smoke
        shell: bash
        run: |
          grep -q "CREATE SCHEMA IF NOT EXISTS occurrence_pipeline" migrations/106_occurrence_staging_runtime.sql
          ! grep -Ei "INSERT INTO oc_graph|UPDATE oc_graph|DELETE FROM oc_graph|TRUNCATE" migrations/106_occurrence_staging_runtime.sql runtime/occurrence_persistence.py
          grep -q "no_production_graph_mutation" runtime/occurrence_persistence.py
          git diff --check
