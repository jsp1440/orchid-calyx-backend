name: CALYX-BRAIN-003 Validation

on:
  pull_request:
    paths:
      - "app/reasoning_publication/**"
      - "app/main.py"
      - "migrations/105_reasoning_ledger_publication_adapter*.sql"
      - "tests/test_calyx_brain_003_*.py"
      - "docs/architecture/CALYX-BRAIN-003-*"
      - ".github/workflows/calyx-brain-003-validation.yml"
  workflow_dispatch:

jobs:
  publication-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brain003
          POSTGRES_PASSWORD: brain003_test_only
          POSTGRES_DB: brain003_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain003 -d brain003_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brain003:brain003_test_only@localhost:5432/brain003_validation
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: PostgreSQL migration order, reapplication, constraints, rollback isolation
        run: python -m pytest -q tests/test_calyx_brain_003_migration.py
      - name: Focused publication adapter
        run: python -m pytest -q tests/test_calyx_brain_003_publication.py
      - name: Reasoning, Brain integration, and Knowledge Graph regressions
        run: >-
          python -m pytest -q
          tests/test_calyx_brain_002_operational.py
          tests/test_calyx_brain_integration.py
          tests/test_build_088b_publication_foundation.py
          tests/test_build_088c_atomic_graph_publication.py
          tests/test_build_088d_publication_lifecycle.py
          tests/test_knowledge_graph_api.py
      - name: Candidate Knowledge, Literature, and Research Station regressions
        run: >-
          python -m pytest -q
          tests/test_build_086a_candidate_knowledge.py
          tests/test_literature_extraction_pipeline.py
          tests/test_literature_extraction_output.py
          tests/test_build_rs_001_research_workspace.py
      - name: Ruff and formatting
        run: |
          python -m ruff check app/reasoning_publication tests/test_calyx_brain_003_publication.py tests/test_calyx_brain_003_migration.py
          python -m ruff format --check app/reasoning_publication tests/test_calyx_brain_003_publication.py tests/test_calyx_brain_003_migration.py
      - name: Compile, import, and OpenAPI route smoke
        run: |
          python -m compileall -q app/reasoning_publication
          python -c "from app.main import app; assert '/api/reasoning-ledgers/{ledger_id}/publish' in app.openapi()['paths']"
      - name: Secret and repository hygiene
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,})' app/reasoning_publication migrations/105_reasoning_ledger_publication_adapter.sql
          git diff --check
