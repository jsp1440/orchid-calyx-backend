name: BUILD-621 Plant Diagnostic Context Validation

on:
  pull_request:
    paths:
      - 'app/brain/plant_diagnostic_context.py'
      - 'app/brain/routes.py'
      - 'app/brain/local_observation_context.py'
      - 'app/brain/local_observations.py'
      - 'app/brain/scoped_reasoning_map.py'
      - 'tests/test_build_621_plant_diagnostic_context.py'
      - 'tests/test_build_620_local_observation_bridge.py'
      - 'tests/test_build_619_reasoning_scope.py'
      - '.github/workflows/build-621-plant-diagnostic-context-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plant-diagnostic-context:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff httpx
      - name: Compile
        run: >-
          python -m py_compile
          app/brain/plant_diagnostic_context.py
          app/brain/routes.py
          tests/test_build_621_plant_diagnostic_context.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/plant_diagnostic_context.py
          app/brain/routes.py
          tests/test_build_621_plant_diagnostic_context.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/plant_diagnostic_context.py
          app/brain/routes.py
          tests/test_build_621_plant_diagnostic_context.py
      - name: Diagnostic context regressions
        run: >-
          python -m pytest -q
          tests/test_build_621_plant_diagnostic_context.py
          tests/test_build_620_local_observation_bridge.py
          tests/test_build_619_reasoning_scope.py
      - name: Verify diagnostic route
        run: >-
          python -c "from app.brain.routes import router; assert any(r.path == '/brain/diagnostic-context' for r in router.routes)"
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
