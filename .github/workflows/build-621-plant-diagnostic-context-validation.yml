name: BUILD-621 Plant Diagnostic Context Validation

on:
  pull_request:
    paths:
      - "app/brain/plant_diagnostic_context.py"
      - "app/brain/routes.py"
      - "app/brain/local_observation_context.py"
      - "app/brain/local_observations.py"
      - "app/brain/scoped_reasoning_map.py"
      - "app/brain/causal_scope.py"
      - "tests/test_build_621_plant_diagnostic_context.py"
      - "tests/test_build_620_local_observation_bridge.py"
      - "tests/test_build_619_reasoning_scope.py"
      - "tests/test_build_618_causal_scope.py"
      - "docs/brain/BUILD-621-PLANT-DIAGNOSTIC-CONTEXT-R3.md"
      - ".github/workflows/build-621-plant-diagnostic-context-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plant-diagnostic-context:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff httpx
      - name: Compile
        run: >-
          python -m py_compile
          app/brain/plant_diagnostic_context.py
          app/brain/routes.py
          tests/test_build_621_plant_diagnostic_context.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/plant_diagnostic_context.py
          app/brain/routes.py
          tests/test_build_621_plant_diagnostic_context.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/plant_diagnostic_context.py
          app/brain/routes.py
          tests/test_build_621_plant_diagnostic_context.py
      - name: Diagnostic context and prerequisite regressions
        run: >-
          python -m pytest -q
          tests/test_build_621_plant_diagnostic_context.py
          tests/test_build_620_local_observation_bridge.py
          tests/test_build_619_reasoning_scope.py
          tests/test_build_618_causal_scope.py
      - name: Verify protected diagnostic route and governance
        run: |
          python - <<'PY'
          from app.brain.routes import router
          from app.brain.plant_diagnostic_context import compose_plant_diagnostic_context

          assert any(route.path == "/brain/diagnostic-context" for route in router.routes)
          source = __import__("inspect").getsource(compose_plant_diagnostic_context)
          for marker in (
              '"read_only": True',
              '"canonical_graph_mutated": False',
              '"candidate_knowledge_mutated": False',
              '"scientific_publication_authority": False',
              '"local_observation_implies_canonical_mechanism": False',
          ):
              assert marker in source, marker
          PY
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
