name: CALYX-BRAIN-002 Runner Probe

on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: |
          echo "runner_started=true"
          uname -a
