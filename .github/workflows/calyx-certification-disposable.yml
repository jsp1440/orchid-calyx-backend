name: CALYX Certification Disposable Failure

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/calyx_certification/**"
      - ".github/workflows/calyx-certification-disposable.yml"

jobs:
  deterministic-certification-failure:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run deterministic certification failure
        run: pytest -q tests/calyx_certification/test_deterministic_failure.py
