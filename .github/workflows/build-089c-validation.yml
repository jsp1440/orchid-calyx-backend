name: BUILD-089C validation

on:
  pull_request:
    paths:
      - "app/design_intelligence/**"
      - "corpus/design_intelligence/build-089c/**"
      - "tests/test_build_089*.py"
      - ".github/workflows/build-089c-validation.yml"

jobs:
  design-corpus-population:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orchid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff httpx psycopg[binary]
      - run: python -m pytest tests/test_build_089a_design_intelligence_corpus.py tests/test_build_089b_design_knowledge_acquisition.py tests/test_build_089c_design_corpus_population.py -q
      - run: python -m compileall app
      - run: ruff check app/design_intelligence tests/test_build_089c_design_corpus_population.py
