name: CALYX-AGENT-003 Validation

on:
  pull_request:
    paths:
      - 'app/calyx_orchestrator/**'
      - 'app/brain/routes.py'
      - 'tests/test_calyx_agent_003.py'
      - 'migrations/20260801_calyx_agent_003.sql'
      - 'docs/architecture/CALYX-AGENT-003.md'
      - '.github/workflows/calyx-agent-003-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-preproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      CALYX_AGENT_PROVIDER: ''
      CALYX_AGENT_MODEL: ''
      OPENAI_API_KEY: ''
      CALYX_ORCHESTRATOR_ENABLED: 'false'
      CALYX_ORCHESTRATOR_MODE: 'preproduction'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx
      - name: Compile
        run: python -m compileall -q app/calyx_orchestrator
      - name: Ruff
        run: ruff check app/calyx_orchestrator tests/test_calyx_agent_003.py
      - name: Focused tests
        run: pytest -q tests/test_calyx_agent_003.py
      - name: Route smoke
        env:
          CALYX_API_KEY: test-key
          CALYX_OWNER_SESSION_SECRET: test-secret
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {
              '/brain/orchestrator/status',
              '/brain/orchestrator/seed-overnight',
              '/brain/orchestrator/jobs',
              '/brain/orchestrator/jobs/{job_id}/cancel',
          }
          missing = required - paths
          if missing:
              raise SystemExit(f'Missing routes: {sorted(missing)}')
          print('CALYX-AGENT-003 routes registered')
          PY
      - name: Verify preproduction fail-closed worker
        run: |
          if python -m app.calyx_orchestrator.worker; then
            echo 'Worker unexpectedly started while disabled'
            exit 1
          fi
