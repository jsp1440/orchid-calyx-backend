name: BUILD-080C Archive Hardening Validation

on:
  pull_request:
    paths:
      - 'app/archive/**'
      - 'migrations/107_archive_production_hardening*'
      - 'tests/test_build_080c_*'
      - '.github/workflows/build-080c-archive-hardening-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: archive
          POSTGRES_DB: archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archive -d archive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://archive:archive@localhost:5432/archive
      PYTHONPATH: .
      ARCHIVE_ALLOWED_ROOTS: /tmp/archive-approved
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest ruff PyYAML httpx
      - run: ruff check app/archive tests/test_build_080c_archive_hardening.py --ignore I001,UP035
      - run: python -m compileall -q app/archive
      - run: python -m pytest -q tests/test_build_080_archive_manager.py tests/test_build_080_archive_api.py tests/test_build_080c_archive_hardening.py
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/106_institutional_archive_manager.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/107_archive_production_hardening.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/107_archive_production_hardening.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/107_archive_production_hardening_rollback.sql
