name: BUILD-BRAIN-114E Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/assignment_factory.py"
      - "app/calyx_orchestrator/program_cycle.py"
      - "app/calyx_orchestrator/program_models.py"
      - "app/calyx_orchestrator/program_repository.py"
      - "app/calyx_orchestrator/program_routes.py"
      - "migrations/20260805_calyx_autonomous_engineering_core.sql"
      - "tests/test_calyx_autonomous_patch_validation_program.py"
      - ".github/workflows/build-brain-114e.yml"
      - "docs/brain/BUILD-BRAIN-114E-PROGRAM-INPUT-INTEGRATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m py_compile \
            app/calyx_orchestrator/assignment_factory.py \
            app/calyx_orchestrator/program_cycle.py \
            app/calyx_orchestrator/program_models.py \
            app/calyx_orchestrator/program_repository.py \
            app/calyx_orchestrator/program_routes.py \
            tests/test_calyx_autonomous_patch_validation_program.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/assignment_factory.py \
            app/calyx_orchestrator/program_cycle.py \
            app/calyx_orchestrator/program_models.py \
            app/calyx_orchestrator/program_repository.py \
            app/calyx_orchestrator/program_routes.py \
            tests/test_calyx_autonomous_patch_validation_program.py
      - name: Focused autonomous patch-validation integration tests
        run: |
          pytest -q \
            tests/test_calyx_autonomous_patch_validation_program.py \
            tests/test_calyx_static_validation_executor.py \
            tests/test_calyx_isolated_patch_executor.py \
            tests/test_calyx_repository_evidence_executor.py \
            tests/test_calyx_governed_assignment_factory.py \
            tests/test_calyx_autonomous_program_cycle.py
      - name: Migration contains compatible input manifest column
        run: grep -q "ADD COLUMN IF NOT EXISTS input_json TEXT NULL" migrations/20260805_calyx_autonomous_engineering_core.sql
      - name: Diff hygiene
        run: git diff --check
