name: CALYX-111 Validation
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/rollback_readiness.py tests/test_calyx_111_rollback_readiness.py
      - run: pytest -q tests/test_calyx_111_rollback_readiness.py
