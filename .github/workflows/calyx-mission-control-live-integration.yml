name: CALYX Mission Control Live Integration

on:
  pull_request:
    paths:
      - "app/live_mission_control.py"
      - "runtime/json_activation_store.py"
      - "tests/test_calyx_mission_control_live_integration.py"
      - ".github/workflows/calyx-mission-control-live-integration.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi httpx pytest ruff
      - run: python -m ruff check app/live_mission_control.py runtime/json_activation_store.py tests/test_calyx_mission_control_live_integration.py
      - run: python -m ruff format --check app/live_mission_control.py runtime/json_activation_store.py tests/test_calyx_mission_control_live_integration.py
      - run: python -m pytest -q tests/test_calyx_mission_control_live_integration.py
      - run: python -m compileall -q app/live_mission_control.py runtime/json_activation_store.py
      - run: git diff --check
