name: Paid API Stage A+B Canary

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run: a, b, or ab"
        required: false
        default: "ab"
        type: choice
        options: [a, b, ab]
      issue_a:
        description: "Issue number for Stage A (default: 1330)"
        required: false
        default: "1330"
      issues_b:
        description: "Comma-separated issue numbers for Stage B (default: 1330,1402)"
        required: false
        default: "1330,1402"
      ceiling_usd:
        description: "Budget ceiling in USD (hard max: 50.00)"
        required: false
        default: "50.00"
  push:
    branches:
      - claude/orchid-worker-codex-adapter-u0rxqr
    paths:
      - ".github/workflows/paid-api-stage-ab.yml"
      - "app/calyx_orchestrator/paid_api_*.py"
      - "app/calyx_orchestrator/codex_*.py"
      - "app/calyx_orchestrator/chatgpt_business_codex_*.py"
      - "tests/test_paid_api_worker.py"
      - "tests/test_codex_worker_adapter.py"

concurrency:
  group: paid-api-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/orchid-worker-codex-adapter-u0rxqr
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Apply safe Ruff fixes
        run: ruff check app/calyx_orchestrator tests/test_calyx_agent_003.py --fix || true
      - name: Apply targeted boundary fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/calyx_orchestrator/chatgpt_business_codex_provider.py")
          s = p.read_text()
          s = s.replace(
              "                timeout=self._timeout,\n            )",
              "                timeout=self._timeout,\n                check=False,\n            )",
          )
          p.write_text(s)

          p = Path("app/calyx_orchestrator/paid_api_canary.py")
          s = p.read_text()
          replacements = {
              "        except Exception as exc:\n            print(f\"[WARN] Could not fetch issue #{issue_number}: {exc}\", file=sys.stderr)":
              "        except Exception as exc:  # noqa: BLE001 - network boundary\n            print(f\"[WARN] Could not fetch issue #{issue_number}: {exc}\", file=sys.stderr)",
              "    except Exception as exc:\n        print(f\"[WARN] Could not post ledger receipt: {exc}\", file=sys.stderr)":
              "    except Exception as exc:  # noqa: BLE001 - GitHub API boundary\n        print(f\"[WARN] Could not post ledger receipt: {exc}\", file=sys.stderr)",
              "        except Exception as exc:\n            blocker = f\"STAGE_A_EXCEPTION: {exc}\"":
              "        except Exception as exc:  # noqa: BLE001 - top-level canary boundary\n            blocker = f\"STAGE_A_EXCEPTION: {exc}\"",
              "        except Exception as exc:\n            blocker = f\"STAGE_B_EXCEPTION: {exc}\"":
              "        except Exception as exc:  # noqa: BLE001 - top-level canary boundary\n            blocker = f\"STAGE_B_EXCEPTION: {exc}\"",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path("app/calyx_orchestrator/paid_api_worker.py")
          s = p.read_text()
          s = s.replace(
              "            except Exception as exc:\n                last_error = str(exc)",
              "            except Exception as exc:  # noqa: BLE001 - provider SDK boundary\n                last_error = str(exc)",
          )
          s = s.replace(
              "            except Exception:\n                pass",
              "            except Exception as release_exc:  # noqa: BLE001 - cleanup boundary\n                suffix = f\"reservation_release_failed={release_exc}\"\n                last_error = f\"{last_error}; {suffix}\" if last_error else suffix",
          )
          p.write_text(s)
      - name: Verify Ruff clean
        run: ruff check app/calyx_orchestrator tests/test_calyx_agent_003.py
      - name: Commit lint repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/calyx_orchestrator
          if git diff --cached --quiet; then
            echo 'No lint changes required.'
          else
            git commit -m 'fix: satisfy orchestrator Ruff validation'
            git push origin HEAD:claude/orchid-worker-codex-adapter-u0rxqr
          fi

  canary:
    if: github.event_name == 'workflow_dispatch'
    name: "Paid API Stage ${{ inputs.stage || 'ab' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/orchid-worker-codex-adapter-u0rxqr
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || pip install -e . 2>/dev/null || true
          pip install anthropic openai pytest
      - name: Verify provider secrets present
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "FAIL: Neither provider key is set."
            exit 3
          fi
      - name: Run deterministic unit tests
        run: |
          python -m pytest tests/test_paid_api_worker.py -q --tb=short
          python -m pytest tests/test_codex_worker_adapter.py -q --tb=short
      - name: Run paid API canary
        run: |
          python -m app.calyx_orchestrator.paid_api_canary \
            --stage "${{ inputs.stage || 'ab' }}" \
            --issue "${{ inputs.issue_a || '1330' }}" \
            --issues "${{ inputs.issues_b || '1330,1402' }}" \
            --ceiling "${{ inputs.ceiling_usd || '50.00' }}"
