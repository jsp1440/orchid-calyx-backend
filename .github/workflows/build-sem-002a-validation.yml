name: BUILD-SEM-002A validation

on:
  pull_request:
    paths:
      - "app/concepts/**"
      - "app/main.py"
      - "migrations/102a_core_concept_registry.sql"
      - "scripts/build_sem_002a_migration_validation.py"
      - "scripts/build_sem_002a_postgres_validation.py"
      - "tests/test_build_sem_002a_core_concept_registry.py"
      - "docs/semantic/BUILD-SEM-002A-*.md"
      - ".github/workflows/build-sem-002a-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concepts_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concepts_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/concepts_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx ruff
      - run: python -m ruff check app/concepts tests/test_build_sem_002a_core_concept_registry.py scripts/build_sem_002a_migration_validation.py scripts/build_sem_002a_postgres_validation.py
      - run: python scripts/build_sem_002a_migration_validation.py
      - run: python scripts/build_sem_002a_postgres_validation.py
      - run: python -m pytest -q tests/test_build_sem_002a_core_concept_registry.py tests/test_build_077_ontology_registry.py
