name: MISSION-CONTROL-TELEMETRY-001A validation

on:
  pull_request:
    paths:
      - "app/executive_telemetry/**"
      - "app/main.py"
      - "tests/test_mission_control_telemetry_001a_executive_state.py"
      - ".github/workflows/mission-control-telemetry-001a-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      CALYX_REVIEW_ALLOW_MEMORY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest 'httpx<0.28'
      - name: Compile executive telemetry service
        run: python -m compileall app/executive_telemetry runtime/executive
      - name: Run telemetry 001A tests
        run: |
          set -o pipefail
          pytest -vv tests/test_mission_control_telemetry_001a_executive_state.py 2>&1 | tee /tmp/mission-control-telemetry-001a.log
      - name: Upload telemetry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-telemetry-001a-diagnostics
          path: /tmp/mission-control-telemetry-001a.log
      - name: Run Mission Control governance regressions
        run: |
          set -o pipefail
          pytest -vv tests/test_mission_control_role_001g_briefing.py tests/test_mission_control_role_001i_workforce_frontend.py tests/test_mission_control_role_001j_release_readiness.py 2>&1 | tee /tmp/mission-control-telemetry-001a-regression.log
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-telemetry-001a-regression-diagnostics
          path: /tmp/mission-control-telemetry-001a-regression.log
