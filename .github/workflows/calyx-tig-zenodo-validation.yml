name: CALYX TIG Zenodo Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/trait_genomics/**"
      - "tests/test_trait_genomics_*.py"
      - "docs/brain/CALYX-TIG-*.md"
      - "docs/brain/book/CALYX-BOOK-TRAIT-INTERACTION-GENOMICS*.md"
      - ".github/workflows/calyx-tig-zenodo-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: TIG archive focused tests
        run: |
          pytest -q \
            tests/test_trait_genomics_discovery.py \
            tests/test_trait_genomics_hardening.py \
            tests/test_trait_genomics_zenodo_archive.py \
            tests/test_trait_genomics_release_service.py \
            tests/test_trait_genomics_live_sources.py \
            tests/test_trait_genomics_molecular_evidence.py
      - name: Compile TIG subsystem
        run: python -m compileall -q app/trait_genomics tests/test_trait_genomics_*.py
      - name: Ruff TIG subsystem
        run: ruff check app/trait_genomics tests/test_trait_genomics_*.py
