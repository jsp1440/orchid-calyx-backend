name: BUILD-622 Diagnostic Hypothesis Validation

on:
  pull_request:
    paths:
      - 'app/brain/diagnostic_hypotheses.py'
      - 'app/brain/routes.py'
      - 'app/brain/plant_diagnostic_context.py'
      - 'app/brain/scoped_reasoning_map.py'
      - 'app/brain/reasoning_scope.py'
      - 'tests/test_build_622_diagnostic_hypotheses.py'
      - 'tests/test_build_621_plant_diagnostic_context.py'
      - 'tests/test_build_620_local_observation_bridge.py'
      - 'tests/test_build_619_reasoning_scope.py'
      - '.github/workflows/build-622-diagnostic-hypothesis-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-diagnostic-hypotheses:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff httpx
      - name: Compile
        run: >-
          python -m py_compile
          app/brain/diagnostic_hypotheses.py
          app/brain/routes.py
          tests/test_build_622_diagnostic_hypotheses.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/diagnostic_hypotheses.py
          app/brain/routes.py
          tests/test_build_622_diagnostic_hypotheses.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/diagnostic_hypotheses.py
          app/brain/routes.py
          tests/test_build_622_diagnostic_hypotheses.py
      - name: Hypothesis and prerequisite regressions
        run: >-
          python -m pytest -q
          tests/test_build_622_diagnostic_hypotheses.py
          tests/test_build_621_plant_diagnostic_context.py
          tests/test_build_620_local_observation_bridge.py
          tests/test_build_619_reasoning_scope.py
      - name: Verify hypothesis route
        run: >-
          python -c "from app.brain.routes import router; assert any(r.path == '/brain/diagnostic-hypotheses' for r in router.routes)"
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
