name: CALYX Matrix Workspace Output Validation

on:
  pull_request:
    paths:
      - 'app/calyx_conversation/workspace_outputs.py'
      - 'app/routers/matrix_identification.py'
      - 'tests/test_calyx_matrix_workspace_output_001.py'
      - 'tests/test_matrix_identification_mvp_001.py'
      - '.github/workflows/calyx-matrix-workspace-output-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile matrix workspace output layer
        run: python -m py_compile app/calyx_conversation/workspace_outputs.py app/routers/matrix_identification.py tests/test_calyx_matrix_workspace_output_001.py
      - name: Run matrix workspace and adjacent ranking regressions
        run: python -m pytest -q tests/test_calyx_matrix_workspace_output_001.py tests/test_matrix_identification_mvp_001.py
      - name: Lint matrix workspace output layer
        run: ruff check app/calyx_conversation/workspace_outputs.py app/routers/matrix_identification.py tests/test_calyx_matrix_workspace_output_001.py
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
