name: Calyx Live Phalaenopsis Scientific Trial

on:
  pull_request:
    paths:
      - ".github/workflows/calyx-live-phalaenopsis-trial.yml"

permissions:
  contents: read

jobs:
  live-scientific-trial:
    runs-on: ubuntu-latest
    environment: production
    env:
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-governed Calyx scientific trial
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          from http.cookiejar import CookieJar
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPCookieProcessor, Request, build_opener

          base = (os.getenv("CALYX_BACKEND_URL") or "https://orchid-calyx-backend.onrender.com").rstrip("/")
          access_code = os.getenv("CALYX_OWNER_ACCESS_CODE", "")
          if not access_code:
              raise SystemExit("CALYX_OWNER_ACCESS_CODE is unavailable")

          jar = CookieJar()
          opener = build_opener(HTTPCookieProcessor(jar))

          def request(path: str, *, method: str = "GET", payload: dict | None = None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              try:
                  with opener.open(req, timeout=60) as response:
                      raw = response.read().decode()
                      return response.status, json.loads(raw) if raw else {}
              except HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  try:
                      body = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      body = {"detail": raw[:1000]}
                  return exc.code, body

          status, session = request(
              "/api/mission-control/owner/session",
              method="POST",
              payload={"access_code": access_code},
          )
          assert status == 200 and session.get("authenticated") is True, (status, session)
          print("PASS owner session authenticated")

          status, verifier_health = request("/api/scientific-interpretation/synthesis/health")
          print("VERIFIER_HEALTH", status, json.dumps(verifier_health, sort_keys=True))
          if not (
              status == 200
              and verifier_health.get("check_calyx") is True
              and verifier_health.get("verification_version") == "CALYX-VERIFY-001"
          ):
              print("DEPLOYMENT_NOT_READY: current production does not yet expose CALYX-VERIFY-001")
              raise SystemExit(2)

          status, speak_status = request("/api/calyx/speak/status")
          assert status == 200, (status, speak_status)
          print("SPEAK_PROVIDER", json.dumps(speak_status.get("provider"), sort_keys=True))

          question = (
              "Which morphological, anatomical, physiological and life-history traits distinguish "
              "cool-growing Phalaenopsis species from warm-growing ones, and which of those traits "
              "remain predictive after accounting for elevation, precipitation, geography and "
              "phylogenetic relatedness?"
          )
          status, conversation = request(
              "/api/calyx/speak/conversations",
              method="POST",
              payload={
                  "title": "Live Calyx scientific trial — Phalaenopsis thermal traits",
                  "project_id": "calyx-live-phalaenopsis-thermal-traits-2026-08-21",
                  "context": {"trial": "CALYX-PHALAENOPSIS-LIVE-001"},
              },
          )
          assert status == 201, (status, conversation)
          conversation_id = conversation["conversation_id"]
          print("CONVERSATION_ID", conversation_id)

          status, result = request(
              f"/api/calyx/speak/conversations/{conversation_id}/turns",
              method="POST",
              payload={
                  "message": question,
                  "project_id": "calyx-live-phalaenopsis-thermal-traits-2026-08-21",
                  "context": {"trial": "CALYX-PHALAENOPSIS-LIVE-001"},
                  "research_mode": "auto",
                  "retrieval_limit": 20,
              },
          )
          assert status == 200, (status, result)

          print("QUESTION", question)
          print("CALYX_ANSWER_BEGIN")
          print(result.get("answer") or "")
          print("CALYX_ANSWER_END")

          research = result.get("research") or {}
          retrieval = research.get("retrieval") or {}
          mission = research.get("mission") or {}
          external = retrieval.get("external_literature") or {}
          summary = {
              "provider": result.get("provider"),
              "persistence_mode": result.get("persistence_mode"),
              "retrieval_status": retrieval.get("status"),
              "retrieval_eligible_results": retrieval.get("total_eligible_results"),
              "external_literature_status": external.get("status"),
              "external_literature_count": external.get("result_count"),
              "resolved_genera": (research.get("continuum") or {}).get("resolved_genera"),
              "mission_id": mission.get("mission_id"),
              "mission_state": mission.get("state"),
              "mission_review_status": mission.get("review_status"),
              "mission_confidence": mission.get("confidence"),
              "supporting_evidence_count": len(mission.get("supporting_evidence") or []),
              "contradicting_evidence_count": len(mission.get("contradicting_evidence") or []),
              "missing_evidence_count": len(mission.get("missing_evidence") or []),
              "synthesis_structure": result.get("synthesis_structure"),
              "citation_count": len(research.get("citations") or []),
          }
          print("TRIAL_SUMMARY", json.dumps(summary, indent=2, sort_keys=True, default=str))

          with open("live_trial_response.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True, default=str)
          PY
      - name: Upload private trial response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calyx-live-phalaenopsis-trial
          path: live_trial_response.json
          if-no-files-found: ignore
          retention-days: 3
