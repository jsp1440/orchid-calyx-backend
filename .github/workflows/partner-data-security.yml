name: Partner Data Security Validation

on:
  pull_request:
    paths:
      - ".github/workflows/partner-data-security.yml"
      - "app/data_governance/**"
      - "app/security.py"
      - "app/mission_control_access/**"
      - "api_occurrence_points.py"
      - "oc_orchid_atlas.py"
      - "migrations/111_partner_data_governance_registry.sql"
      - "tests/test_partner_data_*.py"
      - "tests/test_exact_occurrence_api_security.py"
      - "tests/test_security_fail_closed.py"
      - "docs/security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile security surface
        run: |
          python -m py_compile \
            app/data_governance/__init__.py \
            app/data_governance/access.py \
            app/data_governance/disclosure.py \
            app/data_governance/model_gate.py \
            app/data_governance/models.py \
            app/data_governance/output_guard.py \
            app/data_governance/policy.py \
            app/security.py \
            api_occurrence_points.py \
            oc_orchid_atlas.py \
            tests/test_partner_data_access_bridge.py \
            tests/test_partner_data_disclosure.py \
            tests/test_partner_data_exact_atlas_security.py \
            tests/test_partner_data_governance.py \
            tests/test_partner_data_governance_migration.py \
            tests/test_partner_data_model_output_guards.py \
            tests/test_exact_occurrence_api_security.py \
            tests/test_security_fail_closed.py
      - name: Ruff security surface
        run: |
          python -m ruff check \
            app/data_governance \
            app/security.py \
            api_occurrence_points.py \
            oc_orchid_atlas.py \
            tests/test_partner_data_access_bridge.py \
            tests/test_partner_data_disclosure.py \
            tests/test_partner_data_exact_atlas_security.py \
            tests/test_partner_data_governance.py \
            tests/test_partner_data_governance_migration.py \
            tests/test_partner_data_model_output_guards.py \
            tests/test_exact_occurrence_api_security.py \
            tests/test_security_fail_closed.py
      - name: Focused security regression tests
        run: |
          python -m pytest -q \
            tests/test_partner_data_access_bridge.py \
            tests/test_partner_data_disclosure.py \
            tests/test_partner_data_exact_atlas_security.py \
            tests/test_partner_data_governance.py \
            tests/test_partner_data_governance_migration.py \
            tests/test_partner_data_model_output_guards.py \
            tests/test_exact_occurrence_api_security.py \
            tests/test_security_fail_closed.py \
            tests/test_mission_control_role_001b_capabilities.py
      - name: Diff hygiene
        run: git diff --check
