name: CALYX Figure Assisted Gateway 445

on:
  pull_request:
    paths:
      - "runtime/figure_assisted_gateway.py"
      - "app/routers/figure_assisted_gateway.py"
      - "app/routers/live_mission_control.py"
      - "tests/test_calyx_figure_assisted_gateway_445.py"
      - "tests/test_calyx_figure_artifact_registry_445.py"
      - "docs/brain/CALYX-FIGURE-ASSISTED-GATEWAY-445.md"
      - ".github/workflows/calyx-figure-assisted-gateway-445.yml"
  workflow_dispatch:

jobs:
  figure-assisted-gateway:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile FigureLabs assisted surface
        run: >-
          python -m py_compile
          runtime/figure_assisted_gateway.py
          app/routers/figure_assisted_gateway.py
          app/routers/live_mission_control.py
          tests/test_calyx_figure_assisted_gateway_445.py
          tests/test_calyx_figure_artifact_registry_445.py
      - name: Deterministic assisted gateway tests
        run: >-
          python -m pytest -q
          tests/test_calyx_figure_assisted_gateway_445.py
          tests/test_calyx_figure_artifact_registry_445.py
          tests/test_calyx_artifact_registry.py
      - name: Permanent non-authority and credential assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('runtime/figure_assisted_gateway.py').read_text()
          required = (
              'ImmutableArtifactRegistry',
              '"provider_network_call_authorized": False',
              '"credential_storage_authorized": False',
              '"publication_authorized": False',
              '"production_graph_mutation_authorized": False',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing permanent non-authority/integration assertion(s): {missing}')
          forbidden = (
              'requests.post(', 'httpx.post(', 'selenium', 'playwright',
              'password=', 'cookie=', 'captcha', 'INSERT INTO oc_graph',
              'UPDATE oc_graph', 'DELETE FROM oc_graph',
          )
          present = [item for item in forbidden if item.casefold() in text.casefold()]
          if present:
              raise SystemExit(f'forbidden assisted-gateway surface present: {present}')
          PY
      - name: Changed-surface Ruff and diff hygiene
        run: |
          python -m ruff check runtime/figure_assisted_gateway.py app/routers/figure_assisted_gateway.py tests/test_calyx_figure_assisted_gateway_445.py tests/test_calyx_figure_artifact_registry_445.py
          git diff --check
