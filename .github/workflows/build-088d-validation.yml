name: BUILD-088D validation
on:
  pull_request:
    paths: ["app/knowledge_publication/**", "migrations/088d_publication_lifecycle_corrections_rollback.sql", "tests/test_build_088d_publication_lifecycle.py", "docs/BUILD-088D-PUBLICATION-LIFECYCLE-CORRECTIONS-ROLLBACK-IMPLEMENTATION.md", ".github/workflows/build-088d-validation.yml"]
  workflow_dispatch:
jobs:
  lifecycle-and-rollback:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: build088d, POSTGRES_PASSWORD: build088d_test_only, POSTGRES_DB: build088d_validation}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U build088d -d build088d_validation" --health-interval 5s --health-timeout 5s --health-retries 10
    env: {TEST_DATABASE_URL: postgresql://build088d:build088d_test_only@localhost:5432/build088d_validation}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: python -m ruff check app/knowledge_publication tests/test_build_088d_publication_lifecycle.py
      - run: python -m pytest -q tests/test_build_088d_publication_lifecycle.py
      - run: python -m pytest -q tests/test_build_088c_atomic_graph_publication.py tests/test_build_088b_publication_foundation.py tests/test_build_087b_scientific_interpretation.py tests/test_build_078_publication_gate.py
      - run: python -m compileall -q app runtime scripts tests
      - run: git diff --check
