name: Taxonomy Preflight CI

on:
  pull_request:
    paths:
      - "runtime/taxonomy_preflight.py"
      - "tests/test_taxonomy_preflight.py"
      - ".github/workflows/taxonomy-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator
        run: python -m py_compile runtime/taxonomy_preflight.py

      - name: Run focused unit tests
        run: python -m unittest tests.test_taxonomy_preflight -v
