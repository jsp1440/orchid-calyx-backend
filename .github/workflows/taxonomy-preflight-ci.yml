name: Taxonomy Preflight CI

on:
  pull_request:
    paths:
      - "runtime/taxonomy_preflight.py"
      - "runtime/taxonomy_preflight_governance.py"
      - "tests/test_taxonomy_preflight.py"
      - "tests/test_taxonomy_preflight_governance.py"
      - "config/taxonomy-preflight-policy.json"
      - "config/taxonomy-preflight-governance.json"
      - "docs/azure/taxonomy-preflight-runbook.md"
      - ".github/workflows/taxonomy-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validator and governance wrapper
        run: |
          python -m py_compile runtime/taxonomy_preflight.py
          python -m py_compile runtime/taxonomy_preflight_governance.py

      - name: Run focused unit tests
        run: python -m unittest tests.test_taxonomy_preflight tests.test_taxonomy_preflight_governance -v

      - name: Run governed CLI smoke validation
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          mkdir -p artifacts
          cat > artifacts/baseline.csv <<'CSV'
          taxon_id,scientific_name,status
          1,Cattleya labiata,accepted
          2,Dendrobium kingianum,accepted
          CSV
          cp artifacts/baseline.csv artifacts/candidate.csv
          cat > artifacts/ci-policy.json <<'JSON'
          {
            "minimum_rows": 2,
            "maximum_removed_ratio": 0.0,
            "maximum_changed_ratio": 0.0,
            "maximum_missing_identity_ratio": 0.0,
            "maximum_duplicate_key_ratio": 0.0,
            "finding_sample_limit": 25
          }
          JSON
          cat > artifacts/ci-governance.json <<'JSON'
          {
            "require_baseline": true,
            "allowed_input_shapes": ["headered"],
            "allowed_suffixes": [".csv"],
            "maximum_candidate_bytes": 1000000,
            "maximum_columns": 10,
            "maximum_overall_null_ratio": 0.5,
            "require_private_output_directory": false
          }
          JSON
          python -m runtime.taxonomy_preflight_governance run artifacts/candidate.csv \
            --baseline artifacts/baseline.csv \
            --validator-policy artifacts/ci-policy.json \
            --governance-policy artifacts/ci-governance.json \
            --output-dir artifacts/governed-bundle
          python -m runtime.taxonomy_preflight_governance verify artifacts/governed-bundle
          python - <<'PY'
          import json
          from pathlib import Path
          bundle = Path('artifacts/governed-bundle')
          report = json.loads((bundle / 'report.json').read_text())
          receipt = json.loads((bundle / 'receipt.json').read_text())
          assert report['status'] == 'PASS'
          assert report['generated_at'] == '1970-01-01T00:00:00+00:00'
          assert receipt['run_id'] == report['run_id']
          assert receipt['publication_authorized'] is False
          assert receipt['database_mutation_authorized'] is False
          PY

      - name: Upload governed smoke-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-preflight-governed-ci-evidence
          path: artifacts/governed-bundle/
          retention-days: 7
