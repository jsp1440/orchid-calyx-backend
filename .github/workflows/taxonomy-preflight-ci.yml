name: Taxonomy Preflight CI

on:
  pull_request:
    paths:
      - "runtime/taxonomy_preflight*.py"
      - "tests/test_taxonomy_preflight*.py"
      - "config/taxonomy-*.json"
      - "docs/azure/taxonomy-*.md"
      - "docs/brain/AZURE-001-*.json"
      - ".github/workflows/taxonomy-preflight-ci.yml"
  push:
    branches:
      - "feature/azure-001-*"
    paths:
      - "runtime/taxonomy_preflight*.py"
      - "tests/test_taxonomy_preflight*.py"
      - "config/taxonomy-*.json"
      - "docs/azure/taxonomy-*.md"
      - "docs/brain/AZURE-001-*.json"
      - ".github/workflows/taxonomy-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile governed taxonomy modules
        run: |
          python -m py_compile runtime/taxonomy_preflight.py
          python -m py_compile runtime/taxonomy_preflight_governance.py
          python -m py_compile runtime/taxonomy_preflight_release_gate.py
          python -m py_compile runtime/taxonomy_preflight_readiness.py
          python -m py_compile runtime/taxonomy_preflight_reproducibility.py
          python -m py_compile runtime/taxonomy_preflight_acceptance.py
          python -m py_compile runtime/taxonomy_preflight_attestations.py

      - name: Run focused unit tests
        run: |
          python -m unittest \
            tests.test_taxonomy_preflight \
            tests.test_taxonomy_preflight_governance \
            tests.test_taxonomy_preflight_release_gate \
            tests.test_taxonomy_preflight_readiness \
            tests.test_taxonomy_preflight_reproducibility \
            tests.test_taxonomy_preflight_acceptance \
            tests.test_taxonomy_preflight_attestations -v

      - name: Run governed release-gate smoke validation
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          mkdir -p artifacts
          chmod 700 artifacts
          cat > artifacts/baseline.csv <<'CSV'
          taxon_id,scientific_name,status
          1,Cattleya labiata,accepted
          2,Dendrobium kingianum,accepted
          CSV
          cp artifacts/baseline.csv artifacts/candidate.csv
          cat > artifacts/ci-policy.json <<'JSON'
          {
            "minimum_rows": 2,
            "maximum_removed_ratio": 0.0,
            "maximum_changed_ratio": 0.0,
            "maximum_missing_identity_ratio": 0.0,
            "maximum_duplicate_key_ratio": 0.0,
            "finding_sample_limit": 25
          }
          JSON
          cat > artifacts/ci-governance.json <<'JSON'
          {
            "require_baseline": true,
            "allowed_input_shapes": ["headered"],
            "allowed_suffixes": [".csv"],
            "maximum_candidate_bytes": 1000000,
            "maximum_columns": 10,
            "maximum_overall_null_ratio": 0.5,
            "require_private_output_directory": false
          }
          JSON
          cp config/taxonomy-release-gate-policy.json artifacts/ci-release.json
          python -m runtime.taxonomy_preflight_release_gate plan artifacts/candidate.csv \
            --baseline artifacts/baseline.csv \
            --validator-policy artifacts/ci-policy.json \
            --governance-policy artifacts/ci-governance.json \
            --release-policy artifacts/ci-release.json \
            --review-reference CI-REVIEW-459 \
            --output-dir artifacts/release-bundle > artifacts/release-plan.json
          test ! -e artifacts/release-bundle
          python -m runtime.taxonomy_preflight_release_gate run artifacts/candidate.csv \
            --baseline artifacts/baseline.csv \
            --validator-policy artifacts/ci-policy.json \
            --governance-policy artifacts/ci-governance.json \
            --release-policy artifacts/ci-release.json \
            --review-reference CI-REVIEW-459 \
            --output-dir artifacts/release-bundle
          python -m runtime.taxonomy_preflight_release_gate verify artifacts/release-bundle \
            --release-policy artifacts/ci-release.json
          python -m runtime.taxonomy_preflight_reproducibility artifacts/candidate.csv \
            --baseline artifacts/baseline.csv \
            --validator-policy artifacts/ci-policy.json \
            --governance-policy artifacts/ci-governance.json \
            --release-policy artifacts/ci-release.json \
            --review-reference CI-REVIEW-459 \
            --source-date-epoch 0 > artifacts/reproducibility.json
          python -m runtime.taxonomy_preflight_release_gate azure-spec \
            --image ghcr.io/fcos/taxonomy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > artifacts/azure-execution-spec.json
          cat > artifacts/gate-attestations.json <<JSON
          {
            "schema_version": "1.0.0",
            "attestations": [
              {
                "gate": "ci_validation",
                "status": "verified",
                "evidence_id": "github-actions-${GITHUB_RUN_ID}",
                "issuer": "GitHub Actions",
                "issued_at": "2026-08-06T20:00:00+00:00",
                "evidence_sha256": "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc",
                "scope": "AZURE-001 synthetic CI",
                "metadata": {
                  "repository": "${GITHUB_REPOSITORY}",
                  "commit_sha": "${GITHUB_SHA}",
                  "workflow_run_id": "${GITHUB_RUN_ID}"
                }
              }
            ]
          }
          JSON
          set +e
          python -m runtime.taxonomy_preflight_attestations artifacts/gate-attestations.json \
            --output artifacts/attestation-evaluation.json
          attestation_exit=$?
          python -m runtime.taxonomy_preflight_readiness artifacts/release-bundle \
            --attestations artifacts/gate-attestations.json \
            --output artifacts/readiness.json
          readiness_exit=$?
          python -m runtime.taxonomy_preflight_acceptance artifacts/release-bundle \
            --readiness artifacts/readiness.json \
            --reproducibility artifacts/reproducibility.json \
            --release-policy artifacts/ci-release.json \
            --output artifacts/acceptance.json
          acceptance_exit=$?
          set -e
          test "$attestation_exit" -eq 2
          test "$readiness_exit" -eq 2
          test "$acceptance_exit" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          bundle = Path('artifacts/release-bundle')
          report = json.loads((bundle / 'report.json').read_text())
          receipt = json.loads((bundle / 'receipt.json').read_text())
          complete = json.loads((bundle / 'COMPLETE.json').read_text())
          spec = json.loads(Path('artifacts/azure-execution-spec.json').read_text())
          attestations = json.loads(Path('artifacts/attestation-evaluation.json').read_text())
          readiness = json.loads(Path('artifacts/readiness.json').read_text())
          reproducibility = json.loads(Path('artifacts/reproducibility.json').read_text())
          acceptance = json.loads(Path('artifacts/acceptance.json').read_text())
          assert report['status'] == 'PASS'
          assert report['generated_at'] == '1970-01-01T00:00:00+00:00'
          assert receipt['review_reference'] == 'CI-REVIEW-459'
          assert receipt['publication_authorized'] is False
          assert receipt['database_mutation_authorized'] is False
          assert receipt['azure_resources_created'] is False
          assert complete['run_id'] == report['run_id']
          assert spec['provision'] is False
          assert spec['public_ingress'] is False
          assert attestations['valid'] is False
          assert attestations['gates']['ci_validation'] is True
          assert attestations['azure_provisioning_authorized'] is False
          assert readiness['decision'] == 'HOLD'
          assert readiness['evidence_mode'] == 'typed_attestations'
          assert len(readiness['evidence_digest']) == 64
          assert readiness['azure_provisioning_authorized'] is False
          assert reproducibility['reproducible'] is True
          assert reproducibility['publication_authorized'] is False
          assert acceptance['decision'] == 'REVIEW_ONLY'
          assert acceptance['release_bundle_verified'] is True
          assert acceptance['reproducibility_verified'] is True
          assert acceptance['azure_provisioning_authorized'] is False
          assert acceptance['taxonomy_publication_authorized'] is False
          assert acceptance['database_mutation_authorized'] is False
          assert acceptance['production_migration_authorized'] is False
          PY

      - name: Upload governed smoke-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: taxonomy-preflight-release-gate-ci-evidence
          path: |
            artifacts/release-plan.json
            artifacts/release-bundle/
            artifacts/azure-execution-spec.json
            artifacts/gate-attestations.json
            artifacts/attestation-evaluation.json
            artifacts/readiness.json
            artifacts/reproducibility.json
            artifacts/acceptance.json
          retention-days: 7
