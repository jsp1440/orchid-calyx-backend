name: BUILD-BRAIN-114N Git Mutation Authorization Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_mutation_authorization.py"
      - "tests/test_calyx_git_mutation_authorization.py"
      - "docs/brain/BUILD-BRAIN-114N-GIT-MUTATION-AUTHORIZATION.md"
      - ".github/workflows/build-brain-114n-git-mutation-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Compile authorization gate
        run: python -m compileall -q app/calyx_orchestrator/git_mutation_authorization.py tests/test_calyx_git_mutation_authorization.py
      - name: Ruff authorization gate
        run: ruff check app/calyx_orchestrator/git_mutation_authorization.py tests/test_calyx_git_mutation_authorization.py
      - name: Focused authorization regressions
        run: PYTHONPATH=. pytest -q tests/test_calyx_git_mutation_authorization.py
      - name: Static non-mutation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app/calyx_orchestrator/git_mutation_authorization.py').read_text()
          forbidden = ('subprocess', 'urllib', 'requests.', 'git push', 'merge_pull_request(')
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f'forbidden mutation/network surface found: {found}')
          PY
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
