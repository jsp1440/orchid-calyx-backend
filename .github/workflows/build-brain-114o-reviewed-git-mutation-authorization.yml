name: BUILD-BRAIN-114O Reviewed Git Mutation Authorization Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_mutation_authorization.py"
      - "app/calyx_orchestrator/proposal_authorization.py"
      - "tests/test_calyx_git_mutation_authorization_114o.py"
      - "docs/brain/BUILD-BRAIN-114O-REVIEWED-GIT-MUTATION-AUTHORIZATION.md"
      - ".github/workflows/build-brain-114o-reviewed-git-mutation-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile reviewed authorization surface
        run: |
          python -m compileall -q app/calyx_orchestrator/git_mutation_authorization.py app/calyx_orchestrator/proposal_authorization.py tests/test_calyx_git_mutation_authorization_114o.py
      - name: Ruff reviewed authorization surface
        run: |
          ruff check app/calyx_orchestrator/git_mutation_authorization.py app/calyx_orchestrator/proposal_authorization.py tests/test_calyx_git_mutation_authorization_114o.py
          ruff format --check app/calyx_orchestrator/git_mutation_authorization.py app/calyx_orchestrator/proposal_authorization.py tests/test_calyx_git_mutation_authorization_114o.py
      - name: Focused reviewed authorization regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_proposal_authorization.py tests/test_calyx_git_mutation_authorization_114o.py
      - name: Static non-mutation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/git_mutation_authorization.py").read_text(encoding="utf-8")
          for marker in (
              "subprocess",
              "git push",
              "git commit",
              "merge_pull_request(",
              "create_pull_request(",
              "requests.post",
              "urllib.request",
          ):
              assert marker not in source, marker
          assert 'REQUIRED_REVIEW_CLASSES = ("operational", "security")' in source
          assert "GIT_AUTHORIZATION_REVIEWER_SEPARATION_REQUIRED" in source
          assert '"merge_authorized": False' in source
          assert '"deployment_authorized": False' in source
          assert '"publication_authorized": False' in source
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
