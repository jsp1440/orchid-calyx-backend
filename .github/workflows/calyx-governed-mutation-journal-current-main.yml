name: CALYX Governed Mutation Journal Current-Main Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/git_proposal_mutation_executor.py"
      - "app/calyx_orchestrator/git_proposal_mutation_journal.py"
      - "tests/test_calyx_git_proposal_mutation_executor_114s.py"
      - "tests/test_calyx_git_proposal_mutation_journal_114t.py"
      - "docs/brain/CALYX-GOVERNED-MUTATION-JOURNAL-CURRENT-MAIN.md"
      - ".github/workflows/calyx-governed-mutation-journal-current-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m compileall -q \
            app/calyx_orchestrator/git_proposal_mutation_executor.py \
            app/calyx_orchestrator/git_proposal_mutation_journal.py \
            tests/test_calyx_git_proposal_mutation_executor_114s.py \
            tests/test_calyx_git_proposal_mutation_journal_114t.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/git_proposal_mutation_executor.py \
            app/calyx_orchestrator/git_proposal_mutation_journal.py \
            tests/test_calyx_git_proposal_mutation_executor_114s.py \
            tests/test_calyx_git_proposal_mutation_journal_114t.py
          ruff format --check \
            app/calyx_orchestrator/git_proposal_mutation_executor.py \
            app/calyx_orchestrator/git_proposal_mutation_journal.py \
            tests/test_calyx_git_proposal_mutation_executor_114s.py \
            tests/test_calyx_git_proposal_mutation_journal_114t.py
      - name: Focused executor and journal regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_calyx_git_proposal_execution_plan_114r.py \
            tests/test_calyx_git_proposal_mutation_executor_114s.py \
            tests/test_calyx_git_proposal_mutation_journal_114t.py
      - name: Recovery and authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          executor = Path("app/calyx_orchestrator/git_proposal_mutation_executor.py").read_text(encoding="utf-8")
          journal = Path("app/calyx_orchestrator/git_proposal_mutation_journal.py").read_text(encoding="utf-8")
          joined = executor + "\n" + journal

          for required in (
              "journal.latest(plan_digest=plan.plan_digest)",
              "next_event_index",
              "GIT_PROPOSAL_EXECUTOR_RESUME_IDENTITY_MISMATCH",
              "base_ref != plan.base_ref",
              "resumable_partial",
              "FINAL_STATUSES",
              "receipt_digest",
              "patch_program_job_id",
          ):
              assert required in joined, required

          for forbidden in (
              "merge_pull_request",
              "enable_auto_merge",
              "GITHUB_TOKEN",
              "subprocess",
              "requests.",
              "deployment_client",
              "publish_scientific",
          ):
              assert forbidden not in joined, forbidden
          PY
      - name: No production schema activation
        run: |
          test ! -e migrations/20260811_calyx_git_proposal_mutation_journal.sql
          test ! -e alembic/versions/20260811_calyx_git_proposal_mutation_journal.py
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref || github.event.repository.default_branch }}...HEAD"
