name: Agent Coordination Validation
on:
  pull_request:
    paths:
      - 'coordination/**'
      - 'tests/coordination/**'
      - '.github/workflows/agent-coordination-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acs-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acs_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: acs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acs_test -d acs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACS_TEST_POSTGRES_URL: postgresql://acs_test:local_ci_only@127.0.0.1:5432/acs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 ruff==0.16.8 'psycopg[binary]==3.3.6'
      - run: python -m ruff check coordination tests/coordination
      - run: python -m ruff format --check coordination tests/coordination
      - run: python -m compileall -q coordination tests/coordination
      - run: python -B -m unittest discover -s tests/coordination -v
