name: CALYX-RUNTIME-001I Audited GitHub Dispatcher

on:
  pull_request:
    paths:
      - "runtime/github_connector_dispatcher.py"
      - "tests/test_calyx_runtime_001i_github_connector_dispatcher.py"
      - ".github/workflows/calyx-runtime-001i.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff
      - run: python -m ruff check runtime/github_connector_dispatcher.py tests/test_calyx_runtime_001i_github_connector_dispatcher.py
      - run: python -m ruff format --check runtime/github_connector_dispatcher.py tests/test_calyx_runtime_001i_github_connector_dispatcher.py
      - run: python -m pytest -q tests/test_calyx_runtime_001i_github_connector_dispatcher.py
      - run: python -m compileall -q runtime/github_connector_dispatcher.py
      - run: git diff --check
