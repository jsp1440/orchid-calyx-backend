name: Orchid Completion Lane

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      wave:
        required: false
        default: "1"
        type: string
      max_waves:
        required: false
        default: "1"
        type: string
      lease_comment_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      issue_number:
        description: Orchid Continuum issue number to execute
        required: true
        type: string

# Global paid-execution concurrency — enforces PAID_WORKER_CONCURRENCY=1 across
# all provider workflows.  Per-issue duplicate-execution protection is provided
# by the scheduler lease check (oc-running label) inside the execute job.
# cancel-in-progress: false queues rather than kills a running execution.
concurrency:
  group: swarm-paid-execution-${{ github.repository }}
  cancel-in-progress: false

# Three jobs, split by what each may touch (#1973 review):
#   execute -- trusted admission. Lease, issue, packet, route, owner
#              authorization, governor; settles every denial. Runs only
#              repository code from a fresh checkout of the integration ref.
#   model   -- the paid model run. Holds NO write credential (contents and
#              issues read). Model-driven code runs as a separate unprivileged
#              account that cannot sudo, cannot reach the runner's files or
#              processes, and gets no token at all. Its only output is a patch,
#              a manifest and the execution record, as an artifact.
#   publish -- trusted publication. A fresh checkout of the same revision the
#              admission ran; never checks out, imports or executes the model's
#              tree. Verifies the patch against the admitted path scope,
#              applies it in a side worktree, pushes, opens the draft PR,
#              records cost and settles.
permissions:
  contents: read

jobs:
  execute:
    # Job-level gating is intentional: when NO_API_MODE is active or absent,
    # GitHub never initializes this provider-capable job or downloads its actions.
    if: vars.NO_API_MODE == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      LEASE_COMMENT_ID: ${{ inputs.lease_comment_id }}
      GH_TOKEN: ${{ github.token }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    outputs:
      paid: ${{ steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false' && steps.governor.outputs.authorized == 'true' }}
      trusted_sha: ${{ steps.trusted.outputs.sha }}
      title: ${{ steps.issue.outputs.title }}
      labels: ${{ steps.issue.outputs.labels }}
      tier: ${{ steps.route.outputs.tier }}
      model: ${{ steps.route.outputs.model }}
      max_turns: ${{ steps.route.outputs.max_turns }}
      route_reason: ${{ steps.route.outputs.reason }}
      estimated_cost_usd: ${{ steps.route.outputs.estimated_cost_usd }}
      packet_fingerprint: ${{ steps.packet.outputs.fingerprint }}
      packet_estimated_tokens: ${{ steps.packet.outputs.estimated_prompt_tokens }}
      packet_execution_class: ${{ steps.packet.outputs.execution_class }}
      allowed_paths: ${{ steps.issue_auth.outputs.allowed_paths }}
    steps:
      - name: Checkout autonomous integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      # The model and publish jobs use exactly this revision.
      - name: Record the trusted revision
        id: trusted
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify scheduler lease
        id: lease
        shell: bash
        env:
          LEASE_COMMENT_ID: ${{ inputs.lease_comment_id }}
        run: |
          set -euo pipefail
          # Missing/manual handoffs fail closed; labels never grant ownership.
          if [[ "$LEASE_COMMENT_ID" =~ ^[1-9][0-9]*$ ]] && \
            python3 -m scripts.oc_swarm_settlement --verify-only \
              --min-remaining-seconds 4500 \
              --issue-number "$ISSUE_NUMBER" --comment-id "$LEASE_COMMENT_ID" \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT"; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load issue context and publish worker receipt
        if: steps.lease.outputs.execute == 'true'
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(" ")')
          {
            echo 'title<<EOF'
            echo "$title"
            echo EOF
            echo 'body<<EOF'
            echo "$body"
            echo EOF
            echo "labels=$labels"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare compact work packet
        if: steps.lease.outputs.execute == 'true'
        id: packet
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/swarm_prepare_work_packet.py \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --labels "$ISSUE_LABELS" \
            --packet-file "$RUNNER_TEMP/swarm-work-packet.md" \
            --github-output "$GITHUB_OUTPUT"
          echo "Work packet fingerprint=${{ steps.packet.outputs.fingerprint }} class=${{ steps.packet.outputs.execution_class }} estimated_prompt_tokens=${{ steps.packet.outputs.estimated_prompt_tokens }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deterministic preflight
        if: steps.lease.outputs.execute == 'true'
        id: deterministic
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/swarm_deterministic_preflight.py \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --labels "$ISSUE_LABELS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Select bounded Claude route
        if: steps.lease.outputs.execute == 'true'
        id: route
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.packet.outputs.routing_text }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}
          # Highest tier a route may reach, repair escalation included. Unset
          # keeps the router default (deep); "cheap" pins a bounded window to
          # the smallest model even on a repair attempt.
          OC_CLAUDE_MAXIMUM_TIER: ${{ vars.OC_CLAUDE_MAXIMUM_TIER || 'deep' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/oc_model_router.py \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --labels "$ISSUE_LABELS" \
            --github-output "$GITHUB_OUTPUT"
          route_telemetry="tier=$(grep '^tier=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-); model=$(grep '^model=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-); reason=$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Completion worker started from ${GITHUB_EVENT_NAME}; economy-policy=one-provider-per-run; primary=Claude; route=${route_telemetry}; packet=${{ steps.packet.outputs.fingerprint }}. Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null

      - name: NO-API mode guard
        if: steps.lease.outputs.execute == 'true'
        id: no_api
        env:
          NO_API_MODE: ${{ vars.NO_API_MODE }}
        run: python3 scripts/oc_no_api_guard.py

      - name: Load durable governor spend snapshot
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false'
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/swarm_governor_github_ledger.py \
            --ledger-issue 1330 \
            --github-output "$GITHUB_OUTPUT"

      # Budgets say whether paid execution may run; this says on which work.
      # Only an issue with a valid owner OC-HOSTED-FACTORY-AUTHORIZATION-V1
      # record reaches a provider (#1823: ten unauthorized issues were paid for
      # after a budget change re-queued them). A refusal skips the governor and
      # parks the issue as governor:OWNER_ISSUE_AUTHORIZATION_REQUIRED, which
      # blocked reconciliation holds as owner-gated. An engine-discovered issue
      # admitted under the owner's discovery grant on #1924 is also held to the
      # grant's per-issue reservation ceiling and daily cap; its receipt goes
      # to ledger #1330 before the governor runs.
      - name: Owner issue authorization for paid execution
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false'
        id: issue_auth
        # A crashed check must still reach the denial settlement below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/oc_paid_issue_admission.py \
            --repository "$GITHUB_REPOSITORY" --issue-number "$ISSUE_NUMBER" \
            --reserved-usd "${{ steps.route.outputs.estimated_cost_usd }}" \
            --packet-file "$RUNNER_TEMP/swarm-work-packet.md"

      - name: Swarm governor precheck — primary provider
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false' && steps.issue_auth.outputs.authorized == 'true'
        id: governor
        env:
          NO_API_MODE: ${{ vars.NO_API_MODE }}
          OC_GOVERNOR_EMERGENCY_KILL_SWITCH: ${{ vars.OC_GOVERNOR_EMERGENCY_KILL_SWITCH }}
          OC_GOVERNOR_PAID_EXECUTION_ENABLED: ${{ vars.OC_GOVERNOR_PAID_EXECUTION_ENABLED }}
          OC_GOVERNOR_PROVIDER: anthropic
          OC_GOVERNOR_PROVIDER_ALLOWLIST: ${{ vars.OC_GOVERNOR_PROVIDER_ALLOWLIST }}
          OC_GOVERNOR_RETRY_COUNT: ${{ contains(steps.issue.outputs.labels, 'oc-repair') && '1' || '0' }}
          OC_GOVERNOR_MAX_RETRIES: ${{ vars.OC_GOVERNOR_MAX_RETRIES }}
          OC_GOVERNOR_PER_RUN_ESTIMATED_COST_USD: ${{ steps.route.outputs.estimated_cost_usd }}
          OC_GOVERNOR_PER_RUN_BUDGET_USD: ${{ vars.OC_GOVERNOR_PER_RUN_BUDGET_USD }}
          OC_GOVERNOR_DAILY_BUDGET_USD: ${{ vars.OC_GOVERNOR_DAILY_BUDGET_USD }}
          OC_GOVERNOR_MONTHLY_BUDGET_USD: ${{ vars.OC_GOVERNOR_MONTHLY_BUDGET_USD }}
          OC_GOVERNOR_DAILY_SPEND_USD: ${{ steps.ledger.outputs.daily_spend_usd }}
          OC_GOVERNOR_MONTHLY_SPEND_USD: ${{ steps.ledger.outputs.monthly_spend_usd }}
        run: python3 scripts/swarm_governor_precheck.py

      # A denial releases the lease either way. What it does with the work now
      # depends on whether anything can run without a provider: deterministic
      # work goes back to the queue for the lane that cannot spend, and
      # everything else parks with its durable blocker. Paid eligibility is
      # never restored by this step.
      # A discovery daily cap, reservation ceiling or unreadable authority is
      # not an owner decision; the issue goes back to the queue unpaid rather
      # than parking behind governor:OWNER_ISSUE_AUTHORIZATION_REQUIRED.
      - name: Return deferred discovery admission to the queue
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false' && steps.issue_auth.outputs.authorized != 'true' && steps.issue_auth.outputs.requeue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFERRED_REASON: ${{ steps.issue_auth.outputs.reason }}
        run: |
          set -euo pipefail
          python3 -m scripts.oc_swarm_settlement --disposition queued \
            --message "Discovery admission deferred (${DEFERRED_REASON}); no provider executed." \
            --issue-number "$ISSUE_NUMBER" --comment-id "$LEASE_COMMENT_ID" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Settle denied provider work without restoring paid eligibility
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false' && steps.governor.outputs.authorized != 'true' && steps.issue_auth.outputs.requeue != 'true'
        shell: bash
        env:
          LEASE_COMMENT_ID: ${{ inputs.lease_comment_id }}
          DENIAL_REASON: ${{ steps.issue_auth.outputs.authorized != 'true' && (steps.issue_auth.outputs.reason || 'OWNER_ISSUE_AUTHORIZATION_REQUIRED') || steps.governor.outputs.reason || 'GOVERNOR_ADMISSION_UNCONFIRMED' }}
          BLOCKER_FINGERPRINT: ${{ steps.governor.outputs.blocker_fingerprint }}
        run: |
          set -euo pipefail
          # A verified Swarm claim is required for unattended state mutation.
          # Legacy manual dispatches without a durable claim fail closed here.
          [[ -n "$LEASE_COMMENT_ID" ]]
          python3 -m scripts.oc_swarm_claim \
            --verify-issue "$ISSUE_NUMBER" --lease-comment-id "$LEASE_COMMENT_ID" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --park-denied "$DENIAL_REASON" \
            --blocker-fingerprint "$BLOCKER_FINGERPRINT" \
            --denied-provider anthropic

      - name: Hand the admitted work packet to the model job
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'false' && steps.governor.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oc-packet-${{ inputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swarm-work-packet.md
          if-no-files-found: error
          retention-days: 3

      - name: Return issue to queue when NO-API mode blocks all providers
        if: steps.lease.outputs.execute == 'true' && steps.no_api.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.oc_swarm_settlement --disposition queued \
            --message "NO-API mode active; no provider executed." \
            --issue-number "$ISSUE_NUMBER" --comment-id "$LEASE_COMMENT_ID" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

  model:
    needs: execute
    # The only job that runs the model. Its token can read contents and issues
    # and nothing else, and no step that runs model-driven code receives even
    # that: the executor runs as the unprivileged account created below.
    if: vars.NO_API_MODE == 'false' && needs.execute.outputs.paid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      issues: read
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      LEASE_COMMENT_ID: ${{ inputs.lease_comment_id }}
      INTEGRATION_BRANCH: oc-autonomous-integration
      MODEL_USER: oc-model
      MODEL_HOME: /home/oc-model
    outputs:
      claude_outcome: ${{ steps.claude.outcome }}
      claude_conclusion: ${{ steps.claude.outputs.conclusion }}
    steps:
      - name: Checkout the admitted trusted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.execute.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache: a cache saved from this job would be written by a
      # runner that has executed model-authored code.
      - name: Prepare worker validation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker validation dependencies
        run: |
          python3 -m pip install -r requirements.txt
          # Pinned so a local lint result means what CI will say (#1501).
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest --version
          python3 -m ruff --version

      - name: Fetch the admitted work packet
        uses: actions/download-artifact@v4
        with:
          name: oc-packet-${{ inputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packet

      # Trusted code, before any model-driven code exists on this runner. The
      # read-only token is scoped to this step.
      - name: Verify lease time before paid execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.oc_swarm_settlement --verify-only \
            --min-remaining-seconds 4500 \
            --issue-number "$ISSUE_NUMBER" --comment-id "$LEASE_COMMENT_ID" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      # Model-written tests execute arbitrary code. They run as an account
      # that is not the runner user: it cannot sudo, is in no privileged group
      # (docker, sudo, adm), cannot read the runner's home (checkout, actions,
      # runner files) and cannot read or trace runner processes.
      - name: Isolate model-driven execution in an unprivileged account
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --create-home --home-dir "$MODEL_HOME" --shell /usr/sbin/nologin "$MODEL_USER"
          sudo mkdir -p "$MODEL_HOME/repo" "$MODEL_HOME/out"
          sudo cp -a "$GITHUB_WORKSPACE/." "$MODEL_HOME/repo/"
          sudo cp "$RUNNER_TEMP/packet/swarm-work-packet.md" "$MODEL_HOME/packet.md"
          sudo chown -R "$MODEL_USER:$MODEL_USER" "$MODEL_HOME"
          sudo chmod 0700 "$MODEL_HOME" "$HOME"
          groups=" $(id -nG "$MODEL_USER") "
          for privileged in docker sudo adm admin lxd wheel; do
            [[ "$groups" != *" $privileged "* ]] || { echo "model account in $privileged" >&2; exit 1; }
          done
          if sudo -u "$MODEL_USER" sudo -n true 2>/dev/null; then
            echo "model account can escalate" >&2; exit 1
          fi
          if sudo -u "$MODEL_USER" test -r "$GITHUB_WORKSPACE/.git/config"; then
            echo "model account can read the runner workspace" >&2; exit 1
          fi

      - name: Execute issue with governed direct Anthropic API
        id: claude
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ needs.execute.outputs.title }}
          CLAUDE_MODEL: ${{ needs.execute.outputs.model }}
          CLAUDE_MAX_TURNS: ${{ needs.execute.outputs.max_turns }}
        shell: bash
        run: |
          set -uo pipefail
          # Never merge to `main`, deploy production, mutate production DB/KG/scientific state,
          # activate taxonomy, publish science, create/disclose credentials, or bypass governor controls.
          # Preserve taxonomy, provenance, uncertainty, sensitive-locality protections, unavailable-vs-zero
          # semantics and scientific review boundaries. Never invent science.
          # The executor gets the provider key and nothing else; `-I` keeps the
          # model's tree off its import path, and it makes itself non-dumpable
          # so no model-driven process can read the key from it. It writes a
          # patch; it cannot push, comment or open a pull request.
          python_bin=$(command -v python3)
          cd /
          set +e
          sudo -n -H -u "$MODEL_USER" --preserve-env=ANTHROPIC_API_KEY,GITHUB_RUN_ID \
            "$python_bin" -I "$MODEL_HOME/repo/scripts/swarm_anthropic_direct.py" \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --packet-file "$MODEL_HOME/packet.md" \
            --model "$CLAUDE_MODEL" \
            --max-turns "$CLAUDE_MAX_TURNS" \
            --base "$INTEGRATION_BRANCH" \
            --execution-file "$MODEL_HOME/out/execution.json" \
            --emit-patch-dir "$MODEL_HOME/out" \
            > "$RUNNER_TEMP/worker-stdout.log"
          status=$?
          set -e
          cat "$RUNNER_TEMP/worker-stdout.log"
          if [[ "$status" -eq 0 ]]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Collect model output for the trusted publisher
        if: always() && steps.claude.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          # Nothing the model started outlives the run.
          sudo pkill -KILL -u "$MODEL_USER" || true
          python3 -I scripts/oc_patch_publish.py collect \
            --stdout-log "$RUNNER_TEMP/worker-stdout.log" \
            --source "$MODEL_HOME/out" \
            --destination "$RUNNER_TEMP/model-output"

      - name: Hand the model output to the trusted publisher
        if: always() && steps.claude.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: oc-model-output-${{ inputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-output
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [execute, model]
    # Runs whenever the model job was admitted, including when it failed, so
    # cost is recorded and the lease always settles.
    if: always() && vars.NO_API_MODE == 'false' && needs.execute.outputs.paid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      LEASE_COMMENT_ID: ${{ inputs.lease_comment_id }}
      GH_TOKEN: ${{ github.token }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      # A fresh runner and a fresh checkout of the revision admission ran.
      # The model's tree never reaches this job; only its patch, as data.
      - name: Checkout the admitted trusted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.execute.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Git remote operations authenticate through gh, which reads GH_TOKEN
      # from the calling process's environment at use time.
      - name: Authenticate git remote operations through GH_TOKEN
        run: gh auth setup-git

      - name: Receive the model output
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: oc-model-output-${{ inputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-output

      - name: Classify Claude terminal state
        if: always()
        id: claude_provider
        env:
          # Outcome and conclusion come from the model job; the execution
          # record is the integrity-checked copy from its artifact. All of it
          # is data to classify, never code to run.
          CLAUDE_OUTCOME: ${{ needs.model.outputs.claude_outcome }}
          CLAUDE_CONCLUSION: ${{ needs.model.outputs.claude_conclusion }}
          CLAUDE_EXECUTION_FILE: ${{ runner.temp }}/model-output/execution.json
        shell: bash
        run: |
          set -euo pipefail
          execution_log="${CLAUDE_EXECUTION_FILE:-}"
          terminal_reason=""
          result_text=""
          error_type=""
          result_error=""
          api_error_status=""
          subtype=""
          is_error="false"
          num_turns=""
          model_usage_count="0"
          execution_file_present=false
          if [[ -n "$execution_log" && -f "$execution_log" ]]; then
            execution_file_present=true
            terminal_reason=$(jq -r '[.. | objects | select(.type == "result")] | last | .terminal_reason // ""' "$execution_log" 2>/dev/null || true)
            result_text=$(jq -r '[.. | objects | select(.type == "result")] | last | .result // ""' "$execution_log" 2>/dev/null || true)
            error_type=$(jq -r '[.. | objects | select(.type == "assistant" and .is_api_error_message == true)] | last | .error // ""' "$execution_log" 2>/dev/null || true)
            result_error=$(jq -r '[.. | objects | select(.type == "result")] | last | .error // ""' "$execution_log" 2>/dev/null || true)
            api_error_status=$(jq -r '[.. | objects | select(.type == "result")] | last | .api_error_status // ""' "$execution_log" 2>/dev/null || true)
            subtype=$(jq -r '[.. | objects | select(.type == "result")] | last | .subtype // ""' "$execution_log" 2>/dev/null || true)
            is_error=$(jq -r '[.. | objects | select(.type == "result")] | last | .is_error // false' "$execution_log" 2>/dev/null || true)
            num_turns=$(jq -r '[.. | objects | select(.type == "result")] | last | .num_turns // ""' "$execution_log" 2>/dev/null || true)
            model_usage_count=$(jq -r '[.. | objects | select(.type == "result")] | last | (.modelUsage // {}) | length' "$execution_log" 2>/dev/null || true)
          fi
          normalized=$(printf '%s %s %s %s %s %s' "$terminal_reason" "$result_text" "$error_type" "$result_error" "$api_error_status" "$subtype" | tr '[:upper:]' '[:lower:]')
          kind=healthy
          fallback=false

          # claude-code-action may return a successful GitHub step when it
          # intentionally skips execution (for example workflow-auth validation).
          # A successful wrapper step is therefore not proof that a model ran.
          if [[ "$execution_file_present" != "true" ]]; then
            kind=no_execution
          elif [[ "$result_error" == "billing_error" || "$normalized" == *"credit balance"* || "$normalized" == *"insufficient credit"* || "$normalized" == *"reached your specified api usage limits"* || "$normalized" == *"api usage limit"* ]]; then
            kind=billing_exhausted
          elif [[ "$api_error_status" == "401" || "$api_error_status" == "403" || "$normalized" == *"invalid api key"* || "$normalized" == *"invalid_api_key"* ]]; then
            kind=security
          elif [[ "$normalized" == *"error_max_turns"* || "$normalized" == *"max_turns"* || "$normalized" == *"max turns"* || "$normalized" == *"maximum turns"* ]]; then
            kind=max_turns
          elif [[ "$api_error_status" =~ ^5[0-9][0-9]$ ]]; then
            kind=safe_provider
            fallback=true
          elif [[ "$result_error" == "no_durable_change" ]]; then
            kind=no_durable_change
          elif [[ "$CLAUDE_CONCLUSION" == "failure" && "$model_usage_count" != "0" ]]; then
            kind=provider_failure
          elif [[ "$num_turns" == "" || ! "$num_turns" =~ ^[0-9]+$ || "$num_turns" -lt 1 || "$model_usage_count" == "0" ]]; then
            kind=no_model_usage
          elif [[ "$CLAUDE_OUTCOME" != "success" ]]; then
            if [[ "$normalized" == *"workflow validation failed"* || "$normalized" == *"action skipped"* ]]; then
              kind=workflow_validation_skip
            elif [[ "$normalized" == *"error_max_turns"* || "$normalized" == *"max_turns"* || "$normalized" == *"max turns"* || "$normalized" == *"maximum turns"* ]]; then
              kind=max_turns
            elif [[ "$normalized" == *"authentication"* || "$normalized" == *"unauthorized"* || "$normalized" == *"forbidden"* || "$normalized" == *"permission"* || "$normalized" == *"invalid api key"* || "$normalized" == *"invalid_api_key"* ]]; then
              kind=security
            elif [[ "$normalized" == *"billing_error"* || "$normalized" == *"credit balance"* || "$normalized" == *"insufficient credit"* ]]; then
              kind=billing_exhausted
            elif [[ "$normalized" == *"rate_limit"* || "$normalized" == *"rate limit"* || "$normalized" == *"overloaded"* || "$normalized" == *"service unavailable"* || "$normalized" == *"connection_error"* || "$normalized" == *"timeout"* ]]; then
              kind=safe_provider
              fallback=true
            elif [[ "$is_error" == "true" && "$subtype" == "success" && "$num_turns" =~ ^[0-9]+$ && "$num_turns" -le 1 && "$model_usage_count" == "0" ]]; then
              # Claude Code can surface an opaque provider-side failure as
              # subtype=success + is_error=true with no model usage. That is the
              # observed degraded-runtime signature: no repository work ran and
              # there is no security/permission evidence to fail closed on.
              kind=safe_provider
              fallback=true
            else
              kind=unknown
            fi
          fi
          {
            echo "kind=$kind"
            echo "fallback_allowed=$fallback"
            echo "terminal_reason=${terminal_reason:-unknown}"
            echo "error_type=${error_type:-unknown}"
            echo "result_error=${result_error:-unknown}"
            echo "api_error_status=${api_error_status:-unknown}"
            echo "is_error=${is_error:-unknown}"
            echo "num_turns=${num_turns:-unknown}"
            echo "model_usage_count=${model_usage_count:-unknown}"
          } >> "$GITHUB_OUTPUT"
          echo "Claude classification: kind=$kind fallback_allowed=$fallback"

      - name: Publish the verified patch
        id: publish
        if: always()
        env:
          ISSUE_TITLE: ${{ needs.execute.outputs.title }}
          ALLOWED_PATHS: ${{ needs.execute.outputs.allowed_paths }}
        run: |
          set -euo pipefail
          python3 scripts/oc_patch_publish.py \
            --repository "$GITHUB_REPOSITORY" --issue-number "$ISSUE_NUMBER" \
            --run-id "$GITHUB_RUN_ID" --title "$ISSUE_TITLE" \
            --base "$INTEGRATION_BRANCH" \
            --artifact-dir "$RUNNER_TEMP/model-output" \
            --worktree "$RUNNER_TEMP/publish-worktree" \
            --allowed-paths-json "$ALLOWED_PATHS"

      # Economy policy v1: one paid provider per workflow run. The Gemini and
      # OpenAI fallbacks were disabled here and are removed by the job split:
      # each pushed and opened pull requests from the job that ran the model,
      # which the split forbids. Re-adding one means running it in the model
      # job and handing a patch to the publisher, like the primary route.
      - name: Record provider cost reservation and actual cost
        # The model job's runner can be lost mid-call, leaving no outputs; the
        # reservation is then still recorded. Only a provably skipped call is not.
        if: always() && needs.model.result != 'skipped' && needs.model.outputs.claude_outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The executor prices its own token usage; without it the ledger
          # records actual_usd=unknown and the budget counts the reservation.
          # The execution record reaches this job only through the collector,
          # which keeps it only if its bytes match the executor's own digest.
          actual=$(jq -r '.total_cost_usd // empty' "$RUNNER_TEMP/model-output/execution.json" 2>/dev/null || true)
          python3 scripts/swarm_governor_github_ledger.py \
            --append \
            --ledger-issue 1330 \
            --issue-number "$ISSUE_NUMBER" \
            --provider anthropic \
            --reserved-usd "${{ needs.execute.outputs.estimated_cost_usd }}" \
            --actual-usd "$actual"

      - name: Classify result, dispatch validation, release slot
        id: settlement
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ needs.model.outputs.claude_outcome }}
          CLAUDE_KIND: ${{ steps.claude_provider.outputs.kind }}
          CLAUDE_FALLBACK: ${{ steps.claude_provider.outputs.fallback_allowed }}
          ROUTE_TIER: ${{ needs.execute.outputs.tier }}
          ROUTE_MODEL: ${{ needs.execute.outputs.model }}
          ROUTE_REASON: ${{ needs.execute.outputs.route_reason }}
          ROUTE_RESERVED_COST: ${{ needs.execute.outputs.estimated_cost_usd }}
          PACKET_FINGERPRINT: ${{ needs.execute.outputs.packet_fingerprint }}
          PACKET_ESTIMATED_TOKENS: ${{ needs.execute.outputs.packet_estimated_tokens }}
          PACKET_EXECUTION_CLASS: ${{ needs.execute.outputs.packet_execution_class }}
          ISSUE_LABELS: ${{ needs.execute.outputs.labels }}
          PUBLISH_REASON: ${{ steps.publish.outputs.reason }}
          # Fallback providers are not run (economy policy v1).
          GEMINI_OUTCOME: ""
          GEMINI_KIND: ""
          GEMINI_FALLBACK: ""
          OPENAI_OUTCOME: ""
          OPENAI_KIND: ""
        shell: bash
        run: |
          set -euo pipefail
          marker="OC-AUTO-ISSUE: #${ISSUE_NUMBER}"
          route_telemetry="tier=${ROUTE_TIER:-unknown}; model=${ROUTE_MODEL:-unknown}; reason=${ROUTE_REASON:-unknown}; reserved_cost_usd=${ROUTE_RESERVED_COST:-unknown}; packet=${PACKET_FINGERPRINT:-unknown}; packet_est_tokens=${PACKET_ESTIMATED_TOKENS:-unknown}; execution_class=${PACKET_EXECUTION_CLASS:-unknown}; publish_refusal=${PUBLISH_REASON:-none}"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty")
          settle() {
            local disposition="$1" message="$2"
            shift 2
            python3 -m scripts.oc_swarm_settlement --disposition "$disposition" \
              --message "$message Route=${route_telemetry}; Claude=${CLAUDE_KIND:-unknown}; Gemini=${GEMINI_KIND:-not-run}; OpenAI=${OPENAI_KIND:-not-run}." \
              --issue-number "$ISSUE_NUMBER" --comment-id "$LEASE_COMMENT_ID" \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" "$@"
          }

          if [[ -n "$pr" ]]; then
            settle validating "Durable PR #$pr awaits validation." --blocked-on "pr#$pr"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
            if gh workflow run orchid-autonomous-validation.yml --repo "$GITHUB_REPOSITORY" --ref "$head" >/dev/null; then
              echo "Validation dispatched for PR #$pr." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #$pr remains validating; dispatch failed." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          elif [[ "$CLAUDE_KIND" == "no_execution" || "$CLAUDE_KIND" == "no_model_usage" || "$CLAUDE_KIND" == "workflow_validation_skip" || "$CLAUDE_KIND" == "provider_failure" || "$CLAUDE_KIND" == "billing_exhausted" || "$CLAUDE_KIND" == "security" || "$CLAUDE_KIND" == "safe_provider" || "$CLAUDE_KIND" == "unknown" ]]; then
            settle runtime-backoff "No verifiable model execution ($CLAUDE_KIND). Parked in oc-runtime-backoff; no automatic paid retry."
          elif [[ "$CLAUDE_KIND" == "max_turns" || "$CLAUDE_KIND" == "no_durable_change" ]]; then
            settle repair "Bounded ceiling or no durable change ($CLAUDE_KIND)."
          elif [[ "$CLAUDE_FALLBACK" == "true" && "$GEMINI_OUTCOME" == "success" ]]; then
            settle queued "Gemini completed without durable changes." --repair-queued
          elif [[ "$GEMINI_FALLBACK" == "true" && "$OPENAI_OUTCOME" == "success" ]]; then
            settle queued "Authorized OpenAI completed without durable changes." --repair-queued
          elif [[ "$CLAUDE_FALLBACK" == "true" && "$GEMINI_FALLBACK" != "true" ]]; then
            settle runtime-backoff "Gemini non-substitutable failure; OpenAI not attempted."
            gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded --add-label oc-provider-chain-blocked >/dev/null 2>&1 || true
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID RUNTIME CIRCUIT — **OPEN** after Gemini non-substitutable failure on issue #${ISSUE_NUMBER}." >/dev/null
          elif [[ "$GEMINI_FALLBACK" == "true" ]]; then
            settle runtime-backoff "All eligible providers exhausted; no automatic paid retry."
            gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded --add-label oc-provider-chain-blocked >/dev/null 2>&1 || true
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID RUNTIME CIRCUIT — **OPEN** after all eligible providers failed on issue #${ISSUE_NUMBER}." >/dev/null
          elif [[ "$CLAUDE_OUTCOME" != "success" ]]; then
            settle runtime-backoff "Non-fallback Claude failure; no provider bypass."
            gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded --add-label oc-provider-chain-blocked >/dev/null 2>&1 || true
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID RUNTIME CIRCUIT — **OPEN** after non-fallback Claude failure on issue #${ISSUE_NUMBER}." >/dev/null
          else
            if [[ "${ISSUE_LABELS:-}" == *oc-repair* ]]; then
              settle runtime-backoff "No durable PR on allowed repair attempt. Retry budget exhausted; issue parked in oc-runtime-backoff."
            else
              settle queued "No durable PR; one bounded repair remains; automatic refill remains disabled unless explicitly authorized." --repair-queued
            fi
          fi

      - name: Dispatch trusted hosted completion consumer
        if: steps.settlement.outcome == 'success' && steps.settlement.outputs.pr != '' && inputs.lease_comment_id != ''
        env:
          PR: ${{ steps.settlement.outputs.pr }}
          LEASE: ${{ inputs.lease_comment_id }}
          WAVE: ${{ inputs.wave || '1' }}
          MAX_WAVES: ${{ inputs.max_waves || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          gh workflow run oc-convergence-supervisor.yml --repo "$GITHUB_REPOSITORY" \
            --ref oc-autonomous-integration \
            -f issue="$ISSUE_NUMBER" -f pr="$PR" -f maker_head="$head" \
            -f worker_run="$GITHUB_RUN_ID" -f worker_attempt="$GITHUB_RUN_ATTEMPT" \
            -f lease="$LEASE" -f wave="$WAVE" -f max_waves="$MAX_WAVES"
