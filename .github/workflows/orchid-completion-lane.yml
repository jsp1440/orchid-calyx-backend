name: Orchid Completion Lane

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      issue_number:
        description: Orchid Continuum issue number to execute
        required: true
        type: string

concurrency:
  group: orchid-completion-lane-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
      INTEGRATION_BRANCH: oc-autonomous-integration
    steps:
      - name: Checkout autonomous integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0

      - name: Verify scheduler lease
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(" ")' 2>/dev/null || true)
          if [[ "$labels" == *oc-running* ]]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Stale/duplicate completion dispatch suppressed before provider execution because this issue no longer owns an oc-running lease. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null 2>&1 || true
          fi

      - name: Load issue context and publish worker receipt
        if: steps.lease.outputs.execute == 'true'
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          title=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          {
            echo 'title<<EOF'
            echo "$title"
            echo EOF
            echo 'body<<EOF'
            echo "$body"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Completion worker started from ${GITHUB_EVENT_NAME}; provider order=Claude→Gemini→OpenAI. Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null

      - name: Execute issue with Claude Code
        if: steps.lease.outputs.execute == 'true'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "github-actions"
          prompt: |
            ORCHID CONTINUUM — CONTINUOUS COMPLETION LANE

            Repository: ${{ github.repository }}
            Integration base: oc-autonomous-integration
            Source issue: #${{ inputs.issue_number }} — ${{ steps.issue.outputs.title }}

            Issue requirements:
            ${{ steps.issue.outputs.body }}

            EXECUTE BEFORE EXPLAINING. This lane is part of a continuously refilling completion system.

            Rules:
            - Start from current `oc-autonomous-integration`, inspect current `main` and overlapping PRs, and converge instead of duplicating work.
            - If an open PR already contains `OC-AUTO-ISSUE: #${{ inputs.issue_number }}`, update that same PR/branch.
            - Implement the largest safe bounded slice that can be completed in this run.
            - Preserve taxonomy, provenance, uncertainty, locality sensitivity, and unavailable-vs-zero semantics. Never invent science.
            - Test, fix, lint/typecheck/compile as appropriate before delivery.
            - Commit and push durable work. Open/update exactly one draft PR targeting `oc-autonomous-integration` with these exact lines in its body:
              `OC-AUTO-ISSUE: #${{ inputs.issue_number }}`
              `OC-AUTO-REQUEUE: true|false`
              `OC-AUTO-BLOCKED: true|false`
            - Never merge to `main`, deploy production, mutate production DB/KG/scientific state, activate taxonomy, publish science, create/disclose credentials, spend funds, force-push, or delete branches/repos.
            - Final output: DONE, VALIDATION, PR/HEAD SHA, REMAINING, OWNER GATE if any.
          claude_args: |
            --max-turns 75
            --allowedTools "Edit,Read,Write,Bash(git diff:*),Bash(git status:*),Bash(git ls-files:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(git merge:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(npm:*),Bash(npx:*),Bash(test:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run:*)"
            --append-system-prompt "Read CLAUDE.md and AGENTS.md before editing. Orchid Continuum Brain and GitHub are authoritative. BLOCKED DOES NOT MEAN STOPPED FOR THE PROGRAM. Deliver durable GitHub work, never runner-local-only claims."

      - name: Classify Claude terminal state
        if: always() && steps.lease.outputs.execute == 'true'
        id: claude_provider
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          execution_log="/home/runner/work/_temp/claude-execution-output.json"
          terminal_reason=""
          result_text=""
          error_type=""
          subtype=""
          if [[ -f "$execution_log" ]]; then
            terminal_reason=$(jq -r '[.. | objects | select(.type == "result")] | last | .terminal_reason // ""' "$execution_log" 2>/dev/null || true)
            result_text=$(jq -r '[.. | objects | select(.type == "result")] | last | .result // ""' "$execution_log" 2>/dev/null || true)
            error_type=$(jq -r '[.. | objects | select(.type == "assistant" and .is_api_error_message == true)] | last | .error // ""' "$execution_log" 2>/dev/null || true)
            subtype=$(jq -r '[.. | objects | select(.type == "result")] | last | .subtype // ""' "$execution_log" 2>/dev/null || true)
          fi
          normalized=$(printf '%s %s %s %s' "$terminal_reason" "$result_text" "$error_type" "$subtype" | tr '[:upper:]' '[:lower:]')
          kind=healthy
          fallback=false
          if [[ "$CLAUDE_OUTCOME" != "success" ]]; then
            if [[ "$normalized" == *"error_max_turns"* || "$normalized" == *"max_turns"* || "$normalized" == *"max turns"* || "$normalized" == *"maximum turns"* ]]; then
              kind=max_turns
            elif [[ "$normalized" == *"authentication"* || "$normalized" == *"unauthorized"* || "$normalized" == *"forbidden"* || "$normalized" == *"permission"* || "$normalized" == *"invalid api key"* || "$normalized" == *"invalid_api_key"* ]]; then
              kind=security
            elif [[ "$normalized" == *"billing_error"* || "$normalized" == *"credit balance"* || "$normalized" == *"insufficient credit"* || "$normalized" == *"rate_limit"* || "$normalized" == *"rate limit"* || "$normalized" == *"overloaded"* || "$normalized" == *"service unavailable"* || "$normalized" == *"connection_error"* || "$normalized" == *"timeout"* ]]; then
              kind=safe_provider
              fallback=true
            else
              kind=unknown
            fi
          fi
          {
            echo "kind=$kind"
            echo "fallback_allowed=$fallback"
            echo "terminal_reason=${terminal_reason:-unknown}"
            echo "error_type=${error_type:-unknown}"
          } >> "$GITHUB_OUTPUT"
          echo "Claude classification: kind=$kind fallback_allowed=$fallback"

      - name: Execute bounded Gemini fallback
        if: steps.claude_provider.outputs.fallback_allowed == 'true'
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gemini-stderr.log"
          : > "$RUNNER_TEMP/gemini-result.json"
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "config_missing" > "$RUNNER_TEMP/gemini-status.txt"
            exit 20
          fi

          branch="oc-auto-${ISSUE_NUMBER}-gemini-${GITHUB_RUN_ID}"
          git checkout -B "$branch" "$INTEGRATION_BRANCH"
          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prompt=$(cat <<EOF
          ORCHID CONTINUUM — GOVERNED GEMINI FALLBACK

          Claude was safely classified unavailable. Implement the largest safe coherent repository-local slice for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}.

          ${ISSUE_BODY}

          EDIT FILES ONLY. Do not use shell tools. Do not create commits, branches, pull requests, issues, releases, deployments, credentials, or external publications; the workflow owns packaging. Preserve taxonomy, provenance, uncertainty, sensitive-locality protections, unavailable-vs-zero semantics, scientific review boundaries, tests, security checks, governance, and owner gates. Never invent science. Do not mutate production data, activate taxonomy, publish science, spend funds, or perform destructive operations.
          EOF
          )

          gemini_home="$RUNNER_TEMP/gemini-home"
          mkdir -p "$gemini_home/.gemini"
          cat > "$gemini_home/.gemini/settings.json" <<'JSON'
          {
            "tools": {
              "exclude": ["run_shell_command"]
            }
          }
          JSON

          set +e
          HOME="$gemini_home" env -u GH_TOKEN GEMINI_API_KEY="$GEMINI_API_KEY" GEMINI_CLI_TRUST_WORKSPACE=true \
            timeout 35m npx -y @google/gemini-cli@latest \
            --approval-mode auto_edit --output-format json -p "$prompt" \
            > "$RUNNER_TEMP/gemini-result.json" 2> "$RUNNER_TEMP/gemini-stderr.log"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/gemini-exit.txt"

          if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git diff --check
            git add -A
            git commit -m "feat(auto): Gemini fallback slice for #${ISSUE_NUMBER}"
            git push origin "HEAD:$branch"
            body=$(cat <<EOF
          Governed Gemini fallback slice after Claude safe-provider failure.

          Provider: Gemini fallback
          Claude classification: ${{ steps.claude_provider.outputs.kind }}
          Gemini exit status: ${status}

          Independent exact-head validation remains mandatory. No production mutation, taxonomy activation, scientific publication, sensitive-locality relaxation, credential change, spending action, or destructive operation was authorized.

          OC-AUTO-ISSUE: #${ISSUE_NUMBER}
          OC-AUTO-REQUEUE: true
          OC-AUTO-BLOCKED: false
          EOF
            )
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$INTEGRATION_BRANCH" --head "$branch" --draft --title "Gemini fallback: #${ISSUE_NUMBER} ${ISSUE_TITLE}" --body "$body" >/dev/null
            exit 0
          fi
          exit "$status"

      - name: Classify Gemini terminal state
        if: always() && steps.claude_provider.outputs.fallback_allowed == 'true'
        id: gemini_provider
        env:
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          kind=healthy
          fallback=false
          if [[ "$GEMINI_OUTCOME" != "success" ]]; then
            if [[ -f "$RUNNER_TEMP/gemini-status.txt" ]] && grep -q 'config_missing' "$RUNNER_TEMP/gemini-status.txt"; then
              kind=config
            elif grep -Eqi '401|403|unauthor|forbidden|invalid.?api.?key|authentication|permission' "$RUNNER_TEMP/gemini-stderr.log" "$RUNNER_TEMP/gemini-result.json" 2>/dev/null; then
              kind=security
            elif grep -Eqi '429|quota|rate.?limit|billing|credit|overloaded|service unavailable|temporarily unavailable|timeout|timed out|connection' "$RUNNER_TEMP/gemini-stderr.log" "$RUNNER_TEMP/gemini-result.json" 2>/dev/null; then
              kind=safe_provider
              fallback=true
            elif [[ "$(cat "$RUNNER_TEMP/gemini-exit.txt" 2>/dev/null || true)" == "124" ]]; then
              kind=safe_provider
              fallback=true
            else
              kind=unknown
            fi
          fi
          {
            echo "kind=$kind"
            echo "fallback_allowed=$fallback"
          } >> "$GITHUB_OUTPUT"
          echo "Gemini classification: kind=$kind fallback_allowed=$fallback"

      - name: Execute bounded OpenAI fallback
        if: steps.gemini_provider.outputs.fallback_allowed == 'true'
        id: openai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/openai-stdout.log"
          : > "$RUNNER_TEMP/openai-stderr.log"
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "config_missing" > "$RUNNER_TEMP/openai-status.txt"
            exit 20
          fi

          branch="oc-auto-${ISSUE_NUMBER}-openai-${GITHUB_RUN_ID}"
          git checkout -B "$branch" "$INTEGRATION_BRANCH"
          git config user.name "orchid-continuum-orchestrator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          prompt=$(cat <<EOF
          ORCHID CONTINUUM — GOVERNED OPENAI SECOND FALLBACK

          Claude and Gemini were both safely classified unavailable for provider-capacity reasons. Implement the largest safe coherent repository-local slice for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}.

          ${ISSUE_BODY}

          Work only inside the checked-out repository. Do not use git or gh, do not access network resources from model-generated commands, and do not create commits, branches, pull requests, issues, releases, deployments, credentials, or external publications; the workflow owns packaging. Preserve taxonomy, provenance, uncertainty, sensitive-locality protections, unavailable-vs-zero semantics, scientific review boundaries, tests, security checks, governance, and owner gates. Never invent science. Do not mutate production data, activate taxonomy, publish science, spend funds, or perform destructive operations. You may inspect/edit repository files and run local tests within the workspace sandbox.
          EOF
          )

          set +e
          npx -y @openai/codex@0.151.0 --version 2>> "$RUNNER_TEMP/openai-stderr.log"
          env -u GH_TOKEN OPENAI_API_KEY="$OPENAI_API_KEY" timeout 35m \
            npx -y @openai/codex@0.151.0 --ask-for-approval never exec \
            --sandbox workspace-write --skip-git-repo-check --ephemeral -C "$GITHUB_WORKSPACE" "$prompt" \
            > "$RUNNER_TEMP/openai-stdout.log" 2>> "$RUNNER_TEMP/openai-stderr.log"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/openai-exit.txt"

          if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            git diff --check
            git add -A
            git commit -m "feat(auto): OpenAI fallback slice for #${ISSUE_NUMBER}"
            git push origin "HEAD:$branch"
            body=$(cat <<EOF
          Governed OpenAI second-fallback slice after safe Claude and Gemini provider failures.

          Provider: OpenAI fallback
          Claude classification: ${{ steps.claude_provider.outputs.kind }}
          Gemini classification: ${{ steps.gemini_provider.outputs.kind }}
          OpenAI CLI exit status: ${status}

          Independent exact-head validation remains mandatory. No production mutation, taxonomy activation, scientific publication, sensitive-locality relaxation, credential change, spending action, or destructive operation was authorized.

          OC-AUTO-ISSUE: #${ISSUE_NUMBER}
          OC-AUTO-REQUEUE: true
          OC-AUTO-BLOCKED: false
          EOF
            )
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$INTEGRATION_BRANCH" --head "$branch" --draft --title "OpenAI fallback: #${ISSUE_NUMBER} ${ISSUE_TITLE}" --body "$body" >/dev/null
            exit 0
          fi
          exit "$status"

      - name: Classify OpenAI terminal state
        if: always() && steps.gemini_provider.outputs.fallback_allowed == 'true'
        id: openai_provider
        env:
          OPENAI_OUTCOME: ${{ steps.openai.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          kind=healthy
          stderr_log="$RUNNER_TEMP/openai-stderr.log"
          exit_code="$(cat "$RUNNER_TEMP/openai-exit.txt" 2>/dev/null || true)"
          if [[ "$OPENAI_OUTCOME" != "success" ]]; then
            if [[ -f "$RUNNER_TEMP/openai-status.txt" ]] && grep -q 'config_missing' "$RUNNER_TEMP/openai-status.txt"; then
              kind=config
            elif grep -Eqi '(^|[^0-9])(401|403)([^0-9]|$)|unauthori[sz]ed|invalid.?api.?key|authentication (failed|required)|missing scopes?:|insufficient permissions.*operation' "$stderr_log" 2>/dev/null; then
              kind=security
            elif grep -Eqi '429|quota|rate.?limit|billing|credit|overloaded|service unavailable|temporarily unavailable|timeout|timed out|connection|websocket.*(reset|closed|failed)' "$stderr_log" 2>/dev/null || [[ "$exit_code" == "124" ]]; then
              kind=safe_provider
            elif grep -Eqi 'unknown (argument|option)|unexpected argument|unrecognized option|usage:|config.*(invalid|error)|failed to (load|parse).*config|permission denied|operation not permitted|sandbox.*(denied|permission)|workspace.*trust' "$stderr_log" 2>/dev/null; then
              kind=runtime_config
            else
              kind=unknown
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "OpenAI classification: kind=$kind exit=${exit_code:-unknown}"

          if [[ "$OPENAI_OUTCOME" != "success" && -f "$stderr_log" ]]; then
            {
              echo "### OpenAI fallback diagnostic"
              echo
              echo "classification: \`$kind\`"
              echo "exit: \`${exit_code:-unknown}\`"
              echo
              echo '```text'
              tail -c 4000 "$stderr_log" \
                | sed -E \
                    -e 's/sk-[A-Za-z0-9_-]{16,}/[REDACTED_OPENAI_KEY]/g' \
                    -e 's/(Authorization:[[:space:]]*Bearer)[[:space:]]+[^[:space:]]+/\1 [REDACTED]/Ig' \
                    -e 's/(OPENAI_API_KEY=)[^[:space:]]+/\1[REDACTED]/g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Classify result, dispatch validation, release slot
        if: always() && steps.lease.outputs.execute == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_KIND: ${{ steps.claude_provider.outputs.kind }}
          CLAUDE_FALLBACK: ${{ steps.claude_provider.outputs.fallback_allowed }}
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          GEMINI_KIND: ${{ steps.gemini_provider.outputs.kind }}
          GEMINI_FALLBACK: ${{ steps.gemini_provider.outputs.fallback_allowed }}
          OPENAI_OUTCOME: ${{ steps.openai.outcome }}
          OPENAI_KIND: ${{ steps.openai_provider.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          marker="OC-AUTO-ISSUE: #${ISSUE_NUMBER}"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$INTEGRATION_BRANCH" --limit 100 --json number,body --jq "[.[] | select(.body != null and (.body | contains(\"$marker\")))][0].number // empty")
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-running >/dev/null 2>&1 || true

          if [[ -n "$pr" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-repair --remove-label oc-blocked --remove-label oc-runtime-backoff --add-label oc-validating >/dev/null 2>&1 || true
            head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
            if gh workflow run orchid-autonomous-validation.yml --repo "$GITHUB_REPOSITORY" --ref "$head" >/dev/null; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Lane delivered/updated integration PR #$pr, dispatched independent backend validation, and released its execution slot. Claude=${CLAUDE_KIND:-unknown}; Gemini=${GEMINI_KIND:-not-run}; OpenAI=${OPENAI_KIND:-not-run}. Worker run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
            else
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-repair --add-label oc-validating >/dev/null 2>&1 || true
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Durable PR #$pr exists, but validation dispatch failed. Kept in oc-validating; scheduler will retry validation without redispatching a model. Worker run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
              exit 1
            fi
          elif [[ "$CLAUDE_KIND" == "max_turns" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-backoff --remove-label oc-validating --remove-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude reached the bounded task/turn ceiling. Provider runtime remains healthy; issue moved to oc-repair and the global circuit stays closed." >/dev/null
          elif [[ "$CLAUDE_FALLBACK" == "true" && "$GEMINI_OUTCOME" == "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-backoff --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude was safely unavailable; Gemini completed without durable changes. Issue returned to bounded repair without opening the global circuit." >/dev/null
          elif [[ "$GEMINI_FALLBACK" == "true" && "$OPENAI_OUTCOME" == "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-runtime-backoff --remove-label oc-validating --add-label oc-queued --add-label oc-repair >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude and Gemini were safely unavailable; OpenAI completed without durable changes. Issue returned to bounded repair without opening the global circuit." >/dev/null
          elif [[ "$CLAUDE_FALLBACK" == "true" && "$GEMINI_FALLBACK" != "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-validating --remove-label oc-repair --add-label oc-runtime-backoff >/dev/null 2>&1 || true
            gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded --add-label oc-provider-chain-blocked >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude was safely unavailable but Gemini failed with non-substitutable classification=${GEMINI_KIND:-unknown}. Failed closed; OpenAI was not attempted." >/dev/null
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID RUNTIME CIRCUIT — **OPEN** after Gemini non-substitutable failure on issue #${ISSUE_NUMBER}." >/dev/null
          elif [[ "$GEMINI_FALLBACK" == "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-validating --remove-label oc-repair --add-label oc-runtime-backoff >/dev/null 2>&1 || true
            gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded --add-label oc-provider-chain-blocked >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude and Gemini were safely unavailable and OpenAI did not produce durable work (classification=${OPENAI_KIND:-unknown}, outcome=${OPENAI_OUTCOME:-unknown}). All eligible providers exhausted; issue parked without provider thrashing." >/dev/null
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID RUNTIME CIRCUIT — **OPEN** after all eligible providers failed on issue #${ISSUE_NUMBER}." >/dev/null
          elif [[ "$CLAUDE_OUTCOME" != "success" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-queued --remove-label oc-validating --remove-label oc-repair --add-label oc-runtime-backoff >/dev/null 2>&1 || true
            gh issue edit 1031 --repo "$GITHUB_REPOSITORY" --add-label oc-runtime-degraded --add-label oc-provider-chain-blocked >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Claude failed with non-fallback classification=${CLAUDE_KIND:-unknown}. Failed closed; no provider bypass attempted." >/dev/null
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "ORCHID RUNTIME CIRCUIT — **OPEN** after non-fallback Claude failure on issue #${ISSUE_NUMBER}." >/dev/null
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label oc-validating --remove-label oc-repair --add-label oc-queued >/dev/null 2>&1 || true
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "[OC-AUTO] Preferred provider completed without a durable integration PR. Returned to the queue for a bounded implementation retry while other lanes continue." >/dev/null
          fi
