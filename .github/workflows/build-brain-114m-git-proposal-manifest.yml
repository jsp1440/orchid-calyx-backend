name: BUILD-BRAIN-114M Git Proposal Manifest Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/assignment_factory.py"
      - "app/calyx_orchestrator/execution_bridge.py"
      - "app/calyx_orchestrator/git_proposal_manifest.py"
      - "app/calyx_orchestrator/isolated_patch_executor.py"
      - "app/calyx_orchestrator/persisted_patch_execution.py"
      - "app/calyx_orchestrator/program_cycle.py"
      - "app/calyx_orchestrator/sandbox_supervisor_service.py"
      - "tests/test_calyx_assignment_capabilities_114m_r1.py"
      - "tests/test_calyx_git_proposal_manifest.py"
      - "tests/test_calyx_persisted_patch_execution.py"
      - "tests/test_calyx_workspace_rollback_114m.py"
      - "docs/brain/BUILD-BRAIN-114M-GIT-PROPOSAL-MANIFEST.md"
      - ".github/workflows/build-brain-114m-git-proposal-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile proposal manifest surface
        run: |
          python -m compileall -q app/calyx_orchestrator/assignment_factory.py app/calyx_orchestrator/execution_bridge.py app/calyx_orchestrator/git_proposal_manifest.py app/calyx_orchestrator/isolated_patch_executor.py app/calyx_orchestrator/persisted_patch_execution.py app/calyx_orchestrator/program_cycle.py app/calyx_orchestrator/sandbox_supervisor_service.py tests/test_calyx_assignment_capabilities_114m_r1.py tests/test_calyx_git_proposal_manifest.py tests/test_calyx_persisted_patch_execution.py tests/test_calyx_workspace_rollback_114m.py
      - name: Ruff proposal manifest surface
        run: |
          ruff check app/calyx_orchestrator/assignment_factory.py app/calyx_orchestrator/execution_bridge.py app/calyx_orchestrator/git_proposal_manifest.py app/calyx_orchestrator/isolated_patch_executor.py app/calyx_orchestrator/persisted_patch_execution.py app/calyx_orchestrator/program_cycle.py app/calyx_orchestrator/sandbox_supervisor_service.py tests/test_calyx_assignment_capabilities_114m_r1.py tests/test_calyx_git_proposal_manifest.py tests/test_calyx_persisted_patch_execution.py tests/test_calyx_workspace_rollback_114m.py
          ruff format --check app/calyx_orchestrator/assignment_factory.py app/calyx_orchestrator/execution_bridge.py app/calyx_orchestrator/git_proposal_manifest.py app/calyx_orchestrator/isolated_patch_executor.py app/calyx_orchestrator/persisted_patch_execution.py app/calyx_orchestrator/program_cycle.py app/calyx_orchestrator/sandbox_supervisor_service.py tests/test_calyx_assignment_capabilities_114m_r1.py tests/test_calyx_git_proposal_manifest.py tests/test_calyx_persisted_patch_execution.py tests/test_calyx_workspace_rollback_114m.py
      - name: Focused proposal manifest regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_assignment_capabilities_114m_r1.py tests/test_calyx_git_proposal_manifest.py tests/test_calyx_persisted_patch_execution.py tests/test_calyx_workspace_rollback_114m.py
      - name: Non-mutation and evidence-authority assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/git_proposal_manifest.py").read_text(encoding="utf-8")
          persisted = Path("app/calyx_orchestrator/persisted_patch_execution.py").read_text(encoding="utf-8")
          assignment = Path("app/calyx_orchestrator/assignment_factory.py").read_text(encoding="utf-8")
          bridge = Path("app/calyx_orchestrator/execution_bridge.py").read_text(encoding="utf-8")
          patcher = Path("app/calyx_orchestrator/isolated_patch_executor.py").read_text(encoding="utf-8")
          cycle = Path("app/calyx_orchestrator/program_cycle.py").read_text(encoding="utf-8")
          combined = source + "\n" + persisted + "\n" + assignment + "\n" + bridge
          forbidden = (
              "subprocess",
              "git push",
              "git commit",
              "merge_pull_request",
              "create_pull_request",
              "requests.post",
              "urllib.request",
          )
          for marker in forbidden:
              assert marker not in combined, marker
          assert 'SCHEMA = "calyx-git-proposal-manifest-v2"' in source
          assert "patch_program_job_id" in source
          assert "patch_receipt" not in source
          assert "get_completed_by_digest" in source
          assert "GIT_PROPOSAL_PERSISTED_PATCH_REQUIRED" in source
          assert "GIT_PROPOSAL_PERSISTED_VALIDATION_MISMATCH" in source
          assert "PATCH_PROGRAM_JOB_EXECUTOR_INVALID" in persisted
          assert "PATCH_PROGRAM_JOB_OUTPUT_CHECKSUM_MISMATCH" in persisted
          assert "PATCH_PROGRAM_JOB_RECEIPT_IDENTITY_MISMATCH" in persisted
          assert "PATCH_PROGRAM_JOB_INPUT_CHECKSUM_MISMATCH" in persisted
          assert "PATCH_PROGRAM_JOB_INPUT_OUTPUT_MISMATCH" in persisted
          assert 'ISOLATED_PATCH_CAPABILITIES = (*SAFE_ASSIGNMENT_CAPABILITIES, "workspace_write")' in assignment
          assert '"bounded_isolated_workspace_mutation"' in assignment
          assert '"assignment_id": receipt.assignment_id' in bridge
          assert '"program_id": receipt.program_id' in bridge
          assert '"job_key": receipt.job_key' in bridge
          assert 'ROLLBACK_JOURNAL_SCHEMA = "calyx-isolated-rollback-v1"' in patcher
          assert "_persist_rollback_journal" in patcher
          assert "_recover_for_retry" in patcher
          assert "ISOLATED_PATCH_ROLLBACK_STATE_DIVERGED" in patcher
          assert "self.rollback(assignment.assignment_id)" in patcher
          assert "_rollback_workspace_mutation" in cycle
          assert "_finalize_workspace_mutation" in cycle
          assert '"git_mutation_performed": False' in source
          assert '"automatic_merge_authorized": False' in source
          assert '"deployment_authorized": False' in source
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
