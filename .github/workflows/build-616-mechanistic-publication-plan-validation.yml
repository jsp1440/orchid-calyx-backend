name: BUILD-616 Mechanistic Publication Plan Validation

on:
  pull_request:
    paths:
      - 'app/brain/mechanistic_publication_plan.py'
      - 'app/brain/mechanistic_candidates.py'
      - 'app/candidate_knowledge/**'
      - 'app/parallel_platform/routes.py'
      - 'runtime/knowledge_graph/causal_vocabulary.py'
      - 'runtime/knowledge_graph/validation.py'
      - 'tests/test_build_616_mechanistic_publication_plan.py'
      - 'tests/test_build_615_mechanistic_candidate_graph.py'
      - 'tests/test_build_086a_candidate_knowledge.py'
      - 'docs/brain/BUILD-616-MECHANISTIC-PUBLICATION-PLAN.md'
      - '.github/workflows/build-616-mechanistic-publication-plan-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mechanistic-publication-plan:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile BUILD-616 slice
        run: >-
          python -m py_compile
          app/brain/mechanistic_publication_plan.py
          app/brain/mechanistic_candidates.py
          app/candidate_knowledge/repository.py
          app/parallel_platform/routes.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/mechanistic_publication_plan.py
          app/brain/mechanistic_candidates.py
          app/candidate_knowledge/repository.py
          app/parallel_platform/routes.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/mechanistic_publication_plan.py
          app/brain/mechanistic_candidates.py
          app/candidate_knowledge/repository.py
          app/parallel_platform/routes.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: BUILD-616 behavioral regressions
        run: python -m pytest -q tests/test_build_616_mechanistic_publication_plan.py
      - name: Candidate Knowledge review regressions
        run: python -m pytest -q tests/test_build_086a_candidate_knowledge.py
      - name: BUILD-615 prerequisite regressions
        run: python -m pytest -q tests/test_build_615_mechanistic_candidate_graph.py
      - name: Causal vocabulary regressions
        run: python -m pytest -q tests/test_build_614_scientific_causal_vocabulary.py tests/test_build_612_reasoning_map.py
      - name: Verify read-only route
        run: >-
          python -c "from app.parallel_platform.routes import router; assert any(r.path == '/api/platform/brain/mechanistic-candidates/{candidate_id}/publication-plan' for r in router.routes)"
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
