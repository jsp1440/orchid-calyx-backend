name: Observe AGENT-007 Certification Once

on:
  push:
    branches: [main]
    paths:
      - '.github/calyx-agent-007/observe-once'

permissions:
  contents: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CALYX_BACKEND_URL: https://orchid-calyx-backend.onrender.com
      CALYX_API_KEY: ${{ secrets.CALYX_API_KEY || secrets.MISSION_CONTROL_SMOKE_TOKEN }}
    steps:
      - name: Observe persisted governor until terminal state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CALYX_API_KEY" ]]; then
            gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 LIVE OBSERVER — **missing_api_key_secret**. No usable API-key secret reached the observer job."
            exit 1
          fi
          last_signature=""
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/jobs.json -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H "X-API-Key: ${CALYX_API_KEY}" \
              "${CALYX_BACKEND_URL%/}/brain/engineering/completion-jobs?pull_request_number=1043&limit=1" || true)
            if [[ "$code" != "200" ]]; then
              signature="http_${code}"
              if [[ "$signature" != "$last_signature" ]]; then
                gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 LIVE OBSERVER — endpoint HTTP ${code}; continuing to watch."
                last_signature="$signature"
              fi
              sleep 20
              continue
            fi
            read -r count job_id status state attempts error_code next_action < <(python - <<'PY'
import json
p=json.load(open('/tmp/jobs.json'))
j=(p.get('jobs') or [{}])[0]
vals=[p.get('count',0),j.get('job_id','-'),j.get('status','-'),j.get('state','-'),j.get('attempt_count',0),j.get('error_code') or '-',j.get('next_action') or '-']
print(*[str(v).replace(' ','_') for v in vals])
PY
)
            if [[ "$count" == "0" ]]; then
              signature="no_job"
              if [[ "$signature" != "$last_signature" ]]; then
                gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 LIVE OBSERVER — certification workflow dispatched, but no persisted completion job is visible yet. Continuing to watch."
                last_signature="$signature"
              fi
              sleep 20
              continue
            fi
            signature="${job_id}:${status}:${state}:${attempts}:${error_code}:${next_action}"
            if [[ "$signature" != "$last_signature" ]]; then
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 LIVE OBSERVER — job \`${job_id}\`: status=\`${status}\`, state=\`${state}\`, attempts=\`${attempts}\`, next_action=\`${next_action}\`, error=\`${error_code}\`."
              last_signature="$signature"
            fi
            if [[ "$state" == "ready_for_merge" ]]; then
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 CERTIFICATION — **PASSED**. Persisted governor reached \`READY_FOR_MERGE\` and stopped without merge or deployment authority."
              exit 0
            fi
            if [[ "$state" == halted_* || "$status" == "dead_letter" || "$status" == "blocked_approval" ]]; then
              gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 CERTIFICATION — **HALTED**. job=\`${job_id}\`, status=\`${status}\`, state=\`${state}\`, error=\`${error_code}\`."
              exit 1
            fi
            sleep 20
          done
          gh issue comment 1031 --repo "$GITHUB_REPOSITORY" --body "AGENT-007 LIVE OBSERVER — **timeout after 20 minutes** without terminal governor state. Last observed signature: \`${last_signature}\`."
          exit 1
