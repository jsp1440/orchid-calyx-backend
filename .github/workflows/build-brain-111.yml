name: BUILD-BRAIN-111 Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/artifact_registry.py"
      - "tests/test_calyx_artifact_registry.py"
      - "docs/brain/BUILD-BRAIN-111-ARTIFACT-REGISTRY.md"
      - ".github/workflows/build-brain-111.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: python -m py_compile app/calyx_orchestrator/artifact_registry.py tests/test_calyx_artifact_registry.py
      - name: Ruff
        run: ruff check app/calyx_orchestrator/artifact_registry.py tests/test_calyx_artifact_registry.py
      - name: Focused tests
        run: pytest -q tests/test_calyx_artifact_registry.py
