name: KERNEL-006 validation

on:
  pull_request:
    paths:
      - "app/kernel/**"
      - "tests/kernel/**"
      - "docs/KERNEL-006.md"
      - ".github/workflows/kernel-006-validation.yml"

jobs:
  kernel-006-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Kernel tests
        run: |
          python -m pytest -q \
            tests/kernel/test_foundation.py \
            tests/kernel/test_evidence.py \
            tests/kernel/test_assertions.py \
            tests/kernel/test_relationships.py \
            tests/kernel/test_publications.py \
            tests/kernel/test_queries.py
