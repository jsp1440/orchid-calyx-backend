name: Engineering Memory activation readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/engineering_memory/**"
      - "migrations/082_engineering_memory*.sql"
      - "scripts/validate_engineering_memory_activation.py"
      - "tests/test_engineering_memory*.py"
      - ".github/workflows/engineering-memory-activation-readiness.yml"

permissions:
  contents: read

jobs:
  ephemeral-postgres-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: engineering_memory_ephemeral_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d engineering_memory_ephemeral_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENGINEERING_MEMORY_EPHEMERAL_VALIDATION: "1"
      ENGINEERING_MEMORY_TEST_DATABASE_URL: postgresql+psycopg://synthetic:synthetic@127.0.0.1:5432/engineering_memory_ephemeral_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest ruff "psycopg[binary]"
      - name: Static and focused unit validation
        run: |
          python -m ruff check scripts/validate_engineering_memory_activation.py tests/test_engineering_memory_activation_readiness.py
          python -m ruff format --check scripts/validate_engineering_memory_activation.py tests/test_engineering_memory_activation_readiness.py
          python -m pytest -q tests/test_engineering_memory.py tests/test_engineering_memory_api.py tests/test_engineering_memory_activation_readiness.py
      - name: Ephemeral PostgreSQL migration and behavior proof
        run: python -m scripts.validate_engineering_memory_activation
