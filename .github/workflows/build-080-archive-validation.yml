name: BUILD-080 Archive Validation

on:
  pull_request:
    paths:
      - 'app/archive/**'
      - 'app/routers/health.py'
      - 'migrations/106_institutional_archive_manager*'
      - 'tests/test_build_080_*'
      - '.github/workflows/build-080-archive-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: archive
          POSTGRES_DB: archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archive -d archive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://archive:archive@localhost:5432/archive
      BUILD_080_TEST_DATABASE_URL: postgresql://archive:archive@localhost:5432/archive
      CALYX_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest ruff PyYAML
      - run: ruff check app/archive app/routers/health.py tests/test_build_080_*.py --ignore I001,UP035
      - run: python -m compileall -q app/archive
      - run: pytest -q tests/test_build_080_archive_manager.py tests/test_build_080_archive_api.py tests/test_build_080_archive_migration.py
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/106_institutional_archive_manager.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/106_institutional_archive_manager.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/106_institutional_archive_manager_rollback.sql
