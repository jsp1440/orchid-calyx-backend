name: CALYX-SPEAK-002 Validation

on:
  pull_request:
    paths:
      - 'app/calyx_conversation/**'
      - 'app/routers/calyx_core.py'
      - 'tests/test_calyx_speak_002.py'
      - 'migrations/611_calyx_conversation_owner_scope.sql'
      - '.github/workflows/calyx-speak-002-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-speak:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Compile Speak layer
        run: python -m py_compile app/calyx_conversation/store.py app/calyx_conversation/provider.py app/calyx_conversation/speak_routes.py app/routers/calyx_core.py tests/test_calyx_speak_002.py
      - name: Run Speak acceptance regressions
        run: python -m pytest -q tests/test_calyx_speak_002.py
      - name: Lint Speak layer
        run: ruff check app/calyx_conversation/store.py app/calyx_conversation/provider.py app/calyx_conversation/speak_routes.py tests/test_calyx_speak_002.py
      - name: Verify mounted routes
        run: python -c "from app.routers.calyx_core import router; paths={getattr(r,'path','') for r in router.routes}; required={'/api/calyx/speak/conversations','/api/calyx/speak/conversations/{conversation_id}','/api/calyx/speak/conversations/{conversation_id}/turns'}; missing=required-paths; assert not missing, f'missing routes: {sorted(missing)}'"
