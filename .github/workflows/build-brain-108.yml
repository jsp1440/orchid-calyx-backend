name: BUILD-BRAIN-108-113A Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/executor.py"
      - "app/calyx_orchestrator/execution_bridge.py"
      - "app/calyx_orchestrator/assignment_factory.py"
      - "app/calyx_orchestrator/dry_run_service.py"
      - "app/calyx_orchestrator/scheduler.py"
      - "app/calyx_orchestrator/persisted_scheduler.py"
      - "app/calyx_orchestrator/program_core.py"
      - "app/calyx_orchestrator/program_worker.py"
      - "app/calyx_orchestrator/program_routes.py"
      - "app/calyx_orchestrator/program_models.py"
      - "app/calyx_orchestrator/operations.py"
      - "app/calyx_orchestrator/engineering_core.py"
      - "tests/test_calyx_governed_executor.py"
      - "tests/test_calyx_execution_bridge.py"
      - "tests/test_calyx_governed_assignment_factory.py"
      - "tests/test_calyx_dry_run_execution_loop.py"
      - "tests/test_calyx_dependency_scheduler.py"
      - "tests/test_calyx_persisted_scheduler.py"
      - "tests/test_calyx_engineering_program_worker.py"
      - ".github/workflows/build-brain-108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile changed Python
        run: |
          python -m py_compile \
            app/calyx_orchestrator/executor.py \
            app/calyx_orchestrator/execution_bridge.py \
            app/calyx_orchestrator/assignment_factory.py \
            app/calyx_orchestrator/dry_run_service.py \
            app/calyx_orchestrator/scheduler.py \
            app/calyx_orchestrator/persisted_scheduler.py \
            app/calyx_orchestrator/program_core.py \
            app/calyx_orchestrator/program_worker.py \
            app/calyx_orchestrator/program_routes.py \
            app/calyx_orchestrator/operations.py \
            app/calyx_orchestrator/engineering_core.py \
            tests/test_calyx_governed_executor.py \
            tests/test_calyx_execution_bridge.py \
            tests/test_calyx_governed_assignment_factory.py \
            tests/test_calyx_dry_run_execution_loop.py \
            tests/test_calyx_dependency_scheduler.py \
            tests/test_calyx_persisted_scheduler.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/executor.py \
            app/calyx_orchestrator/execution_bridge.py \
            app/calyx_orchestrator/assignment_factory.py \
            app/calyx_orchestrator/dry_run_service.py \
            app/calyx_orchestrator/scheduler.py \
            app/calyx_orchestrator/persisted_scheduler.py \
            app/calyx_orchestrator/program_worker.py \
            app/calyx_orchestrator/program_routes.py \
            app/calyx_orchestrator/operations.py \
            tests/test_calyx_governed_executor.py \
            tests/test_calyx_execution_bridge.py \
            tests/test_calyx_governed_assignment_factory.py \
            tests/test_calyx_dry_run_execution_loop.py \
            tests/test_calyx_dependency_scheduler.py \
            tests/test_calyx_persisted_scheduler.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_calyx_governed_executor.py \
            tests/test_calyx_execution_bridge.py \
            tests/test_calyx_governed_assignment_factory.py \
            tests/test_calyx_dry_run_execution_loop.py \
            tests/test_calyx_dependency_scheduler.py \
            tests/test_calyx_persisted_scheduler.py \
            tests/test_calyx_engineering_program_worker.py \
            tests/test_calyx_engineering_mission_control.py \
            tests/test_calyx_autonomous_program_core.py
