name: BUILD-BRAIN-108 Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/executor.py"
      - "app/calyx_orchestrator/program_core.py"
      - "app/calyx_orchestrator/engineering_core.py"
      - "tests/test_calyx_governed_executor.py"
      - ".github/workflows/build-brain-108.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Compile changed Python
        run: |
          python -m py_compile \
            app/calyx_orchestrator/executor.py \
            app/calyx_orchestrator/program_core.py \
            app/calyx_orchestrator/engineering_core.py \
            tests/test_calyx_governed_executor.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/executor.py \
            tests/test_calyx_governed_executor.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/test_calyx_governed_executor.py \
            tests/test_calyx_autonomous_program_core.py
