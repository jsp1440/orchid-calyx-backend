name: CALYX-AUTONOMY-DEPLOYMENT-001

on:
  pull_request:
    paths:
      - "app/routers/health.py"
      - "app/routers/live_mission_control.py"
      - "runtime/json_activation_store.py"
      - "tests/test_calyx_autonomy_deployment_001.py"
      - ".github/workflows/calyx-autonomy-deployment-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest ruff
      - run: python -m ruff check app/routers/live_mission_control.py runtime/json_activation_store.py tests/test_calyx_autonomy_deployment_001.py
      - run: python -m ruff format --check app/routers/live_mission_control.py runtime/json_activation_store.py tests/test_calyx_autonomy_deployment_001.py
      - run: python -m pytest -q tests/test_calyx_autonomy_deployment_001.py
      - run: python -m compileall -q app/routers/live_mission_control.py runtime/json_activation_store.py
      - run: git diff --check
