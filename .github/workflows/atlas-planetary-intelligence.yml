name: Atlas Planetary Intelligence Validation

on:
  pull_request:
    paths:
      - "app/atlas_intelligence/**"
      - "tests/test_atlas_*.py"
      - "docs/architecture/ATLAS_*"
      - "docs/architecture/ADR-ATLAS-*"
      - "docs/architecture/BRAIN_CAPTURE_REQUIREMENTS.md"
      - ".github/workflows/atlas-planetary-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi<0.116" httpx pydantic pytest ruff

      - name: Compile Atlas package
        run: python -m compileall -q app/atlas_intelligence

      - name: Lint Atlas package and tests
        run: ruff check app/atlas_intelligence tests/test_atlas_*.py

      - name: Run focused Atlas tests
        run: pytest -q tests/test_atlas_*.py
