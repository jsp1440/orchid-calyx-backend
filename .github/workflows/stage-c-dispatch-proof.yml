name: Stage C Canonical Dispatch Proof

on:
  workflow_dispatch:
  push:
    branches:
      - claude/orchid-worker-codex-adapter-u0rxqr
    paths:
      - 'tests/test_paid_api_stage_c_dispatch.py'
      - 'app/calyx_orchestrator/bounded_dispatcher.py'
      - 'app/calyx_orchestrator/paid_api_worker.py'
      - 'app/calyx_orchestrator/paid_api_budget_governor.py'
      - '.github/workflows/stage-c-dispatch-proof.yml'

permissions:
  contents: read

concurrency:
  group: stage-c-canonical-dispatch-proof
  cancel-in-progress: true

# Exact-head human-authored retrigger after automated Ruff repair.
jobs:
  deterministic-stage-c:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint Stage C proof
        run: ruff check tests/test_paid_api_stage_c_dispatch.py app/calyx_orchestrator/bounded_dispatcher.py app/calyx_orchestrator/paid_api_worker.py

      - name: Run canonical Stage C proof
        run: pytest -q tests/test_paid_api_stage_c_dispatch.py

      - name: Assert zero real provider credentials
        run: |
          test -z "$OPENAI_API_KEY"
          test -z "$ANTHROPIC_API_KEY"
          echo 'Stage C deterministic proof used zero real provider credentials.'
