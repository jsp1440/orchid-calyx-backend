name: Orchid OpenAI Runtime Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/orchid-openai-runtime-canary.yml'

# Global paid-execution concurrency — enforces PAID_WORKER_CONCURRENCY=1 across
# all provider workflows.  cancel-in-progress: false queues rather than kills.
concurrency:
  group: swarm-paid-execution-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe-openai:
    # Fail closed before any provider credential or network path is initialized.
    if: vars.NO_API_MODE == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUNTIME_TRACKER_ISSUE: 1031
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: NO-API mode guard
        id: no_api
        env:
          NO_API_MODE: ${{ vars.NO_API_MODE }}
        run: python3 scripts/oc_no_api_guard.py

      - name: Swarm governor precheck
        id: governor
        if: steps.no_api.outputs.blocked == 'false'
        env:
          NO_API_MODE: ${{ vars.NO_API_MODE }}
          OC_GOVERNOR_EMERGENCY_KILL_SWITCH: ${{ vars.OC_GOVERNOR_EMERGENCY_KILL_SWITCH }}
          OC_GOVERNOR_PAID_EXECUTION_ENABLED: ${{ vars.OC_GOVERNOR_PAID_EXECUTION_ENABLED }}
          OC_GOVERNOR_PROVIDER: openai
          OC_GOVERNOR_PROVIDER_ALLOWLIST: ${{ vars.OC_GOVERNOR_PROVIDER_ALLOWLIST }}
          OC_GOVERNOR_RETRY_COUNT: "0"
          OC_GOVERNOR_MAX_RETRIES: ${{ vars.OC_GOVERNOR_MAX_RETRIES }}
          OC_GOVERNOR_PER_RUN_ESTIMATED_COST_USD: ${{ vars.OC_GOVERNOR_CANARY_ESTIMATED_COST_USD || '0.10' }}
          OC_GOVERNOR_PER_RUN_BUDGET_USD: ${{ vars.OC_GOVERNOR_PER_RUN_BUDGET_USD }}
          OC_GOVERNOR_DAILY_BUDGET_USD: ${{ vars.OC_GOVERNOR_DAILY_BUDGET_USD }}
          OC_GOVERNOR_MONTHLY_BUDGET_USD: ${{ vars.OC_GOVERNOR_MONTHLY_BUDGET_USD }}
          OC_GOVERNOR_DAILY_SPEND_USD: ${{ vars.OC_GOVERNOR_DAILY_SPEND_USD }}
          OC_GOVERNOR_MONTHLY_SPEND_USD: ${{ vars.OC_GOVERNOR_MONTHLY_SPEND_USD }}
        run: python3 scripts/swarm_governor_precheck.py
      - name: Probe OpenAI authentication and clear stale provider-chain block
        if: steps.no_api.outputs.blocked == 'false' && steps.governor.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail

          labels=$(gh issue view "$RUNTIME_TRACKER_ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")' 2>/dev/null || true)
          if [[ "$labels" != *oc-provider-chain-blocked* ]]; then
            echo "Provider chain is not blocked; OpenAI recovery probe not needed."
            exit 0
          fi

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is unavailable to this workflow."
            exit 1
          fi

          status=$(curl --silent --show-error --output "$RUNNER_TEMP/openai-models.json" \
            --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models || true)

          if [[ "$status" != "200" ]]; then
            echo "::error::OpenAI authentication probe failed with HTTP $status."
            case "$status" in
              401) echo "Classification: authentication/key failure" ;;
              403) echo "Classification: project/permission failure" ;;
              429) echo "Classification: rate-limit/quota failure" ;;
              000) echo "Classification: network/transport failure" ;;
              *) echo "Classification: OpenAI API failure" ;;
            esac
            # Intentionally do not print the response body; provider responses may
            # contain account/project detail and are not required for diagnosis.
            exit 1
          fi

          gh issue edit "$RUNTIME_TRACKER_ISSUE" --repo "$REPO" --remove-label oc-provider-chain-blocked >/dev/null
          gh issue comment "$RUNTIME_TRACKER_ISSUE" --repo "$REPO" --body "[OC-AUTO] OpenAI runtime canary authenticated successfully. Cleared stale oc-provider-chain-blocked state; the next scheduler pass may resume governed portfolio dispatch. Canary run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." >/dev/null
          echo "OpenAI authentication succeeded; stale provider-chain block cleared."
