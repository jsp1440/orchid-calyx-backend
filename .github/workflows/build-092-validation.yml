name: BUILD-092 validation

on:
  pull_request:
    paths:
      - "runtime/runtime_engine.py"
      - "tests/test_build_092_runtime_engine_compatibility.py"
      - "tests/test_runtime_engine.py"
      - ".github/workflows/build-092-validation.yml"
  workflow_dispatch:

jobs:
  runtime-engine-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Compile and lint
        run: |
          python -m compileall -q runtime tests/test_runtime_engine.py tests/test_build_092_runtime_engine_compatibility.py
          python -m ruff check runtime/runtime_engine.py tests/test_runtime_engine.py tests/test_build_092_runtime_engine_compatibility.py
      - name: Run focused RuntimeEngine tests
        run: |
          python -m pytest -q \
            tests/test_runtime_engine.py \
            tests/test_build_092_runtime_engine_compatibility.py
      - name: Verify historical suite collection
        shell: bash
        run: |
          mapfile -t runtime_suites < <(
            git grep -l -E \
              'RuntimeEngine|runtime_engine|from app\.main import|import app\.main' \
              -- 'tests/test_*.py' 'tests/**/test_*.py' \
              | sort -u
          )

          if (( ${#runtime_suites[@]} == 0 )); then
            echo "No RuntimeEngine-related historical test suites were discovered."
            exit 1
          fi

          echo "Collecting ${#runtime_suites[@]} RuntimeEngine-related test suites:"
          printf '  %s\n' "${runtime_suites[@]}"
          python -m pytest --collect-only -q "${runtime_suites[@]}"
