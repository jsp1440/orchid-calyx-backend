name: BUILD-086D review-readiness corrections
on:
  pull_request:
    paths:
      - "app/candidate_knowledge/**"
      - "app/evidence_aggregation/**"
      - "app/persistence/**"
      - "migrations/086d_persistent_runtime.sql"
      - "scripts/build_086c_final_validation.py"
      - "tests/test_build_086c_final_validation.py"
      - "tests/test_build_086d_review_readiness.py"
      - ".github/workflows/build-086d-validation.yml"
  push:
    branches: [feature/build-086d-review-readiness-corrections]
  workflow_dispatch:
jobs:
  postgres-review-readiness:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build086
          POSTGRES_PASSWORD: build086_test_only
          POSTGRES_DB: build086_validation
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U build086 -d build086_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://build086:build086_test_only@localhost:5432/build086_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest httpx
      - name: BUILD-086D focused PostgreSQL and API validation
        run: python -m pytest -q tests/test_build_086d_review_readiness.py
      - name: Rerun BUILD-086C final validation
        run: python -m pytest -q tests/test_build_086c_final_validation.py && python scripts/build_086c_final_validation.py
      - name: BUILD-082 through BUILD-086D regression matrix
        run: >-
          python -m pytest -q
          tests/test_build_082_drive_document_import.py
          tests/test_build_083_bulk_drive_import.py
          tests/test_build_084c_foundation.py
          tests/test_build_084d_scientific_objects.py
          tests/test_build_084e_integration.py
          tests/test_build_085a_semantic_index.py
          tests/test_build_085b_hybrid_retrieval.py
          tests/test_build_085c_retrieval_validation.py
          tests/test_build_086a_candidate_knowledge.py
          tests/test_build_086b_evidence_aggregation.py
          tests/test_build_086c_final_validation.py
          tests/test_build_086d_review_readiness.py
      - name: Compile and diff checks
        run: python -m compileall -q app/candidate_knowledge app/evidence_aggregation app/persistence scripts/build_086c_final_validation.py && git diff --check
