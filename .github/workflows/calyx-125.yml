name: CALYX-125 Validation

on:
  pull_request:
    paths:
      - "runtime/calyx_certification/policy_version.py"
      - "tests/test_calyx_125_policy_version.py"
      - ".github/workflows/calyx-125.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check runtime/calyx_certification/policy_version.py tests/test_calyx_125_policy_version.py
      - run: pytest -q tests/test_calyx_125_policy_version.py
