name: OCU University Release Contract

on:
  pull_request:
    paths:
      - "app/university/**"
      - "app/routers/release_identity.py"
      - "app/routers/health.py"
      - "scripts/smoke_university_release.py"
      - "tests/test_university_release_readiness.py"
      - "tests/test_release_identity.py"
      - ".github/workflows/ocu-university-release-contract.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional deployed API base URL, for example https://host.example/api"
        required: false
        type: string

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Run University contract tests
        run: |
          python -m unittest \
            tests/test_university_session_service.py \
            tests/test_university_release_readiness.py \
            tests/test_release_identity.py
      - name: Compile release and smoke checkers
        run: python -m py_compile app/routers/release_identity.py scripts/smoke_university_release.py
      - name: Smoke deployed read-only University backend
        if: ${{ inputs.api_base_url != '' }}
        run: python scripts/smoke_university_release.py "${{ inputs.api_base_url }}"
