name: CALYX-MATRIX-003 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/matrix_identification.py"
      - "runtime/matrix_identification_registry.py"
      - "runtime/matrix_identification_session.py"
      - "runtime/matrix_identification_session_store.py"
      - "runtime/matrix_identification_persistence_preflight.py"
      - "app/routers/matrix_identification.py"
      - "app/routers/matrix_identification_registry.py"
      - "app/routers/matrix_identification_session.py"
      - "app/routers/reference_docs.py"
      - "tests/test_matrix_identification_*.py"
      - ".github/workflows/calyx-matrix-003-validation.yml"
  workflow_dispatch:

jobs:
  matrix-session-vertical-slice:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_preflight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrix -d matrix_preflight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      CALYX_MATRIX_PREFLIGHT_TEST_DATABASE_URL: postgresql://matrix:matrix@localhost:5432/matrix_preflight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt pytest ruff
          pip install 'psycopg[binary]'
      - name: Matrix evaluator, registry, session, and persistence regressions
        run: |
          pytest -q \
            tests/test_matrix_identification_mvp_001.py \
            tests/test_matrix_identification_registry_001.py \
            tests/test_matrix_identification_session_001.py \
            tests/test_matrix_identification_session_store_001.py \
            tests/test_matrix_identification_persistence_preflight_015.py
      - name: Compile
        run: |
          python -m compileall -q \
            runtime/matrix_identification.py \
            runtime/matrix_identification_registry.py \
            runtime/matrix_identification_session.py \
            runtime/matrix_identification_session_store.py \
            runtime/matrix_identification_persistence_preflight.py \
            app/routers/matrix_identification.py \
            app/routers/matrix_identification_registry.py \
            app/routers/matrix_identification_session.py
      - name: Ruff
        run: |
          python -m ruff check \
            runtime/matrix_identification.py \
            runtime/matrix_identification_registry.py \
            runtime/matrix_identification_session.py \
            runtime/matrix_identification_session_store.py \
            runtime/matrix_identification_persistence_preflight.py \
            app/routers/matrix_identification.py \
            app/routers/matrix_identification_registry.py \
            app/routers/matrix_identification_session.py \
            tests/test_matrix_identification_mvp_001.py \
            tests/test_matrix_identification_registry_001.py \
            tests/test_matrix_identification_session_001.py \
            tests/test_matrix_identification_session_store_001.py \
            tests/test_matrix_identification_persistence_preflight_015.py
      - name: Ruff format check
        run: |
          python -m ruff format --check \
            runtime/matrix_identification_session_store.py \
            runtime/matrix_identification_persistence_preflight.py \
            tests/test_matrix_identification_session_store_001.py \
            tests/test_matrix_identification_persistence_preflight_015.py
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref }}...HEAD
