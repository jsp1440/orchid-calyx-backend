name: CALYX-MATRIX Integrated Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/matrix_identification*.py"
      - "app/routers/matrix_identification*.py"
      - "app/routers/reference_docs.py"
      - "migrations/612_matrix_identification_sessions.sql"
      - "migrations/613_matrix_identification_registry_versions.sql"
      - "tests/test_matrix_identification_*.py"
      - ".github/workflows/calyx-matrix-003-validation.yml"
  workflow_dispatch:

jobs:
  matrix-integrated-stack:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: Matrix integrated regressions
        run: pytest -q tests/test_matrix_identification_*.py
      - name: Compile Matrix runtime and routers
        run: |
          python -m compileall -q \
            runtime/matrix_identification*.py \
            app/routers/matrix_identification*.py
      - name: Ruff Matrix stack
        run: |
          python -m ruff check \
            runtime/matrix_identification*.py \
            app/routers/matrix_identification*.py \
            tests/test_matrix_identification_*.py
