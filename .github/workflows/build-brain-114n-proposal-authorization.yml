name: BUILD-BRAIN-114N Proposal Authorization Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/proposal_authorization.py"
      - "tests/test_calyx_proposal_authorization.py"
      - "docs/brain/BUILD-BRAIN-114N-PROPOSAL-AUTHORIZATION.md"
      - ".github/workflows/build-brain-114n-proposal-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile proposal authorization surface
        run: |
          python -m compileall -q app/calyx_orchestrator/proposal_authorization.py tests/test_calyx_proposal_authorization.py
      - name: Ruff proposal authorization surface
        run: |
          ruff check app/calyx_orchestrator/proposal_authorization.py tests/test_calyx_proposal_authorization.py
          ruff format --check app/calyx_orchestrator/proposal_authorization.py tests/test_calyx_proposal_authorization.py
      - name: Focused proposal authorization regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_calyx_proposal_authorization.py
      - name: Non-mutation and identity-boundary assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/proposal_authorization.py").read_text(encoding="utf-8")
          forbidden = (
              "subprocess",
              "git push",
              "git commit",
              "merge_pull_request",
              "create_pull_request",
              "requests.post",
              "urllib.request",
          )
          for marker in forbidden:
              assert marker not in source, marker
          assert 'PATCH_EXECUTOR_KEY = "isolated_workspace_patcher_v1"' in source
          assert "PROPOSAL_AUTH_SELF_APPROVAL_PROHIBITED" in source
          assert "PROPOSAL_AUTH_STALE_MANIFEST" in source
          assert '"git_mutation_authorized": False' in source
          assert '"commit_authorized": False' in source
          assert '"push_authorized": False' in source
          assert '"pull_request_creation_authorized": False' in source
          assert '"automatic_merge_authorized": False' in source
          assert '"deployment_authorized": False' in source
          PY
      - name: Diff hygiene
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          test -n "$BASE_REF"
          git diff --check "origin/${BASE_REF}...HEAD"
