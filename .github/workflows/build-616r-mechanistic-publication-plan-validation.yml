name: BUILD-616R Mechanistic Publication Plan Validation

on:
  pull_request:
    paths:
      - "app/brain/mechanistic_publication_plan.py"
      - "app/parallel_platform/routes.py"
      - "tests/test_build_616_mechanistic_publication_plan.py"
      - "docs/brain/BUILD-616R-MECHANISTIC-PUBLICATION-PLAN.md"
      - ".github/workflows/build-616r-mechanistic-publication-plan-validation.yml"
  push:
    branches: [feature/build-616-current-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile
        run: python -m py_compile app/brain/mechanistic_publication_plan.py app/parallel_platform/routes.py tests/test_build_616_mechanistic_publication_plan.py
      - name: Ruff
        run: ruff check app/brain/mechanistic_publication_plan.py app/parallel_platform/routes.py tests/test_build_616_mechanistic_publication_plan.py
      - name: Formatting
        run: ruff format --check app/brain/mechanistic_publication_plan.py app/parallel_platform/routes.py tests/test_build_616_mechanistic_publication_plan.py
      - name: Behavioral regressions
        run: python -m pytest -q tests/test_build_616_mechanistic_publication_plan.py tests/test_build_615_mechanistic_candidate_graph.py
      - name: Route import
        run: python -c "from app.parallel_platform.routes import router; assert any(r.path.endswith('/publication-plan') for r in router.routes)"
      - name: Hygiene
        run: git diff --check
