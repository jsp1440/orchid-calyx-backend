name: BUILD-616R Mechanistic Publication Plan Validation

on:
  pull_request:
    paths:
      - "app/brain/mechanistic_publication_plan.py"
      - "app/candidate_knowledge/**"
      - "app/parallel_platform/routes.py"
      - "runtime/knowledge_graph/causal_vocabulary.py"
      - "runtime/knowledge_graph/validation.py"
      - "tests/test_build_616_mechanistic_publication_plan.py"
      - "tests/test_build_615_mechanistic_candidate_graph.py"
      - "tests/test_build_086a_candidate_knowledge.py"
      - "docs/brain/BUILD-616R-MECHANISTIC-PUBLICATION-PLAN.md"
      - "docs/brain/BUILD-616R-CORRECTIVE-REVIEW-SNAPSHOT.md"
      - ".github/workflows/build-616r-mechanistic-publication-plan-validation.yml"
  push:
    branches: [feature/build-616-current-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Compile
        run: >-
          python -m py_compile
          app/brain/mechanistic_publication_plan.py
          app/candidate_knowledge/repository.py
          app/parallel_platform/routes.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Ruff
        run: >-
          ruff check
          app/brain/mechanistic_publication_plan.py
          app/candidate_knowledge/repository.py
          app/parallel_platform/routes.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: Formatting
        run: >-
          ruff format --check
          app/brain/mechanistic_publication_plan.py
          app/candidate_knowledge/repository.py
          app/parallel_platform/routes.py
          tests/test_build_616_mechanistic_publication_plan.py
      - name: BUILD-616R behavioral regressions
        run: python -m pytest -q tests/test_build_616_mechanistic_publication_plan.py
      - name: Candidate Knowledge review regressions
        run: python -m pytest -q tests/test_build_086a_candidate_knowledge.py
      - name: BUILD-615 prerequisite regressions
        run: python -m pytest -q tests/test_build_615_mechanistic_candidate_graph.py
      - name: Causal vocabulary and Reasoning Map regressions
        run: python -m pytest -q tests/test_build_614_scientific_causal_vocabulary.py tests/test_build_612_reasoning_map.py
      - name: Route import
        run: python -c "from app.parallel_platform.routes import router; assert any(r.path.endswith('/publication-plan') for r in router.routes)"
      - name: Hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
