name: CALYX Live GitHub Proposal Adapter Validation

on:
  pull_request:
    paths:
      - "app/calyx_orchestrator/github_proposal_mutation_adapter.py"
      - "tests/test_calyx_github_proposal_mutation_adapter_114u.py"
      - "docs/brain/CALYX-LIVE-GITHUB-PROPOSAL-ADAPTER-114U.md"
      - ".github/workflows/calyx-live-github-proposal-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Compile
        run: |
          python -m compileall -q \
            app/calyx_orchestrator/github_proposal_mutation_adapter.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py
      - name: Ruff
        run: |
          ruff check \
            app/calyx_orchestrator/github_proposal_mutation_adapter.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py
          ruff format --check \
            app/calyx_orchestrator/github_proposal_mutation_adapter.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py
      - name: Focused trust-chain and live-adapter regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_calyx_git_proposal_execution_plan_114r.py \
            tests/test_calyx_git_proposal_mutation_executor_114s.py \
            tests/test_calyx_git_proposal_mutation_journal_114t.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py
      - name: Credential and authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/calyx_orchestrator/github_proposal_mutation_adapter.py").read_text(encoding="utf-8")
          for required in (
              '"draft": True',
              '"force": False',
              'already_exists_exact',
              'GITHUB_ADAPTER_POSTIMAGE_HASH_MISMATCH',
              'GITHUB_ADAPTER_PR_BASE_MOVED',
              'GITHUB_ADAPTER_REPOSITORY_NOT_ALLOWED',
              'token=<redacted>',
          ):
              assert required in source, required
          for forbidden in (
              "merge_pull_request",
              "enable_auto_merge",
              "/merges",
              "/deployments",
              "delete_ref",
              "production_database",
              "publish_scientific",
              "taxonomy_activation",
              "knowledge_graph_mutation",
          ):
              assert forbidden not in source, forbidden
          PY
      - name: No credential activation
        run: |
          ! grep -R "GITHUB_TOKEN\|GH_TOKEN\|PRIVATE_KEY" \
            app/calyx_orchestrator/github_proposal_mutation_adapter.py \
            tests/test_calyx_github_proposal_mutation_adapter_114u.py
      - name: Diff hygiene
        run: git diff --check "origin/${{ github.base_ref || github.event.repository.default_branch }}...HEAD"
