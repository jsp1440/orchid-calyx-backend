name: CALYX Hassler Intake Discovery

on:
  pull_request:
    paths:
      - 'scripts/discover_hassler_release_intake.py'
      - '.github/workflows/calyx-hassler-intake-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CALYX_BACKEND_URL: ${{ vars.CALYX_BACKEND_URL }}
      CALYX_OWNER_ACCESS_CODE: ${{ secrets.CALYX_OWNER_ACCESS_CODE }}
      CALYX_HASSLER_DISCOVERY_REPORT: calyx-hassler-intake-discovery.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CALYX_BACKEND_URL:?CALYX_BACKEND_URL is required}"
          : "${CALYX_OWNER_ACCESS_CODE:?CALYX_OWNER_ACCESS_CODE is required}"
      - name: Compile read-only probe
        run: python -m py_compile scripts/discover_hassler_release_intake.py
      - name: Discover deployed intake state
        run: python scripts/discover_hassler_release_intake.py
      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: calyx-hassler-intake-discovery-${{ github.sha }}
          path: calyx-hassler-intake-discovery.json
          if-no-files-found: error
          retention-days: 30
