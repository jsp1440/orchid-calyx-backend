name: CALYX Reasoning Prerequisite Production Activation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Guarded schema-activation profile'
        required: true
        default: reasoning-prerequisites
        type: choice
        options:
          - reasoning-prerequisites
          - research-station-conversations
      apply_prerequisites:
        description: 'Apply the selected profile; false performs read-only preflight only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight-or-activate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact current main checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install activation dependencies
        run: python -m pip install 'psycopg[binary]'

      - name: Verify CALYX runtime and migration database targets match
        if: ${{ inputs.profile == 'research-station-conversations' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALYX_RUNTIME_DATABASE_URL: ${{ secrets.CALYX_RUNTIME_DATABASE_URL }}
        run: python scripts/verify_calyx_runtime_database_target.py

      - name: Read-only reasoning prerequisite preflight
        if: ${{ inputs.profile == 'reasoning-prerequisites' && !inputs.apply_prerequisites }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/activate_reasoning_prerequisite_schemas.py

      - name: Explicitly activate reasoning prerequisite migrations
        if: ${{ inputs.profile == 'reasoning-prerequisites' && inputs.apply_prerequisites }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALYX_REASONING_PREREQ_CONFIRM: APPLY_087B_088B_088C_088D_101
        run: python scripts/activate_reasoning_prerequisite_schemas.py --apply

      - name: Read-only Research Station conversation preflight
        if: ${{ inputs.profile == 'research-station-conversations' && !inputs.apply_prerequisites }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALYX_ACTIVATION_TARGET_ENVIRONMENT: production
          CALYX_REASONING_PREREQ_EVIDENCE_PATH: calyx-research-station-conversation-schema-activation.json
        run: >-
          python scripts/activate_reasoning_prerequisite_schemas.py
          --profile research-station-conversations

      - name: Explicitly activate Research Station migrations 101 and 140 atomically
        if: ${{ inputs.profile == 'research-station-conversations' && inputs.apply_prerequisites }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALYX_ACTIVATION_TARGET_ENVIRONMENT: production
          CALYX_RESEARCH_STATION_CONFIRM: APPLY_RESEARCH_STATION_101_140
          CALYX_REASONING_PREREQ_EVIDENCE_PATH: calyx-research-station-conversation-schema-activation.json
        run: >-
          python scripts/activate_reasoning_prerequisite_schemas.py
          --profile research-station-conversations --apply

      - name: Read-only 103/105 readiness after reasoning prerequisite activation
        if: ${{ inputs.profile == 'reasoning-prerequisites' && inputs.apply_prerequisites && success() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/activate_reasoning_publication_schemas.py

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calyx-schema-activation-${{ inputs.profile }}-${{ github.sha }}
          path: |
            calyx-reasoning-prerequisite-schema-activation.json
            calyx-reasoning-publication-schema-activation.json
            calyx-research-station-conversation-schema-activation.json
          if-no-files-found: warn
          retention-days: 30
