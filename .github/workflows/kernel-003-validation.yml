name: KERNEL-003 validation

on:
  push:
    branches:
      - feature/kernel-003-assertion-engine
  pull_request:
    paths:
      - "app/kernel/**"
      - "tests/kernel/**"
      - "docs/KERNEL-003.md"
      - ".github/workflows/kernel-003-validation.yml"

jobs:
  assertion-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify public imports
        run: python -c "from app.kernel import Assertion, AssertionObject, AssertionStatus, Confidence"
      - name: Run Kernel contract tests
        run: >-
          python -m pytest -q
          tests/kernel/test_foundation.py
          tests/kernel/test_evidence.py
          tests/kernel/test_assertions.py
