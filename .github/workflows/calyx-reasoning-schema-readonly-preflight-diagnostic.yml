name: CALYX Reasoning Schema Read-Only Preflight Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/calyx-reasoning-schema-readonly-preflight-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preflight dependency
        run: python -m pip install 'psycopg[binary]'
      - name: Run read-only reasoning schema preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/activate_reasoning_publication_schemas.py
      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: calyx-reasoning-schema-readonly-preflight-${{ github.sha }}
          path: calyx-reasoning-publication-schema-activation.json
          if-no-files-found: error
          retention-days: 30
