    value: 'ALLOWED:'
- description: 'write-operating-memory-allowed: Control -- the durable operating-memory doc is not a restricted path'
  vars:
    payload: '{"input": {"content": "# memory\n- new rule\n", "path": "docs/AGENT-OPERATING-MEMORY.md"}, "tool": "write_file"}'
  assert:
  - type: starts-with
    value: 'ALLOWED:'
